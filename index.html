  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-11-11","url":"https://dailyintelligence.lacbgrey.com.au/","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Google opened its strongest model to paying users, and still says most work should start on a smaller one. Amazon's engineers stopped using a frontier model to sort tickets. The rest is what that split does to proofs, spreadsheets, shopping, and a robot on a factory line.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-10T19:00:00Z","dateModified":"2026-11-10T20:08:56Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/","name":"Gemini 4 Carbon is public. The intro price matches Argon until 30 November.","description":"On 10 November, Google opened Gemini 4 Carbon to paying developers and enterprises in AI Studio and Gemini for business, and began rolling it out to Google AI Ultra subscribers in Antigravity, the Gemini app, and AI Mode. The introductory API price matches Argon: $2 per million input tokens and $10 per million output tokens. On 30 November that rises to $4 and $20. Google says Argon is still the model for most coding and knowledge work."},{"@type":"ListItem","position":2,"url":"https://strandsagents.com/blog/amazon-saves-millions-replacing-sonnet-with-strands-decider/","name":"Amazon labeled tickets with a 2B model. The bill fell about 98 percent.","description":"Two Amazon engineers replaced Claude Sonnet 4.6 with Strands Decider E4B on an internal ticketing system that sorts work into 20 labels. On their numbers, a ticket fell from $0.0222 to about $0.0005, and the average call from 4.2 seconds to 0.9 seconds. They ran both models on live traffic before turning Sonnet off. They say the change will save millions of dollars in token cost a year."},{"@type":"ListItem","position":3,"url":"https://claude.com/resources/articles/sheets-whiteboards-data","name":"Claude can now keep the board, the sheet, and the chart in the chat","description":"On 10 November, Anthropic launched Claude Whiteboards and Claude Sheets in beta, and made Claude Dashboards generally available under the name Claude Data. A board can turn a messy plan into owners and dates. A sheet can start from a prompt, with tabs, formulas, and drop-downs. Data adds certified metric definitions and live sharing. All three are on paid plans."},{"@type":"ListItem","position":4,"url":"https://deepmind.google/blog/introducing-alphaproof-code/","name":"Agents proved key properties of Signal's code. Humans checked the spec and 1 percent of the proof.","description":"On 10 November, Google DeepMind said AlphaProof Code formally verified key security properties of the code behind the Signal protocol, down to the compiled implementation. Human experts approved every specification. Agents wrote more than six million lines of Lean, then flagged about 1 percent for a second human look. Lean checked the rest. The work took four weeks. DeepMind open-sourced the artifacts."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/introducing-businesses-chatgpt/","name":"A US shop can claim a ChatGPT profile and answer from its own agent","description":"On 10 November, OpenAI opened Businesses in ChatGPT in beta. A business can claim a profile, update details, and see aggregated counts of mentions, profile views, and website clicks. Eligible ecommerce and online-service businesses in the United States can also launch a Business Agent. The agent chat is labeled and separate from the person's ChatGPT conversation. OpenAI says it does not share those chats with the business."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/ai-effect-on-freelance-work","name":"On Upwork, AI-related jobs paid more because the brief got wider","description":"On 10 November, OpenAI and Upwork published a study of freelance postings against ChatGPT use. Of 63 matched work categories, 43 followed one pattern: work that was common in ChatGPT lost share on Upwork, and less common work gained share. Twenty categories went the other way. AI-related postings combined tasks that used to be hired separately. Their adjusted comparison put fixed-price budgets 52 percent higher and hours in the first 90 days 41 percent higher. Posted hourly rates were about the same."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/decision","name":"Hugging Face added a pipeline that returns a choice, not a paragraph","description":"On 10 November, Hugging Face documented decision models in Transformers. You pass a state and one or more questions with allowed answers. The model returns a choice, or a score, and a probability. It does not write the answer token by token. The post's example uses the pipeline name \"decision\" and the model autotrust/GEV-26B-Decide."},{"@type":"ListItem","position":8,"url":"https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/","name":"A humanoid sorted car parts at 96 percent. The model is for partners, not a home robot.","description":"On 10 November, Google DeepMind introduced Gemini Robotics 2.5, a vision-language-action model for robot partners. On its own tests of more than 200 tasks, success was 30 to 100 percent higher than its previous baselines, depending on the task, and the tasks finished 20 to 30 percent faster. In a factory proof of concept with Apptronik and Mercedes-Benz, an Apollo 2 humanoid sorted automotive parts into trays at a 96 percent success rate."},{"@type":"ListItem","position":9,"url":"https://pr.tsmc.com/english/news/3352","name":"TSMC's board approved up to $500 million each for Anthropic and OpenAI","description":"On 10 November, TSMC's board approved an investment of no more than US$500 million in Anthropic common shares, at Anthropic's IPO price, and no more than US$500 million in OpenAI preferred stock. The same meeting approved about US$40.9 billion in capital spending, mostly for advanced chip capacity, packaging, and fab construction, and a separate investment company capped at US$500 million."},{"@type":"ListItem","position":10,"url":"https://support.google.com/gemini/answer/18617127","name":"Gemini will show the memory summary. You can correct it. US paid plans only.","description":"Google's help page now documents Memory summary in the Gemini app. A signed-in adult in the United States, on an active Google AI plan, with Keep Activity and Memory turned on, can open Settings, then Personal Intelligence, then Memory summary. The page is in English, on the Gemini mobile app and gemini.google.com. You can add or remove facts with a prompt, and review a history of changes."},{"@type":"ListItem","position":11,"url":"https://github.com/homeassistant-ai/ha-mcp","name":"homeassistant-ai/ha-mcp: an assistant that can change the house, if you give it an admin token","description":"ha-mcp is an MCP server that lets Claude, ChatGPT, and other assistants configure Home Assistant. The README lists 87 tools. The recommended install is the Home Assistant integration, on Home Assistant 2026.8 or newer. It gained about 790 stars on GitHub's daily trending list, with about 6,500 in total. The license is MIT."},{"@type":"ListItem","position":12,"url":"https://github.com/WhiteTowerAI/ohmygame","name":"WhiteTowerAI/ohmygame: one app for a game, still in beta, still your API key","description":"OhMyGame is an open-source desktop studio for making a game with an agent. The agent works on a canvas of docs, art, and models, then builds and playtests the game. It supports more than 40 model providers, and the keys stay on the machine. Desktop downloads are macOS on Apple silicon and Windows. It gained about 200 stars on GitHub's daily trending list, with about 2,000 in total. The license is Apache-2.0. The app is in beta."},{"@type":"ListItem","position":13,"url":"https://github.com/ashishpatel26/500-AI-Agents-Projects","name":"ashishpatel26/500-AI-Agents-Projects: a catalog of agent ideas, not an agent","description":"500 AI Agents Projects is a curated list of agent use cases, grouped by industry, with links to open-source implementations. It is not one tool you run. It gained about 110 stars on GitHub's daily trending list, with about 39,600 in total. The license is MIT. The latest commit on the default branch was 6 November."}]}}]}</script>
