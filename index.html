  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-11-13","url":"https://dailyintelligence.lacbgrey.com.au/","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Google priced a fast model for the jobs that do not need its deepest one. Nvidia said its chief executive has resigned, and named the finance chief to stand in. The rest is what that split does to a chat log, a phone call, a shopping answer, and a model you can run yourself.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-12T19:00:00Z","dateModified":"2026-11-12T20:09:31Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/","name":"Gemini 4 Hydrogen is $1.50 in and $7.50 out. The free app may not pick it.","description":"On 12 November, Google introduced Gemini 4 Hydrogen as the fast model for everyday coding and agent work, not the deep-reasoning model. Carbon and Argon remain those. The price is flat across a 1 million-token window: $1.50 per million input tokens and $7.50 per million output tokens. At the default high thinking level, Google says Hydrogen scores 51 on the Artificial Analysis Intelligence Index, against 50 for Argon, and 54 at a new xhigh setting."},{"@type":"ListItem","position":2,"url":"https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition","name":"Jensen Huang resigned. Colette Kress is interim chief, and still CFO.","description":"On 12 November, Nvidia said Jensen Huang resigned as president, chief executive, and a board member, effective immediately. Colette Kress, chief financial officer since September 2013, is interim chief executive and keeps the finance job while the board searches for a permanent successor. Harvey C. Jones is the board's first chair. The announcement does not state a reason. Separate reporting has tied the resignation to personal allegations. Those claims are not in the company statement."},{"@type":"ListItem","position":3,"url":"https://www.notion.com/help/security-incident-involving-a-third-party-ai-vendor","name":"Notion says a vendor kept chat text it had promised not to keep","description":"Notion says Fireworks AI notified it of a security incident affecting fewer than 1 percent of workspaces. The exposed text is Notion AI chat input and output that Notion had sent to Fireworks for the Insights feature. On 3 November, Notion says it disconnected Fireworks, deleted the data held there, stopped sending traffic, and halted training runs. Insights is off while Notion investigates. Meeting-note audio was not affected unless someone pasted it into a chat."},{"@type":"ListItem","position":4,"url":"https://elevenlabs.io/blog/scribe-v3","name":"Scribe v3 Live is meant to wait for the end of the sentence","description":"ElevenLabs released Scribe v3 for recorded audio and Scribe v3 Live for real-time speech. The company says v3 makes 27 percent fewer word errors than v2 across 102 languages, and that Live makes 43 percent fewer errors than Scribe v2 Realtime. Live also labels speakers in real time for the first time. Both are in the ElevenLabs API now. The model IDs are scribe_v3 and scribe_v3_live. Live is also in ElevenAgents."},{"@type":"ListItem","position":5,"url":"https://huggingface.co/blog/ibm-granite/llmon-an-llm-native-markup-language-now-in-granite","name":"IBM marked instructions apart from the data. The models are a preview.","description":"On 12 November, IBM released two experimental Granite 4.1 previews, at 3 billion and 8 billion parameters, trained to read and write LLMON. LLMON is a markup language whose structural markers are reserved tokens, not ordinary characters, so an instruction, a piece of data, and a requirement can be addressed separately. IBM says that on some indirect prompt-injection tests, attack success falls to nearly zero, while general ability stays close to the Granite 4.1 Instruct models. A toolkit is on GitHub."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/qvac/botpsy","name":"An 0.8B assistant calls tools on the device. It is not for a high-stakes job.","description":"On 11 November, Tether's QVAC group released BotPsy, a 0.8 billion-parameter model built on Qwen3.5-0.8B for tool use on a device. The authors say it is for low- and medium-difficulty tasks such as search, calendar, files, and simple commerce, and that it is not for high-stakes use. On their tests it leads models up to 1.2 billion parameters on six tool benchmarks, and beats a 2 billion-parameter Qwen on five of the six. Weights and GGUF files are on Hugging Face."},{"@type":"ListItem","position":7,"url":"https://podqi.com/research/ai-search-brand-risk","name":"AI shopping answers recommended risky sites 6.3 times more often than they warned","description":"Podqi, an intellectual-property firm, published a September study of 6,795 shopping answers about 151 brands from ChatGPT, Gemini, and Perplexity. The data came from Gauge. Podqi says about 9 in 100 answers showed a risky site, meaning a lookalike, a suspected counterfeit store, or a dead domain. Of those answers, 57 percent recommended the site as a place to buy, and risky sites were recommended 6.3 times as often as they were warned against. The Verge featured the research. The page also sells Podqi's service."},{"@type":"ListItem","position":8,"url":"https://www.bleepingcomputer.com/news/security/fake-openai-spacex-events-used-to-steal-microsoft-google-accounts/","name":"A fake SpaceX event page was still asking for a work login","description":"BleepingComputer reported on 5 November that attackers were using fake OpenAI, SpaceX, and Anthropic event pages to steal Microsoft and Google work accounts. Push Security said it blocked visits to the pages in late October. One page advertised a private SpaceX event on 12 November and offered Grok Heavy or a SpaceX share. The pages ask visitors to continue with Microsoft or Google. The Microsoft path uses a device-code login. The Google path proxies the real sign-in page."},{"@type":"ListItem","position":9,"url":"https://www.federalreserve.gov/newsevents/speech/barr20261112a.htm","name":"A Fed governor says the labor share hit 52.8 percent. That is his view, not a rate decision.","description":"On 12 November, Federal Reserve Governor Michael Barr said the labor share of US national income fell to 52.8 percent in the second quarter of 2026, which he called a record low. He said AI could send returns to capital rather than wages if a few firms capture the gains, and that smaller firms could then lose share. He also said displacement so far has been limited, access to AI is still fairly broad, and there are signs of substitution for younger, less-experienced workers. These are his views, not the Board's or the rate-setting committee's."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/11/12/phota-labs-uses-ai-to-turn-everyday-photos-into-professional-looking-shots/","name":"Phota says it can fix the shot without inventing a new face","description":"TechCrunch reported on 12 November that Phota Labs, founded by former Adobe computational-photography engineers Cecilia Zhang and Zach Xia, launched a free iPhone app that restyles everyday photos. The founders say their identity model is meant to keep the person recognizable, unlike a general image tool that invents a face when the source is blurry. Edited images carry an invisible watermark. Android is planned. A freemium price is planned later. The company raised a $5.6 million seed round led by a16z last year."},{"@type":"ListItem","position":11,"url":"https://github.com/GoogleChrome/modern-web-guidance-src","name":"GoogleChrome/modern-web-guidance-src: a skill pack so the agent stops writing last decade's web","description":"This was the top repository on GitHub Trending today, with 799 stars in the day and about 2,700 overall. It is the source for Modern Web Guidance, a set of skills that put current browser guidance into a coding agent. Chrome, Edge, Mozilla, and MDN steward it. Code is Apache 2.0. The guides are CC BY 4.0. Install the published package with npx modern-web-guidance@latest install. Usage telemetry is on unless you set DISABLE_TELEMETRY=1."},{"@type":"ListItem","position":12,"url":"https://github.com/ggml-org/llama.cpp","name":"ggml-org/llama.cpp: local model inference, still the day's third AI climb","description":"llama.cpp was on GitHub Trending today with 287 stars in the day, about 134,400 overall, and 25,500 forks. It is a C and C++ project for running large language models locally. The license is MIT. The latest release on the page is v0.9.0, dated 4 November. A commit landed within the hour of this check. The project links to llama.app."},{"@type":"ListItem","position":13,"url":"https://github.com/QwenLM/qwen-code","name":"QwenLM/qwen-code: a terminal coding agent you can point at more than one provider","description":"Qwen Code was on GitHub Trending today with 151 stars in the day and about 29,700 overall. It is an open-source terminal coding agent, with desktop, editor, web, and chat clients. The license is Apache 2.0. It can use Qwen, OpenAI, Anthropic, Gemini, or a local server such as Ollama or vLLM. Node 22 or newer is required for the npm install. A Qwen Plus or Pro subscription, or an API key, is required to sign in."}]}}]}</script>
