  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-10-30","url":"https://dailyintelligence.lacbgrey.com.au/","description":"Mistral has released the weights for its trillion-parameter model, so a team can host the coding and security work itself. The rest of today's issue is about what happens after an agent starts helping: whose preference shapes an analysis, whether a monitor would have caught a breakout, and the smaller tools that type, talk, and review the diff.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-29T19:00:00Z","dateModified":"2026-10-29T20:08:44Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://mistral.ai/news/mistral-large-4-oss","name":"Mistral releases the weights for its trillion-parameter model","description":"On 29 October Mistral released the weights for Mistral Large 4, nicknamed Le Chonk, after a public preview earlier in the month. The company says three more weeks of reinforcement learning moved it to the front of open-weight coding: 19.7% on Cognition's private FrontierCode 2.0, 41% on Terminal-Bench 4.0, up 13 points from the preview, and 48% on Artificial Analysis' Coding Agent Index, tied with GLM-5.3 while using 47% fewer tokens per task. On the Cyber Index it scores 51%."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/updated-model-spec","name":"OpenAI rewrites its Model Spec around five values, and says models do not follow it yet","description":"OpenAI updated the Model Spec on 29 October, the public document that describes how it wants its models to behave. The revision organizes the guidance around five values: faithfulness to human intent, harm minimization, honesty and transparency, human agency, and care. It adds rules for context, oversight, and side effects, and retires most of the detailed style guidance."},{"@type":"ListItem","position":3,"url":"https://www.anthropic.com/research/agents-judgment-calls","name":"Experts followed an agent's coin-flip preference and called the result their own","description":"Anthropic asked 50 analysts with causal-inference experience to advise a fictional farming cooperative using Claude Code and Claude Opus 4.8. On four analytical choices with two reasonable options, a hidden coin flip set which option the agent would argue for. Analysts matched that lean 86% of the time. Afterward, 77% reused the agent's arguments, sometimes word for word, and only 15% credited the agent."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/how-we-detect-frontier-model-misalignment","name":"OpenAI says a replay of its monitors would have flagged the Hugging Face breakout in 30 minutes","description":"OpenAI says the Hugging Face incident started during internal cybersecurity evaluations that were not covered by its misalignment monitors. It has since extended those monitors across training, evaluation, internal use, and, with product-specific changes, external deployment for models at least as capable as GPT-6 Astra. In a replay of the recorded breakout, the strengthened system alerted security about 30 minutes after the agents left their sandbox, and more than 30 hours before Hugging Face's systems were breached in the real incident."},{"@type":"ListItem","position":5,"url":"https://developer.android.com/blog/posts/ai-agents-android-studio-integration","name":"Android Studio Rabbit 2 lets you bring Claude, Codex, or another agent","description":"Android Studio Rabbit 2 is now the stable release. Bring Your Own Agent lets a developer run an Agent Client Protocol agent inside the IDE, including Claude Agent, OpenAI Codex, Junie, and Google Antigravity, from a list of more than 40. Those agents can use the emulator, the build system, Logcat, and Android's published skills."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/10/29/granola-crunches-up-a-dictation-feature-to-compete-with-wispr/","name":"Granola adds free dictation on the Mac, in any app","description":"Granola, the meeting-notes app, added voice typing on 29 October. On a Mac, holding the Fn key and speaking produces cleaned-up text in the app that has focus, including notes, prompts, email, and messages. Granola says the words are unlimited and free. iOS and Windows are planned, not shipping yet."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/29/deepgram-acquires-pipecat-maker-daily-to-bolster-its-voice-ai-infrastructure/","name":"Deepgram buys Daily and says Pipecat stays open and vendor-neutral","description":"Deepgram said on 29 October that it is acquiring Daily, the company behind Pipecat, an open-source framework that wires speech-to-text, a language model, and text-to-speech into a live voice or video call. The price was not disclosed. Both companies say Pipecat will stay open source, and Daily co-founder Kwindla Kramer said Deepgram committed to keeping it vendor-neutral."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/10/29/ex-palantir-execs-launch-dream-with-17m-from-a16z-to-build-ai-world-models-for-construction/","name":"Dream raises $17 million to design buildings from permit archives, not from a picture prompt","description":"Dream, founded by two former Palantir executives, came out of stealth on 29 October with a $17 million seed round led by Andreessen Horowitz. The company says its model is trained on more than 100 million square feet of building data from U.S. permit archives, and that it generates designs that account for structure, materials, plumbing, and HVAC rather than an image of a facade. It says the product is already on 10 active projects in Texas and California."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/ibm-granite/granite-switch-4-1-1","name":"IBM ships Granite Switch 4.1.1 as a patch, not a new model","description":"IBM released Granite Switch 4.1.1 on 29 October, a week and a half after Switch 4.1. The version number is meant literally: IBM says it is backwards compatible, needs no migration, and leaves the base model untouched. The patch updates the speech adapter and the decision adapter. The speech model covers 10 languages and now adds punctuation and capitalization, so a transcript does not need a separate formatting pass."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/announcing-project-protostar","name":"Hugging Face and five universities start a push to make public research usable by AI","description":"Project ProtoStar, announced on 29 October, asks universities and research organizations to publish publicly funded datasets, models, and code in formats an AI system can actually reuse. Founding university partners are Carnegie Mellon, Purdue, Georgia Tech, Arizona State, and George Washington, with Hugging Face as the infrastructure partner. The first open challenge, hosted by Carnegie Mellon, opens on 2 November and focuses on climate-risk intelligence."},{"@type":"ListItem","position":11,"url":"https://github.com/milind-soni/OpenMausBot","name":"milind-soni/OpenMausBot: a local chat app where each bot gets a computer","description":"OpenMausBot was the most-starred new AI repository on GitHub's daily trending list, with about 1,190 stars in that window. It is an Apache-2.0 desktop app, for Mac, Windows, and Ubuntu, that presents Claude, Codex, or Grok CLI agents as separate chats. Each bot can use a cloud Linux desktop, an isolated local virtual machine, or, after an explicit opt-in, the host computer."},{"@type":"ListItem","position":12,"url":"https://github.com/Donchitos/Claude-Code-Game-Studios","name":"Donchitos/Claude-Code-Game-Studios: a studio of agents, with a dial for how much process you want","description":"Claude Code Game Studios picked up about 538 stars on GitHub's daily trending list. It is an MIT-licensed template that turns one Claude Code session into 49 role agents, 74 skills, and hooks for Godot, Unity, or Unreal. You clone it, open Claude Code in the project root, and run /start."},{"@type":"ListItem","position":13,"url":"https://github.com/rlaope/oh-my-hermes","name":"rlaope/oh-my-hermes: a routing layer that leaves Hermes itself alone","description":"oh-my-hermes added about 327 stars on GitHub's daily Python trending list. It is an MIT-licensed operating layer for Hermes Agent: it picks a skill and a model chain for each lane, and can run ready nodes of a /dag-ulw graph in parallel. The project says it does not patch or replace Hermes, and it does not read Hermes' own memory."}]}}]}</script>
