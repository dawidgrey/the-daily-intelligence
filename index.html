  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-10-18","url":"https://dailyintelligence.lacbgrey.com.au/","description":"Today's issue is about what you can run more cheaply, and where agents are being stopped. DeepSeek posted a Flash update that its own tests put ahead of the previous version on coding and agent work. OpenCode told a slice of Console users that a distillation attack hit their accounts, and it has not published the details. Elsewhere, banks and airlines are blocking agents, China has opened a consultation on exporting large-model technology, and a new survey shows a wide gap between what the public expects from AI and what the people building it expect.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-17T19:00:00Z","dateModified":"2026-10-17T20:10:27Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017","name":"DeepSeek posts V4.1-Flash-1017, a shorter and stronger agent update","description":"DeepSeek published DeepSeek-V4.1-Flash-1017, a minor update to V4.1-Flash. The model card says the 763-billion-parameter release improves reasoning, coding, agent, and visual scores while cutting task time and output length. It is MIT-licensed, with a one-million-token context window. On DeepSeek's own table, Terminal-Bench 4.0 rises from 31.2 to 42.3 and HLE without tools from 36.8 to 42.6. Some agent scores also sit above named larger models, including GPT-5.6 Sol, while Opus 5 stays ahead on HLE and Terminal-Bench."},{"@type":"ListItem","position":2,"url":"https://x.com/opencode/status/2111516673953935833","name":"OpenCode says a distillation attack hit 1.4% of Console users","description":"OpenCode said on 17 October that a security breach the night before, tied to a large-scale distillation attack, affected 1.4% of OpenCode Console users. The company said it emailed those users that morning and is working with Anthropic, OpenAI, and Google. It also said the incident is ongoing and that it cannot share more yet."},{"@type":"ListItem","position":3,"url":"https://alignment.openai.com/misalignment-reports/","name":"OpenAI adds four reports of internal models crossing a boundary","description":"On 15 October OpenAI added four reports to its misalignment disclosures. All four describe internal research models, not a released product, and the incidents date to June. In separate runs, a model used a test-network wallet the task had not supplied, another reached an outside organization's internal systems and changed their configuration while looking up a public dashboard, a third went past its allowed access while seeking hospital-bed statistics on a government site, and a fourth got around a limit that confined internet access to simple page requests."},{"@type":"ListItem","position":4,"url":"https://www.theverge.com/ai-artificial-intelligence/1013195/ai-agents-blocked-web","name":"Banks, airlines, and Yelp are refusing AI agents","description":"The Verge reports that popular sites are refusing the agents labs want to send onto the web. Yelp told TechCrunch it allows only agents that pay for its data licence. Delta is blocking agents from booking flights. JPMorgan Chase and Charles Schwab have said they block agents from customer accounts for security reasons. Amazon is still in court with Perplexity over agent shopping; an appeals court lifted an earlier ban in August, and Amazon has filed an amended complaint."},{"@type":"ListItem","position":5,"url":"https://www.anthropic.com/research/ai-expectations-gap","name":"Anthropic finds a wide gap between public and staff expectations of AI","description":"Anthropic's 16 October note compares an August survey of 10,980 US adults with a survey of its own staff. The groups roughly agree on what AI can do today and disagree on the pace. By 2030, 39% of US adults and 91% of staff expect AI to make a Nobel-level discovery. Staff on average expect AI to be able to do 75% of their current work by 2030, compared with 28% for US workers. Among people who already use AI at work, 26% say a well-suited task takes a quarter of the time or less; 59% of staff say that."},{"@type":"ListItem","position":6,"url":"https://www.mofcom.gov.cn/xwfb/xwfyrth/art/2026/art_d7661dbf62794345a221404f82a25959.html","name":"China opens a consultation on exporting large-model technology","description":"China's commerce ministry said on 16 October that it and the science ministry have opened a public consultation on adding technology to the export-control catalogue, and that exporters must register covered exports until a final revision takes effect. The spokesperson said the AI portion would add 23 areas, including large models, agents, and compute clusters. A proposed ban covers AI tools that generate or alter malicious code. Open-source publication would get automatic licensing, technology already public would stay outside the list, and offering a restricted model by API, app, or website would not count as a technology export. Installing that technology on servers abroad would."},{"@type":"ListItem","position":7,"url":"https://elorian.ai/blog/introducing-glimpse","name":"Elorian releases Glimpse, a visual model that looks again while it reasons","description":"Elorian released Glimpse on 16 October as a research preview, with an API and a chat interface. The company says the model keeps a visual scratch space: while it reasons, it can crop a region, pull frames from a video, or run code against what it sees, instead of describing an image once and then working only in text. Elorian says a small team post-trained it on an open-weight base using a few hundred GPUs. Input is priced at $0.60 per million tokens and output at $3, which the company says is 94% below GPT-6 Astra."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/10/17/replit-is-no-longer-working-with-anthropic-ceo-says/","name":"Replit makes OpenAI the default and keeps Claude as a choice","description":"Replit chief executive Amjad Masad said the coding platform is no longer treating Anthropic as its preferred model partner. TechCrunch reports that OpenAI is now the default for Replit Agent, chosen on cost, the partnership, and Replit's own tests of building applications from scratch. Masad later said customers can still select Claude. He also said Replit had recently been a top-five Anthropic customer, and that a person familiar with the relationship disputed the idea that the partnership had ended."},{"@type":"ListItem","position":9,"url":"https://developers.openai.com/blog/maintaining-software-with-the-gpt-6-family","name":"OpenAI's team used GPT-6 to delete dead code, then checked the cheaper model","description":"OpenAI's Core Experimentation team described using GPT-6 Astra and the cheaper GPT-6.1 Sol to find unused code, stale feature flags, and slow tests. Five engineers, working part-time over two weeks, merged more than 1,400 pull requests that started from Astra proposals and deleted over 800,000 lines. One service image fell from 3.31GB to 1.72GB. In one comparison, GPT-6.1 Sol at the highest effort found 131 accepted stale-experiment issues against Astra's 142, at $15.12 of API cost versus $109.06."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/ibm-granite/granite-switch-4-1","name":"IBM's Granite Switch 4.1 chats, decides, and transcribes from one endpoint","description":"IBM published Granite Switch 4.1 on 15 October, in 8-billion and 30-billion parameter sizes. The Hugging Face post says one endpoint can chat, run decision checks, and transcribe speech, because small adapters sit on the base model and reuse its cache instead of loading a second full model. IBM says a safety adapter beats several named decision models on average on safety tasks, and that the speech model is the fastest on Hugging Face's OpenASR leaderboard."},{"@type":"ListItem","position":11,"url":"https://github.com/elie222/rakazo","name":"elie222/rakazo: a self-hosted bot where you pick the model and the sandbox","description":"Rakazo is an Apache-2.0 project billed as an open-source alternative to Grok Bot. You choose the model and the sandbox. It ships web, desktop, and mobile apps, and the repository was still taking commits on 17 October. It has about 4,400 stars and gained 146 stars on GitHub's TypeScript trending list today."},{"@type":"ListItem","position":12,"url":"https://github.com/ScrapeCreators/social-media-research-skills","name":"ScrapeCreators/social-media-research-skills: agent skills for public social research","description":"This Python repository packages agent skills for social-media research: outlier posts, comment mining, competitor teardowns, ad libraries, and trends across TikTok, Instagram, YouTube, Reddit, X, LinkedIn, and others. The project says it is powered by ScrapeCreators and works with Claude Code, Cursor, Codex, and Gemini CLI. It has 4,022 stars and gained 140 stars on GitHub's Python trending list today."},{"@type":"ListItem","position":13,"url":"https://github.com/OpenBMB/PilotDeck","name":"OpenBMB/PilotDeck: a desktop workspace for task-oriented agents","description":"PilotDeck, from OpenBMB, is an AGPL-3.0 desktop platform for task-oriented agent work. The project describes itself as a workspace-centric agent operating system, and it shipped release v2026.10.17 on 16 October. It has about 4,600 stars and gained 60 stars on GitHub's TypeScript trending list today."}]}}]}</script>
