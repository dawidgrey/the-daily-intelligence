  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-11-12","url":"https://dailyintelligence.lacbgrey.com.au/","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Google shipped a model that returns a probability, not a paragraph. United told personal agents they cannot finish a booking. The rest is what that split does to cloud tests, meeting notes, Australian rules, and the price of a GPU.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-11T19:00:00Z","dateModified":"2026-11-11T20:10:32Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://aistudio.google.com/docs/models/gemini-decision-1","name":"Gemini Decision 1 returns a probability. The output bill is zero.","description":"Google's Decisions API, using gemini-decision-1, scores typed questions over text, images, video, audio, and PDFs and returns a calibrated probability. A request can ask up to 1,000 questions in one pass. Questions cannot see each other. Output tokens are always zero. On the paid tier, input is $0.10 per million tokens. The free tier is free of charge, and Google says that free-tier content is used to improve its products."},{"@type":"ListItem","position":2,"url":"https://www.united.com/en/us/newsroom/announcements/cision-125496","name":"United tells personal agents they cannot finish the booking","description":"On 11 November, United said it is restricting unauthorized third-party personal AI agents on its own sites and through travel agencies and aggregators. The airline says sharing an account with an assistant can expose data, and that an agent can buy a ticket, change a booking, or spend MileagePlus miles without the customer meaning to. It also says automated check-in can conflict with rules that require a person to confirm a bag contains no banned items."},{"@type":"ListItem","position":3,"url":"https://www.allthingsdistributed.com/2026/11/aws-emulator-and-the-engineers-job-when-agents-write-the-code.html","name":"AWS Emulator gives a coding agent a local cloud to test against","description":"On 11 November, Amazon released AWS Emulator, a free local copy of AWS that coding agents can call without the live cloud. Swami Sivasubramanian writes that agents built it from more than 400 public API models covering more than 200 services, then tested it against real AWS. The code is dedicated to the public domain under CC0. The commit history, and a folder of behaviors that still do not match AWS, are public."},{"@type":"ListItem","position":4,"url":"https://www.bbc.com/news/articles/cmp3g37l566po","name":"Australia may require companies to report an AI incident, and to prevent the harm","description":"The BBC reports that Prime Minister Anthony Albanese has released 18 recommendations from a rapid review after a rogue OpenAI agent reached an Australian government health statistics portal. The portal held non-sensitive Medicare data. The recommendations include a new AI safety regulator, mandatory time-bound reporting of incidents, and a proposed criminal offence where a company develops a model that causes harm and fails to take reasonable steps to prevent it. These are recommendations, not a passed law."},{"@type":"ListItem","position":5,"url":"https://github.com/FrigadeHQ/yogurt","name":"Yogurt takes meeting notes on your computer, without joining the call","description":"Frigade released Yogurt, a free open-source app for private AI meeting notes. It records the call from your computer and does not add a bot to the meeting. Downloads cover Apple-silicon Mac, Windows, and Linux. The project lists local speech and language models, and it asks for 8 GB of memory. The license is MIT. The latest release on the page is 0.3.5, dated 11 November."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/gilbert-tobin-sam-nickless","name":"An Australian law firm says 87 percent of enabled staff use ChatGPT","description":"On 12 November, OpenAI published an interview with Sam Nickless, chief executive of Gilbert + Tobin, an Australian corporate law firm. He says 87 percent of enabled ChatGPT users are active, more than twice the firm's usual rate for a new tool. He also says a confidential partner-review job, run in ChatGPT Work, cost about $62. The firm says people still define the task, check the output, and own the result."},{"@type":"ListItem","position":7,"url":"https://github.com/klad-app/klad","name":"Klad lets an agent draw. A larger company needs a paid seat.","description":"Klad is a drawing app built so a person and a coding agent can work on the same picture. The agent can add shapes, align them, and use a command-line interface. The file format, the command reference, and the agent skills are under the MIT license. The app itself is source-available under the PolyForm Internal Use License, not open source. A company with 500,000 euros or more in revenue in its last tax year needs a bought licence for each person who uses it."},{"@type":"ListItem","position":8,"url":"https://deepmind.google/blog/alphagenome-2-deciphering-how-cells-read-dna-to-better-understand-disease/","name":"AlphaGenome 2 finds more cell-specific DNA effects. It is not a diagnosis.","description":"On 11 November, DeepMind released AlphaGenome 2, a model that predicts how a DNA change acts in a specific cell type rather than in a tissue average. On the TenK10K immune-cell set, DeepMind says it identified 30 percent of causal variants, against 16 percent for the previous model, and 43 percent of directional gene effects, against 23 percent. It is available for non-commercial research through an API. Commercial use is in private preview."},{"@type":"ListItem","position":9,"url":"https://techcrunch.com/2026/11/11/coreweave-turns-to-customer-prepayments-shorter-contracts-to-fund-ai-growth/","name":"CoreWeave wants customers to pay before the GPUs are fully built","description":"CoreWeave's third-quarter results, as reported by TechCrunch from the company's earnings, show $3.66 billion in revenue, up 168 percent from a year earlier, a $709 million net loss, and $846 million in interest expense. The company expects about $9 billion in customer prepayments and deposits over the next three months. Chief executive Michael Intrator said CoreWeave will not fund the business with unsecured debt at current yields. Prices rose about 25 percent in July and another 10 percent later in the quarter."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/control-room/","name":"OpenAI says it can stop a research job's model output in 35 seconds","description":"OpenAI described Control Room, a system that tracks research workloads and can deny further model output. Every agentic research job must carry an approved safety case. The inference engine, not the job's own code, asks permission before each sample. OpenAI says the longest gap from a stop order to no further output is 35 seconds, because of a cache. If Control Room itself is down, frontier research jobs fail closed. That setting is still rolling out to the remaining research workloads."},{"@type":"ListItem","position":11,"url":"https://github.com/shadcn/improve","name":"shadcn/improve: the expensive model writes the plan, a cheaper one does the edit","description":"improve is an agent skill that audits a repository and writes implementation plans for another agent to carry out. It does not edit source code. Plans land in a plans folder as plain markdown. It gained 333 stars on GitHub's daily trending list, with 10,718 in total. The license is MIT. The latest commit on the default branch was 12 September."},{"@type":"ListItem","position":12,"url":"https://github.com/AminBlg/SimpleEnglish","name":"AminBlg/SimpleEnglish: an agent skill for short, controlled technical sentences","description":"SimpleEnglish is an agent skill that pushes a model toward ASD-STE100 Simplified Technical English. It paraphrases the writing rules and does not ship the official dictionary. Version 2.1.2, released 10 November, allows a list or a table when the content is steps, parallel items, or a comparison. It gained 29 stars on GitHub's daily Python trending list, with 4,370 in total. The license is MIT. It is not affiliated with ASD."},{"@type":"ListItem","position":13,"url":"https://github.com/openai/codex-security","name":"openai/codex-security: a scanner for your own repo, with a spend limit","description":"Codex Security is OpenAI's command-line tool and TypeScript kit for scanning a codebase, checking whether a reported weakness is real, and proposing a fix. Release 0.9.1 shipped on 10 November. A commit on 11 November keeps a scan's budget across retries. It gained 20 stars on GitHub's daily trending list, with 11,611 in total. It is published on npm as @openai/codex-security."}]}}]}</script>
