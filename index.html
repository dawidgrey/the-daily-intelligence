  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-09-26","url":"https://dailyintelligence.lacbgrey.com.au/","description":"Today’s issue follows AI beyond the chat window: into physics calculations, outbreak reporting, sales workflows, local inference, robotics and public infrastructure. The common lesson is practical—capability matters, but so do cost, control, security and human verification.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-25T20:00:00Z","dateModified":"2026-09-25T20:03:17Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/research/yes-claude-can-do-nine-loops","name":"Claude completes a nine-loop theoretical-physics calculation","description":"Anthropic reports that Claude organized the code and computation needed to produce a nine-loop result in a simplified particle-physics theory. Physicist Lance Dixon independently validated the result, while a separate research group produced a concurrent result."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/features/ebola-response","name":"Claude shortens Ebola situation-report work from a day to under an hour","description":"Anthropic says WHO Africa, CEPI and laboratories in the Democratic Republic of the Congo are using Claude to compile field reports, compare daily case data, organize vaccine evidence and assist bioinformatics work during a Bundibugyo Ebola outbreak. A situation report that previously took all day can now be prepared in under an hour."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/introducing-gemini-38-live-with-live-avatar/","name":"Gemini 3.8 Live adds real-time visual avatars for enterprise agents","description":"Google introduced Live Avatar for Gemini 3.8 Live, pairing speech with low-latency generated video, multilingual lip-sync across 97 languages and asynchronous tool use. It is available in Gemini Enterprise, with custom-avatar creation restricted to approved organizations."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/proaction","name":"Proaction uses Codex to turn sales calls into tailored product demos","description":"In an OpenAI customer case study, fleet-software startup Proaction says a non-technical founder uses Codex to turn call recordings, emails and spreadsheets into four to six customized demos each month. The company estimates this saves 40–60 engineering hours monthly and improves progression from initial contact to solution development by 50–60%."},{"@type":"ListItem","position":5,"url":"https://www.esa.int/Newsroom/Press_Releases/ESA_and_Mistral_strengthen_cooperation_on_artificial_intelligence","name":"ESA and Mistral deepen work on sovereign AI for space","description":"The European Space Agency and Mistral signed a letter of intent covering AI for Earth observation, engineering, mission support and skills development. They will also examine European infrastructure with safeguards for security, traceability, auditability and sensitive information."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/omlx","name":"Hugging Face backs full-time maintenance of local-AI server oMLX","description":"Hugging Face has hired oMLX creator Jun Kim to maintain the Apache-2.0 project full time and support the wider Apple MLX ecosystem. Planned work includes making new Transformers model definitions easier to move into MLX implementations used by local inference engines."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/LiquidAI/lfm2-5-vl-dspark","name":"Liquid AI speeds up a small vision-language model with speculative decoding","description":"Liquid AI released an experimental DSpark draft model for LFM2.5-VL-3B that proposes candidate tokens for the main model to verify. The company reports decoding gains of up to 3.13 times on device and 2.66 times on an H100, with support for llama.cpp, MLX-VLM and SGLang."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/nvidia/how-to-use-nvidia-warp-and-mjwarp","name":"NVIDIA publishes a practical path to GPU-scale robot simulation","description":"NVIDIA’s tutorial shows how Warp and MJWarp can move MuJoCo-based robotics simulations from CPU execution to batched GPU workloads. It explains the stack, code structure and decision points for teams preparing many parallel simulated environments before training a policy."},{"@type":"ListItem","position":9,"url":"https://www.cnbc.com/2026/09/25/pentagon-anthropic-ai-risk-appeals-court.html","name":"U.S. appeals court upholds Pentagon’s Anthropic supply-chain designation","description":"A divided federal appeals panel upheld one Pentagon designation of Anthropic as a supply-chain risk, restricting military and contractor use of Claude in Defense Department work. A separate federal court had rejected a parallel designation, and Anthropic says it is considering further review."},{"@type":"ListItem","position":10,"url":"https://www.revefi.com/blog/how-revefi-reduced-its-data-agents-spend","name":"A changing system prompt drove up one data agent’s costs","description":"Revefi says timestamps and changing user context near the front of its system prompt prevented prefix caching across long agent sessions. After restructuring stable and volatile context, the company reports cutting that agent’s model spend by 90% and finding a similar pattern in customer systems."},{"@type":"ListItem","position":11,"url":"https://github.com/paperclipai/paperclip","name":"Paperclip provides an open control plane for workplace agents","description":"Paperclip is a heavily trending TypeScript project for organizing AI agents, tasks, budgets and approvals in one workplace-style application. The MIT-licensed repository has more than 84,000 stars and was receiving active updates during this issue’s collection window."},{"@type":"ListItem","position":12,"url":"https://github.com/mvschwarz/openrig","name":"OpenRig runs Claude Code and Codex as one multi-agent system","description":"OpenRig is an Apache-2.0 TypeScript harness that coordinates Claude Code and Codex within a shared multi-agent workflow. The repository has more than 400 stars, around 3,000 commits and fresh activity during the collection window."},{"@type":"ListItem","position":13,"url":"https://github.com/openai/openai-cookbook","name":"OpenAI Cookbook collects practical API patterns and examples","description":"OpenAI Cookbook is an MIT-licensed collection of examples and guides for the OpenAI API, covering common application and agent patterns. The repository has more than 76,000 stars and recent additions include sandbox, voice-agent evaluation and spending-control examples."}]}}]}</script>
