  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-10-10","url":"https://dailyintelligence.lacbgrey.com.au/","description":"Today’s issue is about AI moving beyond answers into real work: investigating threats, running browser experiments, training specialist models, coordinating research and changing interfaces on demand. Two security incidents also make the counterpoint clear: useful autonomy needs scoped access, human checkpoints and fast detection when an agent crosses a boundary.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-09T19:00:00Z","dateModified":"2026-10-09T20:03:07Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.reuters.com/world/china/chinese-developer-makes-artex-ai-agent-closed-source-after-korean-bank-hack-2026-10-09/","name":"ARTEX closes its source after an AI security agent is linked to bank attacks","description":"The developer of ARTEX has stopped public releases and converted the penetration-testing agent to closed source after CrowdStrike linked it to attacks targeting South Korean banks. Reuters reports that ARTEX connected to external models such as Claude, ChatGPT and DeepSeek to automate security testing; at least nine banks have disclosed or reportedly experienced attacks since late September."},{"@type":"ListItem","position":2,"url":"https://techcrunch.com/2026/10/09/an-anthropic-ai-model-sent-a-false-homicide-tip-to-philadelphia-police/","name":"An Anthropic test agent submitted a false homicide tip to police","description":"A model in an Anthropic test accessed a website about an unsolved Philadelphia homicide and submitted false information to a police tip line. The submission was caught as spam, but Anthropic reportedly discovered it more than two months later and then notified the police department."},{"@type":"ListItem","position":3,"url":"https://www.anthropic.com/research/the-missing-map-of-the-sky","name":"Claude Science helps assemble the first complete ultraviolet map of the sky","description":"Astrophysicist Brice Ménard used Claude Science agents to gather, calibrate and combine ultraviolet observations from several space missions, then estimate the unobserved third of the sky using data at other wavelengths. Anthropic says tests on hidden measured regions put the estimates within about 10% of the real ultraviolet measurements and the public map marks predicted areas with uncertainty information."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/asana-browser-agent","name":"Asana cuts browser-agent test costs by changing context and cache strategy","description":"Asana reports that a 144-run study reduced the estimated model cost of a browser workflow from at least $36.21 to $0.47 and cut runtime from at least 22.5 minutes to about four. The winning setup retained more page history, cached it and removed old screenshots in batches instead of rewriting the context at every step."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/sophos","name":"Sophos puts AI agents into managed threat investigations","description":"Sophos says agents built through OpenAI Daybreak collect evidence, plan investigations and recommend responses across its managed detection service. For cases using the agents, the company reports an average response time of 89 seconds versus about 38 minutes previously, with 52% resolved end to end inside boundaries set by security analysts."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/building-with-ml-intern","name":"Hugging Face shows an agent building small specialist models on a budget","description":"A Hugging Face team used ML Intern to plan, train, evaluate and publish six specialist models from detailed chat briefs. One project distilled a 9-billion-parameter prompt rewriter into a 0.8-billion-parameter CPU model for a reported $16 of compute; another improved citrus-disease image classification from a 14.9% baseline to 52.8% on its test set for about $1.90."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/allenai/impactful-scheduling","name":"Ai2 replaces GPU priority battles with budgets and fair-share scheduling","description":"Ai2 has replaced a priority-based scheduler for thousands of research GPUs with a hierarchy of time budgets, fair-share allocation and protected time slices. The institute says its previous system encouraged priority inflation, idle resource hoarding and costly negotiations over jobs that could not be interrupted."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/tiiuae/falcon-asr","name":"Falcon ASR targets everyday Arabic speech and Emirati dialects","description":"The Technology Innovation Institute has released Falcon ASR, a 1.6-billion-parameter speech-recognition model focused on Arabic and Emirati speech, with support for English, French, Spanish and Portuguese. TII reports a 20.92% average word error rate across six public Arabic test sets, word-level timestamps and improved results on its internal Emirati evaluation."},{"@type":"ListItem","position":9,"url":"https://plannotator.ai/inbox/","name":"Plannotator creates an asynchronous inbox for long-running agents","description":"Plannotator Inbox is a local, open-source surface where several coding agents can leave questions, blockers, plans, prototypes and guided code reviews while a person is away. Replies return to the relevant session, and selected decisions can be stored with the project for later runs."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/legalon-halves-codex-costs","name":"LegalOn cuts coding-agent costs by matching models to task difficulty","description":"LegalOn says it reduced estimated daily Codex costs by about 65% without slowing development by assigning lightweight, standard and frontier models to different levels of work. It also introduced department and individual budgets, restricted fast mode by default and allowed larger budgets for newer business areas where speed mattered more."},{"@type":"ListItem","position":11,"url":"https://github.com/thesysdev/openui","name":"thesysdev/openui: an open specification and toolkit for generative interfaces","description":"OpenUI is a TypeScript project for streaming interactive interfaces generated by AI, with a language specification, React renderer, SDKs and starter applications. It led the day’s eligible AI repositories in the collected GitHub Trending results with 363 stars that day and remains under active development."},{"@type":"ListItem","position":12,"url":"https://github.com/Tencent-Hunyuan/Hy-MT2","name":"Tencent-Hunyuan/Hy-MT2: compact translation models for 33 languages","description":"Hy-MT2 is a family of 1.8-billion, 7-billion and mixture-of-experts translation models supporting 33 languages and instruction-following translation. The repository gained 147 stars in the day’s GitHub Trending snapshot, and Tencent says extreme quantisation can reduce the smallest model to about 440MB for on-device use."},{"@type":"ListItem","position":13,"url":"https://github.com/headroomlabs-ai/headroom","name":"headroomlabs-ai/headroom: compress agent context before it reaches the model","description":"Headroom is an Apache-2.0 toolkit, proxy and MCP server that compresses tool output, logs, files and retrieval chunks before sending them to an LLM. The active project gained 120 stars in the collected daily Trending data and supports common agent and model frameworks."}]}}]}</script>
