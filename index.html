  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-09-02","url":"https://dailyintelligence.lacbgrey.com.au/","description":"Today's developments move AI closer to everyday work: stronger models, cheaper video analysis, live transcription, connected healthcare records and agents that manage real workflows. The practical theme is control—over cost, context, permissions, privacy and the systems AI is allowed to touch.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-01T20:00:00Z","dateModified":"2026-09-01T20:06:52Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/claude-fable-and-mythos-5-1","name":"Anthropic launches Claude Fable 5.1 with lower agent-workflow costs","description":"Anthropic released Claude Fable 5.1 for general use and the more tightly controlled Mythos 5.1 for vetted cyber and life-science work. The company says lower cache-read pricing cuts typical Fable workloads by about 25% and highly agentic workloads by as much as 45%, while reducing false-positive safety blocks."},{"@type":"ListItem","position":2,"url":"https://deepmind.google/blog/introducing-agentic-video-in-gemini/","name":"Gemini can now choose which moments of a video to inspect","description":"Google added agentic video understanding to Gemini 3.7 Flash, 3.6 Flash and 3.5 Flash-Lite. Instead of sampling an entire video at a fixed rate, the models can search and rescan relevant visual, audio and transcript segments; Google reports up to 88% fewer tokens, 66% lower analysis costs and 7% higher accuracy in its tests."},{"@type":"ListItem","position":3,"url":"https://huggingface.co/blog/webgpu-kernels","name":"Hugging Face releases 207 WebGPU kernels for local browser AI","description":"Hugging Face released an Apache-2.0 collection of 207 versioned WebGPU kernels, a JavaScript loader and Fleet, an in-browser benchmarking suite. Each kernel packages its interface, shader templates, correctness cases and benchmarks so implementations can be tested across different browsers and GPUs."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/ai-native-company-workflows","name":"OpenAI maps how three companies turn agent experiments into workflows","description":"OpenAI describes how Basis packages employee onboarding as a reusable skill, Clay maintains persistent account workspaces and Exa lets an agent find integration opportunities and prepare tested pull requests. Across the examples, people retain decision rights while agents work from bounded processes, evidence and review points."},{"@type":"ListItem","position":5,"url":"https://research.meta.ai/blog/introducing-muse-voice-transcribe","name":"Meta introduces Muse Voice Transcribe for live multilingual speech","description":"Meta introduced Muse Voice Transcribe, a streaming model that combines speech recognition, speaker separation and endpoint detection. It supports seamless language switching, can distinguish more than 20 speakers and is available through Meta Model API, Meta AI for Mac and Muse Code."},{"@type":"ListItem","position":6,"url":"https://www.norirobotics.com/","name":"Nori opens orders for a $1,688 two-armed home robot","description":"Nori Robotics is taking full-price orders for the Nori A3, a mobile two-armed robot scheduled to ship in fall 2026. The company lists a 1.5-kilogram payload per arm, four cameras, lidar, voice input, six-to-eight-hour battery life and a laptop app for training and control."},{"@type":"ListItem","position":7,"url":"https://www.manifold.security/blog/ai-coding-agents-git-hijack","name":"GitSpawn flaw lets some coding agents execute repository-controlled commands","description":"Manifold Security found that several coding agents ran Git context commands without neutralizing executable settings in a repository's local Git configuration. A project delivered with its .git directory intact could therefore run code as the user; some affected products were patched, while the researchers reported four findings still unpatched at publication."},{"@type":"ListItem","position":8,"url":"https://openai.com/index/chatgpt-connects-health-records-and-healthcare-sources","name":"ChatGPT for Healthcare connects authorized Epic records and public datasets","description":"OpenAI added an Epic integration that lets eligible healthcare organizations bring authorized patient context into ChatGPT for Healthcare. A separate plugin connects nine official public sources, including PubMed, DailyMed, ClinicalTrials.gov and CMS Coverage, while preserving source references for review."},{"@type":"ListItem","position":9,"url":"https://fambot.com/","name":"Fambot turns family emails and calendars into a daily plan","description":"Fambot is offering a free beta that connects to Gmail and Google Calendar, extracts tasks and dates from school and family messages, and produces a daily digest, shared to-do list and calendar updates. The company says it does not allow its AI providers to train on user data and erases the account when disconnected."},{"@type":"ListItem","position":10,"url":"https://blog.google/products-and-platforms/products/workspace/google-pics/","name":"Google Pics brings prompt-based image creation into Workspace","description":"Google launched Google Pics, a Nano Banana-powered image creation and editing tool for posters, illustrations, social posts and other everyday designs. It supports object-level edits, text changes and translation, variations and collaboration, with availability beginning in Workspace, Docs and Slides for eligible customers."},{"@type":"ListItem","position":11,"url":"https://github.com/debpalash/VoiceStudio","name":"VoiceStudio packages local voice cloning, dubbing and transcription","description":"VoiceStudio is an actively developed, AGPL-licensed desktop platform for local voice generation, cloning, dubbing, transcription, dictation and audiobook workflows. The repository has about 13,600 stars and supports a broad collection of optional speech engines and models."},{"@type":"ListItem","position":12,"url":"https://github.com/Imbad0202/academic-research-skills","name":"academic-research-skills structures research, review and revision for agents","description":"Academic Research Skills is a fast-moving collection of Claude Code workflows for literature research, paper drafting, review, revision, citation checks and reproducibility. The repository has about 44,800 stars and packages the process as separate skills plus an orchestrated academic pipeline."},{"@type":"ListItem","position":13,"url":"https://github.com/inkeep/open-knowledge","name":"OpenKnowledge combines a local Markdown workspace with AI agents","description":"OpenKnowledge is a GPL-licensed Markdown editor and LLM wiki with desktop and local web versions, rich editing, search, graph links and integrations for Claude, Codex and other agent tools. The actively maintained repository has about 3,900 stars and can open existing Markdown folders and Obsidian vaults."}]}}]}</script>
