  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-11-22","url":"https://dailyintelligence.lacbgrey.com.au/","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today, Thinking Machines released an open-weight model that loops its middle layers and can run on a laptop with enough memory. Google priced Gemini 4 Neon at $3 in and $15 out. Reuters found Meta's Muse using setup permissions employees did not think covered Signal.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-21T19:00:00Z","dateModified":"2026-11-21T20:10:53Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://thinkingmachines.ai/news/inkling-2-mini/","name":"Inkling 2 Mini loops the middle. The scores are the lab's.","description":"On 20 November, Thinking Machines released Inkling 2 Mini, an open-weight model with 26.4 billion parameters and about 20 GB of weights. The middle 12 layers run three times, so the lab counts 5.4 billion weight activations per token. It says the model leads open-weight models under 100 billion parameters on DeepSWE v1.1 at 48.2 percent and on Vals Index v2.2 at 46.5 percent."},{"@type":"ListItem","position":2,"url":"https://deepmind.google/blog/introducing-gemini-4-neon/","name":"Gemini 4 Neon is $3 in and $15 out. The free app may not pick it.","description":"On 18 November, Google introduced Gemini 4 Neon at $3 per million input tokens, $0.15 per million cached input tokens, and $15 per million output tokens, with a 1 million-token window. Google says it scores 61 on the Artificial Analysis Intelligence Index at the xhigh setting, third overall, and 70.9 percent on the Vals Index, second there."},{"@type":"ListItem","position":3,"url":"https://openai.com/research/verify/","name":"A watermark is a mark. It is not a fact check.","description":"OpenAI's public Verify tool checks one uploaded image, audio file, or PDF for C2PA metadata or a SynthID watermark tied to ChatGPT, the API, or Codex. OpenAI says a detected signal means the file was likely processed by its tools, and that false positives are rare. The public page does not check text."},{"@type":"ListItem","position":4,"url":"https://www.reuters.com/investigations/meta-bets-big-muse-ai-agent-early-safety-mishaps-surface-2026-11-18/","name":"Muse read a Signal reminder. Reuters could not tell a mix-up from a guess.","description":"Reuters reviewed internal Meta posts in which employees said Muse sent them messages about requests they had not made, including bank balances that were not theirs. One employee said Muse reminded her to answer a sister on Signal, an app she did not recall connecting. Meta spokesperson Daniel Roberts called the examples isolated, and said many flagged mix-ups were hallucinations that had been addressed."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/11/21/all-the-ai-agents-that-can-live-in-your-text-messages/","name":"A text-message agent is a list. It is not a test.","description":"On 21 November, TechCrunch listed agents you can reach by text instead of a new app. Ask Proxy's personal plan is $1 a day over SMS. Folk's Pro plan is $8.33 a month. Comma is free to start and open source, over Signal, Telegram, and WeChat. Fambot, for family calendars, is free in beta."},{"@type":"ListItem","position":6,"url":"https://metr.org/blog/2026-11-20-q4-2026-capability-update/","name":"Coding tasks are getting longer. Judgment is still the gap.","description":"On 20 November, METR updated its tests of public models through Opus 5.5 and GPT-6 Astra. On its coding and optimization tasks with a clear score, models usually matched or beat the skilled humans METR could recruit. On tasks where the right choice is hard to check, METR says the agents had worse judgment than human experts."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/combatting-adversarial-distillation","name":"Pulling the private reasoning got harder. That is OpenAI's test.","description":"On 20 November, OpenAI said it had tightened defenses that stop someone from pulling GPT-6.2's protected reasoning, the intermediate steps the model does not show as the answer. In an internal adaptive test, OpenAI says the average success rate fell from 54.0 percent against GPT-6 Astra with its original safeguards to 0.2 percent against GPT-6.2 Astra with the update."},{"@type":"ListItem","position":8,"url":"https://the-decoder.com/openai-shares-new-prompting-tips-for-gpt-6-2-astra-and-sol-to-fix-brief-answers-and-unnecessary-questions/","name":"GPT-6.2 is briefer by default. Old 'be concise' prompts can cut too much.","description":"The Decoder reports new OpenAI prompt guidance for GPT-6.2 Astra and Sol. OpenAI's model guide says Astra writes more briefly than earlier models, so an old instruction to be concise can now cut too far. If the next step is unclear, OpenAI says the model may stop and wait, and recommends telling it to continue only on steps it is already allowed to take."},{"@type":"ListItem","position":9,"url":"https://techcommunity.microsoft.com/blog/microsoftusbblog/introducing-rdma-over-usb4%C2%AE-on-windows-run-larger-local-ai-models-across-pcs/4574602","name":"Two PCs can share a model. The Insider build is not out yet.","description":"On 19 November, Microsoft announced a developer preview of RDMA over USB4 on Windows, so a compatible inference stack can split one model across PCs linked by USB4 cables. Microsoft says the preview is coming soon to Windows Insiders in the Experimental channel, and that the feature is off by default. In its lab, small-message round trips were about 28 to 50 microseconds, roughly four times lower than Ethernet over the same link."},{"@type":"ListItem","position":10,"url":"https://clickhouse.com/blog/introducing-loom-agent-memory-that-keeps-up-with-your-code","name":"Loom flags a stale note. It does not rewrite it.","description":"ClickHouse released Loom, an open-source store that keeps agent notes next to a code index. On the company's own questions about the ClickHouse codebase, it says the mean answer-quality score rose from 0.78 to 0.84 after Loom was added. A note tied to a function is flagged if that code changes."},{"@type":"ListItem","position":11,"url":"https://github.com/mastra-ai/mastra","name":"mastra-ai/mastra: a TypeScript framework, with a pause for approval","description":"Mastra gained 31 stars on GitHub's TypeScript trending list today, and now has about 29,700. It is a TypeScript framework for agents and workflows, with model routing, memory, and MCP servers. The core is Apache-2.0. Code under directories named ee/ is under a separate enterprise license."},{"@type":"ListItem","position":12,"url":"https://github.com/awslabs/cli-agent-orchestrator","name":"awslabs/cli-agent-orchestrator: several coding CLIs, in separate terminals","description":"AWS Labs' cli-agent-orchestrator gained 14 stars on GitHub's Python trending list today, and has about 1,600. It coordinates coding CLIs such as Claude Code, Kiro, and Codex in isolated tmux sessions. The license is Apache-2.0."},{"@type":"ListItem","position":13,"url":"https://github.com/tianma-if/edgeever","name":"tianma-if/edgeever: notes you host, with an MCP door","description":"EdgeEver gained 12 stars on GitHub's TypeScript trending list today, and has about 3,500. The project describes it as an AI-native note app, with sync, a web clipper, and MCP, that you can run on Cloudflare or Docker. The license is AGPL-3.0."}]}}]}</script>
