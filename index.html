  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/#webpage","name":"The Daily Intelligence — 2026-11-19","url":"https://dailyintelligence.lacbgrey.com.au/","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today, Citi tells customers that a third-party finance agent is their responsibility, even if it is hacked. Google is adding a temporary thread to AI Mode in Search. Anthropic's filing, as TechCrunch reads it, leaves Amazon and Google with nearly 30 percent of the company after the IPO.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-18T19:00:00Z","dateModified":"2026-11-18T20:12:26Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://techcrunch.com/2026/11/18/more-banks-says-customers-using-ai-agents-are-on-their-own-even-if-they-get-hacked/","name":"Citi says the agent is your problem, even if it is hacked.","description":"On 18 November, TechCrunch reported that Citibank changed its online agreement so customers who give a third-party AI tool access to an account are responsible for what that tool does. The bank told TechCrunch the change is meant to make that risk clear, and the report says the terms also leave the customer responsible if the tool leaks the login or is hacked."},{"@type":"ListItem","position":2,"url":"https://blog.google/products-and-platforms/products/search/temporary-threads-ai-mode/","name":"AI Mode in Search can forget the thread.","description":"On 17 November, Google said temporary threads are rolling out in AI Mode in Search, on desktop and mobile, in every language AI Mode supports. You click an icon in the upper right. Google says the session is detached from your account, is not saved to history, and does not change later recommendations."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/11/17/amazon-and-google-will-together-own-nearly-30-of-anthropic-after-its-ipo/","name":"Amazon and Google will hold nearly 30 percent of Anthropic.","description":"TechCrunch, citing Anthropic's IPO disclosure, says Amazon will hold 14.7 percent after the offering, in non-voting shares, and could reach 23.8 percent if it converted every remaining note. Google will hold 13.7 percent, also non-voting."},{"@type":"ListItem","position":4,"url":"https://apnews.com/article/chatgpt-openai-hugging-face-ai-risk-1dd7be56134b4f09fb2fb974803edc69","name":"California sued OpenAI over safety claims. Nothing is decided.","description":"The Associated Press reports that California Attorney General Rob Bonta sued OpenAI in San Francisco Superior Court, alleging the company misled the public by developing advanced models without necessary safeguards. The suit calls that a public nuisance and asks a judge to order changes and the return of profits from the practices it challenges."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/inside-the-codex-sandbox","name":"The Codex sandbox blocks the network. It can still read the key.","description":"On 18 November, OpenAI described the default Codex sandbox for a Git project. Commands may write in the workspace, while .git and .codex stay read-only, and network access is off. Reads are broad, limited by the operating system's own permissions."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/our-first-phase-of-embedded-assessments/","name":"Four outside groups will sit inside OpenAI. Reports can still wait.","description":"On 16 November, OpenAI said it signed agreements with Apollo Research, METR, Transluce, and Goodfire for on-site assessments of alignment and safeguards. Depending on the scope, assessors can see internal checkpoints, code, training data, and monitoring records, and sensitive work is done on OpenAI devices."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/advancing-chip-design-with-our-models","name":"OpenAI says model-written chip changes are in a design AMD sent to be built.","description":"On 18 November, OpenAI said its models found power, performance, and area changes in AMD's flagship GPU designs, up to 14 percent against heavily optimized baselines, and that AMD put some of those changes in a design already sent for manufacturing. OpenAI also says its team estimates about 13 percent less standard-cell area in one Jalapeño block and 10 percent in another, and that those changes were proven in silicon."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/rumble-2-flash","name":"A 0.5B speech model is open. The scores are the maker's.","description":"Reson8 released Rumble-2-Flash on 18 November under Apache 2.0, a 0.5-billion-parameter speech model for more than 40 languages. It runs in Hugging Face Transformers and vLLM without custom code. The weights are at Reson8/Rumble-2-Flash."},{"@type":"ListItem","position":9,"url":"https://docs.mistral.ai/vibe/code/desktop/overview","name":"Vibe Desktop can edit the local repo. Linux is not out.","description":"Mistral's desktop docs describe a coding app for macOS and Windows, with Linux still listed as coming soon. A session can run against a local repository or a cloud sandbox, and Git worktrees keep parallel tasks from writing over the same files. The Decoder reported the desktop release on 18 November."},{"@type":"ListItem","position":10,"url":"https://deepmind.google/blog/genie-4-is-now-available/","name":"Genie 4 is in Project Genie. The gate is an Ultra plan.","description":"On 18 November, DeepMind said Genie 4 is rolling out inside Project Genie to eligible Google AI Ultra subscribers. You can type a prompt while a world is running, including to change the scene, and the model adds native audio. Google AI Pro members can join a waitlist."},{"@type":"ListItem","position":11,"url":"https://github.com/ethanplusai/sellbird","name":"ethanplusai/sellbird: cold email on your model plan. You still own the send.","description":"Sellbird, formerly Harvey, was the second AI climb on GitHub's Python trending list, with 358 stars today and about 6,500 in total. The project says it finds companies and decision makers, checks emails, writes a personal cold email, sends it, and handles replies, using your Claude or ChatGPT plan. It is AGPL-3.0."},{"@type":"ListItem","position":12,"url":"https://github.com/colbymchenry/codegraph","name":"colbymchenry/codegraph: a local map of the repo, for the agent","description":"CodeGraph gained 129 stars on GitHub's TypeScript trending list today. The repo has about 78,000 stars, under MIT, and tagged v1.6.3 on 17 November. The project says it keeps a local code graph that updates as the files change, for Claude Code, Codex, Cursor, Gemini, and Hermes Agent, among others."},{"@type":"ListItem","position":13,"url":"https://github.com/punkpeye/awesome-mcp-servers","name":"punkpeye/awesome-mcp-servers: a list of connectors, not a review","description":"Awesome MCP Servers gained 52 stars on GitHub's daily trending list. The repo has about 98,000 stars, under MIT. It is a collection of MCP servers, not a server itself."}]}}]}</script>
