  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-03.html#webpage","name":"The Daily Intelligence — 2026-09-03","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-03.html","description":"Today’s issue follows AI into practical work: faster agent models, commerce blueprints, live operational forecasting and spatial creation. It also examines the control layer catching up around them, from cyber safeguards and code audits to copyright and forecasting choices.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-02T20:00:00Z","dateModified":"2026-09-02T20:05:00Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://deepmind.google/blog/introducing-gemini-3-8-flash-and-38-flash-cyber/","name":"Google launches Gemini 3.8 Flash for longer agent and coding work","description":"Google introduced Gemini 3.8 Flash as a faster, lower-cost model for multi-step reasoning, software engineering and long-running agents, alongside a restricted cybersecurity variant. The introductory API price matches 3.7 Flash, although Google says difficult tasks may consume more reasoning tokens."},{"@type":"ListItem","position":2,"url":"https://developer.meta.com/ai/models/muse-spark/","name":"Meta’s Muse Spark 1.3 targets agentic coding workflows","description":"Meta released Muse Spark 1.3, describing it as a model trained for agentic workflows and optimized for competitive coding performance. The launch adds another focused coding model to a market increasingly shaped by agents rather than single-turn chat."},{"@type":"ListItem","position":3,"url":"https://www.worldlabs.ai/blog/atlas","name":"World Labs’ Atlas joins generation, 3D reconstruction and simulation","description":"World Labs unveiled Atlas, an early-access model that works across text, images, video and 3D. It can reconstruct scenes, generate camera-controlled video up to one minute at 1440p and support simulation workflows for robotics."},{"@type":"ListItem","position":4,"url":"https://claude.com/blog/claude-for-commerce-agents","name":"Anthropic publishes working blueprints for commerce agents","description":"Anthropic released reference implementations for shopping and merchant agents, including catalog search, cart building, customer care, sales analysis and inventory monitoring. The blueprint keeps checkout with the merchant and requires human approval before suggested business changes go live."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/path-to-astra","name":"OpenAI classifies Astra as its first ‘Critical’ cyber model","description":"OpenAI says its forthcoming Astra model can autonomously find and exploit previously unknown flaws in hardened systems, meeting the company’s Critical cybersecurity threshold. It plans a staged release with restricted advanced cyber access, stronger monitoring and pauses when agent behavior appears unauthorized."},{"@type":"ListItem","position":6,"url":"https://deepmind.google/blog/proactive-cyber-defense-for-governments-and-enterprises/","name":"Google opens a controlled path to AI-generated security patches","description":"Google launched Fairwind, a limited-access program that combines Gemini 3.8 Flash Cyber with its CodeMender harness to find, verify and patch vulnerabilities. Initial access is aimed at governments, critical infrastructure operators and trusted enterprise security teams under operational restrictions."},{"@type":"ListItem","position":7,"url":"https://aisle.com/blog/aisle-discovered-six-curl-cves-after-openai-and-anthropic-found-zero","name":"An AI security system found six low-severity curl flaws others missed","description":"AISLE reports that its autonomous audit produced six findings accepted as CVEs by curl’s maintainers after other frontier security systems returned no additional results. All six flaws were rated low severity and fixed in curl 8.22.0, providing external validation beyond a benchmark score."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/ibm-research/real-time-intelligence","name":"IBM brings time-series foundation models into live data streams","description":"IBM and Confluent are offering early access to time-series foundation models inside Confluent Cloud data streams. The integration targets forecasting, anomaly detection, similar-event retrieval and operational optimization without building a separate model for every signal."},{"@type":"ListItem","position":9,"url":"https://arxiv.org/abs/2608.28482","name":"Research shows reward choice changes how LLM forecasts fail","description":"A new preprint compares five theoretically proper scoring rules used to train LLMs on binary forecasts. The models reached broadly similar aggregate performance but differed in calibration, probability use and the mix of bias, information and noise in their errors; the authors note that each condition used only one seed."},{"@type":"ListItem","position":10,"url":"https://www.reuters.com/legal/litigation/us-government-backs-openai-new-york-times-copyright-case-2026-09-02/","name":"US government backs a broad fair-use argument for AI training","description":"The US government filed an advisory brief supporting OpenAI in its copyright dispute with The New York Times, arguing that training language models on copyrighted text is generally transformative fair use. The brief is not a ruling, and US courts have not settled the broader question."},{"@type":"ListItem","position":11,"url":"https://github.com/Gitlawb/openclaude","name":"openclaude: a provider-flexible coding agent runtime","description":"openclaude is a TypeScript coding-agent project designed to run across environments and model providers. It is actively maintained, with a recent release and broad community participation."},{"@type":"ListItem","position":12,"url":"https://github.com/blader/humanizer","name":"Humanizer: an agent skill for revising formulaic AI prose","description":"Humanizer is a portable agent skill that identifies common patterns associated with generic AI-generated writing and guides a rewrite in plainer language. It supports skill and plugin installation across several coding-agent environments."},{"@type":"ListItem","position":13,"url":"https://github.com/KeygraphHQ/shannon","name":"Shannon 3.0 adds agentic static analysis to AI pentesting","description":"Shannon is an AI pentesting system for web applications and APIs that analyzes source code and attempts controlled exploits to validate findings. Version 3.0 adds an agentic static-analysis pipeline and reconciles those results with runtime pentest findings."}]}}]}</script>
