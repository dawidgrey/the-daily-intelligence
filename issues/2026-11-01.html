  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-01.html#webpage","name":"The Daily Intelligence — 2026-11-01","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-01.html","description":"Researchers showed that opening a public ChatGPT share could read private chats. OpenAI fixed it on 26 October. The rest of today's issue is about the checks that are still yours: a bad extension that sat in Cursor's store for part of a day, a Claude watermark that two older models skip if a sampling setting changes, and a privacy assistant that shuts down on 6 November.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-31T19:00:00Z","dateModified":"2026-11-07T20:14:59Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.parameter.ai/labs/we-found-a-gap-at-openai","name":"A shared ChatGPT link could read private chats. OpenAI has closed it","description":"Parameter says that in October it found a way for a public ChatGPT share to run code inside the signed-in session of whoever opened it. The code could list that person's conversations and read a private chat that had never been shared. The person did not need to install an app or paste anything. OpenAI fixed the issue on 26 October and rated it P1, a high-severity report."},{"@type":"ListItem","position":2,"url":"https://cursor.com/blog/claude-code-extension-security-notice","name":"A modified Claude Code extension sat in Cursor's store for part of a day","description":"Cursor says that on 29 October, between about 2:27am and 1:35pm Pacific time, versions 2.1.312 and 2.1.313 of an extension named Anthropic.claude-code were available in its VS Code marketplace for Mac and Windows. Those versions were not from Anthropic. Cursor says the extension tried to collect basic computer details and install a lasting remote-access method. The attacker server is offline. Cursor says no other marketplace extensions were tampered with."},{"@type":"ListItem","position":3,"url":"https://the-decoder.com/anthropics-watermark-rollout-leaves-a-loophole-on-two-older-claude-models/","name":"On two older Claude models, a sampling change skips the watermark","description":"The Decoder reports that Anthropic emailed API customers to say it is adding its text watermark to Claude Mythos 5, Opus 4.7, Opus 4.6, and Sonnet 4.6. Newer models, including Opus 5.5, already carry it. On Opus 4.6 and Sonnet 4.6, The Decoder says the mark applies only when sampling settings are left at their defaults. A change to those settings skips it. The email, as reported, does not describe that exception for Mythos 5 or Opus 4.7."},{"@type":"ListItem","position":4,"url":"https://www.gamedeveloper.com/programming/anthropic-appears-to-have-ordered-ai-tool-claude-to-stop-remaking-video-games","name":"Claude Code is being steered away from remaking a specific game","description":"On 30 October Game Developer reported that Anthropic added two sentences to Claude Code's prompt on Opus 5.5, after a change spotted on 27 October. The instruction is to build original games, games in a genre, and games from the user's own designs and assets, and not to recreate a specific existing game, even under a new name. Anthropic's Addy Osmani said the change is because using Claude to infringe intellectual property is against the usage policy."},{"@type":"ListItem","position":5,"url":"https://www.apple.com.cn/newsroom/2026/10/apple-intelligence-features-are-coming-to-users-in-china/","name":"Apple Intelligence reaches China in December, without the new Siri","description":"On 31 October Apple said the first Apple Intelligence features will reach users in China with iOS 27.3 in December. A developer beta opens on 4 November. The set includes live translation, writing tools, visual intelligence, photo cleanup, Genmoji, notification summaries, and priority mail. In some of those experiences Apple is adding Alibaba's Qwen, including in Siri, writing tools, and visual intelligence. This release does not include the newer Siri AI announced at WWDC 2026."},{"@type":"ListItem","position":6,"url":"https://www.theverge.com/ai-artificial-intelligence/1023820/sam-altman-ram-shortage-cloud-servers","name":"Altman says scarce memory is better used in a data center than in a PC","description":"On the Cheeky Pint podcast, Sam Altman said it is quite terrible, from a global allocation view, for limited DRAM to sit in personal computers and be used a small share of the time. He argued that a supply squeeze is better handled by high use in the cloud. The Verge notes that Samsung and SK Hynix have long-term deals with cloud operators, including projects such as OpenAI's Stargate, and that this is why laptops and phones are getting more expensive."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/31/openai-reportedly-lowers-funding-target-for-new-round/","name":"OpenAI has reportedly cut a $30 billion target, and closed $11 billion","description":"On 31 October TechCrunch reported, citing the Financial Times, that OpenAI has lowered a funding target from $30 billion to $20 billion, with a first close expected to be lower still. A Wall Street Journal follow-up, also cited by TechCrunch, said the company had secured $11 billion so far and met a tepid response from some large investors. The round is reported to be led by investors from the United Arab Emirates. TechCrunch said it had asked OpenAI for comment."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/10/30/ollie-a-privacy-focused-ai-assistant-is-shutting-down/","name":"The privacy assistant Ollie shuts down on 6 November","description":"Ollie co-founder Bill Lennon said on 30 October that the app will shut down on 6 November. Ollie was a subscription assistant for family organisation, connected to email and calendar, with plans for bookings, meal planning, and bills. It had raised a $7.5 million seed round led by Khosla Ventures, announced in September, and was one of the early assistants in this category to complete a SOC 2 audit. Lennon said the company could not keep up as Muse, Instinct, and others entered."},{"@type":"ListItem","position":9,"url":"https://www.npr.org/2026/10/30/nx-s1-6022278/ai-artificial-intelligence-teens-jed-common-sense-media","name":"Nearly two in three tweens and teens have used a chatbot","description":"NPR reported on 30 October that two surveys put chatbot use well above half of American tweens and teens. Common Sense Media found that nearly half of 9-to-12-year-olds have used a chatbot or companion, and that by 13 nearly three-quarters have. A JED Foundation survey of 5,500 students aged 9 to 17 found that 90 percent have used one, and that nearly two-thirds use chatbots both for schoolwork and when they are stressed, lonely, or anxious."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/10/30/zests-new-ai-agent-finds-restaurants-and-books-reservations-over-text/","name":"Zest will book a table from a text, if you have linked a card","description":"On 30 October Zest opened a restaurant concierge you reach by text, including in a group chat. It can blend tastes, run a vote, and book through OpenTable, Resy, or SevenRooms. The suggestions start from where people have actually eaten. Zest imports food and drink transactions through Plaid, the same link many banks use, rather than asking for a long preference interview. TechCrunch said its own tests returned usable options for time, party size, and place."},{"@type":"ListItem","position":11,"url":"https://github.com/Orkas-AI/Orkas","name":"Orkas-AI/Orkas: a local desktop where several agents share one job","description":"Orkas gained 1,118 stars on GitHub Trending on 1 November, and has about 6,000 in total. It is a free MIT-licensed desktop app for Mac and Windows. A commander turns a goal into tasks and coordinates 16 built-in specialist agents, plus Claude Code, Codex, OpenCode, OpenClaw, and Hermes. You can use its built-in models or your own keys. Linux can run from source. There is no Linux installer yet."},{"@type":"ListItem","position":12,"url":"https://github.com/lightpanda-io/browser","name":"lightpanda-io/browser: a smaller browser for agents, under AGPL","description":"Lightpanda gained 929 stars on GitHub Trending on 1 November, and has about 39,100 in total. It is a headless browser written in Zig, not a Chromium fork, aimed at agents and automation. It speaks the Chrome DevTools protocol, so Puppeteer and Playwright can drive it, and it also has an MCP server with separate browsing sessions per connection. On the project's own benchmark of 100 pages, it reports 123MB peak memory against 2GB for headless Chrome, and 5 seconds against 46."},{"@type":"ListItem","position":13,"url":"https://github.com/mattpocock/skills","name":"mattpocock/skills: engineering skills from one working .agents folder","description":"Matt Pocock's skills repository gained 882 stars on GitHub Trending on 1 November, and has about 308,200 in total. It is the skill set from his own .agents directory, under MIT. The engineering skills include a pull-request shape and a wizard for steps only a person can do, such as creating credentials. The productivity skills include grilling a plan until the open branches are resolved, and compacting a session into a handoff another agent can continue."}]}}]}</script>
