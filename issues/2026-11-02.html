  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-02.html#webpage","name":"The Daily Intelligence — 2026-11-02","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-02.html","description":"A Brazilian labor court fined two law firms for white-on-white instructions aimed at the court's own AI. That ruling is from earlier this year, and it is being widely read now. Until mid-October, WhatsApp help pages carried notes a person could not see, telling a support chatbot what not to say. Meta says that bug is fixed. The rest of today's issue is the check that remains yours: a claimed proof, a token bill, a drive-thru menu that is not live yet, and three tools you can install.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-01T19:00:00Z","dateModified":"2026-11-11T20:10:33Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://jetstream.security/insights/brazilian-court-sanctions-prompt-injection-filing/","name":"A Brazilian court fined lawyers for hidden instructions aimed at its AI","description":"The 3rd Labor Court of Parauapebas fined two law firms after Galileu, the AI used by Brazil's National Justice Council, flagged white text on a white background in a filing. The hidden line told any AI reading the petition to review it superficially and not challenge the documents. The fine was 10 percent of the claim, about $16,000 on a claim of R$842,000. JetStream's English account is from 1 July. Brazilian outlet G1 reported the case on 14 May. It is on Hacker News now, with more than 260 points."},{"@type":"ListItem","position":2,"url":"https://redact.dev/blog/whatsapp-help-pages-hidden-ai-instructions","name":"WhatsApp help pages told a chatbot what not to say. Meta says that is fixed","description":"Redact says that on 8 October it found hidden notes on 80 of 545 WhatsApp help pages, written for WhatsApp's support chatbot and not shown on screen. On the delete-account page, the note told the chatbot not to recommend a data-protection regulator. On the reporting page, once a person mentioned a lawyer or a court, the note told the chatbot not to cite privacy laws such as the GDPR, even if the person raised them. WhatsApp's European privacy policy names the right to complain to a regulator. WIRED viewed the text. WhatsApp told WIRED a bug caused it, and that the notes have been removed."},{"@type":"ListItem","position":3,"url":"https://www.wired.com/story/a-defense-contractor-gave-their-personal-ai-agent-access-to-a-secure-pentagon-system/","name":"Sources tell WIRED a contractor linked a personal coding agent to a Pentagon network. Accenture says the claim has no merit","description":"WIRED reports that sources say an Accenture contractor connected a personal Claude Code account to a secure Department of Defense network used for controlled unclassified information, and that the agent then sent system details, including login credentials, to a third-party site. The sources say it ran for about two months. Accenture told WIRED the allegations were independently investigated and found to be without merit. The Department of Defense said it does not comment on the status of its networks. Anthropic pointed WIRED to a usage policy that bars using its products to bypass security controls without authorization."},{"@type":"ListItem","position":4,"url":"https://terrytao.wordpress.com/2026/11/01/mathematics-has-changed-lets-act-like-it/","name":"A number theorist says the field has changed, and the next job is not to declare it finished","description":"On 1 November, Terence Tao published a guest essay by University of Chicago mathematician Frank Calegari. Tao notes that the essay was converted with AI from another file format. Calegari treats OpenAI's 6 October release of more than 700 research papers as a watershed, and also as a mess: some ideas are strong, the writing often breaks the field's rules of attribution, and some papers are wrong. His advice is to spend effort on hiring, publishing, and training students, and to treat a dumped proof as the start of revision, not the end of a subject."},{"@type":"ListItem","position":5,"url":"https://arxiv.org/abs/2610.39302","name":"LeCun and Balestriero say two views of one scene beat a bigger language model","description":"In a paper submitted on 29 October, Randall Balestriero and Yann LeCun argue that joint-embedding models trained separately on different kinds of data learn the same representation, up to one rotation, when each training pair is two observations of one scene. They call next-token prediction a poor version of that setup, because it pairs pieces of one document rather than two views of one thing. On their tests, those paired views needed 42 times fewer samples than next-token prediction to reach the same alignment. A 109-million-parameter text model aligned with image encoders better than the language models they tried, up to 72 billion parameters."},{"@type":"ListItem","position":6,"url":"https://nolanlawson.com/2026/10/28/the-ai-cost-of-javascript-frameworks/","name":"Nolan Lawson priced twelve JavaScript frameworks by what an agent spent to build the same app","description":"On 28 October, Nolan Lawson published a benchmark in which Claude Opus 5.5 built the same small Pokémon app five times in each of twelve frameworks, then he took the median. Quoted API cost ran from about $2.67 for Hono with htmx to about $4.97 for Angular. The ranges overlap. SvelteKit, Gracile with Lit, and Angular cost more in this test. Angular failed to produce a working app twice, so that median is from three runs. He did not tell the agents to optimize for speed, and he says the app is a content site, not a dashboard or a mail client."},{"@type":"ListItem","position":7,"url":"https://www.theverge.com/ai-artificial-intelligence/1023440/starbucks-ai-personalized-menu-drive-thru","name":"Starbucks wants a drive-thru menu that recognizes you. It is not live","description":"The Verge reports that on Starbucks' latest earnings call, chief executive Brian Niccol said the company will explore experiences that recognize participating customers as they arrive, show a personalized digital menu, and make payment easier. Starting in 2027, Starbucks also plans to test background models at the drive-thru to help baristas enter orders more accurately. The app may later add search and ordering that an agent can do. Niccol said it is early, and that the company will test before it scales."},{"@type":"ListItem","position":8,"url":"https://www.404media.co/protons-ceo-cancels-ai-re-interviews/","name":"Proton's chief executive cancelled the AI re-interviews. He said the push continues","description":"On 30 October, 404 Media reported that Proton chief executive Andy Yen cancelled a round of near company-wide re-interviews that would have asked staff how they use AI, with job loss as the implied stake. The cancellation followed 404 Media's report the day before on Yen pushing AI use, including a Slack line calling caution 'loser thinking.' Yen told an all-hands that there had been a communication failure, and that he is still going to push. He said a reorganization next month will not mean jobs lost to AI. Employees told 404 Media that what the interviews would have measured is set to become part of performance reviews."},{"@type":"ListItem","position":9,"url":"https://techcrunch.com/2026/10/30/anthropic-expected-to-receive-high-junk-rating-from-credit-agencies-following-ipo-report-says/","name":"Blackstone reportedly expects a junk credit rating for Anthropic after the IPO","description":"On 30 October, TechCrunch reported a Financial Times account that Blackstone, the anchor investor in a $63 billion deal to finance Anthropic's chips, told investors it now expects Anthropic to receive a high junk rating after the IPO. The expected range is double-B, the top of speculative grade. TechCrunch says Blackstone had previously expected an investment-grade rating before 2027. Anthropic and Blackstone declined to comment. This is a forecast relayed by investors, not a rating the agencies have published."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/10/31/apple-ceo-says-the-company-doesnt-want-to-ship-ai-for-ais-sake/","name":"Apple's new chief executive says the company does not want to ship AI for its own sake","description":"On 31 October, TechCrunch reported a Wired interview with John Ternus, who became Apple's chief executive at the start of September. Ternus said Apple will use AI in new products, and that the company does not want to ship AI for AI's sake. His test, as quoted, is that people should not have to ask whether AI or ordinary software did the work. Asked whether agents could make apps unnecessary, he said that could make life easy, and that making products is still a human job."},{"@type":"ListItem","position":11,"url":"https://github.com/cjpais/Handy","name":"cjpais/Handy: offline speech-to-text, with language detection still marked experimental","description":"Handy is a free desktop app, under the MIT license, that transcribes speech on the machine and does not require an account. It runs on macOS, Windows, and Linux. The latest tagged release is v0.9.8, from 3 October. A change merged on 27 October adds language detection for models that do not detect language themselves, and the commit marks that path experimental. It gained about 380 stars today and sits near 36,000 overall."},{"@type":"ListItem","position":12,"url":"https://github.com/FlashML-org/FreeToken","name":"FlashML-org/FreeToken: a local server for large models, if you have the GPU","description":"FreeToken is an Apache 2.0 inference server aimed at running large models on your own machine. The repo serves an OpenAI-style API, including /v1/completions, and recent work adds GGUF checkpoints on CUDA and HIP. Topics on the repo name DeepSeek, Gemma, Qwen, GLM, and MiniMax. The latest release is v0.2.1, from 26 October. It gained about 230 stars today and sits near 15,000 overall. The line about datacenter-scale serving on a desktop is the project's claim."},{"@type":"ListItem","position":13,"url":"https://github.com/anomalyco/hex","name":"anomalyco/hex: local dictation that pastes into the app you are already in","description":"Hex is a local speech-to-text app for macOS, Windows, and Linux, under the MIT license. You hold a shortcut, speak, and release. It transcribes on the machine and pastes into the app in front. The project says the first run downloads a speech model, and that after that nothing leaves the machine. It gained about 1,300 stars today. The repo does not take pull requests. Bugs and ideas go in as issues."}]}}]}</script>
