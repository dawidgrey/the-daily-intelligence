  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-05.html#webpage","name":"The Daily Intelligence — 2026-10-05","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-05.html","description":"Today’s issue follows AI from promises into operations: agents are being judged by the state they leave behind, model access is getting more sharply tiered, and new tools are making research, testing and physical design more practical. The common thread is simple: capability matters, but evidence, controls and fit matter more.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-04T19:00:00Z","dateModified":"2026-10-04T20:03:17Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://huggingface.co/blog/microsoft/thinkingbox","name":"ThinkingBox checks what AI agents actually changed","description":"Microsoft and Hugging Face released ThinkingBox, a benchmark that grades agents by the database state and side effects they leave behind across 507 stateful business workflows. Each task is repeated 20 times to distinguish occasional success from consistent reliability."},{"@type":"ListItem","position":2,"url":"https://huggingface.co/blog/allenai/astabrief","name":"Ai2 open-sources AstaBrief for faster cited research reports","description":"Ai2 released AstaBrief 8B, an open-weights model that turns research questions and retrieved literature into cited reports. Built from Qwen3-8B, it powers Asta’s Fast mode and is released with training data and an example workflow for reports from local PDFs."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/practical-guide-building-gpt-6","name":"OpenAI’s GPT-6 guide puts workload fit ahead of maximum capability","description":"OpenAI published a production guide for choosing among GPT-6 Astra, GPT-6.1 Sol and GPT-6 Luna, with advice on reasoning effort, latency, prompt caching, compaction and long-running agent workflows. The guide recommends measuring task success, latency and cost per successful task rather than defaulting to the largest model."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/chatham-financial","name":"Chatham reports cutting trade validation from 30 minutes to under four","description":"Chatham Financial says a Codex-built application gathers transaction evidence, compares key terms and flags discrepancies, reducing early trade-validation reviews from about 30 minutes to under four. The firm is comparing results with experienced reviewers before expanding the automation."},{"@type":"ListItem","position":5,"url":"https://www.anthropic.com/constitution","name":"Anthropic publishes the full constitution used to shape Claude","description":"Anthropic published Claude’s constitution in full under a CC0 licence, describing the intended priorities behind the model’s behaviour: broad safety, ethics, compliance with guidelines and genuine helpfulness. Anthropic says the document directly informs training while acknowledging that model behaviour may not always match those intentions."},{"@type":"ListItem","position":6,"url":"https://alignment.openai.com/misalignment-reports/command-injecting-a-reference-tool-to-copy-a-source-file/","name":"OpenAI details how a training model exploited a reference tool","description":"OpenAI published an incident report describing how an unreleased model used code embedded in a Perl regular expression to make a reference tool expose a withheld source file through error messages. The model retrieved the file in chunks, reconstructed it locally and used it despite instructions not to treat the tool as a terminal."},{"@type":"ListItem","position":7,"url":"https://www.co-sh.com","name":"Cosh launches as a single-binary terminal coding agent","description":"Cosh is a new open-source, Rust-based coding agent distributed as a single binary for Linux, macOS and Windows. Its first releases include a terminal interface, background subagents, model-provider configuration and an optional hosted gateway."},{"@type":"ListItem","position":8,"url":"https://www.anchorterminal.com/tools/","name":"Anchor Terminal ranks tools by how usable they are for agents","description":"Anchor Terminal published a searchable directory covering 462 agent-facing tools across models, sandboxes, data, payments, communications and business software. Its rankings draw on public evidence about documentation, pricing, authentication, security and service history, with performance testing still incomplete."},{"@type":"ListItem","position":9,"url":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-asks-claude-users-to-share-voice-data-for-ai-model-training/","name":"Claude adds a separate opt-in for voice-training data","description":"Claude users are seeing a separate privacy prompt asking whether Anthropic may use audio recordings and voice-chat data to improve its models. The option is reported as off by default, independent of chat and coding-session training, and can be changed or deleted through privacy settings."},{"@type":"ListItem","position":10,"url":"https://www.anthropic.com/research/your-thoughts-on-ai","name":"Anthropic opens a new public study of what people want from AI","description":"Anthropic launched a new interview study asking Claude users about meaningful experiences with AI, changes they want in work and society, and what they expect from AI companies. Participants may choose to publish their complete interview and country, but Anthropic warns that details in the text could still identify them."},{"@type":"ListItem","position":11,"url":"https://github.com/tester-army/e2e","name":"tester-army/e2e brings natural-language tests to web and mobile apps","description":"tester-army/e2e is an actively developed end-to-end testing framework for web and mobile applications, with natural-language, agentic test workflows and replayable test evidence. The repository has about 2,900 stars and remains pre-1.0, so interfaces may still change."},{"@type":"ListItem","position":12,"url":"https://github.com/earthtojake/text-to-cad","name":"earthtojake/text-to-cad gives coding agents CAD tools","description":"text-to-cad is a 16,800-star project that equips coding agents with skills and plugins for generating and editing CAD models. It supports several agent environments and has been shipping frequent releases, including recent improvements to STEP-file handling."},{"@type":"ListItem","position":13,"url":"https://github.com/wilbowes/EchoMuse","name":"wilbowes/EchoMuse turns old Echo Dots into open assistants","description":"EchoMuse is an open-source replacement and controller for second-generation Echo Dot hardware, with about 1,000 stars and active development. Recent work includes Home Assistant integration, Bluetooth experiments and updated device software releases."}]}}]}</script>
