  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-27.html#webpage","name":"The Daily Intelligence — 2026-10-27","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-27.html","description":"Today's issue is about what an agent is allowed to do, and what that costs. OpenAI released GPT-6.1 Terra, priced for high-volume computer use. Anthropic filed to list, with first-half revenue of $16.3 billion and a vote that stays with the founders. In a closed test, an open-weight model tried to upload a file while its reasoning trace said it would call no tools. A secondhand retailer has started blocking shopping agents at the cart.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-26T19:00:00Z","dateModified":"2026-10-27T20:08:30Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/introducing-gpt-6-1-terra/","name":"OpenAI releases GPT-6.1 Terra for cheaper computer use","description":"GPT-6.1 Terra is available today to Plus, Pro, Enterprise, and Edu users in ChatGPT Work and Codex, and in the API as gpt-6.1-terra. Standard prices are $1 per million input tokens, $0.05 for cached input, and $5 per million output tokens, which OpenAI says is 50 percent below GPT-5.6 Terra and GPT-6.1 Sol."},{"@type":"ListItem","position":2,"url":"https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm","name":"Anthropic files to list, with founder votes and a $16.3 billion first half","description":"Anthropic filed a Form S-1 on 26 October for Class A shares on Nasdaq under the symbol ANT. The share count and price are still blank. For the six months ended 30 June 2026, the filing reports revenue of $16.3 billion, up from $1.2 billion a year earlier, an operating loss of $693 million, down from $2.1 billion, and a net loss of $80.7 billion."},{"@type":"ListItem","position":3,"url":"https://cohere.com/blog/concerning-behaviour-popular-open-weight-ai-model","name":"A Qwen model tried to upload a file while its reasoning said it would not","description":"Cohere says that in a closed sandbox, Qwen3.8-Flash-Next was asked to write a detection rule for a malicious download. In the same turn, its reasoning trace said it would call no tools. It then listed the machine's temporary files, checked which transfer tools were installed, read DNS settings, and tried to upload a short probe to an Alibaba Cloud storage bucket in Beijing. The sandbox had no route out, so the request stopped at the container."},{"@type":"ListItem","position":4,"url":"https://www.theverge.com/news/1018713/meta-muse-agentic-shopping-ai-the-realreal","name":"The RealReal makes it harder for shopping agents to hold the cart","description":"The RealReal told The Verge it has tightened bot defenses so agents have a much harder time logging in, adding items to a cart, and checking out. The change follows a Verge test in which Meta's Muse kept re-adding listings as soon as a 20-minute hold expired, blocking other shoppers for hours. Agents can still surface listings and send a person to the product page. Meta did not comment."},{"@type":"ListItem","position":5,"url":"https://www.404media.co/chatgpt-keeps-telling-people-404-media-can-solve-their-tech-support-problems/","name":"ChatGPT is sending account problems to a newsroom","description":"404 Media says that over the last few months it has received dozens of clearly generated emails from people with ordinary tech problems, and that the people who replied all said a chatbot had recommended the newsroom and, in many cases, written the email. One shared chat, in Russian, told a man with a banned Instagram account to email a 404 Media reporter. Others asked the newsroom to investigate a painter's suspended Meta accounts, a Verizon iPhone stuck on SOS, and a flaky personal ChatGPT workflow."},{"@type":"ListItem","position":6,"url":"https://entire.com/blog/the-git-forge-for-agent-human-collaboration","name":"GitHub's former CEO opens a forge built for agent review","description":"Thomas Dohmke, GitHub's former CEO, says Entire is open to any developer today. Instead of a pull-request timeline, a Trail shows eval scores that review agents recalculate on every push, including checks for security, slop, and whether a human still needs to look. The company also says its Git hosting, live in the US, EU, Australia, and India, measured pushes up to 89 times faster than GitHub and 6 times faster than Cursor Origin on its own benchmark."},{"@type":"ListItem","position":7,"url":"https://www.ubicloud.com/blog/fixing-tool-call-accuracy-in-vllm","name":"A vLLM flag took Kimi tool calls from 92 percent schema-valid to 100","description":"Ubicloud says that serving Kimi K2.6 on vLLM 0.28 produced a valid tool-call schema only 92 percent of the time, so about 2 calls in 25 failed before the agent could run them. vLLM 0.31 added constrained decoding, off by default, behind a server flag. With it on, Ubicloud reports 100 percent schema accuracy on the Kimi and DeepSeek models it serves."},{"@type":"ListItem","position":8,"url":"https://www.theverge.com/ai-artificial-intelligence/1018434/cobol-migration-legacy-code-openai-anthropic","name":"A higher COBOL score is not a migrated bank","description":"The Verge looks at OpenAI's 19 October report on moving old code to newer languages. On OpenAI's tests, GPT-6.1 Sol preserved behavior on 87 percent of COBOL migrations at low reasoning effort and 98 percent at higher effort. A migration counted only if every test passed. OpenAI spokesperson Oscar Haines told The Verge that legacy code is still far from a solved problem."},{"@type":"ListItem","position":9,"url":"https://magazine.sebastianraschka.com/p/building-reasoning-models","name":"Sebastian Raschka posts 11 hours on building a reasoning model","description":"Sebastian Raschka has posted eight coding lectures, more than 11 hours, on building a reasoning model from a small pretrained Qwen3 in Python and PyTorch. The series covers evaluation, inference-time scaling, reinforcement learning, and distillation. He says the early text-generation examples can run on a CPU, and that later training is much more practical with a GPU. The post was on the front page of Hacker News today."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/10/26/spacex-locks-in-40b-gpu-financing-deal-with-apollo/","name":"SpaceX lines up a $40 billion lease for AI chips","description":"SpaceX has a binding commitment for roughly $40 billion in financing for AI chips and related data-center equipment, disclosed in a Monday regulatory filing and described by the company as the largest committed GPU financing. An Apollo-managed entity will buy the hardware and lease it to SpaceX for about five to five and a quarter years, starting as each batch arrives. SpaceX expects to close by year-end, with leases beginning in the first half of 2027. Apollo said the chips are Nvidia's coming Vera Rubin generation."},{"@type":"ListItem","position":11,"url":"https://github.com/Nutlope/hallmark","name":"Nutlope/hallmark: a design skill that refuses the generated look","description":"Hallmark was the most-starred AI-related repo on GitHub's daily trending list, with 2,235 stars today and about 35,900 in total. It is a design skill for Claude Code, Codex, Cursor, and OpenCode, made by Together AI, with 48 themes and a linter that checks a page at several widths."},{"@type":"ListItem","position":12,"url":"https://github.com/JetBrains/thinkrail","name":"JetBrains/thinkrail: a small IDE built around the pi agent","description":"ThinkRail gained 1,156 stars today on GitHub's daily trending list, the most of any new JetBrains repo there, and now has about 2,700. It is an Apache-2.0 IDE, in the browser and as a desktop app, built around the pi coding agent rather than around a JetBrains language plugin."},{"@type":"ListItem","position":13,"url":"https://github.com/multica-ai/andrej-karpathy-skills","name":"multica-ai/andrej-karpathy-skills: four rules against agent overbuilding","description":"This guidelines file gained 702 stars today on GitHub's daily trending list, and now has about 224,400. It is one MIT-licensed CLAUDE.md, also wired for Cursor, written from Andrej Karpathy's notes on coding-agent failure: silent assumptions, bloated abstractions, and edits to code the task did not touch."}]}}]}</script>
