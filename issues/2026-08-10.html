  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-10.html#webpage","name":"The Daily Intelligence — 2026-08-10","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-10.html","description":"Today’s issue follows AI into longer-running coding work, workplace learning, legal systems and institutional security. The practical signal is clear: capable tools are becoming easier to deploy, while accountability, evaluation and human understanding matter more—not less.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-09T20:00:00Z","dateModified":"2026-09-02T20:05:01Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://claude.com/blog/auto-mode-default-in-claude-code","name":"Claude Code makes classifier-governed auto mode the default","description":"From August 14, new Claude Code sessions on Pro, Max and Team plans will use auto mode by default, replacing most permission prompts with a classifier that blocks irreversible, destructive or external actions. Anthropic says a study of 1,053 testers found the classifier caught 89% of planted dangerous commands, versus 13.6% caught by people reviewing prompts."},{"@type":"ListItem","position":2,"url":"https://openchamber.dev/","name":"OpenChamber brings persistent, multi-model coding agents into one workspace","description":"OpenChamber is an open-source development environment that can keep agents working toward session goals, run a task across as many as five models, explain large diffs and move sessions between desktop, browser, mobile and VS Code. It runs on the OpenCode SDK and says project and session content remain on the user’s machine."},{"@type":"ListItem","position":3,"url":"https://laurentiugabriel.github.io/blog/articles/how-i-use-llms-to-learn/","name":"A simulation-first workflow turns LLM research into interactive learning","description":"Engineer Laurentiu Raducu describes using coding agents to research a complex topic, review the resulting knowledge base and build a small interactive simulation rather than stopping at a written explanation. His examples visualize chip fabrication, rocket engines, language models and other systems as explorable web projects."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/economic-index","name":"Anthropic’s Economic Index maps where AI augments work and where it automates it","description":"Anthropic’s public Economic Index lets users explore Claude usage by country, US state, occupation, task, artifact and collaboration pattern. The current data distinguishes work, personal and coursework use and compares tasks where people collaborate with Claude against those they delegate more fully."},{"@type":"ListItem","position":5,"url":"https://the-decoder.com/ai-is-flooding-britains-employment-courts-with-lawsuits/","name":"AI-written claims are adding pressure to Britain’s employment courts","description":"The Decoder reports, citing a memo from British tribunal presidents, that employment claims rose 39% in the year through March 2026 while the unresolved backlog grew 55% to 64,000. Officials say some AI-assisted filings are hundreds of pages long and include fabricated law or unrealistic demands."},{"@type":"ListItem","position":6,"url":"https://playground.fabraix.com/","name":"Fabraix opens a public playground for testing whether agents can be manipulated","description":"Fabraix’s public playground challenges users to persuade a guarded AI agent to call a tool that its policy forbids. The current scenario uses an inert placeholder rather than hazardous material, and successful attacks are reviewed before appearing on a leaderboard."},{"@type":"ListItem","position":7,"url":"https://blog.raed.dev/posts/ai-code-review/","name":"Code review breaks down when no human understands the generated change","description":"Raed Abdallah argues that conventional code review assumes an accountable author who can explain a change, an assumption weakened when agents produce complete pull requests before a person understands them. He proposes a simple readiness rule: the submitting human must explain the intent, affected invariants and evidence that the change is safe."},{"@type":"ListItem","position":8,"url":"https://www.cnbc.com/2026/08/09/israeli-startup-irregular-linked-to-ai-hacks-openai-anthropic-meta.html","name":"One testbed misconfiguration connected three labs’ rogue-agent incidents","description":"CNBC reports that recent disclosures from OpenAI, Anthropic and Meta all pointed to an evaluation environment hosted by security startup Irregular. Irregular says the incidents came from the same configuration issue, did not involve a sophisticated sandbox escape and have no remaining open issue while it prepares a retrospective."},{"@type":"ListItem","position":9,"url":"https://arstechnica.com/ai/2026/08/bytedance-trains-massive-ai-model-in-bid-to-rival-anthropic/","name":"ByteDance begins training a model that could reach 10 trillion parameters","description":"A Financial Times report carried by Ars Technica says ByteDance is in the early pre-training stage of a model that may reach 10 trillion parameters, with final size still undecided and training expected to take months. The effort is part of a wider push by Chinese labs toward larger frontier systems."},{"@type":"ListItem","position":10,"url":"https://the-decoder.com/scammers-are-enrolling-fake-students-at-us-community-colleges-and-using-ai-to-collect-financial-aid/","name":"AI-assisted fake students target US community-college financial aid","description":"The Decoder, citing reporting by The New Yorker, describes fraudsters enrolling fabricated students in US community colleges, using AI to complete coursework and seeking financial-aid payments. Instructors say anonymous asynchronous courses make identity and authorship especially difficult to verify."},{"@type":"ListItem","position":11,"url":"https://github.com/google-deepmind/weathernext","name":"google-deepmind/weathernext: open code and weights for AI weather forecasting","description":"Google DeepMind’s WeatherNext repository contains code and pretrained weights for global medium-range and tropical-cyclone forecasting, including WeatherNext 2 and earlier GraphCast and GenCast systems. It was the strongest AI-specific repository in today’s collected GitHub Trending results and currently shows about 7,000 stars."},{"@type":"ListItem","position":12,"url":"https://github.com/harveyai/harvey-labs","name":"harveyai/harvey-labs: a public benchmark for legal agents","description":"Harvey LAB provides realistic legal tasks, documents, rubrics and an execution harness for evaluating agents that support legal work. The trending repository recently added a 250-task enterprise-search benchmark and currently shows about 780 stars."},{"@type":"ListItem","position":13,"url":"https://github.com/funstory-ai/BabelDOC","name":"funstory-ai/BabelDOC: layout-preserving translation for research PDFs","description":"BabelDOC is an AGPL-licensed Python library for translating scientific PDFs while supporting bilingual comparison and preserving document structure. The actively maintained project offers a command-line interface and Python API and currently shows about 9,200 stars."}]}}]}</script>
