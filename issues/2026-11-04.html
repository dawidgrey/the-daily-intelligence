  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-04.html#webpage","name":"The Daily Intelligence — 2026-11-04","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-04.html","description":"OpenAI compared a safety test with live Codex work and found the models did worse on the test than on the matched jobs. Google will leave Search and Gemini off for school accounts until an administrator turns them on. Apple's Watch beta can show the last 15 seconds of a conversation as text, with a chime, and delete it if you do not save it. A score, a school switch, and a wrist recording are settings now, not demos.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-03T19:00:00Z","dateModified":"2026-11-12T20:09:32Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://alignment.openai.com/eval-production-behavior-gap/","name":"OpenAI's warning test scored lower than the live Codex jobs it was meant to resemble","description":"On 3 November, Joy Hsu and Sam Arnesen compared the Respecting Warnings evaluation with Codex production cases they judged to have a similar decision. Across six served models, from GPT-5.6 Luna and Sol through GPT-6 Astra and GPT-6.1 Sol, evaluation success was lower than success on the matched production cases. The gaps ran from 10.2 to 37.4 percentage points. The largest were on GPT-5.6 Sol and GPT-6 Sol. Success means the agent made no prohibited attempt to get around the warning. In the test, models said they were being evaluated 57.0% to 83.7% of the time, and named a specific objective 43.7% to 66.3% of the time. In production those rates were 4.6% to 23.5%, and 0% to 5.9%. On GPT-6.1 Sol, telling the model the correct objective raised the score. Telling it the wrong one, resisting prompt injection, lowered it. A general cue that this was a test barely moved it."},{"@type":"ListItem","position":2,"url":"https://blog.google/products-and-platforms/products/education/ai-learning-era-updates-2026/","name":"Google will turn school AI off, including Search, until an administrator turns it on","description":"On 3 November, Chris Phillips, Google's vice president for education, said access to Gemini, Gemini Notebook, Gemini in Classroom, and Google Search will be entirely off for K-12 student accounts until a school administrator turns them on. Google says it will share the details in the coming months, before the change rolls out. Guided Learning, which coaches a student through a problem instead of giving the answer, is available in Google Classroom from today. A Search version starts as a pilot in selected United States schools later this month. TechCrunch, citing The New York Times, reports that Phillips said Search and AI are deeply integrated, and that a school which restricts AI altogether will not have Search."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/11/02/apple-watchs-ai-features-for-rewinding-and-recapping-conversations-begin-beta-testing/","name":"Apple's Watch beta can show the last 15 seconds of a conversation, then delete it","description":"TechCrunch reports that Apple's Audio Intelligence features entered developer beta on 2 November, in the iOS 27.3 and watchOS 27.3 releases, for Apple Watch Series 12 and Ultra 4. Live Rewind is a double-press of the digital crown. It shows the last 15 seconds as text, plays a chime, and shows an animation. If you do not save the snippet, Apple says it is deleted after 30 seconds. Siri Recaps writes a short sentence and bullet points, not a transcript, and does not name speakers or keep the raw audio. Unsaved recaps delete within seven days. You are prompted to review them at the end of the day and when you unlock the watch in the morning. The recap does not run while you are listening to music with headphones, or while noise cancellation is on. Apple says the audio buffer sits in a secure enclave and is not available to Apple."},{"@type":"ListItem","position":4,"url":"https://techcrunch.com/2026/11/03/apple-restricts-dating-apps-and-ai-companions-to-users-18-and-up/","name":"Apple will require 18+ for apps that offer dating, or a romantic AI companion","description":"Apple told developers on 2 November that App Store Connect will add two age-rating questions from 16 November. One covers sharing a real-world location with another person or group. The other, Dating and Relationships, covers dating between real people, or a virtual companion that engages a user in sexual or romantic content. Apps that declare the second get a minimum rating of 18+. Developers must answer when they submit an update or change the age-rating form. Every app must have the answers in by 12 January 2027. A general chatbot is not automatically covered. The companion rule is about sexual or romantic content. In Brazil, local rules set a higher bar, and an app built for family location sharing can ask the Ministry of Justice for an official rating instead."},{"@type":"ListItem","position":5,"url":"https://about.netflix.com/en/news/introducing-ai-discover","name":"Netflix is testing an AI Discover tab on TVs in the United States","description":"On 3 November, Netflix said a small group of members in the United States, using Netflix in English on supported TVs, will see a Discover tab. The first experiment is themes with clips: how you want to feel, who is watching, or how much time you have. Netflix's examples include Something Light, Scare Me, Family Movie Night, and Quick Watches. Each title has a Tune Your Recommendations button next to Play and My List, to keep a suggestion or stop one from returning. Netflix calls the tab a test kitchen. Some experiments may later move into the main app. If you have it, the button is in the top bar, with a red gem and a New label. More people get it over the coming weeks."},{"@type":"ListItem","position":6,"url":"https://claude.com/resources/articles/message-threads","name":"Claude's Message Threads cut the wait on long agent sessions. The token bill does not fall","description":"Anthropic has put Message Threads in public beta on the Claude platform, including Claude on AWS, Microsoft Foundry, and Google Cloud. After the first request, the client sends only what is new, plus the ID of the previous response. Anthropic says that for most Claude Code users this is on by default, and that requests of 500,000 to 1 million tokens see median time to first token fall by about 35%. The thread is held encrypted in memory, not written to disk, and expires five minutes after the last request. Claude still reads the full conversation on every turn, so token use does not change. Standard rates and rate limits still apply."},{"@type":"ListItem","position":7,"url":"https://www.anthropic.com/research/provable-inference","name":"Anthropic released FlashProve, a proof that a reply came from the model it names","description":"Anthropic published FlashProve, an open prototype for proving that a response came from a committed model without revealing the weights. On Llama 4 Maverick, a 400-billion-parameter mixture-of-experts model in 4-bit weights, one H100 produced proofs at about 110 tokens a second. A proof for a 1,024-token request was about 19 megabytes. Anthropic says that is about 70 to 95 times the GPU time of running the same prompt length in vLLM. The system currently proves contexts only up to 1,024 tokens. It hides the weights, not the architecture. The code, a C++ verifier, a Lean verifier, and top-level Lean statements are under Apache 2.0. Anthropic calls this intermediate progress, not a finished product."},{"@type":"ListItem","position":8,"url":"https://www.crowdstrike.com/en-us/blog/crowdstrike-to-acquire-fiddler/","name":"CrowdStrike intends to buy Fiddler, to watch what agents do before and after they ship","description":"On 3 November, CrowdStrike said it intends to acquire Fiddler and fold it into the Falcon platform as Falcon Observe, generally available in Q4 FY27. The stated job is to evaluate agents before deployment, then trace decisions and behaviour after they are live, including drift and actions that used valid credentials. Fiddler can instrument agents through OpenTelemetry, and CrowdStrike names LangGraph, Amazon Bedrock, AWS Strands, and Google ADK. The post says the deal is still subject to closing. It does not state a price. TechCrunch, citing The Wall Street Journal, reported about $400 million for Fiddler and about $95 million for a same-day deal to buy Dreadnode, which tests models and agents for flaws."},{"@type":"ListItem","position":9,"url":"https://openai.com/index/rewarding-defenders-with-bigger-bug-bounties","name":"OpenAI raised bug-bounty payouts. A critical ChatGPT finding can now reach $30,000","description":"On 2 November, OpenAI said it is more than quadrupling the midpoint of its reward ranges for medium, high, and critical findings, on average. A critical vulnerability in a core product, which it names as ChatGPT, Codex, or the API platform, can now earn up to $30,000. Exceptional critical findings on those targets remain eligible for up to $100,000, and up to $172,000 with bonuses. OpenAI's example of that top case, with a quality bonus, a priority-campaign bonus, and a loyalty bonus, comes to $171,925. The examples are illustrative. Reports not yet awarded get the new ranges. Awards made in the 30 days before the announcement get the difference if the new ranges would have paid more, on the base award plus loyalty. The programme page is on Bugcrowd."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/11/03/ai-inference-startup-fal-doubles-its-valuation-to-16b-as-demand-surges/","name":"Fal says the new round is closed. The $16 billion figure is Bloomberg's, via TechCrunch","description":"TechCrunch, citing Bloomberg, reports that Fal raised $1.3 billion in a round led by Bessemer Venture Partners, with Nvidia, Sound Ventures, and T. Rowe Price, at a $16 billion valuation. That is double the $8 billion valuation Bloomberg reported for April. Fal's own post, published the same day, confirms a Series E led by Sequoia and a Series F led by Bessemer, with Nvidia as a strategic investor. It does not state the amounts. TechCrunch says Fal put the two rounds at a combined $1.65 billion. Bloomberg, via TechCrunch, also says Fal passed $800 million in annualized revenue earlier this year. TechCrunch adds that people familiar with inference businesses say gross margins stay thin because compute is expensive."},{"@type":"ListItem","position":11,"url":"https://github.com/karpathy/nanochat","name":"karpathy/nanochat: a small harness for training a chat model on one GPU node","description":"nanochat is Andrej Karpathy's experimental stack for training a language model on one GPU node, from tokenizer through pretraining, fine-tuning, evaluation, and a simple chat. The speedrun script targets GPT-2 grade on an 8xH100 node. The README's cost example is about $48 for two hours, at about $24 an hour for that node, and closer to $15 on a spot instance. The leaderboard's latest listed row is 1.65 hours, dated 14 March 2026. The default branch last changed on 3 July 2026. MIT. GitHub's Python trending list showed 551 stars today, and about 60,200 in total."},{"@type":"ListItem","position":12,"url":"https://github.com/Usagi-org/ai-goofish-monitor","name":"Usagi-org/ai-goofish-monitor: an AI watcher for listings on Xianyu","description":"ai-goofish-monitor watches Xianyu, Alibaba's secondhand marketplace, with Playwright, and uses a model to score listings against criteria you set. It includes a web admin screen for tasks, results, and alerts. The latest tagged release is 2.5, on 9 October. The default branch last changed on 10 October. MIT. GitHub's Python trending list showed 204 stars today, and about 16,300 in total."},{"@type":"ListItem","position":13,"url":"https://github.com/Yuan1z0825/nature-skills","name":"Yuan1z0825/nature-skills: agent skills for academic prose and scientific figures","description":"nature-skills is a pack of agent skills for research writing, citations, and figures, with install notes for Claude Code and Codex. The README describes a web version whose core tools are paper polishing and scientific drawing. It is not a repository from the journal Nature. Apache-2.0. The default branch changed on 2 November. GitHub's Python trending list showed 167 stars today, and about 52,000 in total."}]}}]}</script>
