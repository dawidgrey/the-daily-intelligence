  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-29.html#webpage","name":"The Daily Intelligence — 2026-07-29","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-29.html","description":"Today’s issue is about making AI useful under real constraints: coding agents in science, managed workers with budgets and safety hooks, local models that run on CPUs, and workflows reaching farms, nonprofits and wearable meeting notes. Security remains part of the operating model, with new cryptography results and a patched desktop-app flaw showing both sides of agent capability.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-07-28T20:00:00Z","dateModified":"2026-09-04T20:06:19Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/research/discovering-cryptographic-weaknesses","name":"Claude finds new weaknesses in two cryptographic research targets","description":"Anthropic says Claude Mythos Preview helped improve an attack on HAWK, a candidate post-quantum signature scheme, and found a faster attack on a reduced-round version of AES. The company stresses that neither result breaks deployed production systems, and it released papers, demonstration code and a new cryptanalysis benchmark."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/scientific-computing-agentic-ai","name":"Coding agents help scientific teams modernise fragile research software","description":"An OpenAI field report covers eight scientific-computing projects that used Codex, or Codex with Claude Code, for maintenance, optimisation, migrations and redesigns. Teams reported faster engineering work, while scientific validity, edge cases and long-term stewardship remained human responsibilities."},{"@type":"ListItem","position":3,"url":"https://blog.google/innovation-and-ai/technology/developers-tools/expanding-managed-agents-gemini-api-3-6-flash-hooks/","name":"Gemini managed agents add safety hooks, schedules and spending limits","description":"Google’s Managed Agents in the Gemini API now default to Gemini 3.6 Flash and add environment hooks that can block, inspect or audit tool calls inside a sandbox. The update also introduces model selection, budget controls, scheduled triggers, environment management and free-tier access."},{"@type":"ListItem","position":4,"url":"https://www.granola.ai/blog/granola-for-apple-watch","name":"Granola brings one-tap AI meeting notes to Apple Watch","description":"Granola has launched a free Apple Watch companion for starting meeting notes with a tap during walking meetings, whiteboard sessions and other conversations away from a laptop. Notes sync to its iPhone and desktop apps and can become context for connected AI tools through Granola MCP."},{"@type":"ListItem","position":5,"url":"https://www.strix.ai/blog/granola","name":"An AI security agent found a one-click Granola account takeover, now patched","description":"Strix reports that its autonomous security system found a chain in Granola’s Electron desktop app that could let a malicious notification link inherit a privileged application bridge and take over an account. Granola shipped server-side and follow-up fixes in June, and both companies report no evidence of exploitation."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/LiquidAI/lfm2-5-encoders","name":"Liquid AI releases small long-context encoders designed for CPUs","description":"Liquid AI has released 230M- and 350M-parameter LFM2.5 encoder models with an 8,192-token context window for classification, routing, policy checks, retrieval and token-level tasks. Its published tests show the 230M model running about 3.7 times faster than ModernBERT-base at long context on CPU."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/allenai/olmoearth-infrastructure","name":"OlmoEarth turns satellite foundation models into continent-scale maps","description":"Ai2 has detailed the OlmoEarth Platform, which handles satellite-data preparation, model adaptation and large-scale geospatial inference for uses such as wildfire risk, food security and deforestation monitoring. A recent North America run used distributed CPU and GPU stages to reduce thousands of serial compute hours to roughly 30.5 hours."},{"@type":"ListItem","position":8,"url":"https://oxide.computer/blog/oxide-anthropic-project-glasswing","name":"Oxide joins Anthropic’s Project Glasswing to test critical infrastructure code","description":"Oxide says it is joining Anthropic’s Project Glasswing and will apply Claude Mythos 5 across its open-source infrastructure stack, including firmware, operating-system, control-plane and network code. The company says it intends to identify and patch vulnerabilities while sharing security work openly."},{"@type":"ListItem","position":9,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/using-gemini-to-manage-farm/","name":"A dairy farm shows how local agents can unite scattered business data","description":"A Michigan dairy farmer built a local multi-agent workflow with Gemini 3.6 Flash to combine sensor exports, feed logs, invoices and weather data into a daily operating briefing. The system uses monitored folders and specialised ingestion, analysis and reporting agents rather than direct integrations with every source system."},{"@type":"ListItem","position":10,"url":"https://blog.google/company-news/outreach-and-initiatives/google-org/nonprofits-ai-tools-training/","name":"Google offers nonprofits free AI courses and individual coaching","description":"Google.org has launched three free, nonprofit-specific online courses covering everyday AI use, fundraising, creativity and workflows. Eligible Google for Nonprofits organisations can also book no-cost one-to-one product coaching, alongside a new survey of AI adoption across more than 6,000 organisations."},{"@type":"ListItem","position":11,"url":"https://github.com/virgiliojr94/book-to-skill","name":"virgiliojr94/book-to-skill: turn a technical PDF into a reusable agent skill","description":"Book to Skill is an MIT-licensed converter that structures a technical-book PDF as a searchable skill for Claude Code, including extracted knowledge, references and study material. It is one of today’s fastest-rising AI repositories, with more than 11,000 stars."},{"@type":"ListItem","position":12,"url":"https://github.com/vudovn/ag-kit","name":"vudovn/ag-kit: a structured workspace for Google Antigravity agents","description":"AG Kit packages rules, skills, specialist roles, workflows, persistent memory, MCP guidance and a narrow destructive-command safety hook for Google Antigravity projects. The repository has passed 8,000 stars and provides installation, validation and migration tooling."},{"@type":"ListItem","position":13,"url":"https://github.com/anthropics/prompt-eng-interactive-tutorial","name":"anthropics/prompt-eng-interactive-tutorial: practise clearer instructions for Claude","description":"Anthropic’s interactive prompt-engineering course has returned to GitHub’s trending list, with more than 37,000 stars. Its nine chapters and exercises cover clear instructions, examples, output formats, hallucination reduction, tool use and retrieval."}]}}]}</script>
