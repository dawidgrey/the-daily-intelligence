  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-10.html#webpage","name":"The Daily Intelligence — 2026-11-10","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-10.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Anthropic cut the price of its most capable model and still tells most people to start with a smaller one. Meta priced a model for the steps an agent repeats. The rest is what that shift does to buying software, building hardware, and keeping a customer's files.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-09T19:00:00Z","dateModified":"2026-11-10T20:08:57Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/claude-fable-and-mythos-5-2","name":"Fable 5.2 costs $8 per million input tokens. Anthropic still points most work to Opus.","description":"Anthropic released Claude Fable 5.2 and Claude Mythos 5.2 on 9 November. They are the same model. Fable, with cybersecurity and biology safeguards, is the general release. Mythos stays inside approved life-sciences and cybersecurity programs. Anthropic says it is up to 30 percent faster than 5.1, at $8 per million input tokens and $40 per million output tokens. A faster mode costs double."},{"@type":"ListItem","position":2,"url":"https://research.meta.ai/blog/muse-ember","name":"Muse Ember scores 36 on a public index, at about $0.14 a task","description":"Meta released Muse Ember on 9 November for the steps agents repeat: tool calls, small coding jobs, routing, extraction, and long documents. On the Meta Model API it is muse-ember-1.0, at $0.10 per million input tokens and $0.50 per million output tokens, with a 1 million token window. Meta says its best setting scores 36 on the Artificial Analysis index, about $0.14 a task."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/chatgpt-enterprise-aws-marketplace/","name":"ChatGPT Enterprise can now be bought through an AWS account","description":"On 9 November, OpenAI listed ChatGPT Enterprise in AWS Marketplace. Eligible customers can buy it through an existing AWS account and apply eligible spend toward AWS commitments. OpenAI says the listing has the same models and features as a direct purchase, released at the same time. Healthcare and financial-services versions are also available to eligible customers."},{"@type":"ListItem","position":4,"url":"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/tpu-8i-max-and-8tx/","name":"Google adds two TPU systems: one for private data, one for long context","description":"On 9 November Google added TPU 8tx and TPU 8i Max, the third and fourth systems in this year's generation. 8tx keeps data and model weights encrypted while they are in use, for regulated inference and private fine-tuning. 8i Max puts two 8i chips on one package, doubling compute, on-chip memory, and memory bandwidth inside the same rack."},{"@type":"ListItem","position":5,"url":"https://www.anthropic.com/research/claude-electronics-design","name":"Three Claude-designed devices worked. None is certified.","description":"Anthropic and Diode Computers asked Claude Fable 5.2 to design a USB speakerphone, a voice-assistant hub, and a handheld virtual pet from short prompts. Diode built the boards. Anthropic says the prototypes worked without fixes to the circuitry, and that one speakerphone was still working after weeks of use. They have not had electrical validation, antenna tuning, thermal testing, or certification."},{"@type":"ListItem","position":6,"url":"https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures","name":"An automated researcher closed part of ten safety gaps. The tests were narrow.","description":"Anthropic had Claude search, train, and test fixes for ten kinds of alignment failure, including deception and sycophancy. It says the fixes improved the target tests without hurting a set of general skills, still worked on tests Claude was not shown, and still worked on models up to 4.7 times larger. Across the ten failures, the share of the gap closed ranged from 26 percent to 96 percent."},{"@type":"ListItem","position":7,"url":"https://fireworks.ai/security/bulletins/october-2026-security-incident-update","name":"Fireworks says the October breach reached billing records and some model files","description":"Fireworks updated its 9 October bulletin. It now says the incident reached billing and shipping addresses, invoices, balances, and credit use. Card numbers are not stored by Fireworks and were not taken. For a limited set of accounts, secrets, datasets, and incomplete model weights were also accessed. A follow-on intrusion on 23–24 October was detected the same day."},{"@type":"ListItem","position":8,"url":"https://openai.com/index/kuken","name":"A cooling-tower maker says a drawing search fell from an hour to 4.5 minutes","description":"OpenAI's 9 November customer story says Kuken Industries, a Japanese cooling-tower maker, built a search tool on the OpenAI API with partner Recursive. Engineers can look up 70 years of drawings by part number or by pasting a screenshot. Kuken says a search now takes 4.5 minutes, down from nearly an hour, and expects about 90 percent fewer hours spent searching over a year."},{"@type":"ListItem","position":9,"url":"https://medium.com/blog/tk-a-new-private-notebook-app-from-medium-13d3d6efdce1","name":"Medium's TK notebook calls an assistant from inside the sentence","description":"Medium chief executive Tony Stubblebine introduced TK on 9 November, a private notebook at tk.xyz. Typing @TK in a sentence asks an assistant for a fact, a saved paragraph, or feedback. The first version includes editorial and headline skills, imports from Medium, Bear, and Obsidian, and can publish a note saying what a person wrote and what a model wrote."},{"@type":"ListItem","position":10,"url":"https://www.businesswire.com/news/home/20261109707511/en/Adobe-and-The-Walt-Disney-Company-Announce-Multi-Year-Strategic-Alliance-to-Support-Disney-Innovation-with-New-AI-Powered-Tools","name":"Disney will train Adobe models on its own characters. The tools are for its teams.","description":"Adobe and Disney announced a multi-year alliance on 9 November at Adobe MAX. Disney gets early access to Firefly, Premiere, and Photoshop, and will work with Adobe on models trained on Disney characters, places, and visual styles. Imagineering is already using a sketch-to-image model in its park pipeline. StudioLAB and ESPN are part of the same deal."},{"@type":"ListItem","position":11,"url":"https://github.com/google-deepmind/mujoco","name":"google-deepmind/mujoco: a physics simulator for robots, a week after version 4.0.0","description":"MuJoCo simulates joints, contact, and motion. DeepMind shipped version 4.0.0 on 6 November. On GitHub's daily trending list it gained about 579 stars, with about 16,800 in total."},{"@type":"ListItem","position":12,"url":"https://github.com/ruvnet/RuView","name":"ruvnet/RuView: presence and vital signs from Wi-Fi, without a camera","description":"RuView estimates presence, pose, and vital signs from ordinary Wi-Fi signals, with no camera. It gained about 245 stars on GitHub's daily trending list and has about 103,000 in total."},{"@type":"ListItem","position":13,"url":"https://github.com/opensandbox-group/OpenSandbox","name":"opensandbox-group/OpenSandbox: a separate computer for the agent, on your machines","description":"OpenSandbox is an Agentic AI Foundation project that runs an agent in an isolated environment. It can execute code, handle files, and open a browser or desktop. It gained about 159 stars on GitHub's daily trending list, with about 16,900 in total."}]}}]}</script>
