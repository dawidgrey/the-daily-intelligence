  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-22.html#webpage","name":"The Daily Intelligence — 2026-09-22","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-22.html","description":"Today’s issue is about the less glamorous layer where AI becomes useful: faster validation, durable context, reliable model calls, practical training and clearer privacy controls. New models still matter, but the strongest signal is the tooling being built around them.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-21T20:00:00Z","dateModified":"2026-09-21T20:08:38Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://linear.app/now/ci-bottleneck-reworked","name":"Linear cuts CI cost and delay as AI-generated code multiplies tests","description":"Linear says its test suite nearly quadrupled as agents accelerated software development, turning continuous integration into a bottleneck. Faster runners, a native TypeScript compiler, leaner checkout jobs and lower setup overhead cut runner time per test roughly in half while reducing pull-request waits."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/institute/measuring-pace-of-ai-development","name":"Anthropic measures how much of its own AI research Claude now leads","description":"Anthropic reports that Claude now leads 26% of measured internal AI R&D tasks and collaborates on more than 90%, while none of the measured work is fully autonomous. It also proposes public metrics for agent oversight, review latency and compute allocation, with third-party evaluators planned."},{"@type":"ListItem","position":3,"url":"https://www.eff.org/deeplinks/2026/09/how-limit-what-apples-new-siri-ai-can-access-ios-27","name":"EFF explains how to limit Siri AI’s access to app data in iOS 27","description":"EFF documents how the new Siri can search content from Messages, Notes, Mail and supported third-party apps, sometimes using Apple’s Private Cloud Compute. Its guide shows users how to disable content indexing for selected apps and reviews the separate controls for app access and on-screen awareness."},{"@type":"ListItem","position":4,"url":"https://huggingface.co/blog/tokenizers-v1","name":"Hugging Face benchmarks a major speed-up for tokenizers v1","description":"Hugging Face’s tokenizers v1 release candidate preserves existing token IDs and APIs while reporting three-to-30-fold single-thread gains over version 0.23, lower tail latency and better multilingual performance. The team published the tokbench harness and commands needed to reproduce the tests on other hardware."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/expanding-openai-academy-with-new-learning-paths","name":"OpenAI Academy adds role-based paths for workers, developers and leaders","description":"OpenAI Academy now offers structured learning paths for everyday work, API and Codex development, organisational leadership, educators and college students. The courses emphasise practising on real tasks, reviewing outputs and adding human checkpoints, with assessments and completion badges."},{"@type":"ListItem","position":6,"url":"https://x.ai/news/grok-4-7","name":"xAI launches Grok 4.7 for coding and knowledge work at lower API prices","description":"xAI has released Grok 4.7 with a larger base model, longer reinforcement-learning runs and more emphasis on self-verification during extended tasks. It is available through the Grok API, Grok Build, Cursor and other coding tools from $2 per million input tokens and $6 per million output tokens."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/v7","name":"V7 builds source-linked institutional memory for long-running agents","description":"V7 Go turns files from systems such as SharePoint and Google Drive into a context graph linking entities, facts, relationships and original evidence. V7 says agents can query that graph through MCP, fall back to document retrieval when needed and preserve an auditable trail across long financial and insurance workflows."},{"@type":"ListItem","position":8,"url":"https://vernllm.dev/","name":"VernLLM adds retries, fallback and rate limits without a separate gateway","description":"VernLLM is a typed TypeScript call layer that wraps existing model clients with timeouts, retry budgets, circuit breaking, provider fallback, caching and local rate limits. It runs inside the application, supports major providers and adds no runtime dependencies of its own."},{"@type":"ListItem","position":9,"url":"https://docs.opencomputer.dev/agents/database","name":"OpenComputer gives every managed agent environment a durable SQL database","description":"OpenComputer now provisions one durable SQL database for every project environment, shared across its agents and sessions while keeping development and production isolated. Schemas are managed through ordered migrations, and bounded MCP tools separate read queries from parameterised writes."},{"@type":"ListItem","position":10,"url":"https://www.projectterminal.app/","name":"Project Terminal puts coding agents, shells and a browser in one Mac workspace","description":"Project Terminal is a macOS workspace for arranging Claude Code, Codex, shells, development servers and browser panes by project. It uses tmux to keep local sessions running when the app closes, stores workspace data locally and offers three projects free with a one-time paid tier."},{"@type":"ListItem","position":11,"url":"https://github.com/trycua/cua","name":"trycua/cua: open infrastructure for computer-using agents","description":"Cua provides open drivers, virtualised computer environments, cross-platform fleets and benchmarks for training and evaluating agents that operate graphical interfaces. The MIT-licensed project led today’s eligible AI repositories on GitHub Trending with 609 stars added during the day."},{"@type":"ListItem","position":12,"url":"https://github.com/coder/coder","name":"coder/coder: secure cloud workspaces for developers and their agents","description":"Coder is a self-hostable platform for centrally managed development environments that can be used by people and coding agents. The actively maintained Go project has more than 16,000 stars and added 461 stars on GitHub Trending today."},{"@type":"ListItem","position":13,"url":"https://github.com/akitaonrails/ai-memory","name":"akitaonrails/ai-memory: shared long-term memory across coding agents","description":"ai-memory is a Rust-based memory layer designed to preserve project knowledge and hand work between coding-agent command-line tools from different vendors. The MIT-licensed project has about 7,600 stars and gained 217 stars on GitHub Trending today."}]}}]}</script>
