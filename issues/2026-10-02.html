  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-02.html#webpage","name":"The Daily Intelligence — 2026-10-02","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-02.html","description":"Today’s issue follows AI into the less glamorous work that determines whether it is useful: safety oversight, secure model operations, small-business training, retail workflows, better evaluation and faster infrastructure. We also look at practical tools for image control, data cleaning and open model development.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-01T20:00:00Z","dateModified":"2026-10-10T20:05:49Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.cnbc.com/2026/09/30/ftc-ai-probe-openai-anthropic.html","name":"FTC opens investigation into risks from leading AI products","description":"The US Federal Trade Commission has opened an investigation into OpenAI, Anthropic and other unnamed AI companies over potential product risks. The inquiry adds formal regulatory scrutiny to an industry already debating how advanced agents should be tested and controlled."},{"@type":"ListItem","position":2,"url":"https://www.paradedb.com/blog/opening-a-closed-tin","name":"ParadeDB closes a Postgres search performance gap","description":"After PlanetScale published benchmarks showing its TIN extension ahead of ParadeDB, ParadeDB reworked its BM25 search path and reports substantially higher throughput on the same workload. Its engineering account explains the optimizations and also identifies benchmark settings that can affect result quality."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/helping-small-businesses-put-ai-to-work","name":"OpenAI and America’s SBDC launch practical AI training for small businesses","description":"OpenAI is partnering with America’s Small Business Development Centers to train about 150 advisers and initially reach at least 1,000 businesses through workshops and follow-up support. A companion report describes small firms using AI for finance, supply chains, compliance and marketing."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/albertsons-reimagining-retail","name":"Safeway brings meal planning and cart building into ChatGPT","description":"Albertsons is expanding its OpenAI partnership with a Safeway experience that can turn recipes, photos, lists or meal requests into a shopping cart before sending customers to Safeway for checkout. The retailer is also applying AI to employee workflows, recommendations and promotional analysis."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/disrupting-a-coordinated-model-distillation-campaign","name":"OpenAI details a coordinated attempt to extract hidden model reasoning","description":"OpenAI says it disrupted a coordinated adversarial-distillation campaign involving extraction patterns across more than 15,000 users, attributing a core cluster to people associated with Moonshot AI. The company says attackers manipulated model interactions rather than breaching databases or stored conversations."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/allenai/olmocore3","name":"Ai2 releases Olmo-core 3 for scaling open mixture-of-experts training","description":"Ai2 has released Olmo-core 3, an open training stack designed to scale mixture-of-experts models into the trillion-parameter range. In a preliminary eight-GPU test, its redesigned distributed system delivered about 2.7 times the throughput of the earlier implementation for a 47-billion-parameter model."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/open-tts-leaderboard","name":"Hugging Face launches an open multilingual TTS leaderboard","description":"Hugging Face has introduced a leaderboard for evaluating open text-to-speech and voice-cloning models across languages. The project responds to a catalogue that has grown beyond 8,000 TTS models and aims to make comparisons more systematic and scalable."},{"@type":"ListItem","position":8,"url":"https://bfl.ai/models/flux-3-image","name":"FLUX 3 adds layout-controlled image generation and targeted editing","description":"Black Forest Labs has introduced FLUX 3 Image with bounding-box layout controls, stronger prompt following and multi-region edits that aim to preserve untouched parts of an image. Users can draw boxes directly or let a language model propose an editable composition."},{"@type":"ListItem","position":9,"url":"https://vercel.com/ai-gateway/models/laya","name":"Laya offers fast typed decisions through Vercel AI Gateway","description":"Vercel AI Gateway has added Laya, a decision model that answers choice, score and yes-or-no questions with typed outputs and probabilities in one forward pass. It is positioned for routing, classification, guardrails and rubric-based evaluation rather than free-form writing."},{"@type":"ListItem","position":10,"url":"https://schancel.github.io/scrubbed/","name":"Scrubbed combines web-data cleaning, PII scanning and deduplication","description":"Scrubbed is a native command-line tool that repairs encoding, extracts main content, scans or masks common personal information and supports duplicate detection for AI training data. Its published benchmark reports much lower CPU time than a matched multi-tool Python pipeline, while clearly limiting the claim to that workload."},{"@type":"ListItem","position":11,"url":"https://github.com/Friedrich-M/UniMate","name":"Friedrich-M/UniMate","description":"UniMate is an MIT-licensed research implementation of a unified model for animating characters with different skeletal structures. It supports text-to-motion, in-betweening, guided editing and motion expansion, with training and inference code available."},{"@type":"ListItem","position":12,"url":"https://github.com/modelcontextprotocol/servers","name":"modelcontextprotocol/servers","description":"The official Model Context Protocol servers repository contains reference implementations that show how AI applications can connect to tools and data through MCP. The actively maintained project has more than 90,000 GitHub stars."},{"@type":"ListItem","position":13,"url":"https://github.com/tile-ai/tilelang","name":"tile-ai/tilelang","description":"TileLang is a domain-specific language for writing high-performance kernels across GPUs, CPUs and other accelerators. The project has more than 8,000 stars and continues to add hardware backends and optimization support."}]}}]}</script>
