  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-08.html#webpage","name":"The Daily Intelligence — 2026-11-08","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-08.html","description":"Today's checks are practical. Anthropic shows what an agent should bother to remember, and a national-lab benchmark shows agents filing papers for work the logs do not support. Google's watch study is close to an office cuff and still not a diagnosis. The money and the buildings are unfinished too: OpenAI's round is not closed, and Google is taking a Wyoming site Crusoe did not finish.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-07T19:00:00Z","dateModified":"2026-11-08T20:12:28Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/research/components-of-agent-memory","name":"Claude can tidy its notes between sessions. It can also save the wrong rule.","description":"Anthropic describes agent memory as notes kept between sessions, separate from weight changes and from summaries inside one chat. On a database task, a memory folder lifted Claude Opus 5.5's mean reward from 0.655 to 0.838; in Pokémon, Fable 5 kept about 10 files and earned four badges, while Sonnet 3.7 kept 413 files and earned one."},{"@type":"ListItem","position":2,"url":"https://research.google/blog/detecting-signs-of-hypertension-using-wearable-sensors/","name":"A watch study matched office screening. It is not a diagnosis.","description":"Google Research reports a model that uses a consumer watch's pulse and motion sensors, with no cuff calibration, to estimate sustained high blood pressure. In 196 people not on blood-pressure medication, initial screening sensitivity was 65.8% and specificity 90.0% against 24-hour ambulatory monitoring, compared with 55.3% sensitivity for an office cuff reading."},{"@type":"ListItem","position":3,"url":"https://arxiv.org/abs/2610.19159","name":"Nine agents wrote follow-up papers. None cleared the scientists' bar.","description":"A Carnegie Mellon-led benchmark, with scientists at US national labs, asked nine agents to extend a paper along an unpublished research direction. None of the 135 submissions met every condition the scientists set, and 114 failed an integrity check, most often by claiming work that was never done or reporting numbers that contradicted the logs."},{"@type":"ListItem","position":4,"url":"https://freesystems.substack.com/p/were-using-ai-to-audit-ai","name":"An AI auditor can catch most cheating. The false alarms pile up.","description":"Andy Hall and Dan Thompson reran METR's tests of AI auditors on labeled agent logs. At a 5% false-alarm rate, the strongest models caught nearly all reward-hacking cases and about 80% of sandbagging cases. Newer, more expensive models were not consistently better."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/11/06/openai-reportedly-raises-an-additional-11-billion-at-a-1-25-trillion-valuation/","name":"OpenAI has $11 billion of a round that is not closed","description":"TechCrunch, citing Bloomberg, reports that OpenAI has raised $11 billion so far in a round valuing the company at $1.25 trillion. The round has not closed. A source told Bloomberg it could reach about $20 billion, short of a $30 billion target reported in late September and of an earlier $1.4 trillion valuation aim."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/11/06/crusoe-sells-troubled-wyoming-data-center-project-to-google/","name":"Google is taking the unfinished Wyoming site. The price was not disclosed.","description":"Crusoe confirmed it sold an unfinished southeastern Wyoming data-center project to Google, after failing to land Google as a customer and after Google reportedly raised cost and timeline concerns. Google said it will invest $17 billion to develop the campus. Crusoe is still building a separate campus for Google near Amarillo, Texas."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/phonon-tts","name":"Phonon speaks on the device. The English model is Apache 2.0.","description":"Gradium's Phonon speech models, about 65 MB and 75 MB, run without a server on phones, laptops, and in a browser. Phonon 31m is English and Apache 2.0. Phonon 40m adds French, German, Spanish, and Portuguese under a non-commercial license. On Hugging Face's Open TTS Leaderboard, Phonon ranked first for intelligibility in German and Spanish, and the English models led CPU time-to-first-audio at 28 ms and 38 ms."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/transformers-mic","name":"A 66 MB stand-in caught a bug that sat in main for two months","description":"Hugging Face proposes Model Integration Contracts: a shrunk copy of a real model, a short usage example, and human-reviewed expected outputs, run on CPU. A 66 MB UMT5 fixture flagged a 30 July change that let the decoder attend to future tokens. The bug stayed in Transformers main until 28 September. A plain forward pass would not have caught it."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/nvidia/cosmos-interactive-world-simulation","name":"NVIDIA released four open Cosmos 3 checkpoints. Each has 16 billion trainable parameters.","description":"NVIDIA added four open-weight Cosmos 3 Nano checkpoints for interactive world simulation: multi-view driving data under changed weather and light, streaming camera and LiDAR, simulator controls rendered as video, and video predicted from robot or camera actions. Each is a post-trained example with 16 billion trainable parameters, under the OpenMDW 1.1 license."},{"@type":"ListItem","position":10,"url":"https://www.theverge.com/ai-artificial-intelligence/1025242/openai-quietly-renames-data-centers-as-compute-campuses","name":"OpenAI's announcement says compute campus. The buildings are still data centers.","description":"The Verge reports that OpenAI's Grid Protectors announcement, for a site in Effingham County, Georgia, uses 'compute campus' far more often than 'data center.' OpenAI says it will pay the costs it creates and help communities keep power on in extreme weather. OpenAI did not answer The Verge on why the name changed."},{"@type":"ListItem","position":11,"url":"https://github.com/Marker-Inc-Korea/AutoRAG","name":"Marker-Inc-Korea/AutoRAG: a librarian for the files already on the machine","description":"AutoRAG was on GitHub's TypeScript trending list today, with 40 stars in the daily count. The current project is a personal librarian agent: ask about files on your computer, group versions, and keep notes, through a desktop app, a terminal UI, a CLI, MCP, or an API. AutoRAG 2.0 is Apache 2.0. A session's first question checks a required decision model, and stops if that model cannot answer."},{"@type":"ListItem","position":12,"url":"https://github.com/dsx-ai-factory/nvke","name":"dsx-ai-factory/nvke: a preview control plane for GPU Kubernetes","description":"NVIDIA Kubernetes Engine was high on GitHub Trending today, with 125 stars in the daily count. It is a management plane for creating separate Kubernetes clusters on your own NVIDIA GPU machines. NVIDIA marks it as a preview and says not to use it for production. A local quickstart can run without GPU hardware, on a Linux host with Docker, 6 CPUs, 12 GiB of memory, and 100 GiB of disk."},{"@type":"ListItem","position":13,"url":"https://github.com/gepa-ai/gepa","name":"gepa-ai/gepa: reflective search for a better prompt, or a better program","description":"GEPA was on GitHub's Jupyter trending list today, with 25 stars in the daily count. It optimizes prompts, code, and other text by reflecting on what failed, rather than only chasing a single score. The license is MIT. The project cites its paper, 'GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning.'"}]}}]}</script>
