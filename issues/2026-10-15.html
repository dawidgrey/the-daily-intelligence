  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-15.html#webpage","name":"The Daily Intelligence — 2026-10-15","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-15.html","description":"Today's issue is about practical control. Music services are labelling or preparing to hide machine-made tracks, Android is adding stronger scam checks, and a new method aims to make two-to-six-week weather forecasts more reliable. Alongside that, courts and a major bank are counting the cost of AI secrets, child-safety claims and software flaws that advanced models can expose.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-14T19:00:00Z","dateModified":"2026-10-24T20:08:56Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.justice.gov/opa/pr/saudi-national-arrested-installing-surreptitious-audio-recording-device-openai","name":"US charges an OpenAI engineer over a hidden recording device","description":"Federal prosecutors say an OpenAI engineer was arrested and charged with trying to intercept oral communications after a concealed audio recorder was found in an executive conference room. The complaint alleges a related chatbot account was used to ask about building and hiding a recorder. He has been charged, not convicted."},{"@type":"ListItem","position":2,"url":"https://www.reuters.com/business/retail-consumer/openai-employee-who-left-apple-took-files-about-unreleased-device-openai-alleges-2026-10-14/","name":"OpenAI alleges a former employee took unreleased device files to Apple","description":"In a new court filing, OpenAI alleges an employee who left for Apple sent more than 100 files about an unreleased product to a personal account and later presented that product to senior Apple leaders. Apple says it has found no evidence supporting the claim and that new hires are barred from using a prior employer's confidential information."},{"@type":"ListItem","position":3,"url":"https://www.reuters.com/world/eight-us-states-sue-openai-claiming-chatgpt-harms-children-2026-10-14/","name":"Eight US states sue OpenAI over alleged harms to children","description":"Iowa, Kansas and six other states sued OpenAI on Wednesday, alleging ChatGPT has harmed children and asking courts to require changes in how the product works for young users. The suits also seek profits the company earned from those users. Florida filed a similar case in June; these new filings have not been decided."},{"@type":"ListItem","position":4,"url":"https://www.cnbc.com/2026/10/14/anthropic-mythos-bank-of-america-hiring-cost.html","name":"Bank of America added 1,000 contractors to patch flaws found with Mythos","description":"CEO Brian Moynihan said the bank put 1,000 contractors alongside about 3,000 internal staff to patch software flaws exposed by advanced models, including Anthropic's Mythos. He also said software remediation and separate anti-money-laundering compliance together added a couple of hundred million dollars of third-quarter cost."},{"@type":"ListItem","position":5,"url":"https://blog.youtube/news-and-events/youtube-music-ai-labels/","name":"YouTube Music adds labels for tracks made mainly with generative AI","description":"YouTube Music is rolling out player labels that mark songs created primarily with generative AI, including cases where a model produced the composition and vocals. The labels are also expanding to the main YouTube app, using partner disclosures and YouTube's own detection."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/10/14/deezer-will-soon-let-you-filter-out-ai-generated-music/","name":"Deezer plans a switch to hide AI-generated music","description":"Deezer said it is building a toggle, due before the end of 2026, that will remove AI-generated tracks, albums and related artists from search results. The company says more than half of its daily uploads are now AI-generated, averaging about 90,000 tracks a day as of July."},{"@type":"ListItem","position":7,"url":"https://blog.google/security/new-android-scam-protections/","name":"Android adds opt-in Gemini checks for message scams","description":"Google is rolling out an opt-in enhanced protection mode in Google Messages that uses cloud Gemini models, inside Private AI Compute, to judge the intent of unknown senders, plus on-device Gemini Nano checks for unfamiliar links. Android will also warn about call-forwarding tricks and hide passwords and payment fields during screen sharing."},{"@type":"ListItem","position":8,"url":"https://www.anthropic.com/news/2026-us-midterms","name":"Claude will add official US voting information and election results","description":"Anthropic says that later this month Claude.ai will pull state-specific voting information from Democracy Works into answers about where to vote or what identification to bring, and will show official results on election night. In a late-September sample, about 0.51% of US Claude.ai conversations were about elections or voting."},{"@type":"ListItem","position":9,"url":"https://www.nature.com/articles/s41586-026-11126-x","name":"A machine-learning correction improves two-to-six-week weather forecasts","description":"A Nature paper published on 14 October describes probabilistic bias correction, a method that learns to fix systematic errors in existing weather models rather than replacing them. Applied to European Centre for Medium-Range Weather Forecasts systems, the authors report better skill for most temperature and precipitation targets at the two-to-six-week range."},{"@type":"ListItem","position":10,"url":"https://www.gartner.com/en/newsroom/press-releases/2026-10-14-gartner-says-over-us-dollars-three-and-a-half-trillion-of-artificial-intelligence-infrastructure-spending-could-be-exposed-to-impairment-by-the-end-of-2030","name":"Gartner warns much planned AI infrastructure spending may not earn its keep","description":"Gartner said more than $3.5 trillion of AI infrastructure spending could be exposed to impairment by the end of 2030 if current capital plans continue, because forecast AI revenue would not cover that spending and a 12% return. It also predicts that cost pressure will push more than 80% of independent neocloud providers to cease independent operations by 2030."},{"@type":"ListItem","position":11,"url":"https://github.com/storytold/artcraft","name":"storytold/artcraft: an IDE for composing AI images and video","description":"ArtCraft is an open desktop workspace for composing AI images and video, with tools for placing characters, staging 3D scenes and choosing among image, video, audio and 3D models. It was the strongest new AI-related repository on today's GitHub trending list that this publication has not already covered, with about 3,172 stars today and roughly 27,600 overall."},{"@type":"ListItem","position":12,"url":"https://github.com/MakazhanAlpamys/Soup","name":"MakazhanAlpamys/Soup: fine-tune a language model from one YAML file","description":"Soup is a Python toolkit for fine-tuning language models from a single configuration file, including LoRA-style training and a layer-streaming mode the project says can train an 8B model on a 4 GB laptop GPU. It was the second-highest new AI-related repository on today's trending list, with about 281 stars today and roughly 9,000 overall."},{"@type":"ListItem","position":13,"url":"https://github.com/apify/apify-mcp-server","name":"apify/apify-mcp-server: connect a coding agent to web data tools","description":"Apify's MCP server lets coding agents call the company's library of web extractors for sources such as search, maps and public web pages. It was the third-highest new AI-related repository on today's trending list, with about 233 stars today and roughly 11,200 overall."}]}}]}</script>
