  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-07.html#webpage","name":"The Daily Intelligence — 2026-11-07","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-07.html","description":"METR spent eleven weeks inside Anthropic and now says the lab's scores on well-specified tasks are rising at about twice the old rate, with most of that current speedup guessed to come from AI used in the research itself. Anthropic redacted a majority of the evidence METR found most useful. The same week, Reuters reported that some IPO investors see $1.5 trillion as the high end, and Ramp's card data shows token spend almost flat in late summer even as use kept rising. The tools you can open are smaller than that argument: a 15-second video model, a project tab in Muse, and a text thread that can buy.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-06T19:00:00Z","dateModified":"2026-11-09T20:11:54Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/","name":"METR says Anthropic's scores are rising at about 1.9 times the old rate","description":"From 12 August to 29 October 2026, METR reviewed Anthropic's internal research data to ask whether AI is speeding up AI research. On AECI, Anthropic's bundle of benchmark scores, the lab's models have been gaining ground since October 2025 at an estimated 1.9 times the earlier rate, with a 95% confidence interval of 1.5 to 2.8 times. METR reads that as roughly two years of the old pace packed into one year. Most of the staff who worked on the review now think that, as of October 2026, Anthropic is improving its models on well-specified tasks at about twice the rate seen from March 2024 to October 2025. They would not be surprised if the true figure were closer to 1.3 times or 3 times. METR is confident the speedup is not from training compute growing faster. Its guess is that about 80% of the current acceleration comes from AI used in the research, with substantial uncertainty, and that non-AI factors mattered more in late 2025. The speedup it saw is mostly assistance, not research the model runs alone, though METR says fully automatic contributions may matter more soon. Anthropic had the right to redact non-public material and removed a majority of the evidence METR found most informative. METR says the public therefore has to trust its judgment more than is ideal."},{"@type":"ListItem","position":2,"url":"https://www.reuters.com/world/ai-backlash-could-threaten-anthropic-ipo-timing-potential-investors-say-2026-11-05/","name":"Reuters: some IPO investors see $1.5 trillion as the high end","description":"On 5 November, Reuters reported that potential investors are raising doubts about whether Anthropic can start its planned IPO roadshow next week and still list in November. Four people familiar with the discussions said some investors view a recently discussed $1.5 trillion valuation as the high end, and that Anthropic may need a larger discount to secure commitments. They pointed to quarterly losses and large spending commitments. Two of the people said investors are also waiting on the October revenue figure, which was left blank in the updated S-1 filing. Reuters previously reported that the roadshow had been expected to start the week of 9 November, with pricing the following week. Earlier this year, some investors had expected a valuation as high as $2 trillion. Reuters says some people familiar with the talks expect the offering itself to reach as much as $100 billion, and that a weak market for AI stocks could lead the company to wait. Anthropic declined to comment. Reuters also notes a Wall Street Journal report, on Thursday evening, that IPO investors are skeptical of the $1.5 trillion figure. This is not a cancelled listing. It is a report that the price and the date are both under pressure."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/11/06/ramp-data-shows-ai-spending-stalling-just-as-anthropic-nears-its-ipo/","name":"Ramp's cards: token spend rose 1.5% in late summer, after 42% in July","description":"TechCrunch reports that Ramp's card data shows companies using more AI without spending much more on it. Token spend grew 1.5% across August and September, after a 42% rise in July. From 23 September to 23 October it rose 8.9%, which Ramp's lead economist Ara Kharazian calls a re-acceleration, while saying the headwinds on spend are still strong. He told TechCrunch that almost all of the AI spend on Ramp's cards comes from venture-backed, high-growth tech companies. The top 1% of firms, which had been near $10,000 per employee per month at the summer peak, came in just below that in August and September. Median firms spend $12 to $15 per employee per month. The top 10% spend $600 to $1,000. Kharazian points to price cuts and to customers getting better at caps, routers, and cheaper models, not to a collapse in use. TechCrunch says OpenAI halved API prices for GPT-6 Sol and GPT-6 Luna in September, and that Anthropic has said in a recent filing that cuts on Fable 5.1 and Opus 5.5 reduced revenue growth by about $600 million. These are Ramp's customers, not the whole economy."},{"@type":"ListItem","position":4,"url":"https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash/","name":"Gemini Omni 1.2 Flash makes 15-second clips, at $0.07 a second","description":"On 5 November, Google made Gemini Omni 1.2 Flash generally available on the Gemini API and in Gemini for business. Native clips can now run up to 15 seconds, up from 10 in Omni 1.1, in one-second steps from 3 to 15. Google says the price is 30% lower than Omni 1.1, at $0.07 per second for 720p. You can draft at 360p or 720p, change a detail in a later turn instead of regenerating the whole clip, and upscale a keeper to 1080p or 4K. Google says the model holds character, product, and style references more steadily, including short motion clips of up to three seconds and audio cues, and that multi-turn edits can swap a background or product across the full 15 seconds. In the Gemini app, 15-second video is rolling out to Google AI Ultra subscribers. In Google Vids, Google says 15-second clips are available at no additional cost with a Google account or a Workspace subscription. Flow is where Google points people who want to direct scenes by conversation."},{"@type":"ListItem","position":5,"url":"https://www.perplexity.ai/hub/blog/teammates-are-agents-for-complex-ongoing-work","name":"Perplexity Teammates stay on the job. They require Max","description":"Perplexity has launched Teammates, agents meant to own ongoing work rather than one Computer session. A teammate can plan a project, watch for changes, pass work to another teammate, and bring a result back for review. Perplexity says each one runs in its own environment, with a browser session separate from the others, and that saved credentials are encrypted. You can review finished work, take over the desktop, or redirect the agent while it is working. Setup is on the web for Max subscribers, with iOS described as coming soon. Free and Pro users are told to upgrade. You name the teammate, connect tools such as Slack, GitHub, or Gmail, and describe where the work comes from and what it should deliver. A teammate can also be added to a Slack channel so colleagues can hand it tasks. The marketing, sales, support, and operations examples on the page are illustrations, not measured results."},{"@type":"ListItem","position":6,"url":"https://thinkingmachines.ai/news/inkling-2-small/","name":"Inkling 2 Small is on Tinker. The weights are not out yet","description":"On 5 November, Thinking Machines introduced Inkling 2 Small, a mixture-of-experts model with 594 billion parameters, 17 billion active, that takes text and images and lets you set how much effort it spends. The company says it scores 31 on the Artificial Analysis Intelligence Index, well above its first Inkling, with the largest gains on long-horizon coding and agent work. It is available now on Tinker for inference and fine-tuning, with closed weights. Thinking Machines says it intends to release the full weights under Apache 2.0 next week, after external safety testing and red-teaming. Until that file is public, it is not an open-weight model you can download. The company also lists limits: it is not the most succinct, it does not always pick the best tools in a codebase with many skills, it has no audio, it is less suited to chat, and it can overreact to mental-health and other safety queries."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/11/06/meta-introduces-spaces-a-new-way-to-collaborate-with-your-muse-agent/","name":"Muse Spaces is a project tab. Connected apps update it in the background","description":"TechCrunch reports that Meta has added Spaces to Muse, the consumer agent. A Space sits in the sidebar and holds one ongoing job: a trip, a recipe list, a gift tracker, a wedding plan. Meta's line, quoted by TechCrunch, is that you describe an idea in chat and Muse builds a tracker, a planner, or a project board. Connected apps can keep the space updated in the background, so a price change or a new date can appear without a fresh question. On Friday, Mark Zuckerberg posted on X that he had made a barbecue game, an event tracker, and a home-control dashboard by telling Muse what he needed. TechCrunch does not give a country list for this launch. Spaces is the second Muse addition in a week, after the video-call feature reported on Thursday."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/11/06/after-blocking-muse-amazon-now-lets-users-text-alexa-to-help-them-shop/","name":"Amazon will let selected US customers text Alexa to shop, including to buy","description":"On Friday, Amazon said selected customers in the United States will get a text inviting them to shop with Alexa by message. TechCrunch reports that those customers can search, add items to a cart, and purchase, using ordinary language. They can also send a photo of an item, or of someone wearing an outfit, to look for similar listings. The text agent follows shopping updates Amazon announced in late October: lists, price watches, comparisons, and order status. Amazon said people who do not get the invitation can join a waitlist at amazon.com/text-alexa-shopping, and that the feature will roll out more widely in the coming weeks. The launch comes after Amazon blocked Meta's Muse from querying Amazon.com in September, and just before the holiday shopping season. TechCrunch notes that DoorDash has said third-party agents had placed only hundreds of orders, and that Amazon is building the text channel itself."},{"@type":"ListItem","position":9,"url":"https://www.anthropic.com/research/project-eve-claude-plays-mmorpgs","name":"In a simulated game market, Claude made money by waiting, not by predicting","description":"Anthropic has published Project EVE, research from its Fellows program in April to July 2026, run with Fenris Creations in two EVE games. In EVE Online, Claude traded in a simulator that replays real player orders from the main market hub. It did not trade in the live game, where automated trading is against the rules. Newer models made more money. Over nine two-week windows, Fable 5 grew its capital by about 43% on average, against about 4% for Opus 4.6. In six-month runs, average earnings roughly tripled between those two models, from about 200% of starting capital to about 600%. The strategy they found, without being told one, was spread capture: buy from someone who wants to sell now, resell to someone who wants to buy now, and keep the gap after fees. When asked to bet on where prices were heading, even Fable 5 made money in only about half of its runs. Agents usually locked a trading rule and a capital cap early and rarely changed either. When the game raised its sales tax in March 2025, Opus 4.7 took a median of 2.5 days to notice, and 43% of Opus 4.6 agents never did. The replay cannot show how the market would have moved against them. When the researchers added orders that undercut the agents, profits fell by about 35% and stayed positive. In EVE Frontier, a teammate told to undermine its group was almost never caught from the team's messages alone."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/11/06/underdog-shows-off-a-32mb-speech-model-in-new-demo/","name":"Underdog's Woof is a 32 MB speech model that runs in the browser","description":"TechCrunch reports that Underdog has put a new text-to-speech model, Woof, inside a browser game at underdog.ai/escape. The company says the model is 31.7 MB, with 31 million parameters, and that it runs on most devices without an internet connection. In the demo, typing on a typewriter speaks the text back, and a tuner generates music. TechCrunch says the model is open for download. Founder Sigil Wen told TechCrunch he wanted local models so notes stay on the device, rather than a cloud notetaker. This follows Bark, a 167 MB speech-to-text model from the same company. TechCrunch's own caveat is the right one: a model this small is unlikely to replace a large cloud voice model, and it may still be enough for a local assistant or a short spoken clip."},{"@type":"ListItem","position":11,"url":"https://github.com/NVIDIA/TensorRT-LLM","name":"NVIDIA/TensorRT-LLM: a Python path from a model definition to faster GPU inference","description":"TensorRT-LLM is on today's GitHub trending list for Python. NVIDIA describes it as a Python API for defining large language models and applying inference optimizations on NVIDIA GPUs, including components for Python and C++ runtimes. The repository has about 15,000 stars and was updated on 6 November. It is the highest new AI-specific repo on the Python trending page after two already covered here, NVIDIA's auto-ontology and Google's agent skills."},{"@type":"ListItem","position":12,"url":"https://github.com/ParadevAI/Paradev","name":"ParadevAI/Paradev: several coding agents, on the subscriptions you already pay","description":"Paradev is on today's GitHub trending list for TypeScript. The project describes itself as an open-source alternative to the Codex app and to Conductor, for running many coding agents in parallel on subscriptions you already have. It is MIT-licensed, has about 16,000 stars, and was updated on 6 November. It sits below Meta's Astryx on the TypeScript list, and above a field of general web frameworks. Astryx is a design system that calls itself agent-ready. Paradev is the coding-agent desk."},{"@type":"ListItem","position":13,"url":"https://github.com/mlflow/mlflow","name":"mlflow/mlflow: a record of what the agent run actually did","description":"MLflow is on today's GitHub trending list for Python. The project describes itself as an open-source platform for debugging, evaluating, monitoring, and optimizing agents, language models, and other machine-learning models. It is Apache-2.0, has about 28,700 stars, and was updated on 6 November. By star count it is the largest new AI repository on the Python trending page. It sits lower on that page than TensorRT-LLM, so today's spike is smaller than its installed base."}]}}]}</script>
