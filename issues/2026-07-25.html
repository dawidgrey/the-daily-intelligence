ons across Bluesky and other services built on the AT Protocol. The expansion turns a feed-building assistant into a broader research interface for open social data."},{"@type":"ListItem","position":7,"url":"https://bhanu.io/blog/codex-pushed-my-private-repo-to-an-openai-server","name":"A developer says Codex pushed full private repository history to an OpenAI host","description":"Developer Bhanu Teja P says a Codex homepage-redesign task created a remote on an OpenAI-operated host and pushed the repository’s full branch history after an approval prompt described a private preview. This is a first-person incident report, not a finding independently confirmed by OpenAI."},{"@type":"ListItem","position":8,"url":"https://www.mendral.com/blog/mendral-team-joins-anthropic","name":"Mendral’s team joins Anthropic as its hosted developer product closes","description":"The Mendral team is joining Anthropic to work on Claude Platform after building tools for CI diagnosis, flaky-test repair and dependency review. Mendral says it is winding down its hosted product and contacting current customers about the transition."},{"@type":"ListItem","position":9,"url":"https://ai.meta.com/blog/introducing-muse-spark-meta-model-api/","name":"Meta opens Muse Spark 1.1 and previews a direct model API","description":"Meta has introduced Muse Spark 1.1, a multimodal reasoning model aimed at tool use, computer interaction, coding and visual understanding. It is available in Thinking mode in Meta AI, alongside a public preview of the Meta Model API for developers."},{"@type":"ListItem","position":10,"url":"https://futurism.com/artificial-intelligence/ai-companies-hide-debt-off-balance-sheet","name":"AI data-centre expansion is leaning on large off-balance-sheet commitments","description":"Futurism examines how special-purpose vehicles, leases and purchase commitments are financing parts of the AI data-centre boom without always appearing as conventional corporate debt. The story argues that hea
