  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-09.html#webpage","name":"The Daily Intelligence — 2026-11-09","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-09.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today the loudest workplace story is a bank taking coding agents off the trading floor. A new test says the best model fully finishes about one real revision in four. The rest of the issue is what to do with that gap.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-08T19:00:00Z","dateModified":"2026-11-11T20:10:33Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.fa-mag.com/news/goldman-restricts-traders-and-bankers-from-using-some-ai-tools-89026.html","name":"Goldman limits Claude Code and GitHub to engineers","description":"Internal guidance updated in October, reported by Bloomberg on 2 November, limits Anthropic's Claude Code and Microsoft's GitHub to Goldman's engineers. Traders had used the tools to watch client flows and model positions. The limit does not cover strats, who sit between trading, research, and engineering."},{"@type":"ListItem","position":2,"url":"https://arxiv.org/abs/2610.35138","name":"On real app revisions, the best model fully finishes one task in four","description":"Co-Design Bench is 273 revision tasks taken from real coding sessions, with hidden criteria and no gold screenshot. Under one shared harness, the strongest of ten model endpoints meets about 70 percent of a task's criteria on average, and fully finishes 26.4 percent of tasks. Tasks that mix three or four kinds of change score worse for every model tested."},{"@type":"ListItem","position":3,"url":"https://hackertube.org/","name":"HackerTube keeps the videos Hacker News already recommended","description":"Andrej Karpathy has published HackerTube, a site of videos that people on Hacker News have recommended. It needs no login, and it shows a frame from the video rather than a designed thumbnail. He has said on X that Claude did nearly all of the build."},{"@type":"ListItem","position":4,"url":"https://recto.design/","name":"Recto is a free canvas for what a coding agent draws","description":"Recto 0.1.8, released 8 November, runs locally on Mac, Windows, and Linux. It detects coding agents already on the machine, including Claude Code, Codex, Cursor, and OpenCode, and lets you move, restyle, or send a comment back to the agent. Designs are HTML and CSS, and the download is free."},{"@type":"ListItem","position":5,"url":"https://lovable.dev/blog/how-we-built-lovable-and-why-we-keep-rebuilding-it","name":"Lovable deleted most of its agent loop, then put the checks back","description":"Anton Osika writes that open-ended agents got stuck, so the team deleted almost all of that code and returned to one request and a predictable chain of tools. Short notes about recurring mistakes, retrieved into context, worked better for them than the fine-tuned models they had planned. The company says users have created more than 70 million projects."},{"@type":"ListItem","position":6,"url":"https://psicode.ai/","name":"psi is a 6.4 MB coding agent you can read","description":"psi is a portable coding agent written in ANSI C and Lua, under an MIT license. The site says the binary is 6.4 MB and runs on Linux, macOS, Windows, FreeBSD, OpenBSD, and Haiku. You bring a provider: Anthropic, OpenAI Codex, OpenRouter, or a local model through Ollama."},{"@type":"ListItem","position":7,"url":"https://www.thenationalnews.com/future/technology/2026/11/06/openai-deal-to-cut-abu-dhabi-government-processing-times-from-days-to-minutes/","name":"Abu Dhabi says one food-import check now takes minutes","description":"Faisal Al Hawi, of Abu Dhabi's Department of Government Enablement, told The National that AI has already cut some food-import processing from several days to minutes. The wider OpenAI partnership aims at a workforce of people plus agents, with government data processed inside the UAE. The stated target is an AI-native government by the end of 2027."},{"@type":"ListItem","position":8,"url":"https://openai.com/index/measuring-how-ai-agents-handle-wet-lab-science","name":"On routine lab reads, GPT-6 Astra scores 66.7%","description":"BioBasicsBench is 100 tasks built with Ligo from raw wet-lab evidence, such as gel images, plates, and instrument files. At the highest reported reasoning setting, GPT-6 Astra earned 66.7% of available credit, against 43.8% for GPT-5.6 Sol. OpenAI says the gain is mostly in reading images and knowing when the evidence is not enough."},{"@type":"ListItem","position":9,"url":"https://openai.com/index/australian-universities-ai-native-graduates","name":"Four Australian universities are rolling out ChatGPT Edu","description":"OpenAI says UNSW, the University of Sydney, La Trobe, and Adelaide University are giving students and staff ChatGPT Edu, on staggered timelines. A survey OpenAI commissioned of 1,018 Australian students, taken 3–7 August, found 81% already use AI several times a week, and 28% say they have built an agent. UNSW is extending access toward more than 80,000 people."},{"@type":"ListItem","position":10,"url":"https://alexmarquardt.com/ai-tools/agent-fleet-token-efficiency/","name":"One coding fleet cut tokens per line by about 3.3 times","description":"Alexander Marquardt measured ten weeks of Claude Code transcripts from a fleet he runs. Tokens per changed line fell about 3.3 times after he ended each agent at one task, kept the prompt cache warm, and loaded less into every session. He says several changes landed together, so he cannot separate every effect, and rework per pull request rose slightly."},{"@type":"ListItem","position":11,"url":"https://github.com/Albert-Weasker/niubigeo","name":"Albert-Weasker/niubigeo: ask model APIs how a brand shows up","description":"NiubiGEO is an open-source workbench for brand-visibility and competitor reports. It was the most-starred new AI project on GitHub's daily TypeScript list, with about 1,307 stars today."},{"@type":"ListItem","position":12,"url":"https://github.com/meta/astryx","name":"meta/astryx: a design system an agent can read","description":"Astryx is Meta's open design system, described as fully customizable and agent ready. It gained about 863 stars on today's TypeScript trending list."},{"@type":"ListItem","position":13,"url":"https://github.com/poco-ai/Agentero","name":"poco-ai/Agentero: a local desk for papers and agents","description":"Agentero is a MIT-licensed research workspace that keeps PDFs, notes, and agent context on the local machine. It gained about 175 stars on today's TypeScript trending list."}]}}]}</script>
