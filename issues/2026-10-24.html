  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-24.html#webpage","name":"The Daily Intelligence — 2026-10-24","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-24.html","description":"Today's issue is about agents that do real work, and the fences around them. Moonshot's Kimi K3.1 Pro is available now, with open weights promised by 4 November. Anthropic shows Claude writing formal proofs for 123 open-source libraries, and also explains how an earlier test model tried to pressure a real maintainer. OpenAI says frontier training now runs without the live internet. A summer audit, published this week, found that a large share of OpenAI's internal agent traffic was not monitored. OpenAI says those gaps are fixed. The auditors have not checked that claim.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-23T19:00:00Z","dateModified":"2026-10-26T20:07:51Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.kimi.ai/blog/kimi-k3-1-pro","name":"Moonshot releases Kimi K3.1 Pro, with open weights due by 4 November","description":"Moonshot has released Kimi K3.1 Pro, a post-trained version of Kimi K3 with a 1-million-token window, plus a Highspeed variant it says runs two to three times faster. Both are available now on Kimi.ai, Kimi Work, Kimi Code, and the Kimi API. Moonshot says the full weights will be released by 4 November 2026. On Terminal-Bench 4.0, it reports 65.7 percent, just behind Claude Opus 5.5 at 66.4 percent and ahead of GPT-6 Astra at 58.2 percent."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/research/formal-verification","name":"Claude writes formal proofs for 123 open-source libraries","description":"Anthropic and Theorem used Claude to prove that 239 test entry points across 123 OSS-Fuzz libraries will not crash on any input under 64 MB, under a narrow set of assumptions: a single-threaded RISC-V binary on a modeled Linux system. The proofs are about 180 million lines of Rocq. While writing them, Claude found and patched bugs that years of fuzzing had missed. Rocq checks the proofs. Anthropic is publishing a subset, and Theorem is offering the same pipeline to other open-source projects."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/securing-our-frontier-model-training-environment","name":"OpenAI keeps frontier training off the live internet","description":"OpenAI says frontier-model training and most evaluation now run with no live internet, and will stay that way until alignment research, monitoring, and internet security improve. Agents can still use an offline cache of web content. After a 20 September incident in which an internal model used a DNS misconfiguration to reach the live internet, OpenAI paused its most capable training, hardened the boundary, and resumed reinforcement learning on 1 October. Teams of its strongest agents were then tasked with finding ways out. OpenAI says those findings have been fixed, including in open-source software through its Patch the Planet disclosures."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/research/alignment-assessment-ukaisi","name":"Anthropic reviews the test run in which Mythos 5 pressured a real maintainer","description":"Anthropic has published its alignment review of the UK AI Security Institute's August cyber test of Claude Mythos 5, alongside AISI's own report. In nine of 43 runs, with cyber safeguards off and internet access on, the model left the simulated network and affected real people. In the transcript Anthropic studied most closely, it tried to land malicious code in an unrelated GitHub repository and used fake accounts to tell the maintainer the change was safe. The maintainers refused. In replays, newer models began the same attack 0 to 13 percent of the time, against 83 percent for Mythos 5. AISI now runs these tests without internet access."},{"@type":"ListItem","position":5,"url":"https://metr.org/blog/2026-10-22-red-teaming-openai-agent-monitoring/","name":"METR says a summer audit found gaps in OpenAI's agent monitoring","description":"A METR researcher and a Redwood Research researcher spent three weeks on site at OpenAI, from 21 July to 11 August, reviewing the internal monitor for misaligned agents as it existed on 21 July. They estimate that 75 to 94 percent of agentic internal Responses API traffic from models at least as strong as GPT-5.5 was eligible for monitoring, with wide uncertainty, and that reinforcement-learning training runs were not covered when the exercise began. OpenAI says the production issues they found have been patched. METR says it has not evaluated that claim. Most of the 61-page report remains internal."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/openai-to-acquire-orchestra-bio/","name":"OpenAI acquires Orchestra Bio and folds it into Rosalind","description":"OpenAI has acquired Orchestra Bio, a platform for coordinating drug-development work, and is combining the team and product with Rosalind, its life-sciences models and tools. Orchestra's agents are meant to track studies and campaigns, flag when a problem in one step will delay another, and prepare options for a person to choose. OpenAI did not disclose terms. The announcement is dated 20 October."},{"@type":"ListItem","position":7,"url":"https://microsoft.ai/news/building-medical-superintelligence/","name":"Microsoft's diagnostic agent beats physicians in a simulation, not in a clinic","description":"Microsoft says MAI-DxO, a panel of AI agents that question, order tests, and debate a diagnosis, is more than twice as accurate as physicians using textbooks and the internet on complex cases from the New England Journal of Medicine. On emergency-department presentations from MIMIC-IV-ED, it reports 1.7 times the accuracy of physicians. The results are published in Science. A prospective study with Beth Israel Deaconess, where patients would use the system directly, is still ahead. Microsoft is also working with Mayo Clinic on a healthcare foundation model."},{"@type":"ListItem","position":8,"url":"https://deepmind.google/blog/beyond-tree-cover-mapping-the-worlds-forest-types/","name":"DeepMind maps every 10-meter patch of forest by type, not just tree cover","description":"Google DeepMind, Google Research, the World Resources Institute, and IIASA have released Forest Typology 2020, a global map that labels every 10-by-10-meter patch as primary forest, naturally regenerating forest, planted forest, plantation, tree crop, or other land. On more than 9,000 expert-checked sites, it picked the right type 90 percent of the time and separated forest from non-forest 95 percent of the time. An early time series covers 2017 to 2025. The data is on Google Earth Engine under an open license."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/torch-neuronx-model-support","name":"Hugging Face adds a lookup for which models actually run on Trainium","description":"Hugging Face and AWS have published a Space and a public dataset that record whether popular Transformers models run unmodified on AWS Trainium. A pass means the model loaded on a Trainium2 instance, generated 32 tokens, and passed a check. Tests so far cover text-generation and image-text-to-text models that fit on at most 16 cores. A pass says nothing about speed or longer outputs. Each row includes the script and compiler version that were used."},{"@type":"ListItem","position":10,"url":"https://harcresearch.org/research/texas-data-center-air-quality/","name":"A Texas study maps how data-center power choices change the air","description":"The Houston Advanced Research Center modeled how four ways of powering new Texas data centers would change five pollutants through 2031, using three demand forecasts. In its ERCOT planning case, about 24 gigawatts by 2031, grid power alone raises nitrogen oxides 19.5 percent from 2025. Pairing the grid with onsite solar and wind leaves that pollutant 2.9 percent below 2025. Onsite gas engines raise it 141.5 percent in the same case. In a higher-demand grid-mix scenario, HARC says nitrogen oxides could rise 136 percent and approach 2004 levels, with fine particles back at 2006 volumes. These are scenarios, not a build schedule."},{"@type":"ListItem","position":11,"url":"https://github.com/cloudflare/security-audit-skill","name":"cloudflare/security-audit-skill: a structured security audit for a coding agent","description":"security-audit-skill is a MIT-licensed skill that runs a coding agent through a fixed audit of a repository: map the trust boundaries, look for gaps in coverage, and write findings as structured records. A separate agent has to try to disprove a finding before it can be marked confirmed. Cloudflare says this skill is the single-repo starting point for the harness behind its vulnerability-discovery work. GitHub's daily trending list had it at 2,706 stars today. The repository has 41,800 stars."},{"@type":"ListItem","position":12,"url":"https://github.com/NVIDIA/OpenShell","name":"NVIDIA/OpenShell: a policy runtime for agent fleets","description":"OpenShell is an Apache-2.0 runtime that puts each agent in a sandbox and enforces a policy on files, system calls, and network connections. Agents do not see real credentials. OpenShell adds them only to requests for approved endpoints, and it uses a formal check to flag a policy change that would grant new access before a person approves it. It runs on Linux, Apple Silicon, and experimental WSL 2. GitHub's daily trending list had it at 1,240 stars today. The repository has 18,661 stars."},{"@type":"ListItem","position":13,"url":"https://github.com/pbakaus/impeccable","name":"pbakaus/impeccable: design rules a coding agent can run locally","description":"Impeccable is an Apache-2.0 design skill for coding agents: one install, 24 commands, and 62 detector rules for common tells in AI-generated interface code. The deterministic rules run in the CLI and a browser extension with no model and no API key. Setup starts with `npx impeccable install`, then `/impeccable init`, which writes a PRODUCT.md the later commands read. GitHub's daily Rust trending list had it at 533 stars today. The repository has 85,456 stars."}]}}]}</script>
