  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-05.html#webpage","name":"The Daily Intelligence — 2026-11-05","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-05.html","description":"Uber's Halloween week covered about 320 million trips and orders. Four rides, and 500 food orders, came from an AI agent. The same day, OpenAI put Images 2.6 in ChatGPT, with looping GIFs and a claim of generations that are 50% faster. Ricursive released a 65-billion-parameter coding model and said the whole project cost $32 million. A booking button, an image setting, and a weight file are the parts a person can actually use.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-04T19:00:00Z","dateModified":"2026-11-04T23:53:39Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://techcrunch.com/2026/11/04/almost-no-one-uses-ai-agents-to-book-their-uber-company-says/","name":"Uber's busiest week: four rides booked by an AI agent, and 500 food orders","description":"TechCrunch reports that on Uber's third-quarter earnings call on 4 November, the company said only four rides were ordered through an AI agent during its busiest week in October, the week of Halloween. Chief financial officer Balaji Krishnamurthy said that week covered about 320 million trips and orders across Uber and Uber Eats, and that 500 Uber Eats orders were placed by an AI agent. Chief executive Dara Khosrowshahi called the traction very early and very limited, and said he hopes it grows. He also said booking a ride takes about 50 seconds in the Uber app, and reordering a favourite food takes about 90 seconds."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/introducing-images-2-6/","name":"Images 2.6 is in ChatGPT today. It makes GIFs, and OpenAI says it is 50% faster","description":"On 4 November, OpenAI released Images 2.6 in ChatGPT, Codex, and the API, on every subscription tier, on desktop, mobile, and the web. OpenAI says people already create 4 billion images a week across those surfaces, and that Images 2.6 generates images 50% faster than before. The new motion format is a GIF: a brand character, a reaction, or a short storyboard loop. In the API, GPT-Image-2.6 Flare and Sunburst are the two choices. At low quality, OpenAI says Flare can finish in as little as six seconds. Sunburst is the higher-detail option, at medium or high quality, and OpenAI says it holds characters and products more steadily across edits. Image markup, already in ChatGPT, comes to the API, along with SVG export and a complexity setting that changes how much planning the model does."},{"@type":"ListItem","position":3,"url":"https://www.conductor.build/announcement","name":"Conductor is joining Meta. The cloud product goes read-only on 13 November","description":"Conductor, the Mac app for running a team of coding agents, said it is joining Meta. The company launched in July 2025. From 4 November there are no new sign-ups and no new downloads. Existing free users cannot upgrade. Existing pro users keep pro features for free. Conductor Cloud goes read-only on 13 November: old chats can be read and exported, new messages cannot, and active subscribers get a refund. On 20 November the company begins deleting Conductor Cloud user data. The local app keeps receiving new models and critical bug fixes until early 2027, then starts to wind down. The founders say they hope to have something new to use by then, and that they have not sold or trained on user data."},{"@type":"ListItem","position":4,"url":"https://www.ricursive.com/ripple","name":"Ricursive released Ripple-65B Preview, and says the project cost $32 million","description":"Ricursive Intelligence released Ripple-65B Preview, a general-purpose version of the dense model it says powers its chip-design platform. It was pretrained on 12 trillion tokens, with a context length of up to 1 million tokens. Ricursive says it scores 80.52 on TerminalBench 2.1, which it calls a new U.S. open-weight mark, ahead of Reflection Beam 501B at 80.1, Meta Muse Spark Open 816B at 76.4, Thinking Machines Inkling 975B at 63.8, and NVIDIA Nemotron 3 Ultra 550B at 56.4. It says the full research cost, from a blank start through the final training run, was $32 million, and that this is about one-tenth the cost of the previous open-weight leader, estimated from public reports rather than an invoice. It also says the reinforcement-learning climb used 1.4 million rollouts, about 70 times fewer than Reflection Beam. The weights are on Hugging Face, and the post lists Together AI, GMI Cloud, and OpenRouter as serving it, with Fireworks due later on release day. It chose a dense model, not a mixture of experts, and says the smaller size is meant to run on devices such as NVIDIA's DGX Spark."},{"@type":"ListItem","position":5,"url":"https://huggingface.co/moonshotai/Kimi-K3.1-Pro","name":"Kimi K3.1 Pro weights are on Hugging Face. It is a 2.8-trillion-parameter model","description":"Moonshot AI has put Kimi K3.1 Pro weights on Hugging Face. The model card describes a mixture-of-experts model with 2.8 trillion total parameters, 104 billion active, a 1-million-token context, and text plus image input. Weights are MXFP4, activations MXFP8. Moonshot's tech blog, which said the weights would be out by 4 November, also offers Kimi K3.1 Pro Highspeed, at two to three times the speed, on Kimi.ai, Kimi Work, Kimi Code, and the API. On the card, Terminal-Bench 4.0 is 65.7 at maximum effort, run with the Claude Code harness. Moonshot's table puts that ahead of GPT-6 Astra at 58.2 and just behind Claude Opus 5.5 at 66.4. Those comparison numbers are the maximums Moonshot says it took from model posts or the official leaderboard, not a single shared run. The license on the card is Moonshot's own Kimi K3.1 Pro license."},{"@type":"ListItem","position":6,"url":"https://hy.tencent.ai/research/hy4","name":"Tencent released Hy4 on an API. The weights are not out yet","description":"On 4 November, Tencent released Hy4, which it says is the first Hy model it would place among the strongest open-source models. Compared with Hy4 preview, it adds vision, and Tencent says instruction following, long context, long-horizon tasks, and deep research are substantially better. The API is on Tencent Cloud, OpenRouter, and Hy AI Studio. Listed prices per million tokens are $0.042 for cached input, $0.834 for input, and $2.501 for output. Tencent says it plans to open-source the weights, with a system card at that release, and that it is working with vLLM and SGLang. On an internal finance set of 579 tasks, judged by 213 professionals, Tencent ranks Hy4 first among open-weight models at 3.04, against DeepSeek-V4.1-Flash-1017 at 2.97 and both Kimi K3.1 Pro and GLM-5.3 at 2.68. It also says a clear gap remains versus the top closed models, including on its own hard tests for research mathematics, long coding jobs, and visual questions."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/a-thousand-fewer-paths-to-root/","name":"OpenAI says a research run produced 948 local paths to root in Linux","description":"On 4 November, OpenAI said a research pipeline, run in a controlled environment in mid-October, started from 2,308 candidate Linux kernel findings, reproduced 1,724, and produced 948 working local privilege-escalation exploits plus 291 information-leak proofs. The run cost $1,213,430 in API credits, about $1,279 per privilege-escalation exploit. People reviewed the output before reports went to maintainers. OpenAI says it began with critical cases and is working with Linux kernel partners through Patch the Planet. It also says the newer model found more than five times as many novel local privilege escalations as a GPT-5.6 Sol run in July, after three months of hardening in between. It does not say those patches are already in a distribution you can install."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/11/04/duckduckgo-pitches-itself-to-schools-amid-backlash-over-googles-ai-policy/","name":"DuckDuckGo is telling schools they can turn its AI off, and keep search","description":"TechCrunch reports that DuckDuckGo is pitching schools after Google's decision to leave Gemini, Gemini Notebook, and Search off for student accounts until an administrator turns them on, with Search tied to AI features. Founder Gabriel Weinberg pointed schools to DuckDuckGo's deploy documentation and said to get in touch. The company told TechCrunch that Google could turn Search's AI features off for schools if it wanted to. DuckDuckGo is not an AI-free company: it has Duck.ai and an AI search assistant. Unlike the Google setup in dispute, it says those features can be switched off in search and in the browser, and it runs a separate site, noai.duckduckgo.com, where AI-assisted answers, AI images, and AI feature suggestions are off."},{"@type":"ListItem","position":9,"url":"https://surgehq.ai/blog/benchmarking-coding-agent-harnesses","name":"Surge says extra thinking beat the coding-agent harnesses it tested","description":"On 4 November, Surge AI reported a test of coding-agent setups on its sudo L7 benchmark, with the model held at Claude Opus 5.5. Raising vanilla Claude Code from medium thinking effort to xhigh raised the score by 11.3 points, at 3.5 times the cost. Superpowers, a skills plugin, added 2.4 points at about 1.1 times the cost. Claude Code's /goal and /code-review together added 3.3 points at 1.8 times the cost. A Compound Engineering setup cost about eight times vanilla, without a statistically clear gain in this experiment. In one example, a medium-effort run scored 14 out of 100 and cost $0.12; the xhigh run on the same task scored 100 and cost $0.41, because it kept looking and found a second crash the first fix had missed. Surge says this is one model and one set of tasks."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/openai-to-acquire-pierre/","name":"OpenAI will acquire Pierre. The deal is not closed, and the libraries stay open","description":"On 4 November, OpenAI said it will acquire Pierre Computer Company, the maker of Code Storage and of the Trees and Diffs libraries already used in the Codex app. Trees is for moving through a project's files. Diffs is for seeing a change. OpenAI says Pierre's open-source projects will stay open source, and that it will keep contributing. Code Storage customers can keep using the service after closing, while OpenAI works to bring those features into Codex. Closing still needs the usual conditions, including regulatory approval. Until then, the companies remain separate."},{"@type":"ListItem","position":11,"url":"https://github.com/NVIDIA/auto-ontology","name":"NVIDIA/auto-ontology: a semantic layer so an agent query can show its work","description":"NVIDIA Auto Ontology was the top repository on GitHub's daily trending page, with 2,053 stars in that window. It is an Apache-2.0 Python library that builds a semantic layer from database metadata: business terms, checked SQL expressions, and joins, stored in Postgres with pgvector. Agents reach it through MCP, a command line, or an API. The default models in the example environment are NVIDIA NIM endpoints, including Nemotron for chat, embeddings, and reranking. NVIDIA says it is not accepting external pull requests."},{"@type":"ListItem","position":12,"url":"https://github.com/FareedKhan-dev/kimi-k3-in-c","name":"FareedKhan-dev/kimi-k3-in-c: Kimi K3 on a CPU, if the disk can hold 1.56 TB","description":"kimi-k3-in-c was the next unpublished AI repository on GitHub's daily trending page, with 351 stars in that window and about 10,300 in total. It is a portable C99 engine, Apache-2.0, version 1.1.0, with no GPU and no BLAS. The README's table says the checkpoint is 1.56 TB on disk, peak memory was measured at 8.24 GB, and the engine itself is 176 KB. On an 8 GB laptop the same table lists 26.5 seconds per token, because the model streams off disk. At 128 GB or more, it lists 5.6 seconds per token. The output is claimed to be byte-identical across those machines. This is Kimi K3, not the K3.1 Pro weights released this week."},{"@type":"ListItem","position":13,"url":"https://github.com/max-sixty/worktrunk","name":"max-sixty/worktrunk: a separate checkout for each agent, addressed like a branch","description":"Worktrunk was the next unpublished AI-related repository on GitHub's daily trending page, with 524 stars in that window and about 11,000 in total. It is a command-line tool that treats git worktrees as something you address by branch name. The README's core example, `wt switch -c -x claude feat`, creates the worktree and starts Claude in it. `wt remove` deletes the worktree and the branch. It also documents hooks, generated commit messages, and a merge cleanup flow. A commit landed on 4 November."}]}}]}</script>
