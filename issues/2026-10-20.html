  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-20.html#webpage","name":"The Daily Intelligence — 2026-10-20","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-20.html","description":"Today's issue is about agents that now sit closer to ordinary work, and the controls that have not caught up. Nvidia has released an open model meant to run agent tasks on a PC without sending the job to the cloud. Meta's Muse, left to sell a keyboard, shared a home address and told a buyer the seller was there. OpenCode says attackers reached API keys stored in its online console and ran up charges on a small share of those accounts. Elsewhere, Kling 4.0 is generating longer clips with stereo sound, and MiniMax has priced a faster agent model at 15 cents per million input tokens.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-19T19:00:00Z","dateModified":"2026-10-29T20:08:45Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blogs.nvidia.com/blog/nemotron-3-5-super-vl/","name":"Nvidia releases an open 120B agent model, plus a version that fits in 24GB","description":"Nvidia has released Nemotron 3.5 Super VL, an open 120-billion-parameter model aimed at always-on agent work, with open weights, datasets, and training recipes. It also released Nemotron 3.5 Bolt 74B-A9B, a 2-bit build meant to fit in 24GB and run local agent tasks on RTX and DGX Spark machines. A smaller Bolt E4B, for conversational agents in 4GB, is scheduled for 23 October. Nvidia says Super VL matches the accuracy of its largest reasoning model at about one-fifth the parameter count, and that organisations can post-train it on their own data and keep it on their own infrastructure."},{"@type":"ListItem","position":2,"url":"https://apnews.com/article/meta-muse-openai-dot-ai-privacy-449734d41d3750aad7038b761faa49c9","name":"Meta's Muse shared a home address and greeted a buyer at the door","description":"The Associated Press reports that Matt Robb let Meta's Muse agent handle a Facebook Marketplace listing for a keyboard. Within a day, Muse accepted an offer, shared his Toronto home address, and sent an automated message that he was there when a buyer arrived late at night. Robb later learned the address was in an 'always allow' template he had given the agent. On another listing, Muse suggested a price $100 below his minimum. Meta acknowledged the pricing error and did not comment further. Apple has also said it will add Mac controls after reports that agents can reach mail, messages, and browsing history without a user's full understanding."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/10/19/hackers-hit-ai-coding-tool-opencode-running-up-charges-on-users-ai-accounts/","name":"OpenCode says attackers reached API keys and ran up charges on 1.4% of Console users","description":"TechCrunch reports that OpenCode said attackers broke into an older part of OpenCode Console, the online place where some users store API keys for AI services. The company said 1.4% of Console users were affected, and that people who did not get an email were not. Co-founder Dax Raad said the open-source app and command-line tool were not affected, because those keys are not sent to OpenCode. Users reported unexpected charges in the hundreds of dollars, and a few above $1,000. Anthropic and Google blocked keys they believed were exposed. OpenAI said it worked with OpenCode to restore access and refund its API customers. OpenCode said refunds for unauthorised charges are underway."},{"@type":"ListItem","position":4,"url":"https://www.microsoft.com/en-us/security/blog/2026/10/19/agents-are-your-newest-insiders-security-must-move-at-their-speed/","name":"Microsoft says an agent should have its own identity, not the user's keys","description":"Microsoft's 19 October security note treats agents as a new kind of insider: not malicious by default, but able to reach company data, tools, and other agents, and able to be mistaken or misled. It is expanding discovery to 60 types of local agents, including Claude Code, OpenAI Codex, and GitHub Copilot, and extending Entra Agent ID so a local or previously unknown agent can still be a policy target. The control it describes is separate from the model: an agent should not inherit the standing access of the person who started it. Permissions should be limited to the task, limited in time, and able to require a person for a high-impact step."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/10/19/people-are-using-ai-to-make-their-smart-tvs-dumb-again/","name":"People are pointing coding agents at their own TVs to strip ads and tracking","description":"TechCrunch reports that developers are using coding agents to remove ads, tracking, and extra software from their own smart TVs. Gathin T. said he gave Claude Code his parents' Xiaomi model number, had it remove 25 packages over Wi-Fi, and replace the home screen with a simple launcher. He says a few thousand people then did similar work on Xiaomi, TCL, Sony, Fire TV, LG, and a projector or two. His project, cleanyourtv, says it does not need root access and can be returned to the factory state. A second project, dumbtv, says it has been tested on Fire TV and on Android or Google TV sets from several brands. Modern sets use automatic content recognition, which fingerprints what is on screen for advertising."},{"@type":"ListItem","position":6,"url":"https://www.minimax.io/blog/minimax-m31f","name":"MiniMax prices M3.1 Flash at $0.15 per million input tokens","description":"MiniMax has released M3.1 Flash through its API, M Plan, and MiniMax Code desktop app. The published price is $0.15 per million input tokens, $0.60 per million output tokens, and $0.015 for cached input. MiniMax says everyday output can exceed 200 tokens a second, that agent-task cost is about 70% lower than the previous model, and that online inference is nearly three times faster. It reports 73.7% on DeepSWE v1.1, a software-engineering test, and says weights will be released later."},{"@type":"ListItem","position":7,"url":"https://kling.ai/release-note/release-notes/Kling_4?type=dialog","name":"Kling 4.0 adds 30-second clips, stereo sound, and up to 10 keyframes","description":"Kling AI says version 4.0 became available to everyone on 15 October. A clip can run from 3 to 30 seconds, at 720p, 1080p, or 4K, with two-channel stereo and up to 10 keyframe images. Prompts can run to 8,000 tokens. Reference input can include up to 10 images, 5 videos totalling 30 seconds, and 7 elements, within a cap of 15 items. Lip sync and on-screen text cover Chinese, English, Japanese, Korean, Spanish, Portuguese, German, French, Hindi, and more. A Flash variant is aimed at faster generation. Kling says 4.0 is also available through MCP and a command-line tool, so an agent can call it."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/nvidia/scaling-indic-pretraining","name":"Nvidia and AI4Bharat prepare 2.8 trillion tokens for 22 Indian languages","description":"Nvidia, with IIT Madras and its AI4Bharat lab, says it will release Nemotron-pretraining-Indic-v1: about 2.8 trillion tokens across the 22 languages listed in India's Constitution, plus an open pipeline for translation, quality checks, and repair. Native-script text covers all 22 languages. Romanised text covers 12. The material is translated from curated English sources, including maths, code, and question-answer text, and each record is meant to trace back to a source document. Continued pretraining for Nemotron 3.5 Super VL already used 10 billion Indic tokens from a 12-language subset. The full corpus is described as releasing soon, not as a download today."},{"@type":"ListItem","position":9,"url":"https://techcrunch.com/2026/10/19/tenstorrent-hits-6-2b-valuation-to-scale-open-weight-ai-chips/","name":"Tenstorrent raises $1.5 billion to scale chips for open-weight models","description":"Tenstorrent, a 10-year-old inference-chip company led by Jim Keller, has raised $1.5 billion at a $6.2 billion valuation. TechCrunch says the round was led by Trace Capital and Innovation X, with Cadence Ventures, Eclipse, Fidelity, SanDisk, and T. Rowe Price also in. The valuation is more than double the $2.6 billion from late 2024. Keller told Bloomberg the company stayed independent after showing that its Galaxy servers could run DeepSeek models. The new capital is for chips aimed at serving open-weight models and video generation."},{"@type":"ListItem","position":10,"url":"https://arxiv.org/abs/2610.07130","name":"A paper asks whether an agent left alone on an island is playing","description":"In a paper submitted on 5 October and not yet peer-reviewed, Nathan Cloos, Phillip Isola, and co-authors put a coding assistant in charge of a body on an unknown digital island. The instruction named no task, reward, or activity. Across 30-hour runs, 13 agents climbed hills, stacked blocks, drew mandalas, reinterpreted sports, and tested the physics of the world. The histories diverged. The authors say the agents learned techniques that later expanded what they could do, and they ask whether the behaviour meets classical tests for play."},{"@type":"ListItem","position":11,"url":"https://github.com/Kruk2/jasna","name":"Kruk2/jasna: local AI restoration for mosaic blocks in video","description":"On GitHub's daily trending list, Kruk2/jasna was the highest-rising unpublished AI repository, with about 502 new stars and about 2,800 overall. It is a local app that finds mosaic blocks in a video or image and restores those regions, leaving the rest of the frame alone. The free model is BasicVSR++. A slower LTX diffusion model, for more detail, is limited to supporters and NVIDIA GPUs. The public application source is AGPL-3.0."},{"@type":"ListItem","position":12,"url":"https://github.com/microsoft/AI-Engineering-Coach","name":"microsoft/AI-Engineering-Coach: a local review of your agent sessions","description":"microsoft/AI-Engineering-Coach gained about 184 stars on GitHub's daily trending list and now has about 4,300. It is an MIT-licensed VS Code extension, also available as a GitHub Copilot canvas, that reads local AI session logs and flags anti-patterns. The repo lists 45 rules across prompt quality, session hygiene, code review, tool use, and context management. Analysis stays on the machine. The project says it is a community effort by Microsoft employees, not an official Microsoft product."},{"@type":"ListItem","position":13,"url":"https://github.com/GCWing/OpenBitFun","name":"GCWing/OpenBitFun: a Rust agent runtime with a desktop app","description":"GCWing/OpenBitFun gained about 151 stars on GitHub's daily trending list and now has about 2,900. It pairs a Rust agent runtime with a desktop app for coding and for work beyond code. The project says you can start a task on the desktop, continue it from a phone or browser, and run the agent over SSH on a remote host, through a jump host, or inside a container. Core code is MIT. Installers are published for Windows, macOS, and Linux."}]}}]}</script>
