ent UI, which can compose answers using charts, forms, buttons and interactive diagrams as well as text. Paid tiers use GPT-6 Sol, while Free and Go users receive GPT-6 Luna."},{"@type":"ListItem","position":3,"url":"https://huggingface.co/blog/LiquidAI/open-d1","name":"Liquid AI opens small multimodal decision models for edge devices","description":"Liquid AI has released d1-3B and an experimental d1-omni-600M, open models that make structured decisions in a single forward pass rather than generating prose token by token. The models accept combinations of text, images and audio and are designed for low-latency use on edge hardware."},{"@type":"ListItem","position":4,"url":"https://devblogs.microsoft.com/foundry-on-windows/build-on-winml-oct-7-26/","name":"Windows ML adds experimental GGUF and llama.cpp support","description":"Microsoft has added experimental llama.cpp support to Windows ML, allowing developers to run GGUF models locally through new text-generation APIs and an OpenAI-compatible endpoint. A preview Windows-native runtime also adds finer control over ONNX and GGUF pipelines across CPUs, GPUs and NPUs."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/sharing-ai-progress-in-mathematics","name":"OpenAI publishes hundreds of AI-produced mathematics manuscripts","description":"OpenAI has published a large collection of mathematical results produced by an internal frontier model, including computer-checkable Lean formalizations for many proofs. The release also includes reasoning summaries, attempt statistics and rough compute estimates, with revision and citation protocols hosted in a public repository."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/radisson","name":"Radisson reports stronger booking conversion from its ChatGPT plugin","description":"Radisson says its ChatGPT plugin, built with Accenture, lets travellers compare hotels on maps and continue to direct booking. The company reports that early visit-to-booking conversion was about 1.5 times its organic-search rate during July and August 2026, though the figures are company-reported rather than independently audited."},{"@type":"ListItem","position":7,"url":"https://apnews.com/article/mcdonalds-ai-pricing-lawsuit-competition-franchisees-bb78e854b11b54b394603effa7550bbe","name":"McDonald’s faces a lawsuit over AI-assisted pricing guidance","description":"A proposed US class action alleges that McDonald’s AI-enhanced pricing tool and related franchise rules reduce competition among independently owned restaurants. McDonald’s says the system provides recommendations and context, while franchisees retain control of their menu prices."},{"@type":"ListItem","position":8,"url":"https://smartbuildlabs.com/apps/smart-blur/","name":"Smart Blur uses local AI to hide personal data during screen sharing","description":"Smart Blur is a browser extension that detects and obscures emails, phone numbers, card details, names and addresses before they appear in a screen share or screenshot. Its AI processing runs locally through WebGPU, and the free tier covers pattern detection and manual blur controls."},{"@type":"ListItem","position":9,"url":"https://panolayer.com","name":"Panolayer adds deterministic code maps around coding agents","description":"Panolayer has opened a macOS public beta that maps a codebase from source, runs coding agents in separate Git worktrees and checks changes against functions, callers and documented expectations. It supports a range of existing coding agents and keeps its code index local unless the user chooses to sync or share it."},{"@type":"ListItem","position":10,"url":"https://agentpicks.io","name":"Agent Picks tests which developer tools coding agents actually choose","description":"Agent Picks runs neutral developer requests across five coding models in isolated computers, then records which vendor each agent selects, installs and uses. Tool makers can edit the generated requests before a run and inspect the session evidence behind each choice."},{"@type":"ListItem","position":11,"url":"https://github.com/garrytan/gbrain","name":"garrytan/gbrain: an opinionated operating layer for personal agents","description":"Gbrain packages skills, recipes, evaluations and supporting tools for running a structured personal agent setup with OpenClaw or Hermes Agent. The active TypeScript project has more than 30,000 GitHub stars and frequent releases."},{"@type":"ListItem","position":12,"url":"https://github.com/google-gemma/cookbook","name":"google-gemma/cookbook: practical examples for Google’s open models","description":"The Gemma Cookbook collects tested notebooks, full applications, experiments and responsible-AI examples for Google’s Gemma family. The repository has more than 4,000 stars and received new tutorial notebooks this week."},{"@type":"ListItem","position":13,"url":"https://github.com/vercel/eve","name":"vercel/eve: an open framework for building and deploying agents","description":"Eve is Vercel’s open TypeScript framework for building agents with tools, workflows, sandboxes and web-chat deployment. The beta project has more than 5,000 stars and remains under active development."}]}}]}</script>
