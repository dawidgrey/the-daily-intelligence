  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-23.html#webpage","name":"The Daily Intelligence — 2026-09-23","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-23.html","description":"Today’s strongest signals are not just higher benchmark scores. New flagship models compete on price and efficiency, local model tooling becomes easier to use, and researchers are asking harder questions about evaluation, labour effects, privacy and what model internals may contain.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-22T20:00:00Z","dateModified":"2026-09-26T20:03:11Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/claude-opus-5-5","name":"Claude Opus 5.5 targets long agent tasks at 40% lower cost","description":"Anthropic has released Claude Opus 5.5, reporting performance near Claude Fable 5.1 on most work, more than 30% faster output and roughly 40% lower typical workload cost than Opus 5. The model also adds stronger prompt-injection resistance, broader long-task evaluations and lower cache-read pricing."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/introducing-gpt-6-sol-and-luna","name":"OpenAI halves API prices for GPT-6 Sol and Luna","description":"OpenAI has launched GPT-6 Sol and GPT-6 Luna as faster, lower-cost companions to GPT-6 Astra, cutting their API prices by 50% from the GPT-5.6 promotional rates. Both are available in the API and selected ChatGPT Work and Codex plans, with Luna also reaching Free and Go users in the desktop app."},{"@type":"ListItem","position":3,"url":"https://huggingface.co/blog/transformers-llama-cpp-quants","name":"Transformers can now run llama.cpp-style GGUF models directly","description":"Hugging Face is adding direct GGUF support to Transformers, initially optimised for Qwen3.5 on Apple Silicon using llama.cpp’s underlying ggml kernels. Developers can load a quantised Hub checkpoint through the familiar Transformers API or serve it behind an OpenAI-compatible endpoint."},{"@type":"ListItem","position":4,"url":"https://huggingface.co/blog/evaleval-aisi","name":"UK AISI publishes model evaluations in a reproducible common format","description":"The UK AI Security Institute is using EvalEval’s Evaluation Cards to publish verified methods, configurations and results for five widely used benchmarks across six frontier models, plus two cyber evaluations. The shared format is intended to make expensive model tests easier to inspect, compare and reproduce."},{"@type":"ListItem","position":5,"url":"https://www.reuters.com/business/meta-testing-human-concierge-its-new-personal-ai-agent-muse-2026-09-22/","name":"Meta pauses a human-backed Muse calling test after disclosure concerns","description":"Reuters reports that Meta tested human contractors quietly handling some business calls placed through its Muse assistant, raising internal privacy and disclosure concerns. Meta rolled the feature back for now and says any public release would include proper disclosures and protections."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/priorities-principles-third-party-assessments","name":"OpenAI proposes deeper independent checks of frontier-model safety claims","description":"OpenAI has outlined principles for independent organisations to assess model safety cases, critical safeguards, capability evaluations and monitoring systems across training and deployment. It says effective reviews require meaningful access, assessor independence, scientific rigour, secure handling of sensitive information and clear public communication."},{"@type":"ListItem","position":7,"url":"https://conference.nber.org/conf_papers/f247923.pdf","name":"Study finds weaker hiring flows in work most exposed to adopted AI","description":"A Federal Reserve research paper combining US labour surveys, job openings and measures of AI exposure and adoption finds larger post-LLM declines in job-finding and job-switching rates among highly exposed workers in industries actively adopting AI. The authors estimate a 0.1–0.2 percentage-point rise in the natural unemployment rate, while stressing considerable uncertainty."},{"@type":"ListItem","position":8,"url":"https://arxiv.org/abs/2609.20408","name":"Xeno-interpretability asks whether models use concepts humans cannot name","description":"A new conceptual paper argues that language models may contain stable internal distinctions with no adequate human-language equivalent. It proposes an experimental programme for locating, manipulating and linking these model-native representations to behaviour even when researchers cannot fully describe what they mean."},{"@type":"ListItem","position":9,"url":"https://paradigma.inc/blog/limite-1b-violetto/","name":"Limite 1B targets competition maths with a compact specialist model","description":"Paradigma has released Limite 1B–Violetto, a one-billion-parameter model trained for high-throughput mathematical reasoning, along with evaluations, a value model and a vLLM inference plugin. The company reports strong competition-maths results for its size but openly shows serious failures on ordinary instructions outside the model’s narrow scope."},{"@type":"ListItem","position":10,"url":"https://agent-manager.dev/writing/mouse-support/","name":"Agent Manager adds mouse control without losing terminal behaviour","description":"Agent Manager 0.38.0 adds clicking, double-click focus, scrolling, split resizing, text selection and link opening to its tmux-based interface for multiple agent sessions. Its implementation records the geometry actually drawn on each frame and lets users disable mouse reporting when they prefer native terminal selection."},{"@type":"ListItem","position":11,"url":"https://github.com/dream-num/univer","name":"dream-num/univer: an office-document runtime for AI agents","description":"Univer is a TypeScript office runtime covering spreadsheets, documents, slides, canvas, relational tables and PDFs, with interfaces intended for both people and AI agents. The active project has more than 15,000 stars and gained about 202 stars in today’s GitHub Trending collection."},{"@type":"ListItem","position":12,"url":"https://github.com/superdesigndev/treg","name":"superdesigndev/treg: a routing layer for agent tools","description":"Treg describes itself as an OpenRouter-style layer for agent tools, maintaining a catalogue that agents can discover and route requests through rather than wiring every service separately. The fast-moving Python project has more than 2,000 stars and added about 197 stars in today’s GitHub Trending collection."},{"@type":"ListItem","position":13,"url":"https://github.com/upscayl/upscayl","name":"upscayl/upscayl: local open-source AI image enlargement","description":"Upscayl is a desktop application that uses AI models to enlarge and enhance images locally on Linux, macOS and Windows. The established open-source project has nearly 50,000 stars and gained about 177 stars in today’s GitHub Trending collection."}]}}]}</script>
