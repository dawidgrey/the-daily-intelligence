  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-02.html#webpage","name":"The Daily Intelligence — 2026-08-02","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-02.html","description":"Today’s issue follows AI into mathematics, robotics, video production and brain imaging, while keeping the operational questions in view: how do we verify the result, constrain the workflow and preserve human judgement? It also covers practical changes for creators, developers and security-conscious teams, plus three fast-rising GitHub projects.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-01T20:00:00Z","dateModified":"2026-08-05T20:04:25Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/ten-advances-in-mathematics","name":"OpenAI says Astra produced ten new results on longstanding mathematics problems","description":"OpenAI published ten claimed advances across geometry, coding theory, complexity, group theory and other fields, saying the core arguments were generated by an internal version of its next major model, Astra. Humans prepared the manuscripts with the model, and OpenAI released Lean certificates and reasoning walkthroughs for scrutiny."},{"@type":"ListItem","position":2,"url":"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/","name":"Gemini Robotics 2 adds whole-body control, dexterity and robot teamwork","description":"Google DeepMind introduced a three-model Gemini Robotics 2 family for whole-body control, embodied reasoning and local on-device operation. Demonstrations span humanoid movement, two-handed manipulation and teams of robots, although published results show that several multi-finger tasks remain difficult."},{"@type":"ListItem","position":3,"url":"https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5","name":"Seedance 2.5 generates 30-second video-and-audio scenes in one pass","description":"ByteDance launched Seedance 2.5 with single-pass clips of up to 30 seconds, multiple extensions and joint video-and-audio generation. It accepts as many as 30 images, 10 videos and 10 audio clips as references, and adds timestamp-level editing and stronger continuity across shots."},{"@type":"ListItem","position":4,"url":"https://supabase.com/blog/introducing-supabase-evals","name":"Supabase open-sources real-environment evaluations for coding agents","description":"Supabase released the benchmark and regression framework it uses to test Claude Code, Codex and OpenCode on tasks such as schema creation, Edge Function debugging and row-level security fixes. Scenarios run against containerised Supabase environments and combine deterministic checks with semantic grading."},{"@type":"ListItem","position":5,"url":"https://blog.ai.princeton.edu/2026/07/31/reading-minds-almost-scientists-just-reconstructed-what-someone-sees-from-their-brain/","name":"Princeton researchers reconstruct viewed images from fMRI in about 15 seconds","description":"A Princeton-led study used personalised fMRI training data and generative models to reconstruct rough versions of images a participant was viewing. Its fastest configuration produced recognisable semantic approximations about 15 seconds after viewing, rather than photographic copies."},{"@type":"ListItem","position":6,"url":"https://newsroom.snap.com/rewarding-authentic-creativity-on-spotlight","name":"Snapchat removes wholly AI-generated videos from Spotlight recommendations","description":"Snap says wholly AI-generated videos are no longer eligible for recommendation on Spotlight as it shifts discovery toward human-made work. AI-assisted edits made with Snapchat tools can remain eligible when accompanied by transparency indicators."},{"@type":"ListItem","position":7,"url":"https://www.justiz.bayern.de/gerichte-und-behoerden/landgericht/muenchen-1/presse/2026/16.php","name":"Munich court holds Suno liable for memorised songs in training and outputs","description":"A Munich court largely upheld GEMA’s claims against Suno over six songs, finding protected works reproducibly present in model versions 3.5 and 4 and recognisable in generated outputs. It rejected German text-and-data-mining protection and a US fair-use defence in this case, and assigned responsibility to Suno rather than users; the ruling is not final."},{"@type":"ListItem","position":8,"url":"https://www.tomzahavy.com/files/llms-cant-jump.pdf","name":"A position paper argues language models still lack science’s abductive leap","description":"Google DeepMind researcher Tom Zahavy argues that language models are increasingly capable at induction and deduction but lack the abductive step that forms new explanatory hypotheses. Using Einstein’s development of general relativity as a case study, the paper proposes physically consistent multimodal world models as a possible bridge."},{"@type":"ListItem","position":9,"url":"https://scottspence.com/posts/how-i-stop-llms-drifting-in-production-codebases","name":"Production guardrails turn coding-agent mistakes into visible failures","description":"Engineering lead Scott Spence describes controlling coding-agent drift with repository-level checks, architecture rules, documentation retrieval, tool-call blockers and mandatory validation before handoff. Across 350 sessions in one production codebase, the checks repeatedly caught boundary violations and other copied shortcuts."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/disrupting-malicious-uses-of-ai-criminal-scam-operation","name":"OpenAI details how a scam network used ChatGPT across several fraud schemes","description":"OpenAI says it banned a coordinated Cambodia-linked account network that used ChatGPT for fake personas, translations, forged-document imagery and the administration of romance, investment, gambling and law-enforcement impersonation scams. It shared indicators with partners and authorities after a lead from WhatsApp."},{"@type":"ListItem","position":11,"url":"https://github.com/zhaoxuya520/reverse-skill","name":"zhaoxuya520/reverse-skill: An agent skill router for authorised security work","description":"Reverse-skill packages routing, tool bootstrapping and reusable procedures for reverse engineering, CTFs and authorised penetration testing across coding agents including Claude Code, Kiro, Cursor and Cline. It led the AI-related repositories found on GitHub’s daily Trending page with about 11,700 total stars and 1,360 stars added that day."},{"@type":"ListItem","position":12,"url":"https://github.com/github/copilot-sdk","name":"github/copilot-sdk: Embed the Copilot agent in applications and services","description":"GitHub’s multi-platform Copilot SDK exposes agent sessions, tools, hooks, MCP integrations and custom agents for applications and services. The project had about 10,300 total stars and added roughly 145 stars on GitHub’s daily Trending page when reviewed."},{"@type":"ListItem","position":13,"url":"https://github.com/rohitg00/agentmemory","name":"rohitg00/agentmemory: Persistent memory across coding-agent sessions","description":"Agentmemory provides a local-first memory layer, plugins, hooks and MCP tools intended to carry useful context across sessions in multiple coding agents. It had about 26,300 total stars and added roughly 120 stars in the GitHub Trending language feeds collected for today’s review."}]}}]}</script>
