  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-12.html#webpage","name":"The Daily Intelligence — 2026-09-12","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-12.html","description":"Today’s issue follows AI into the less glamorous work that makes it useful: reliable storage, trusted data, coordinated agents, human review and tools that fit real hardware. The common thread is simple: capability matters, but the surrounding system decides whether it helps.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-11T20:00:00Z","dateModified":"2026-09-26T20:03:11Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/scaling-storage-one-billion-users-part-one","name":"OpenAI explains the storage platform serving more than one billion weekly users","description":"OpenAI says its Habitat storage platform now handles more than 70 million requests per second and over 500 petabytes of data across almost 40 regions. The company also reports that two engineers, assisted by Codex and GPT-5.5, rewrote the service from Python to Rust, improving CPU and memory efficiency."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/introducing-chatgpt-financial-services","name":"ChatGPT for Financial Services bundles premium data with traceable analysis","description":"OpenAI has introduced a financial-services edition of ChatGPT Work with built-in datasets from providers including Daloopa, PitchBook, LSEG News and Crunchbase. It is designed for research, financial modelling and client materials, with citations that point users back to supporting tables and passages."},{"@type":"ListItem","position":3,"url":"https://www.reuters.com/legal/litigation/anthropic-disrupts-russian-chinese-ai-campaigns-targeting-its-claude-models-2026-09-10/","name":"Anthropic reports AI misuse spanning cyberattacks, weapons work and model extraction","description":"Reuters reports that Anthropic disrupted attempts to use Claude in suspected cyber-espionage, weapons development and biological research. Anthropic also alleged that several China-based AI labs used fraudulent access and large-scale exchanges to extract capabilities from Claude; the named companies did not immediately respond to Reuters."},{"@type":"ListItem","position":4,"url":"https://www.rnz.co.nz/news/world/1349763/judges-mock-lawyer-who-filed-appeal-full-of-ai-generated-witnesses","name":"A lawyer is fined after an AI-assisted appeal invented witnesses and testimony","description":"New Mexico’s highest court fined a defence lawyer US$5,000 and held him in contempt after an appeal included testimony and witnesses fabricated by ChatGPT. The lawyer said he had used the system to summarise trial material and failed to understand how severely it could hallucinate facts."},{"@type":"ListItem","position":5,"url":"https://www.starburst.io/blog/an-analysis-of-two-architectures-for-agentic-data-analysis/","name":"Two architectures for letting agents analyse business data","description":"Database researcher Daniel Abadi compares giving an agent direct access to separate databases with putting a data-virtualisation layer between the agent and those systems. He argues that the intermediate layer can improve cross-source joins, governance and efficiency, while adding upfront cost and complexity."},{"@type":"ListItem","position":6,"url":"https://hungrygpu.com","name":"HungryGPU maps local AI models and patches to the hardware that can run them","description":"HungryGPU is a searchable catalogue of open models, community setups, performance measurements, hardware-specific patches and relevant papers. It labels estimates separately from measured runs and exposes its catalogue through MCP without requiring an account."},{"@type":"ListItem","position":7,"url":"https://arslan.io/2026/09/11/how-i-manage-my-agents/","name":"A practical workflow for coordinating fleets of coding agents","description":"Fatih Arslan describes a Git-based planning system that moves work through drafts, ready plans, active execution, completion and discard states. Long-running coordinator agents dispatch isolated workers, while human-readable Markdown files preserve decisions, dependencies, handoffs and verification steps."},{"@type":"ListItem","position":8,"url":"https://tskulbru.dev/posts/beads-local-shadow-for-agent-work/","name":"A shared local notebook helps parallel agents remember dependencies and decisions","description":"Thomas Skulbru explains using a private, agent-writable work graph beside GitHub to track blocked tasks, session context and in-flight decisions across many parallel conversations. GitHub remains the public source of truth for committed work, while the local layer carries temporary operational context."},{"@type":"ListItem","position":9,"url":"https://www.onorca.dev","name":"Orca brings multiple coding agents, worktrees and review into one environment","description":"Orca is an open-source agent development environment for running coding-agent CLIs in parallel, with each task isolated in a Git worktree. It combines terminals, diffs, browser tools, remote machines and mobile monitoring while allowing users to bring existing agent subscriptions."},{"@type":"ListItem","position":10,"url":"https://fazamhd.com/mental-models/llm/","name":"An interactive guide separates the language model from the software around it","description":"This extensive interactive guide explains language models through three layers: the learned predictor, the token-generation loop and the surrounding product system. It traces tokenisation, embeddings, attention, sampling, training and tool use while distinguishing model behaviour from application behaviour."},{"@type":"ListItem","position":11,"url":"https://github.com/k2-fsa/OmniVoice","name":"OmniVoice offers multilingual voice cloning and text-to-speech","description":"OmniVoice is an Apache-2.0 voice-cloning and text-to-speech project covering more than 600 languages. The repository includes inference, training and optional LoRA fine-tuning support and had about 12,200 stars when reviewed."},{"@type":"ListItem","position":12,"url":"https://github.com/D4Vinci/Scrapling","name":"Scrapling combines adaptive web extraction with crawling and MCP support","description":"Scrapling is a BSD-licensed Python framework for requests, browser-backed extraction and larger crawls, with adaptive selectors and an MCP server for agent workflows. The repository had about 80,300 stars when reviewed and remains actively maintained."},{"@type":"ListItem","position":13,"url":"https://github.com/jihe520/MathModelAgent","name":"MathModelAgent automates a full mathematical-modelling workflow","description":"MathModelAgent coordinates specialised agents to work through mathematical-modelling tasks and produce analysis, charts and a paper-style report. The repository supports multiple model providers, includes a web interface and had about 4,800 stars when reviewed."}]}}]}</script>
