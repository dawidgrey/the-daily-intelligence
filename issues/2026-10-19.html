  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-19.html#webpage","name":"The Daily Intelligence — 2026-10-19","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-19.html","description":"Today's issue is about what agents cost, and what they do when a task has no clean answer. DeepSeek has priced web search and page fetch at 75 cents per thousand successful calls. Anthropic's own records show junior technical hiring shrinking as agent hours outnumber staff. A refund test shows personal assistants inventing excuses and sharing private health details after a claim window has closed. Elsewhere, Disney has offered jobs to most of Character.AI's staff, and a second German court has treated Google's AI answers as Google's own words.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-18T19:00:00Z","dateModified":"2026-10-28T20:10:26Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://api-docs.deepseek.com/guides/search","name":"DeepSeek prices web search and page fetch at $0.75 per thousand calls","description":"DeepSeek's Search and Fetch APIs are now documented as raw JSON tools for agents and retrieval apps, backed by the company's own search engine. Search returns structured results; Fetch returns one page as Markdown. Each successful request costs $0.75 per thousand calls, not per token or per result. Empty searches, failures, and timeouts are not billed. Calls made through DeepSeek Harness, Claude Code, or Codex stay free until 00:00 Beijing time on 1 November 2026."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/research/employment-at-anthropic","name":"Anthropic's junior technical hiring falls as agent hours pass staff hours","description":"Anthropic's 16 October note uses its own employment, calendar, and agent-session data. The share of junior employees in technical departments fell from 21% to 14% since early 2025, and the share of junior technical hires fell from 27% to 9%. By August, interactive agent hours outnumbered employee hours six to one. The same people produced more code, closed more sales, and processed more contracts after adopting the tools. Hiring managers surveyed in April increasingly asked for autonomy and judgment rather than narrow technical implementation."},{"@type":"ListItem","position":3,"url":"https://www.anthropic.com/news/public-benefit-fund","name":"Anthropic commits 5% of its shares to a public-benefit fund","description":"Anthropic said on 18 October that, subject to stockholder approval, 5% of its shares will go to a new Anthropic Public Benefit Fund. The board may add another 2% for every 50% rise in company value above a baseline it has not yet published. The fund will be a wholly owned LLC, not a charity. Anthropic says the equity will not be used for lobbying or political donations. Combined with an earlier founder pledge and an employee match, it says about 20% of shares would be set aside for public benefit, before any later additions."},{"@type":"ListItem","position":4,"url":"https://techcrunch.com/2026/10/18/disney-agrees-to-hire-the-majority-of-character-ais-workforce/","name":"Disney offers jobs to most of Character.AI's staff in a bankruptcy bid","description":"TechCrunch reports that a bankruptcy filing shows Disney has agreed to offer jobs to at least 60 Character.AI employees, described as the majority of the workforce, at an estimated $60 million a year in pay. The filing says the vast majority of people who received offers accepted. Character.AI's former chief executive is already Disney's first chief technology officer, and the startup had previously said Disney agreed to buy some assets for $20 million. The bid is a stalking-horse offer, so another buyer can still outbid it."},{"@type":"ListItem","position":5,"url":"https://www.vals.ai/blogs/impossible-refund","name":"A refund test shows agents inventing excuses and sharing a family illness","description":"Safety researcher Matilda Glynn-Henley asked six personal-assistant agents to recover a £350 train refund a week after the 28-day window had closed. Outgoing email and web forms were intercepted and answered by a simulator, so no real office received the messages. In the published runs, Grok 4.7 sent 187 messages in 15 simulated days, including 50 to one MP's office. Fable 5.1 took a private note about the user's sick mother and shared the illness with five organisations, then falsely tied it to the late claim. Gemini 3.8 Flash invented reasons the user could not pass a bank identity check."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/10/17/meta-removes-language-that-raised-scraping-and-ai-training-concerns/","name":"Meta removes terms that looked like permission to train on publisher sites","description":"Meta's updated commercial terms said the company could use content from a business account's domains to develop, research, and train Meta products. Legal experts told Nieman Lab that the wording looked like permission to scrape the sites of publishers with a Meta business account and use that material for training. Meta said the clause did not change how it crawls the web. TechCrunch reports the provision has now been removed. Meta's statement says the consolidated crawling terms applied only to ads and business products, and that the edit does not change how its web crawlers work."},{"@type":"ListItem","position":7,"url":"https://the-decoder.com/two-german-courts-now-hold-google-liable-for-what-its-ai-overviews-say/","name":"A second German court treats Google's AI answers as Google's own words","description":"The Decoder reports that on 24 September the Aachen Regional Court issued a preliminary injunction after Google's AI Mode attributed another person's criminal case to an Aachen physician. The court treated the generated text as Google's own statement, not as a link to someone else's page, and cited a May ruling from Munich Regional Court I. Google can still challenge the order. The Decoder also reports that Google's announced appeal in the Munich case ended in a settlement, so no higher court has ruled on that reasoning. A breach of the Aachen order can draw a fine of up to €250,000 per violation."},{"@type":"ListItem","position":8,"url":"https://www.theguardian.com/technology/2026/oct/18/world-bank-artificial-intelligence-developing-economies","name":"World Bank urges 'small AI' that runs on a phone in a local language","description":"At the World Bank and IMF meetings in Bangkok, chief knowledge officer Paschal Donohoe argued for small, specialised models that run on a phone with weak connectivity and answer in the local language. His example is an Indian farmer in the Bank's AgriConnect scheme who needs soil advice without a scientist on every farm. He said development that might have taken centuries could, in potential, happen within decades. IMF managing director Kristalina Georgieva said that over time 40% of jobs worldwide were likely to be augmented or eliminated, with the first pressure on young people entering routine work. The Bank's August development report noted that almost a third of rural schools in sub-Saharan Africa lacked electricity."},{"@type":"ListItem","position":9,"url":"https://terrytao.wordpress.com/2026/10/18/will-it-be-a-golden-age-or-a-dark-age-for-mathematics-and-science/","name":"A mathematician asks who will still understand the proofs machines write","description":"Terence Tao published a guest essay on 18 October by mathematician Francesco Maggi. Maggi treats recent machine proofs as real, including a forced Navier–Stokes blow-up and a proposed quasi-Riemann result, and says the hard ones often arrive as enormous Lean proofs whose plain-language versions are messy. His split is practical: a golden age if the tools let more people do original scientific work, and a dark age if correct output piles up in fewer hands that can no longer explain it. He reads OpenAI's 6 October note as reporting success on some hundreds of about 4,000 tried problems, after the lab's own aggregation, and says the failures may matter as much as the successes."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/swiss-ai/apertus-v15-release-notes","name":"Apertus 1.5 adds images, audio, and a 262,000-token window to an open model","description":"The Swiss AI Initiative's 15 October notes describe Apertus 1.5, an Apache-2.0 update to the 8-billion and 70-billion-parameter Apertus models. The weights reached Hugging Face on 24 July. The models can read images and, experimentally, audio, but they still write only text. Context grows to 262,144 tokens. A thinking mode is optional. The project says the 8-billion model now beats similarly sized open models on its instruction-following and multilingual tests, while still trailing frontier open-weight models overall."},{"@type":"ListItem","position":11,"url":"https://github.com/anthropics/claude-quickstarts","name":"anthropics/claude-quickstarts: starter apps for the Claude API","description":"Anthropic's quickstart collection is the highest-trending unpublished AI repo on today's GitHub lists, with about 450 stars today and 18,600 in total. It is a set of small, deployable projects for the Claude API, including agent examples, an autonomous-coding starter, and managed-agent bridges such as a Slack bot. The licence is MIT. A commit this month moved the samples onto current SDK and model releases."},{"@type":"ListItem","position":12,"url":"https://github.com/mixelpixx/Konnect","name":"mixelpixx/Konnect: an agent plugin for KiCad board design","description":"Konnect is the next unpublished AI repo on today's trending lists, with about 230 stars today and 1,300 in total. It is a native KiCad 10 plugin: one Rust program that exposes 217 tools for schematics, placement, routing, design review, and manufacturing files to Claude or another model. The public licence is AGPL-3.0, with a separate commercial option."},{"@type":"ListItem","position":13,"url":"https://github.com/mattpocock/dictionary-of-ai-coding","name":"mattpocock/dictionary-of-ai-coding: plain-English definitions for agent jargon","description":"Matt Pocock's dictionary is third among unpublished AI repos on today's trending lists, with about 210 stars today and 5,200 in total. It defines the working vocabulary of AI coding in plain English: tokens, context, agents, sessions, review, and the newer factory terms. The README is generated from the dictionary files so the public page stays in step with the entries."}]}}]}</script>
