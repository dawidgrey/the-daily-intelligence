  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-05.html#webpage","name":"The Daily Intelligence — 2026-09-05","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-05.html","description":"Today’s issue follows AI beyond chat: long-running agent workflows, computer-checked mathematics, local memory, engineering tests and live weather forecasts. The practical theme is clear: capability matters, but dependable tools, evidence and operational resilience increasingly decide whether AI is useful.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-04T20:00:00Z","dateModified":"2026-09-05T20:04:45Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://developers.openai.com/api/docs/guides/latest-model","name":"GPT-6 Astra adds asynchronous tools and mid-task steering","description":"OpenAI is rolling GPT-6 Astra out first through its Trusted Access Program, with broader API and ChatGPT access planned in the following days. For developers, the important additions include asynchronous tool calls, mid-turn instructions and reasoning-effort changes that preserve prompt caching."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/research/formalizing-fermats-last-theorem","name":"Claude produces a computer-checked formalization of Fermat’s Last Theorem","description":"Anthropic says a multi-agent Claude system completed the first end-to-end Lean formalization of Fermat’s Last Theorem in 11 days. The 13-million-line result uses 29,500 intermediate theorems and was checked by Lean, with outside mathematician Kevin Buzzard reviewing the proof’s structure."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/introducing-weathernext-3-our-most-advanced-and-accurate-global-weather-ai-model/","name":"WeatherNext 3 brings hourly, higher-resolution forecasts into Google products","description":"Google introduced WeatherNext 3, which combines live satellite observations with other weather data to issue global forecasts every hour at resolutions as fine as five kilometres. It is beginning to power Search, Gemini, Maps and developer data services, with new variables for wind and solar energy planning."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/daybreak-for-frontline-defenders","name":"OpenAI commits $1 billion of cyber-AI support to frontline defenders","description":"OpenAI launched Daybreak for Frontline Defenders, committing $1 billion in subsidized model access, training, technical support and partnerships. Initial priorities include water and power operators, local government, community banks, nonprofits and open-source maintainers with limited security resources."},{"@type":"ListItem","position":5,"url":"https://www.wired.com/story/nobody-is-saying-why-openai-and-anthropic-had-outages-today/","name":"Simultaneous frontier-model outages expose a resilience gap","description":"OpenAI, Anthropic and xAI services experienced overlapping outages on Thursday. OpenAI attributed its disruption to a routing error, xAI cited an outage at its Memphis compute centre, and Anthropic said it had identified and fixed its cause without providing further detail; no shared infrastructure failure was confirmed."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/funes","name":"Funes gives coding agents a local, cross-tool memory","description":"Hugging Face introduced Funes, an open-source memory layer that indexes existing Claude Code, Codex, Pi and Hermes sessions. It performs embedding, hybrid retrieval and reranking locally by default, returns original passages with provenance, and can optionally sync a redacted memory through a private Hugging Face dataset."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/grpo-with-trl-ifstruct","name":"A 100-step fine-tune improves small-model structured output","description":"A public recipe used roughly 500 examples and 100 GRPO training steps to improve a 350-million-parameter Liquid AI model’s IFStruct score from 22.6% to 29.7%. The run targets JSON and schema compliance, fits on a free-tier 16 GB GPU and includes a reproducible notebook."},{"@type":"ListItem","position":8,"url":"https://eebench.org/blog/can-ai-design-circuit-boards-yet/","name":"EEBench tests whether AI-designed circuits survive real constraints","description":"EEBench evaluates AI agents on circuit-design tasks using deterministic builds, SPICE simulations, component tolerances, availability and cost rather than judging whether a schematic merely looks plausible. Its current 13-task benchmark covers simulated analog and digital design, not physical layout or manufacturing."},{"@type":"ListItem","position":9,"url":"https://www.appliedcompute.com/case-studies/turbopuffer","name":"A specialist code-search agent cuts the cost of searching large repositories","description":"Applied Compute and turbopuffer trained a 35-billion-parameter open model to search indexed code across thousands of repositories. Their case study reports frontier-competitive retrieval, nearly three-times lower median latency at large scale and roughly 100-times lower marginal search cost than repeatedly scanning files with a frontier model."},{"@type":"ListItem","position":10,"url":"https://www.vlmrun.com/gateway","name":"VLM Run puts open vision and OCR models behind one API","description":"VLM Run launched a visual-model gateway covering OCR, document-to-Markdown, image and video chat, detection and related tasks through an OpenAI-compatible API and MCP server. Its catalogue lists open-weight models from multiple providers and offers hosted, private-cloud and on-premises deployment options."},{"@type":"ListItem","position":11,"url":"https://github.com/magnitudedev/magnitude","name":"Magnitude runs local models for the agent you already use","description":"Magnitude is an Apache-2.0 local inference server that selects models for available hardware and connects them to agents including Hermes, Codex, Claude Code and OpenCode. The actively updated repository has about 2,300 stars and supports offline operation after models are downloaded."},{"@type":"ListItem","position":12,"url":"https://github.com/radixark/miles","name":"Miles packages large-scale reinforcement learning for LLMs and VLMs","description":"Miles is an Apache-2.0 framework for post-training language and vision-language models with reinforcement learning. The roughly 2,500-star project supports several training and rollout backends, agent environments and distributed deployments, and was being actively updated this week."},{"@type":"ListItem","position":13,"url":"https://github.com/upstash/context7","name":"Context7 supplies current documentation to coding agents","description":"Context7 is an MCP-based service and source repository that gives coding assistants current, version-specific library documentation and examples. The MIT-licensed project has more than 61,000 stars and remains under active development, although some supporting backend components are not included in the public repository."}]}}]}</script>
