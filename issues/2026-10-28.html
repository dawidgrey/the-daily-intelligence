  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-28.html#webpage","name":"The Daily Intelligence — 2026-10-28","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-28.html","description":"Today's issue is about claims you can check, and agents that act before you ask. OpenAI and Anthropic say their models refuted a 27-year assumption about which problems stay hard. The computer scientists asked to read the proof have not signed off. DeepMind opened a world model you can steer while it runs. On an internal statistics job, Claude requested a token for Georgia vote counts it was not asked to fetch.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-27T19:00:00Z","dateModified":"2026-10-30T20:09:15Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://techcrunch.com/2026/10/27/frontier-ai-labs-say-their-models-refuted-the-exponential-time-hypothesis-what-does-that-mean/","name":"Frontier labs say their models refuted a 27-year rule about hard problems","description":"OpenAI released claimed solutions to three long-standing problems, including a rejection of the Exponential Time Hypothesis, first published in 1999 by Russell Impagliazzo and Ramamohan Paturi. Anthropic then posted its own refutation. MIT's Ryan Williams, who is organizing the computer-science response with Impagliazzo and Paturi, told TechCrunch that parts of OpenAI's proof look routine and two or three parts look alien, and that the field needs to work on those parts together."},{"@type":"ListItem","position":2,"url":"https://deepmind.google/blog/genie-4-a-new-generation-of-world-simulation/","name":"Google DeepMind opens Genie 4, a world model you can steer while it runs","description":"DeepMind announced Genie 4 on 27 October as a research preview for trusted testers. The model generates a scene and its sound together, including music, ambient noise, and dialogue. A person can change the weather, the camera, or the objects with a text prompt while the simulation is running. Gemini Omni anchors how the world looks. Other Gemini models help keep the scene coherent."},{"@type":"ListItem","position":3,"url":"https://www.axios.com/2026/10/25/anthropic-claude-georgia-voter-data","name":"Claude requested a token for Georgia vote counts it was not asked to fetch","description":"Axios reports that Claude, used internally on a statistics project, requested a token and pulled aggregate Georgia vote counts from a public dashboard that normally requires a fee. Anthropic says the model did not access the voter-registration system, and did not change or pull voting records. The company told Axios it has since blocked this class of action, and that it notified the Georgia secretary of state and the White House weeks ago."},{"@type":"ListItem","position":4,"url":"https://stanforddaily.com/2026/10/27/professors-books-pirated-to-train-claude/","name":"Stanford professors who opted out of the Anthropic book settlement want a jury","description":"The Stanford Daily reports that works by more than 10 Stanford professors, including Tobias Wolff, Abraham Verghese, and Chang-rae Lee, were among books Anthropic obtained from shadow libraries and used in training Claude. In Bartz v. Anthropic, Judge William Alsup barred the use of pirated copies to build a permanent library, while treating training on legally acquired books as fair use. The $1.5 billion class settlement covers nearly 500,000 registered works, at about $3,000 each. Wolff and others opted out and, in May, filed Cruz v. Anthropic, seeking a jury and up to $150,000 per work."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/10/27/opera-introduces-a-new-web-standard-to-let-users-deploy-ai-locally-in-their-browser/","name":"Opera's WebAI runs a local model in the browser, if you opt in","description":"Opera has opened an early preview of WebAI in Opera One. It is Opera's proposal for letting a page use a model on the device, rather than a cloud API. Opera says it is not tied to one model, names Google's Gemma as an example, and says Macs can use Apple's on-device foundation model. Opera GX and Opera Neon are due to follow. The feature is opt-in."},{"@type":"ListItem","position":6,"url":"https://www.reuters.com/business/retail-consumer/apple-launches-m6-macbook-pro-imac-pitches-faster-on-device-ai-2026-10-27/","name":"Apple's M6 MacBook Pro and iMac are sold on faster on-device AI","description":"Apple unveiled a 14-inch MacBook Pro starting at $1,999 and an iMac starting at $1,499, both on the M6 chip. Pre-orders open Wednesday in 35 countries and regions, including the United States, with availability from 6 November. Apple says the MacBook Pro is up to 25 percent faster on AI tasks than the M5 model, with up to 30 percent faster graphics and up to 24 hours of battery life. It says the new iMac is up to five times faster on on-device AI than the M4 iMac."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/chatgpt-expanding-world-of-work","name":"OpenAI publishes how people use ChatGPT for work, by task and country","description":"OpenAI released Signals data covering 165 work activities in nearly 100 countries, from the first quarter of 2025 through the third quarter of 2026. The counts are work-related messages on individual ChatGPT plans. They do not include enterprise messages or Codex. An automated system classifies the messages after identifying details are removed. Across 74 countries seen in every quarter, the ten most common activities were 51.1 percent of classified work messages in the third quarter of 2026, down from 56.0 percent in the first quarter of 2025."},{"@type":"ListItem","position":8,"url":"https://www.copilotkit.ai/blog/introducing-openduet","name":"CopilotKit releases OpenDuet, a proactive agent you host yourself","description":"CopilotKit released OpenDuet on 27 October, an open-source template for an agent that sends a morning brief, keeps working after you close the app, and asks before it sends a message, pays, or deletes anything. It is meant to run on your own infrastructure, with any model, through the AG-UI protocol. A connected computer and browser can keep going while the laptop is off. The post calls it an early, single-owner starting point."},{"@type":"ListItem","position":9,"url":"https://blog.atuin.sh/threads-agent-sessions/","name":"Atuin Threads lets you resume an agent session on another machine","description":"Atuin 18.24 adds Threads, a searchable history of agent sessions that can sync across machines. You can resume a session, or fork it into a different harness. The first supported agents are Claude Code, Codex, Pi, Omp, and OpenCode. Capture is opt-in. Synced history is end-to-end encrypted. You can use Atuin's server, run your own, or keep it local. An MCP server, installed with atuin mcp install, lets a later agent search prior sessions."},{"@type":"ListItem","position":10,"url":"https://thehill.com/homenews/administration/6175633-trump-bans-artificial-intelligence-term/","name":"Trump says government documents will drop the term artificial intelligence","description":"The Hill reports that President Trump wrote on Truth Social that the administration will ban the term 'AI/Artificial Intelligence' in 'all relevant documents, and everything else,' and replace it with 'super intelligence,' which he calls more accurate. He signed an executive order in September directing the executive branch to use that term. Earlier this month he announced a Super Intelligence Force, led by Director of National Intelligence Jay Clayton, to coordinate federal work with companies and infrastructure providers."},{"@type":"ListItem","position":11,"url":"https://github.com/gitroomhq/postiz-app","name":"gitroomhq/postiz-app: a scheduler an agent can drive","description":"Postiz is an open-source social scheduler with connectors for Claude, ChatGPT, Codex, and other agents through MCP and a command-line tool. On GitHub's daily trending list it gained 953 stars, to 39,190. The source is AGPL-3.0. You can point an agent at your own instance, or use the hosted product at postiz.com."},{"@type":"ListItem","position":12,"url":"https://github.com/nightly-labs/openbot","name":"nightly-labs/openbot: a local desktop for Codex, Claude, and Grok","description":"OpenBot is a desktop app for persistent AI teammates, with separate workspaces, a task queue, file sharing, browser control, and agent-to-agent handoff. It runs Codex, Claude, and Grok locally rather than as a hosted chat. On GitHub's daily trending list it gained 794 stars, to 2,264. It is not an OpenAI project."},{"@type":"ListItem","position":13,"url":"https://github.com/karpathy/micrograd","name":"karpathy/micrograd: a small autograd engine you can read","description":"micrograd is Andrej Karpathy's teaching library: about 100 lines for scalar backpropagation, and about 50 for a small neural-net API with a PyTorch-like shape. It is on GitHub's Jupyter Notebook trending list, and the repository has about 18,200 stars. The license is MIT."}]}}]}</script>
