  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-29.html#webpage","name":"The Daily Intelligence — 2026-08-29","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-29.html","description":"Today’s issue follows AI agents into the systems that make them useful: faster infrastructure, specialist models, safer training, scientific discovery and practical workflows. It also looks at the legal and labour-market signals shaping where these tools go next.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-28T20:00:00Z","dateModified":"2026-08-29T20:05:38Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.reuters.com/legal/government/us-judge-blocks-pentagons-anthropic-blacklisting-2026-08-28/","name":"US judge blocks the Pentagon’s Anthropic blacklist","description":"A US federal judge blocked the Pentagon’s designation of Anthropic as a national-security supply-chain risk, calling the decision illegal and baseless. A separate case over another designation that could affect civilian government contracts remains pending."},{"@type":"ListItem","position":2,"url":"https://arxiv.org/abs/2608.23691","name":"Uncoordinated AI agents report new results on five mathematics problems","description":"Researchers placed agents from different model families in an open-ended shared environment where they chose directions, ran experiments and built a common literature without a central coordinator. The paper reports results novel relative to prior literature on five of 12 construction problems and releases dialogues, proofs and verification code."},{"@type":"ListItem","position":3,"url":"https://handbook.sutro.sh","name":"A new handbook treats analytical AI as a measurable data workflow","description":"The Analytical AI Handbook lays out patterns for using models to classify, extract, score, normalize and judge information at scale. It emphasizes ground-truth datasets, evaluations, consistency, smaller adequate models and batch processing over defaulting to the largest model."},{"@type":"ListItem","position":4,"url":"https://help.openai.com/en/articles/20001499-luna-reserve-in-codex-and-chatgpt-work","name":"OpenAI introduces a limited Luna fallback after regular usage runs out","description":"OpenAI says selected personal Plus and Pro accounts can continue some Codex or ChatGPT Work conversations with GPT-5.6 Luna after exhausting regular usage. Luna Reserve has a separate finite allowance, does not add API credits and is not available to every account or to Business and Enterprise workspaces."},{"@type":"ListItem","position":5,"url":"https://blogs.nvidia.com/blog/vera-cpu-delivery/","name":"NVIDIA begins shipping Vera CPUs built around agent workloads","description":"NVIDIA says its first custom CPU, Vera, is now shipping to cloud providers and major AI labs, with AWS receiving an initial server and Vera Rubin GPU. The company positions Vera’s 88 cores and high memory bandwidth for agent sandboxes, tool calls, retrieval and orchestration workloads that accompany GPU inference."},{"@type":"ListItem","position":6,"url":"https://hy.tencent.ai/research/hy4-preview","name":"Tencent previews Hy4, a 770B-parameter open model with a 1M-token context","description":"Tencent released Hy4 preview, a mixture-of-experts model with 770 billion total parameters, 49 billion active parameters and a one-million-token context window. The company targets long-horizon coding, multi-file office analysis, game development and scientific research, with access through cloud and open-model platforms."},{"@type":"ListItem","position":7,"url":"https://alignment.anthropic.com/2026/automated-alignment-researchers/","name":"Automated researchers reduce ten measured AI alignment failures","description":"Anthropic-affiliated researchers used automated alignment researchers to propose training methods and data for ten measurable failures including deception, sycophancy and jailbreak compliance. Their strongest methods improved targeted safety benchmarks while largely preserving capability and generalized to held-out tests, behavioural audits and larger models."},{"@type":"ListItem","position":8,"url":"https://www.daily.co/blog/announcing-pipecat-phonellm-alpha-1/","name":"Pipecat releases an open-weight model tuned for low-latency phone agents","description":"PhoneLLM Alpha 1 is an open-weight, BSD-licensed fine-tune of NVIDIA’s Nemotron 3 Nano with 3.5 billion active parameters. Pipecat trained it for responsive multi-turn calls and accurate tool use, and released PhoneBench to evaluate accuracy, speaking style, latency, cost and whether an agent’s actions match its words."},{"@type":"ListItem","position":9,"url":"https://openai.com/index/supporting-next-generation-ai-startups-thailand","name":"OpenAI and Thailand launch an accelerator for health and education startups","description":"OpenAI and Thailand’s Ministry of Higher Education, Science, Research and Innovation are running an eight-week program for ten health, wellness and education startups. Teams receive mentoring, technical guidance and API credits, with milestones tied to working products, representative-user evidence and deployment plans."},{"@type":"ListItem","position":10,"url":"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7330818","name":"Study links higher AI exposure with a larger education wage premium","description":"An observational study combining US labour data from 2015–2025 with an occupational AI-exposure index finds the clearest post-2023 association in returns to education rather than experience. Among knowledge workers, the estimated college-premium difference between high- and low-AI occupations rose to about 14.7% by 2025, while earnings results were not consistently significant."},{"@type":"ListItem","position":11,"url":"https://github.com/abi/screenshot-to-code","name":"abi/screenshot-to-code: turn interface images into editable web code","description":"This popular open-source project converts screenshots, mockups and videos into implementations using HTML, Tailwind, React or Vue, with support for multiple model providers. Its workflow is aimed at quickly recreating a visual starting point rather than replacing review of accessibility, behaviour and maintainability."},{"@type":"ListItem","position":12,"url":"https://github.com/cursor/plugins","name":"cursor/plugins: the official specification and catalog for Cursor extensions","description":"Cursor’s repository defines its plugin format and collects official plugins that add skills, commands, agents, hooks and MCP integrations. Recent work includes broader agent compatibility and connectors for services such as Outlook, Outlook Calendar and OneDrive."},{"@type":"ListItem","position":13,"url":"https://github.com/abhigyanpatwari/GitNexus","name":"abhigyanpatwari/GitNexus: map a codebase into a local knowledge graph","description":"GitNexus analyzes a repository or ZIP into an interactive knowledge graph and provides a Graph RAG agent for exploring relationships in the code. Its browser-based approach is designed to work without a separate server and supports repositories from major hosting services or local files."}]}}]}</script>
