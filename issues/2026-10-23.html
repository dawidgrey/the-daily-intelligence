  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-23.html#webpage","name":"The Daily Intelligence — 2026-10-23","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-23.html","description":"Today's issue is about the plumbing around agents, not a new chatbot. Anthropic is handing its skill format to a shared foundation. 1Password will fill a login without giving the password to the agent. Major US banks are starting to block agents that sign in with a customer's own credentials. Google has built a separate microVM for each Gemini agent, and is opening that design later. OpenAI's Decisions API is now generally available for the small choices an app makes thousands of times a day.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-22T19:00:00Z","dateModified":"2026-10-24T20:08:56Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/news/donating-agent-skills-to-the-agentic-ai-foundation","name":"Anthropic donates Agent Skills to the Agentic AI Foundation","description":"Anthropic is donating Agent Skills, the folder-and-SKILL.md format it published as an open standard in December 2025, to the Agentic AI Foundation under the Linux Foundation. That is the same foundation Anthropic, Block, and OpenAI set up for the Model Context Protocol. Anthropic says more than 70 platforms, including ChatGPT, Cursor, GitHub Copilot, and VS Code, have integrated the format, and that 1 million skills have been published and nearly 280 million installed. The donation covers the name, logo, GitHub organization, and agentskills.io domain. People can keep using and contributing without joining the foundation."},{"@type":"ListItem","position":2,"url":"https://1password.com/press/2026/october/1password-for-agents-trust-layer-personal-ai-agents","name":"1Password will fill a login without showing the password to the agent","description":"1Password has announced 1Password for Agents, a way for a personal agent to sign in without receiving or storing the password. When an agent reaches a sign-in form, it proves its identity to 1Password with a unique digital key. The person sees which credential is needed and why, then approves the request on their own device. 1Password fills the form itself. The company says it is building this with Muse, Claude, OpenAI, Grok Bot, and Town, and is also working with Browserbase, Perplexity, Ramp, and others. It points readers to its site for which integrations are actually available."},{"@type":"ListItem","position":3,"url":"https://the-decoder.com/major-us-banks-are-locking-out-ai-agents-that-log-in-with-customer-credentials/","name":"Major US banks are blocking agents that log in with customer credentials","description":"The Decoder reports, citing Axios, that major US banks are restricting external AI agents that reach accounts with customer-provided usernames and passwords. It names Morgan Stanley, JPMorgan, Bank of America, and Wells Fargo, and says Morgan Stanley already blocks agents entirely, with JPMorgan, Bank of America, and Citi moving the same way. That use breaks bank rules that require the account holder to log in personally. Morgan Stanley told reporters it has not seen rogue agents on its platforms. Most banks, The Decoder says, want agents limited to read-only access, and many cannot yet tell a user-directed agent from one acting on its own."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/decisions-api","name":"OpenAI's Decisions API is generally available for bounded choices","description":"OpenAI has made the Decisions API generally available. It uses GPT-6 Luna for questions with a bounded answer: a probability, a choice from a list you supply, or a score against a rubric. OpenAI says it can be up to 10 times faster than calling GPT-6 Luna through the Responses API, and that a request can now hold up to 400 questions. Input is priced at $0.10 per million tokens, cached input at $0.01, with no output-token charge. Regional processing is available in the US and EU. Zero Data Retention is available to eligible customers. The API also connects to GPT-Live, so a voice session can pick a next action or an avatar expression without a full model turn."},{"@type":"ListItem","position":5,"url":"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance","name":"Google gives each Gemini agent its own hardware-isolated microVM","description":"Google Cloud has announced Agent Compute Engine, the runtime it says already powers Gemini's agent for work. Each agent gets a hardware-isolated microVM that can pause when idle and resume from a snapshot, with short-lived credentials injected outside the guest rather than stored inside it. Customer preview is planned for the coming months, via an interest form, not a switch you can turn on today. For teams already on Kubernetes, Google is also offering Agent Substrate on GKE, an open-source runtime it says can fit up to 10 times as many agents on a server and resume in under 500 milliseconds in a 200,000-agent test. It says Agent Substrate runs on any Kubernetes cluster and works with harnesses including Claude Code, OpenClaw, and Hermes."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/uber-chatgpt-work-rollout","name":"Uber is putting ChatGPT Work on more than 30,000 employee accounts","description":"OpenAI says Uber is expanding ChatGPT Work from a pilot of 1,000 employees to more than 30,000, starting 22 October. It is Uber's first company-wide deployment of an agent platform for knowledge work, inside ChatGPT Enterprise. The agent connects to Google Drive, Gmail, Google Calendar, and Slack, and GPT-6.1 Sol is the default model. Uber is pairing the rollout with an internal skills library, approved integrations, and employee training. Its developers will keep using Codex for software work. OpenAI says the companies plan to share adoption and outcome figures later."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/22/canva-releases-its-first-image-generation-model/","name":"Canva releases Craft, its own image model trained on designs","description":"TechCrunch reports that Canva has released Canva Craft, an image model built by its research team, with researchers from Leonardo.ai, which Canva acquired in 2024. Canva says the model first writes a plan for layout, scale, hierarchy, and text, then generates an image at up to 2K in as many as 30 aspect ratios. It was trained on human-designed Canva templates, not photographs, so a result can be turned into a layered design with Canva Magic. TechCrunch says Craft is available to all users in the Dream Lab tab, and through the Canva API. Faster variants, Craftfast and Craft-ultrafast, are planned. Canva also plans to offer generation inside ChatGPT and Gemini through its MCP server."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/nvidia/kumo-relational","name":"Nvidia's Kumo Relational predicts from a database without a training run","description":"Nvidia has introduced Kumo Relational, a pre-trained model that answers predictive questions directly on a relational database. You describe the question in its Predictive Query Language. The model gathers up to 10,000 historical examples as context and returns a prediction in one forward pass, without task-specific training or flattening the tables into one feature row. Nvidia says that across 41 tasks on 15 databases it beat supervised relational deep-learning models and expert-engineered gradient-boosted trees, and that on the SAP SALT benchmark it beat AutoGluon ensembles by 8 percent in mean reciprocal rank. It is available through Nvidia's open-source structured-data library or as an Nvidia NIM. The paper is on arXiv."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/allenai/olmoearth-v1-3","name":"Allen Institute releases planet-wide satellite embeddings you can query in a browser","description":"The Allen Institute for AI has released OlmoEarth v1.3, an open satellite embedding model, plus precomputed annual embeddings for land and nearby coastal water at 10-meter resolution. A year of Sentinel-1, Sentinel-2, and Landsat observations becomes one 128-number vector per pixel, or a smaller 64-number version. The institute says the 128-dimension embeddings ranked highest on 20 of 27 evaluations against AlphaEarth Foundations and Tessera v2. Weights, pretraining data, and code are open. A browser explorer lets you compare years, find similar places, or train a small classifier from a few labels and export a GeoTIFF, with no account."},{"@type":"ListItem","position":10,"url":"https://www.theguardian.com/books/2026/oct/21/new-prize-launches-books-co-written-with-ai-france","name":"A French prize will publish fiction co-written with an AI model","description":"The Guardian reports that the Prix Pascal de Littérature IA is open for unpublished fiction co-written with a language model. Entries must be 10,000 to 50,000 words, in French, and must name the model and the prompt. Entrants can be anywhere. The terms also ask that the text help address an ethical, social, or ecological problem. The winner is promised publication. Applications close at the end of November, a shortlist of 10 follows, and the winner is due in early December. Submissions go through prixpascal.fr. The prize was founded by technology entrepreneurs Philippe Rodriguez, Albin Serviant, and Gilles Mentré."},{"@type":"ListItem","position":11,"url":"https://github.com/bowenliang123/dsh-context","name":"bowenliang123/dsh-context: a dashboard for what a DeepSeek agent is carrying","description":"dsh-context is a plugin for DeepSeek Harness that shows how a session's context is composed, how it changes, and where commands ran. It adds a context dashboard, browser, sidebar, and command, with English and Simplified Chinese. GitHub's daily TypeScript trending list had it at 321 stars today. It supports @deepseek-ai/dsh from 0.2.0-rc.2 on the 0.2.0 and 0.2.1 lines, and is Apache-2.0."},{"@type":"ListItem","position":12,"url":"https://github.com/onyx-dot-app/onyx","name":"onyx-dot-app/onyx: self-hosted chat, search, and agents for any model","description":"Onyx is an open-source AI platform for chat, retrieval, agents, and actions that works with whatever LLM you connect. The Community Edition is MIT-licensed and covers those core features. Enterprise features such as SSO, SCIM, role-based access, and usage analytics are separate. GitHub's daily Python trending list had it at 201 stars today. A hosted trial is at cloud.onyx.app if you do not want to deploy it."},{"@type":"ListItem","position":13,"url":"https://github.com/genspark-ai/genoffice","name":"genspark-ai/genoffice: a local office suite a coding agent can edit","description":"GenOffice is an open-source office suite for documents, spreadsheets, slides, PDF, Markdown, and HTML, with a built-in agent. A genoffice command-line tool and an agent skill let Claude Code, Codex, and Cursor create and edit real .docx, .xlsx, and .pptx files locally. You bring your own model key. It runs on macOS, Windows, and Linux. GitHub's daily TypeScript trending list had it at 191 stars today. The suite is Apache-2.0. The ee/ directory is reserved for enterprise modules under a separate license. The GenOffice and Genspark names are trademarks, so a fork needs its own branding."}]}}]}</script>
