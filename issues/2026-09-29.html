nes the open-source OpenShell runtime with Sentry monitoring and policy enforcement outside the agent’s host process. It is designed to control access to files, networks, tools and credentials, with optional hardware-backed monitoring that can quarantine an agent."},{"@type":"ListItem","position":3,"url":"https://huggingface.co/blog/Hcompany/holo4","name":"Holo4 agents work across screens, code, APIs and MCP tools","description":"H Company has released Holo4 in 27B dense and 35B-A3B mixture-of-experts versions, plus Holotron4 Nano. The models can combine GUI actions, code execution, APIs and MCP tools, and the company has published weights, benchmark trajectories and a dataset for inspection."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/lenfest-ai-collaborative-expansion","name":"OpenAI doubles support for embedded AI engineers in local newsrooms","description":"OpenAI is committing another $5 million, plus up to $5 million in software credits and engineering support, to expand the Lenfest AI Collaborative and Fellowship. The program places full-time AI engineers inside news organisations and plans to turn successful projects into reusable tools and playbooks."},{"@type":"ListItem","position":5,"url":"https://x.com/gilgNYC/status/2104583942728822998","name":"Shopify gives browser agents structured checkout tools","description":"Shopify has extended WebMCP support to checkout and Shop Pay for eligible merchants. Browser agents can now read and update checkout state through structured tools and submit an order only after the buyer authorises the purchase, with handoff when human action is required."},{"@type":"ListItem","position":6,"url":"https://about.fb.com/news/2026/09/launching-meta-enterprise-platform/","name":"Meta creates an enterprise business for Muse and its AI stack","description":"Meta has launched Meta Enterprise Platform to package Muse, Meta Business Agent, Muse API, Muse Code and related infrastructure for companies and developers. Former MongoDB CEO Chirantan “CJ” Desai will lead the new unit as chief enterprise platform officer."},{"@type":"ListItem","position":7,"url":"https://arxiv.org/abs/2608.10257","name":"Netflix tests an LLM-backed recommendation ranker with fewer engineered features","description":"Netflix researchers describe GenRec, an LLM-backed ranker that represents viewing history and context in natural language rather than relying on thousands of hand-engineered features. They report statistically significant offline and online gains in a large A/B test while using substantially fewer ranking-specific training examples and inputs."},{"@type":"ListItem","position":8,"url":"https://stateofutopia.com/experiments/microllmlab/","name":"MicroLLM Lab runs seven tiny language models entirely in the browser","description":"MicroLLM Lab is an interactive WebGPU experiment for loading, running and comparing seven models from 25.8 million to 362 million parameters locally in a browser. It includes objective prompt tests, speed measurements and downloadable benchmark certificates, with model data cached on the device."},{"@type":"ListItem","position":9,"url":"https://www.openappa.com/","name":"OpenAPPA proposes deterministic data-flow controls for agents","description":"OpenAPPA is an MIT-licensed guardrail engine that labels data by audience, trust and authority, then applies deterministic rules as information moves between agent tools. It can return remedy plans such as redaction, approval or isolated subagents instead of simply blocking a task."},{"@type":"ListItem","position":10,"url":"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/","name":"A practitioner’s 2026 LLM review finds coding agents crossed a usability threshold","description":"Simon Willison’s annotated keynote traces the year’s model, coding-agent, security and tool-use developments. His central practical observation is that late-2025 model improvements made coding agents reliable enough for daily use, while 2026 exposed both their wider usefulness and their security limits."},{"@type":"ListItem","position":11,"url":"https://github.com/ashhart/TensorFold","name":"ashhart/TensorFold: exact local LLM decoding behind an OpenAI-compatible API","description":"TensorFold serves supported language models locally through an OpenAI-compatible endpoint, with exact speculative decoding on Apple Silicon and support for selected NVIDIA DGX Spark configurations. The MIT-licensed project had 548 stars and active releases when checked today."},{"@type":"ListItem","position":12,"url":"https://github.com/samugit83/redamon","name":"samugit83/redamon: an agentic framework for authorised security testing","description":"Redamon is an actively maintained framework that combines AI agents with reconnaissance, vulnerability scanning, exploitation workflows and a graph database for red-team operations. The project had about 2,744 stars and 567 forks when checked today."},{"@type":"ListItem","position":13,"url":"https://github.com/HelpCode-ai/anythingmcp","name":"HelpCode-ai/anythingmcp: turn business APIs and databases into MCP tools","description":"AnythingMCP is a self-hosted gateway that converts REST, SOAP, GraphQL, OData and SQL interfaces into MCP tools for AI assistants. The AGPL-licensed project advertises 265 connectors and had 550 stars with frequent updates when checked today."}]}}]}</script>
