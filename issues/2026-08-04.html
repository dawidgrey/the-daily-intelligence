  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-04.html#webpage","name":"The Daily Intelligence — 2026-08-04","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-04.html","description":"Today’s issue follows a practical shift from impressive demos to systems people can actually use: lower-cost models, deployable coding agents, more capable assistants, clearer governance and better ways to evaluate output. We also highlight three fast-rising open-source projects for coding and live-data RAG.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-03T20:00:00Z","dateModified":"2026-08-04T20:04:28Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://deepmind.google/blog/introducing-gemini-3-6-flash-3-5-flash-lite-and-3-5-flash-cyber/","name":"Google’s new Flash models target cheaper, more reliable AI agents","description":"Google introduced Gemini 3.6 Flash, 3.5 Flash-Lite and the cyber-focused 3.5 Flash Cyber. The company says 3.6 Flash uses fewer output tokens than 3.5 Flash, requires fewer reasoning steps and tool calls, and costs $1.50 per million input tokens and $7.50 per million output tokens."},{"@type":"ListItem","position":2,"url":"https://blog.cloudflare.com/smaller-faster-safer-models/","name":"Cloudflare doubles long-context capacity for Kimi while cutting GLM memory use","description":"Cloudflare detailed production techniques for serving large open models: an 8-bit KV cache doubled Kimi K2.6 context capacity, while 4-bit weight compression cut GLM 5.2’s checkpoint size by about 40%. Its evaluations found no meaningful accuracy loss in the tested workloads."},{"@type":"ListItem","position":3,"url":"https://hoplite.sh","name":"Hoplite launches cloud coding agents that work from task to pull request","description":"YC-backed Hoplite gives each coding task an isolated cloud sandbox where an agent can inspect a repository, edit code, run tests, open a live preview and prepare a pull request. Teams can gate file edits, shell commands and pull-request actions behind approvals."},{"@type":"ListItem","position":4,"url":"https://www.youtube.com/playlist?list=PLangBM27OtEA","name":"Stanford publishes a nine-part course on self-improving AI agents","description":"Stanford Online released the CS329A lecture playlist covering test-time compute, verifiers, reinforcement learning, tool use, memory, planning, deep-research agents and long-horizon evaluation. The nine graduate-level recordings provide a structured survey of how agents can improve through feedback and interaction."},{"@type":"ListItem","position":5,"url":"https://www.june.ai/","name":"June brings agent-led implementation to enterprise software","description":"June has emerged with a platform for mapping business workflows and implementing changes across enterprise systems, data platforms and AI agents. It emphasizes sandbox testing, reviewable changes, audit trails and access to human experts for difficult deployments."},{"@type":"ListItem","position":6,"url":"https://www.apple.com/newsroom/2026/06/apple-introduces-siri-ai-a-profoundly-more-capable-and-personal-assistant/","name":"Siri AI adds personal context, onscreen awareness and a dedicated app","description":"Apple’s rebuilt Siri can hold longer conversations, use information on screen, search personal messages, email and photos, and answer broader web questions. It also adds a dedicated app and uses Apple’s privacy-focused architecture across supported devices."},{"@type":"ListItem","position":7,"url":"https://www.cnbc.com/2026/08/03/openai-chatgpt-anthropic-congress-house-ai-spending.html","name":"ChatGPT takes 88% of identifiable House AI spending","description":"A CNBC analysis of U.S. House disbursement records found ChatGPT represented about 88% of identifiable AI-tool spending in the year to March 31. Staff reported using AI for legislative summaries, briefing memos, constituent responses, research and communications, though the records exclude free and bundled tools."},{"@type":"ListItem","position":8,"url":"https://www.designarena.ai/","name":"Design Arena turns millions of user choices into AI model rankings","description":"Design Arena lets people compare model outputs for websites, slides, apps, games, images, video and other formats, then publishes preference-based leaderboards. The service says more than 5.5 million users across over 190 countries use it to compare creative AI systems."},{"@type":"ListItem","position":9,"url":"https://openai.com/index/advancing-responsible-ai-across-europe","name":"OpenAI maps its EU AI Act approach to safety, transparency and provenance","description":"OpenAI outlined how its system cards, preparedness processes, external testing and content-provenance work align with the EU’s general-purpose AI and transparency codes. It says it is expanding provenance measures beyond images to audio and, as standards mature, other modalities including text."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/building-abundant-intelligence","name":"OpenAI argues the useful metric is cost per completed outcome","description":"OpenAI set out a full-stack strategy for lowering the cost of useful intelligence through cheaper models, serving efficiency, routing and context management. It argues that buyers should measure the total cost of a successful result—including retries, oversight and errors—rather than token price alone."},{"@type":"ListItem","position":11,"url":"https://github.com/can1357/oh-my-pi","name":"can1357/oh-my-pi","description":"Oh My Pi is a terminal coding agent with hash-anchored edits, language-server support, browser tooling, Python execution and subagents. The actively updated project has more than 21,000 GitHub stars."},{"@type":"ListItem","position":12,"url":"https://github.com/Alishahryar1/free-claude-code","name":"Alishahryar1/free-claude-code","description":"Free Claude Code is an open-source gateway for using coding agents such as Claude Code, Codex and Pi from terminals, IDEs, apps or phones. The Python-led project has attracted more than 43,000 GitHub stars and was updated this week."},{"@type":"ListItem","position":13,"url":"https://github.com/pathwaycom/llm-app","name":"pathwaycom/llm-app","description":"Pathway’s LLM App repository provides ready-to-run templates for RAG, enterprise search and live-data AI pipelines. Its connectors cover sources including SharePoint, Google Drive, S3, Kafka, PostgreSQL and real-time APIs, and the project has more than 59,000 stars."}]}}]}</script>
