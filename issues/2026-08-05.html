  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-05.html#webpage","name":"The Daily Intelligence — 2026-08-05","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-05.html","description":"Today's issue follows AI beyond the chat window: smaller models are becoming practical on everyday hardware, voice systems are learning to converse continuously, and agents are testing the boundaries of shopping, security, education, and creative work.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-04T20:00:00Z","dateModified":"2026-08-05T20:04:25Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://huggingface.co/blog/LiquidAI/lfm2-5-2-6b","name":"Liquid AI's 2.6B model brings capable agents to phones and laptops","description":"Liquid AI released LFM2.5-2.6B, a compact model trained for tool use and multi-step agent workflows. The company reports a 128K context window, memory use below 2.5 GB, and competitive agent performance against models roughly four times larger."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/learn-teach-chatgpt-work-codex","name":"OpenAI packages agent workflows for teachers and college students","description":"OpenAI introduced three education plugins for K–12 teachers, college educators, and college students inside ChatGPT Edu and district deployments of ChatGPT for Teachers. They combine approved course materials, apps, skills, and common workflows for planning, study, research, and content creation."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/continuous-voice-interaction-with-gpt-live","name":"GPT-Live shows how voice AI can listen and speak at the same time","description":"OpenAI detailed the architecture behind GPT-Live, a full-duplex voice model that removes the separate turn detector and can listen while speaking. A dedicated media path keeps audio responsive while deeper reasoning and tool calls run asynchronously."},{"@type":"ListItem","position":4,"url":"https://deepgrove.ai/maple-preview","name":"Maple-Preview bets on fast ternary reasoning for personal devices","description":"DeepGrove unveiled Maple-Preview, an open-source 20B mixture-of-experts reasoning model with ternary weights and 1.49B active parameters. Its model card reports a 5.31 GB checkpoint, a 131K context window, and more than 200 tokens per second on an M4 Mac mini."},{"@type":"ListItem","position":5,"url":"https://edotenv.com/","name":"A new RL environment uses markets to train agents for changing conditions","description":"Y Combinator-backed E.env is building reinforcement-learning environments from market data to train agents in applied machine learning and long-horizon planning. Its thesis is that shifting regimes and decaying trading edges provide harder, less saturating tasks than static benchmarks."},{"@type":"ListItem","position":6,"url":"https://www.superconductor.com/blog/remote-sandboxes-agent-security","name":"Coding agents need a tighter boundary than your whole laptop","description":"Superconductor argues that coding agents should run in isolated remote sandboxes rather than inherit a developer laptop's files, credentials, browser sessions, and network access. It recommends fresh workspaces, scoped secrets, restricted networks, disposable state, and centralized audit logs."},{"@type":"ListItem","position":7,"url":"https://www.ibm.com/reports/data-breach","name":"IBM's breach report puts agent identity controls at the top of the checklist","description":"IBM and the Ponemon Institute's 2026 Cost of a Data Breach report says AI-driven attacks are growing as organizations expand agent use. IBM recommends identity-based runtime controls, tightly scoped permissions, human attribution, auditability, data discovery, and continuous monitoring."},{"@type":"ListItem","position":8,"url":"https://www.niemanlab.org/2026/08/a-record-breaking-eight-pulitzer-awardees-disclosed-ai-use-this-year/","name":"Pulitzer-recognized newsrooms use AI to sort evidence, not write the story","description":"Nieman Lab reports that five 2026 Pulitzer winners and three finalists disclosed using AI, a record since disclosures began in 2024. Common uses included summarizing, translating, classifying, and searching large document collections, with reporters and specialists checking the relevant source material."},{"@type":"ListItem","position":9,"url":"https://newsroom.spotify.com/2026-08-04/merlin-spotify-licensing-agreements-fan-made-covers-remixes/","name":"Spotify and Merlin set opt-in terms for fan-made AI covers and remixes","description":"Spotify and independent-music licensing group Merlin agreed terms for Spotify's upcoming fan-made covers and remixing tool. Participating artists can opt in, receive credit and compensation, and gain an additional revenue stream from the paid add-on."},{"@type":"ListItem","position":10,"url":"https://www.reuters.com/business/retail-consumer/amazon-loses-us-court-ban-perplexitys-ai-shopping-tools-2026-08-04/","name":"Appeals court reopens Amazon to Perplexity's shopping agents","description":"A U.S. appeals court overturned a temporary order that blocked Perplexity's agentic shopping tools from Amazon. The court said Amazon was unlikely to prevail on its claim under federal computer-hacking law and treated users, rather than Perplexity itself, as the parties accessing the platform."},{"@type":"ListItem","position":11,"url":"https://github.com/huangruiteng/loopx","name":"GitHub trend: LoopX keeps long-running agent teams on track","description":"LoopX is an agent-agnostic state kernel for long-running teams using Codex, Claude Code, and other coding agents. It provides durable goals, executable to-do items, quota-aware wake-ups, evidence logs, and verifiable handoffs."},{"@type":"ListItem","position":12,"url":"https://github.com/livekit/agents","name":"GitHub trend: LiveKit Agents builds realtime voice and video assistants","description":"LiveKit Agents is a server-side framework for realtime, programmable voice and multimodal assistants. It lets developers combine speech recognition, language models, text-to-speech, realtime APIs, telephony, and video components."},{"@type":"ListItem","position":13,"url":"https://github.com/uber/ADR","name":"GitHub trend: Uber open-sources detection tools for risky AI agents","description":"Uber's Agentic AI Detection and Response project captures agent intent and tool traces, benchmarks defenses across more than 300 tasks and 133 MCP servers, and detects suspicious sessions. Uber says the system is deployed in production, while the open release includes its sensor, benchmark, and detector rather than its prevention component."}]}}]}</script>
