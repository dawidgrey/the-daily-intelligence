  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-21.html#webpage","name":"The Daily Intelligence — 2026-11-21","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-21.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today, Anthropic's shares were back near the sale price during Friday's session. Signal is blocking phone screenshots so a phone assistant cannot read the chat. A claimed math proof is not a prize.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-20T19:00:00Z","dateModified":"2026-11-20T20:11:02Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.reuters.com/business/anthropics-post-debut-stumble-delivers-reality-check-ai-trade-2026-11-20/","name":"Anthropic was last at $87.28. That was not the close.","description":"Reuters reported that during Friday's session Anthropic was last trading at $87.28, about 10 percent below Thursday's close and not far from the $83 IPO price. At that print, Reuters put the fully diluted valuation at about $1.6 trillion, and the market value of shares outstanding at $1.2 trillion."},{"@type":"ListItem","position":2,"url":"https://signal.org/blog/protecting-your-privacy/","name":"Signal is blocking the screenshot. You can turn that off.","description":"On 20 November, Signal president Meredith Whittaker said the app is blocking screenshots on iOS 27, and turning on screen security on Android when it detects an assistant trying to read the screen. The aim is to stop Gemini and Siri from capturing Signal chats. You can turn the block off in settings."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/11/20/ai-claimed-a-solution-to-the-167-year-old-riemann-hypothesis-and-a-human-did-too/","name":"A Lean file is not the Riemann prize.","description":"TechCrunch reports that Levent Alpöge, a mathematician at Anthropic, posted an essay saying he had a Lean-compilable solution to the Riemann hypothesis, and that he asked Dario Amodei on Sunday night how to announce it. TechCrunch also reports that Stanford professor Ravi Vakil posted a separate draft of the General Riemann hypothesis by Alessandro Masullo, which Vakil said used no AI."},{"@type":"ListItem","position":4,"url":"https://apnews.com/article/cyberattack-european-union-artificial-intelligence-ai-79705095e8141cd650196dbff1cf3c70","name":"The Commission confirms an AI-assisted attack. It has not named who.","description":"AP reports that European Commission spokesperson Thomas Regnier confirmed on Thursday that an attack detected on 22 October used AI tools. He said several applications were taken down and most have been restored. He did not name who was behind it."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/introducing-medchembench","name":"MedChemBench is a test on old papers. It is not a new drug.","description":"On 20 November, OpenAI introduced MedChemBench, 99 problems drawn from published medicinal-chemistry papers. At the xhigh setting, OpenAI says GPT-6.2 Astra earned 84.5 percent of the available credit, against 58.2 percent for GPT-5.6 Sol. Selecting compounds and predicting numbers scored lower than rebuilding a molecule's structure."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/harness-adapters-at-scale","name":"A harness adapter is a small add-on, not a new model.","description":"On 20 November, Hugging Face said it trained a LoRA adapter for Qwen3.8-27B inside three agent harnesses: Pi, OpenCode, and Hermes Agent. On Terminal-Bench 2.1 with Pi, the lab says the base model scored 39 percent and used about 2,900 tokens a task. The Pi adapter scored 55 percent pass@1 and used about 1,500 tokens."},{"@type":"ListItem","position":7,"url":"https://www.theverge.com/tech/1038059/google-search-homepage-ai-chats","name":"Google Search is adding a sidebar for old AI chats.","description":"The Verge reports that Robby Stein, a Google vice president of product, said on 19 November that a collapsible sidebar is rolling out globally on the desktop homepage. It lists recent AI Mode searches so you can reopen them. From the clip he posted, The Verge says you open it from a gray bar on the left."},{"@type":"ListItem","position":8,"url":"https://openai.com/index/research-acceleration-jagged-frontier/","name":"OpenAI says agents finish more of the long tasks. People still run the lab.","description":"OpenAI says that from March to October, estimated success on internal research tasks judged to take a person two to four hours rose from 23 percent to 46 percent. At published API prices, the median researcher's daily agent spend reached $2,400 in October, up 62 percent from September. The 90th percentile reached $23,000."},{"@type":"ListItem","position":9,"url":"https://enola.tech/blog/agent-memory-needs-a-code-reference","name":"A saved line number can point at the wrong function.","description":"Enola checked agent notes saved against older revisions of Excalidraw and Vite. After 30 days, 13 of 45 Excalidraw locations and 8 of 51 Vite locations pointed into a different function. The original functions were usually still in the repo. Other edits had moved them."},{"@type":"ListItem","position":10,"url":"https://www.theverge.com/tech/1038227/apple-ai-agent-engineer-job-listing","name":"Apple posted a job for an agent. The listing is gone.","description":"The Verge, citing Bloomberg, reports that a since-removed Apple job listing sought an engineer to lead an agent that could browse the web, work across apps, write code, and call services. The listing said the role would work with Siri, UI frameworks, and Apple's foundation models. The Verge says the listing has been taken down."},{"@type":"ListItem","position":11,"url":"https://github.com/agentscope-ai/agentscope","name":"agentscope-ai/agentscope: a framework you can watch while it runs","description":"AgentScope gained 75 stars on GitHub's Python trending list. The repo has 36,379 stars, under Apache-2.0. The project describes 2.0 as a production-ready agent framework. Version 2.0.12 was tagged on 16 November. The repo was pushed on 20 November."},{"@type":"ListItem","position":12,"url":"https://github.com/SWE-agent/mini-swe-agent","name":"SWE-agent/mini-swe-agent: a small coding agent, with the maker's score","description":"mini-swe-agent gained 62 stars on GitHub's Python trending list. The repo has 9,895 stars, under MIT. The project calls it a roughly 100-line agent for GitHub issues and the command line, and says it scores above 74 percent on SWE-bench verified. The latest tag, v2.4.6, is from 23 July, so today's climb is not a new release."},{"@type":"ListItem","position":13,"url":"https://github.com/phone-harness/phone-harness","name":"phone-harness/phone-harness: the agent can tap the phone. You still unlock it.","description":"Phone Harness gained 206 stars on GitHub's Python trending list. The repo has 5,342 stars, under MIT. It lets an agent see and tap a phone: iPhone through the mirroring window, Android through adb. The latest tag, 0.3.3, is from 2 November. The repo was pushed on 20 November."}]}}]}</script>
