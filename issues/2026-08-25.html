  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-25.html#webpage","name":"The Daily Intelligence — 2026-08-25","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-25.html","description":"Today’s issue tracks the practical side of AI’s next phase: lower model costs, more structured coding tools, stronger privacy controls, calibrated agent memory, and accessibility features moving from research into everyday products.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-24T20:00:00Z","dateModified":"2026-09-02T20:05:01Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://developers.openai.com/api/docs/pricing","name":"OpenAI sets promotional GPT-5.6 Sol pricing through at least November","description":"OpenAI’s current API pricing lists GPT-5.6 Sol at $4 per million short-context input tokens and $20 per million output tokens, with the promotional rate available through at least November 21. Batch and Flex processing halve those standard rates."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/gpt-5-6-in-kiro","name":"GPT-5.6 arrives in Kiro for spec-driven software development","description":"Kiro now offers GPT-5.6 Sol, Terra, and Luna inside workflows that turn requirements into designs, tasks, implementation, review, and property-based tests. OpenAI says testing found Terra completed successful Terminal-Bench 2.1 tasks in Kiro at roughly 82% lower cost, though that is a vendor-reported result."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/from-atari-to-eve-online-building-on-15-years-of-ai-research-in-games/","name":"Google DeepMind expands game partnerships to test general AI agents","description":"Google DeepMind is working with studios including Fenris Creations, Hello Games, and Coffee Stain to prototype AI-driven gameplay and develop agents that can understand varied 3D worlds through ordinary screen, keyboard, and mouse interfaces."},{"@type":"ListItem","position":4,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/","name":"Gemini 3.7 Flash targets coding and agents at half 3.6 Flash’s launch price","description":"Google says Gemini 3.7 Flash improves on 3.6 Flash across software engineering, document work, web development, and business automation, while launching at half the earlier model’s original per-token price. Google reports gains on several coding and workflow benchmarks, which remain vendor-provided measurements."},{"@type":"ListItem","position":5,"url":"https://deepmind.google/blog/putting-sign-language-ai-into-users-hands/","name":"Google brings sign-language dictation to Gboard and Live Transcribe","description":"Google’s multilingual sign-language-to-text model now powers American Sign Language dictation in Gboard and Live Transcribe on Pixel 11, with more devices and languages planned. The system sends pose landmarks for translation rather than retaining the raw camera video."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/ibm-research/altk-evolve-hmm","name":"IBM research finds agent memory works best as a calibrated dose","description":"An IBM Research evaluation across eight models found that more agent memory is not automatically better: stronger models benefited from fuller guidance, weaker models often did better with a compact core plus retrieval, and saturated models showed little gain. In one reported result, curated retrieval raised task completion by 16.1 percentage points with only 5% more tokens."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/offering-zero-data-retention-for-frontier-models","name":"OpenAI previews private safety checks for zero-retention API use","description":"OpenAI says eligible API customers can continue using Zero Data Retention while a forthcoming Private Safety Processing system looks for risk patterns across interactions without giving OpenAI personnel access to the underlying prompts and responses. The system is in early testing, with a technical white paper and rollout planned for September."},{"@type":"ListItem","position":8,"url":"https://openai.com/index/replit","name":"Replit uses GPT-5.6 Luna to power a no-token-cost planning mode","description":"Replit’s Free Mode uses GPT-5.6 Luna for project-aware planning, questions, feedback, and analysis without consuming user usage, while harder tasks can be routed to GPT-5.6 Sol before returning to the same project context."},{"@type":"ListItem","position":9,"url":"https://www.anthropic.com/news/claude-text-watermark","name":"Anthropic explains the invisible watermark planned for future Claude text","description":"Anthropic says future Claude models will use a SynthID-Text-based statistical watermark to support EU AI Act requirements. The pattern changes low-stakes word-selection randomness rather than adding hidden characters, carries no user identity, and is easier to detect in longer passages than short or heavily factual text."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/partnering-with-codeai","name":"OpenAI and CodeAI plan free AI-literacy programs for students","description":"OpenAI and CodeAI announced a year of student and teacher programs spanning basic AI literacy, a high-school builders challenge, classroom resources, career sessions, and an advisory council focused on child development and learning. The partnership accompanies ChatGPT for Teens and CodeAI’s free AI Foundations course."},{"@type":"ListItem","position":11,"url":"https://github.com/anthropics/claude-plugins-community","name":"anthropics/claude-plugins-community: a reviewed marketplace mirror for Claude extensions","description":"Anthropic’s community marketplace mirror collects third-party plugins for Claude Cowork and Claude Code, with submissions flowing through an internal review pipeline rather than direct pull requests. The repository was among the day’s fastest-moving AI projects and had about 1,300 stars when checked."},{"@type":"ListItem","position":12,"url":"https://github.com/apache/maka","name":"apache/maka: a local-first workspace with auditable agent histories","description":"Apache Maka is an incubating local-first AI agent workspace that records model messages, tool calls, results, permission decisions, and termination events in an append-only log. It had about 2,800 stars and active development when checked."},{"@type":"ListItem","position":13,"url":"https://github.com/AgriciDaniel/claude-obsidian","name":"AgriciDaniel/claude-obsidian: a self-organizing Markdown knowledge base","description":"Claude Obsidian combines Obsidian and Claude Code to read incoming sources, create links, and organize them into a user-owned knowledge graph of plain Markdown. The project had about 11,700 stars when checked, making it one of the most popular AI-focused repositories in the day’s candidate set."}]}}]}</script>
