  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-18.html#webpage","name":"The Daily Intelligence — 2026-11-18","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-18.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Gemini can phone a shop and check out, including in Australia, if you turn on Tasks and set a spending limit. GPT-6.2 is in paid ChatGPT Work. Microsoft's new coding model is in GitHub Copilot, at a promotional price. A Gemini chat with history off is now kept for about two months.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-17T19:00:00Z","dateModified":"2026-11-21T20:10:54Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blog.google/innovation-and-ai/products/gemini-app/tasks-in-gemini-free-new-features/","name":"Gemini can call the shop. You still set the spending cap.","description":"On 17 November, Google said Gemini Tasks is rolling out free on Gemini 4 Hydrogen in the United States, Japan, Korea, Canada, Australia, and India. You switch the app from Chat to Task, text it, or forward mail to gemini@google.com. Google says it can call a business, read a bill, or check out with Google Pay, and that it is designed to ask before it clicks Buy."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/introducing-gpt-6-2-astra-sol","name":"GPT-6.2 is in paid ChatGPT Work. It may skip the blocked step.","description":"On 17 November, OpenAI released GPT-6.2 Astra for harder work and GPT-6.2 Sol for everyday work. Both are in ChatGPT Work and Codex for Plus, Pro, Enterprise, and Edu. In the API, Astra is $8 per million input tokens and $40 per million output tokens, with cached input at $0.40. Sol stays at $2, $0.10 cached, and $10."},{"@type":"ListItem","position":3,"url":"https://microsoft.ai/news/introducing-mai-code-2-and-mai-code-2-flash/","name":"MAI Code 2 is in Copilot. The discount is promotional.","description":"Microsoft released MAI Code 2 and the cheaper Code 2 Flash for everyday coding. Both are in GitHub Copilot. Flash is also in a limited preview in Microsoft Foundry. On four coding tests, Microsoft says Code 2 reached 98% of GPT-6.1 Sol's score at 40% of the cost, and 96% of Claude Opus 5.5's score at 5% of the cost. Those costs use a 50% promotional price."},{"@type":"ListItem","position":4,"url":"https://blog.google/innovation-and-ai/products/gemini-app/updated-controls/","name":"History off no longer means the chat is gone.","description":"On 16 November, Google said Gemini history and model training are now separate settings, rolling out globally over the coming weeks. If the new History setting is off, future chats are kept for about two months, to answer you, process feedback, and protect the service. Google's privacy hub, updated the same day, says temporary chats are not used to train models, and that the last 24 hours can be used as context."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/11/17/protons-lumo-a-privacy-focused-alternative-to-chatgpt-and-claude-arrives-on-desktop/","name":"Lumo Desktop can touch the files. You set the gate.","description":"On 17 November, Proton launched Lumo Desktop for Windows, macOS, and Linux. It can use local files, a shell, a browser, Proton Mail, and connectors such as Dropbox and Jira. Proton says you can mark each action as automatic, ask-first, or blocked, and that chats are encrypted, not logged on the server, and not used for ads or training."},{"@type":"ListItem","position":6,"url":"https://www.liquid.ai/blog/d1-2","name":"A decision model can return the amount, or say it is not there.","description":"Liquid AI released d1.2 and d1.2-ultra, decision models that return a value, a box on a picture, or a probability, including from audio. They are on the Liquid API at $0.02 and $0.042 per million input tokens. If a requested figure is missing, Liquid says the model is meant to answer \"not found\" instead of guessing."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/astra-law-6-2","name":"Astra for Law leads one legal test. Most assignments still fail it.","description":"On 17 November, OpenAI said every ChatGPT Enterprise customer can request Astra for Law, a GPT-6.2 Astra setup with a larger legal search index. Teams that already have it select gpt-6.2-astra-law. On Harvey's LAB-AA test, as presented by OpenAI, it earned full credit on 20.8% of 120 assignments, ahead of plain GPT-6.2 Astra at 15.0%."},{"@type":"ListItem","position":8,"url":"https://microsoft.ai/news/introducing-mai-realtime-1/","name":"MAI Realtime 1 is a preview. The minute price is not the whole bill.","description":"Microsoft introduced MAI Realtime 1, a speech-to-speech model priced at $0.01 per audio minute, with reasoning billed separately at $1 per million input tokens and $5 per million output tokens. You can try it in MAI Labs or register for a limited Foundry preview. Preview customers are not billed until the public preview begins."},{"@type":"ListItem","position":9,"url":"https://www.bleepingcomputer.com/news/security/researchers-hijack-hugging-face-account-for-popular-kokoro-ai-model/","name":"An abandoned speech model can still be taken over.","description":"On 17 November, BleepingComputer reported that researchers took over the Hugging Face account behind Kokoro, a speech model with nearly 13 million downloads a month. They recovered a domain the project still listed, then reset the login. They changed the weights on their own machine so the spoken words no longer matched the text, and they did not upload that copy."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/11/17/model-ml-raises-250m-to-automate-investment-banking-grunt-work/","name":"A $250 million round does not update the client model.","description":"Model ML, a London startup that builds agents for financial models, pitch decks, and due-diligence reports, raised $250 million in a Series B at a $1.5 billion valuation. General Atlantic and QED Investors co-led the round. The company says the agents sit in a client's Excel and PowerPoint and update the files when a deal changes."},{"@type":"ListItem","position":11,"url":"https://github.com/Tencent/LoopForge","name":"Tencent/LoopForge: the agent opens the sandbox. You approve the merge.","description":"LoopForge is a self-hosted workspace for shipping code with coding agents. It gained 590 stars on GitHub's daily trending list and has about 3,000 stars overall. A chat can open a Docker sandbox, call a coding-agent CLI, and save a repeatable workflow with human approval gates. The license is MIT."},{"@type":"ListItem","position":12,"url":"https://github.com/lnkiai/m3e-canvas","name":"lnkiai/m3e-canvas: sketch the screen, then hand the agent a prompt.","description":"M3E Canvas is a browser tool for sketching Material 3 phone screens and turning them into prompts for a coding agent. It gained 101 stars on GitHub's daily TypeScript trending list and has about 10,500 stars overall. The sketch stays in the browser. The license is MIT."},{"@type":"ListItem","position":13,"url":"https://github.com/a-ghorbani/pocketpal-ai","name":"a-ghorbani/pocketpal-ai: a chat model that stays on the phone.","description":"PocketPal AI is an open app that runs language models on a phone, with no account and no cloud required after the download. It gained 85 stars on GitHub's daily TypeScript trending list and has about 9,500 stars overall. It uses llama.cpp for GGUF models. The license is MIT."}]}}]}</script>
