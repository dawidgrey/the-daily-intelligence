  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-11.html#webpage","name":"The Daily Intelligence — 2026-09-11","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-11.html","description":"Today’s issue follows AI as it moves deeper into everyday work: managed agent infrastructure, conversational data analysis, more natural voice systems, safer evaluation practices, and practical tools for building and governing workflows. We also look at three trending open-source projects for knowledge, agent architecture, and automated trading.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-10T20:00:00Z","dateModified":"2026-09-14T20:04:15Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/introducing-the-agents-api/","name":"OpenAI launches a managed Agents API","description":"OpenAI has released the Agents API in public beta, offering the managed harness behind Codex for long-running tasks, tool use, context management, sandboxes, and subagent coordination. Developers can use OpenAI-hosted environments, their own infrastructure, or supported sandbox partners."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/put-data-to-work","name":"ChatGPT Work adds a conversational data agent","description":"The new Data agent connects ChatGPT Work to approved business systems including BigQuery, Databricks, MongoDB, Redshift, Snowflake, Google Drive, and SharePoint. Users can investigate business questions in plain language and turn the results into interactive dashboards while existing source permissions remain in force."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/introducing-gpt-live-1-in-the-api","name":"GPT-Live-1 brings full-duplex voice agents to the API","description":"OpenAI has made GPT-Live-1 available through its API at $0.05 per minute for the voice layer. The model listens and speaks at the same time, handles interruptions and background noise, supports phone workflows, and can delegate deeper reasoning or tool calls to another model."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/using-codex-chatgpt-to-search-for-new-antimicrobials","name":"AI helps researchers search genomes for antimicrobial candidates","description":"César de la Fuente’s lab is using specialist deep-learning models alongside Codex and ChatGPT to search genome and protein databases for molecules that might fight drug-resistant microbes. AI helps the team generate hypotheses, write code, prepare large datasets, and bridge gaps between biology, chemistry, and computing."},{"@type":"ListItem","position":5,"url":"https://www.anthropic.com/threat-intelligence-report-september-2026","name":"Anthropic details how AI misuse is becoming more autonomous","description":"Anthropic’s latest threat-intelligence report describes malicious uses of Claude that it says it disrupted between December 2025 and August 2026. The cases span cyber operations, surveillance, influence, scams, biological and weapons misuse, and model distillation, with AI increasingly used to orchestrate multi-step activity rather than simply answer questions."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/gradio-workflow-1111","name":"Gradio rebuilds a complex image workflow as a visual graph","description":"Hugging Face has demonstrated Workflow1111, a 73-node Gradio workflow that recreates much of AUTOMATIC1111 across 11 media pipelines. It combines image generation, editing, upscaling, prompt assistance, object detection, background removal, metadata, and image-to-video in one rewritable canvas."},{"@type":"ListItem","position":7,"url":"https://promptsign.ai/","name":"PromptSign applies code-signing ideas to AI instructions","description":"PromptSign signs AI skill folders and instruction files such as AGENTS.md and CLAUDE.md, recording publisher identity and tamper-evident file fingerprints. Its command-line hooks can block unsigned or modified instructions, while verification can run offline."},{"@type":"ListItem","position":8,"url":"https://lowdefy.com/articles/lowdefy-6-whats-new/","name":"Lowdefy 6 adds agent-ready app infrastructure","description":"Lowdefy 6 replaces its Next.js base with Hono and Vite while keeping its YAML application model. The release adds WebSockets, notification email, dynamic pages, scheduled endpoints, LLM steps, an MCP interface, and development tools that let coding agents inspect what they build."},{"@type":"ListItem","position":9,"url":"https://jasondoyle.ie/whitepapers/when-ai-evaluations-act-on-the-real-world/","name":"Why agent evaluations should be treated as production-risk systems","description":"A new incident-grounded paper argues that agent evaluations stop being passive measurements once models receive shells, browsers, credentials, networks, and mutation-capable tools. It proposes six independent boundaries covering execution, networks, identity, external effects, evaluation integrity, and evidence and response."},{"@type":"ListItem","position":10,"url":"https://cortecs.ai","name":"Cortecs offers a Europe-focused gateway for AI models","description":"Cortecs provides one OpenAI- and Anthropic-compatible API for routing text, vision, embedding, transcription, and speech workloads across more than 150 model endpoints. It emphasizes European providers, policy-based routing, GDPR controls, and an EU-sovereign option."},{"@type":"ListItem","position":11,"url":"https://github.com/alsk1992/CloddsBot","name":"CloddsBot: a self-hosted AI trading agent","description":"CloddsBot is an MIT-licensed TypeScript agent for monitoring and trading across prediction markets, centralized exchanges, and decentralized finance venues. The repository has about 1,500 stars and includes strategy, risk-management, data, and execution integrations."},{"@type":"ListItem","position":12,"url":"https://github.com/nashsu/llm_wiki","name":"LLM Wiki turns documents into a persistent knowledge base","description":"LLM Wiki is a cross-platform desktop application that incrementally converts documents into an organized, linked wiki rather than regenerating answers from retrieved passages each time. The GPL-licensed project has about 18,000 stars and includes local-model support, web clipping, and an MCP server."},{"@type":"ListItem","position":13,"url":"https://github.com/FareedKhan-dev/all-agentic-architectures","name":"A runnable guide to 35 agent architectures","description":"All Agentic Architectures packages 35 agent patterns—including Reflexion, LATS, GraphRAG, MemGPT, Voyager, and browser agents—as a Python library and runnable textbook. The MIT-licensed repository has about 4,500 stars, supports multiple model providers, and includes a 17-task benchmark leaderboard."}]}}]}</script>
