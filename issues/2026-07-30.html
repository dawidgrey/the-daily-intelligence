  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-30.html#webpage","name":"The Daily Intelligence — 2026-07-30","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-30.html","description":"Today’s issue follows AI from the model-serving stack into daily work: agents are learning to optimise infrastructure, researchers are receiving broader access, and music tools are becoming more editable. The counterweight is accountability, with new controls for agent autonomy, endpoint monitoring, content provenance and a school deployment paused for consultation.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-07-29T20:00:00Z","dateModified":"2026-08-01T20:05:09Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://newsletter.posthog.com/p/agent-autonomy","name":"PostHog offers a practical test for how much work to delegate to agents","description":"PostHog proposes grading agent autonomy by two properties of the task: how easily the result can be checked and how cheaply a mistake can be undone. Its four-level framework ranges from assistant mode to self-driving work, with deterministic tests and reversible changes enabling more delegation."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/chatgpt-for-academic-researchers","name":"OpenAI offers 100,000 academic researchers free access to frontier models","description":"OpenAI is starting a programme that will give 100,000 eligible scientists, mathematicians and engineers free access to frontier ChatGPT and Codex tools through 2027. It begins with 10,000 researchers and includes larger context windows, research connectors, training and business-grade data protections."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/gpt-5-6-frontier-intelligence-efficiency","name":"GPT-5.6 engineering points to cheaper inference and leaner agent context","description":"OpenAI has detailed optimisations across model training, routing, GPU kernels, speculative decoding, caching and its agent harness. It reports that GPT-5.6-assisted kernel work reduced end-to-end serving costs by 20%, while improvements to its draft model raised token-generation efficiency by more than 15%."},{"@type":"ListItem","position":4,"url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/lyria-3-5/","name":"Google launches Lyria 3.5 with more control over generated music","description":"Google has released Lyria 3.5 in Flow Music, promising stronger musical structure, lyrics, pronunciation and expressive vocals. Users can also control tempo and duration more directly while editing individual parts of a generated track."},{"@type":"ListItem","position":5,"url":"https://www.pangram.com/blog/introducing-pangram-4","name":"Pangram 4 targets mixed human-and-AI writing, with a higher API price","description":"Pangram has launched a larger text detector designed to identify AI-assisted passages, mixed authorship and output processed by humaniser tools. The company reports a 0.0041% false-positive rate on internal tests, while changing API billing to $0.05 per 100 words and retiring Pangram 3 in September."},{"@type":"ListItem","position":6,"url":"https://research.perplexity.ai/articles/securing-agents-across-perplexity%E2%80%99s-client-endpoints-with-numbat","name":"Perplexity open-sources Numbat to monitor and block risky agent actions","description":"Perplexity has released Numbat, an Apache-licensed endpoint security suite for detecting, investigating and optionally blocking risky AI-agent behaviour on macOS, Linux and Windows. It integrates with common client-side agent harnesses and keeps detection local while producing forensic records."},{"@type":"ListItem","position":7,"url":"https://nanoclaw.dev/blog/nanoclaw-echo-hardened-agent-runtime/","name":"NanoClaw adds an opt-in hardened runtime for open-source agents","description":"NanoClaw and Echo have released a free, opt-in runtime that rebuilds and patches the browser, libraries and command-line tools inside an agent sandbox. The companies say this cuts known vulnerabilities from thousands to near zero while retaining a locally built, unauthenticated alternative."},{"@type":"ListItem","position":8,"url":"https://asari.ai/blog/inference-optimization","name":"Asari’s self-improving agents optimise the full LLM serving stack","description":"Asari reports that parallel optimisation agents improved throughput and interactivity by up to 16% for DeepSeek v4 Pro and GLM 5.2 on NVIDIA B200 systems running vLLM. The agents changed kernels, schedulers, load balancers and configuration, then used distribution-level checks to test whether model behaviour remained consistent."},{"@type":"ListItem","position":9,"url":"https://engy.ai/","name":"Engy offers cryptographic proof that an API served the requested open model","description":"Engy has introduced an inference service that says it can provide cryptographic proof that a requested open model produced an output, rather than an undisclosed cheaper or quantised substitute. Its current setup supports GLM-5.2 through OpenAI-compatible APIs and configuration examples for Claude Code, Cursor, Codex and Hermes."},{"@type":"ListItem","position":10,"url":"https://apnews.com/article/new-york-school-artificial-intelligence-robot-teacher-c2126c704104c4eb68b79738630b07df","name":"New York school pauses an AI robot teacher plan after community concern","description":"A school district in Salamanca, New York, has paused plans to introduce a humanlike AI robot after residents questioned its classroom role and the manufacturer’s corporate links. District leaders said the robot was intended as a supervised technology demonstration and agreed to gather more community input."},{"@type":"ListItem","position":11,"url":"https://github.com/microsoft/VibeVoice","name":"microsoft/VibeVoice: an open voice-AI toolkit for speech and conversation","description":"Microsoft’s VibeVoice repository has more than 51,000 stars and is among today’s fastest-rising AI projects on GitHub Trending. It provides research code and models for expressive speech generation and voice workflows, with an MIT licence and a warning against untested commercial use."},{"@type":"ListItem","position":12,"url":"https://github.com/deepfakes/faceswap","name":"deepfakes/faceswap: a mature open toolkit for face-swapping research","description":"Faceswap is a long-running deep-learning project for training and creating face swaps, with more than 56,000 stars and renewed activity on GitHub Trending. Its Python codebase, installers and training workflow are released under GPL-3.0."},{"@type":"ListItem","position":13,"url":"https://github.com/sgl-project/sglang","name":"sgl-project/sglang: high-performance serving for language and multimodal models","description":"SGLang is an Apache-licensed serving framework for large language, vision-language and diffusion models, with more than 30,000 stars and very active development. It focuses on high-throughput inference, model compatibility and production deployment across modern accelerators."}]}}]}</script>
