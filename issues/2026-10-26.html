  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-26.html#webpage","name":"The Daily Intelligence — 2026-10-26","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-26.html","description":"Today's issue is about tools that look general and jobs that are not. A dermatologist's test found a 2015 image network beating GPT-6 Astra and Claude Fable 5.1 at naming biopsy-proven skin lesions. That is not a reason to skip a doctor: on whether a melanoma could be sent home, the chatbots were the more cautious ones. Anthropic says a pile of specialist sub-agents is often slower, and lossier, than one agent that loads a skill when it needs it. Nvidia has opened the models it uses to label robot video. Pennsylvania will require a label on ads that AI significantly changed.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-25T19:00:00Z","dateModified":"2026-10-28T20:10:26Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://lynchlab.net/llm-skin-cancer","name":"A 2015 image network beat two frontier chatbots at naming skin lesions","description":"Consultant dermatologist Magnus Lynch gave GPT-6 Astra and Claude Fable 5.1 the same 200 biopsy-proven lesions from the public MILK10k set, each with a clinical photo and a dermoscopic image, and asked for one of six diagnoses. A fine-tuned Inception v3, a 2015 convolutional network trained for about twenty minutes on public dermatology images with those cases held out, named the right diagnosis for 125 of 200. The chatbots named 84 and 85. Each chatbot was run once, at default settings."},{"@type":"ListItem","position":2,"url":"https://claude.com/resources/articles/building-agents-when-to-fold-subagents-into-your-main-agent-loop","name":"Anthropic says one agent with skills often beats a fleet of sub-agents","description":"Anthropic's Applied AI team says that, across several enterprise deployments, a single agent that loads skills and tools only when needed frequently beat both a giant system prompt and a design built from specialist sub-agents, often at lower cost and latency. One customer with about a dozen specialist sub-agents inside a customer-facing agent found the split hard to keep on-brand, and about twice as slow as a single loop. Anthropic has published a migration kit that walks a team through folding one sub-agent at a time and checking the result."},{"@type":"ListItem","position":3,"url":"https://www.dailycal.org/news/campus/academics/ai-use-leads-uc-berkeley-math-professor-to-see-no-point-in-grading-homework/article_bdf1eae2-c08b-491f-b9f1-81a7cea177de.html","name":"A Fields medalist at Berkeley has stopped grading homework for correctness","description":"Richard Borcherds, a UC Berkeley mathematics professor and Fields medalist, told The Daily Californian that he now grades homework on completion, because students using AI were consistently receiving top scores and he saw no point in paying readers to grade for correctness. He called the new system not a very good one, and said he has no alternative yet. Campus has tried Turnitin and Rumi and decided those detectors are not good enough to standardise. Course AI rules remain up to each faculty member."},{"@type":"ListItem","position":4,"url":"https://research.nvidia.com/labs/gear/flora/","name":"Nvidia opens Flora, the model suite it uses to label robot video","description":"Nvidia's GEAR lab has released Flora, an open suite for the three labels a robotics model needs from video: when an action happens, how well each step went, and whether the episode succeeded. Nvidia says the same pipeline already labels 200,000 hours a day across 512 GB300 GPUs while training its GR00T models, and that it is roughly 125 times cheaper than calling GPT-6 Astra. The weights are on Hugging Face. On Nvidia's own table, Flora leads on human captioning and on catching failed steps, while Astra still leads on robot-video captions and on rubric scoring."},{"@type":"ListItem","position":5,"url":"https://arxiv.org/abs/2610.14157","name":"OpenMobile-2 trains phone agents on more than 110 resettable apps","description":"Researchers from Nanjing University, SenseTime, and other labs have released OpenMobile-2, with open training environments and recipes for mobile agents. MobileGym++ rebuilds 35 commercial-style apps so a run can be reset and checked, and with emulator apps the playground covers more than 110. They release about 12,000 supervised trajectories and more than 2,000 tasks with automatic rewards. The larger model scores 79.9 on AndroidWorld and 50.4 on MobileWorld. On real Android phones, SPA-Bench rises from 31.9 to 59.6."},{"@type":"ListItem","position":6,"url":"https://blog.csongor.co.uk/loom/","name":"Coding agents missed hazards in a language that only looked familiar","description":"Csongor Kiss built Loom, a small smart-contract language that looks like Move and then breaks three assumptions a reader would carry over: a signer can be stored, a transaction can replace an existing interface implementation, and a panic can be deferred until the value is used. Across 75 agent runs, no submission shipped a corrected pricing formula. Asking the agent to write an assumptions log raised the share that recognised at least one hazard, from 17 of 40 baseline runs to 25 of 35. Opus 5.5 recognised all three in every reviewed assumptions-log run. Eleven agents proposed the pricing fix. None shipped it."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/destined/hurston-1","name":"Hurston-1 is an open text-to-speech model aimed at the phone line","description":"Destined AI has released Hurston-1, an Apache-2.0 fine-tune of Maya1 that speaks Southern American English and several African Englishes from a plain description of gender, age, accent, style, and pace. A phone mode filters the audio to the telephone band and emits 8 kHz G.711, the format a Twilio-style call expects. It does not clone a person. Each call is a new voice that fits the description, and the voice can change between chunks of a long script. Hugging Face requires you to accept the model conditions before download."},{"@type":"ListItem","position":8,"url":"https://www.cbc.ca/news/world/ai-coding-hack-smart-tvs-9.7392179","name":"People are asking agents to strip the smart TV. Experts say use the settings.","description":"CBC reports that viral posts are showing people how to ask a coding agent to remove apps, ads, and some tracking from a smart TV, after the set becomes slow or noisy. Toronto analyst Ritesh Kotak and London, Ontario journalist Carmi Levy say the same job can often be done in the TV's own settings, or by leaving the television offline and putting the apps on a separate streaming stick. They also say an agent-written change can brick the set, void the warranty, or skip the security updates that a connected TV still needs. One person told CBC-cited posts that an attempt left an Android TV unusable."},{"@type":"ListItem","position":9,"url":"https://www.theverge.com/ai-artificial-intelligence/1018187/pennsylvania-ai-deceptive-advertising-act","name":"Pennsylvania will require a label on ads that AI significantly changed","description":"Pennsylvania Governor Josh Shapiro has signed the Artificial Intelligence Deceptive Advertising Act. The Verge reports that an ad in any format — image, video, audio, or text — that has been significantly modified or generated by AI must carry a label in the same format as the ad. The rule applies wherever the ad was made, if it is expected to run in Pennsylvania. The text leaves open what \"significantly modified\" means, carves out parody, satire, commentary, criticism, and anything \"evidently fictional,\" and ties the duty to synthetic content that creates a false impression of a product or service."},{"@type":"ListItem","position":10,"url":"https://www.theverge.com/ai-artificial-intelligence/1018217/reddit-opensource-ai-ban","name":"r/opensource's new rules bar AI projects, new projects, and non-English posts","description":"Moderators of Reddit's r/opensource posted rules that reject a project if it uses AI, was made by AI, or is intended for AI. Submissions must also be at least a year old, actively maintained, and have more than one contributor. The same post says people who do not speak English should find another community, because the moderators say they cannot tell AI translation from AI writing. A moderator later said some incidental uses, such as automatic captions, could be allowed. Commenters have started a rival forum, r/trueopensource, and have pointed out that the Linux kernel now contains some AI-generated code."},{"@type":"ListItem","position":11,"url":"https://github.com/google-gemini/gemini-cli","name":"google-gemini/gemini-cli: Google's terminal agent, with a handover note on the readme","description":"Gemini CLI is Google's open-source terminal agent for Gemini, Apache-2.0, with about 108,000 stars and 825 stars today. It is still the most-starred AI repository on today's TypeScript trending list. The readme now says unpaid and Google One users were moved to Antigravity CLI on 18 June 2026, and that Gemini CLI is not optimised for Gemini 4 Argon."},{"@type":"ListItem","position":12,"url":"https://github.com/AgriciDaniel/claude-seo","name":"AgriciDaniel/claude-seo: a large SEO skill pack for Claude Code","description":"claude-seo is an MIT-licensed skill pack for Claude Code, with about 20,600 stars and 179 stars today, second among AI repositories on today's Python trending list that this newsletter has not already covered. The author describes 26 sub-skills and 19 sub-agents covering technical SEO, schema, local and international SEO, agent-readable site files, and PDF or Excel reports, plus optional extensions for live SEO data."},{"@type":"ListItem","position":13,"url":"https://github.com/basketikun/infinite-canvas","name":"basketikun/infinite-canvas: an open canvas for image, video, and agent work","description":"infinite-canvas is an MIT-licensed workspace for AI image generation, reference-image edits, video, a prompt library, and an on-canvas agent. It has about 9,100 stars and 148 stars today, third among AI repositories on today's trending lists that this newsletter has not already covered. It speaks an OpenAI-compatible API, so you point it at an endpoint you are allowed to use. The current release is v0.20.0. The interface and readme are primarily in Chinese."}]}}]}</script>
