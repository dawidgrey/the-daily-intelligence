  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-09.html#webpage","name":"The Daily Intelligence — 2026-09-09","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-09.html","description":"Today’s issue follows AI from personal errands and enterprise deployment to mathematics, genomics and creative work. The useful thread is not simply greater capability: it is whether actions can be checked, access can be controlled, and results can be measured rather than inferred from activity.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-08T20:00:00Z","dateModified":"2026-09-15T20:03:58Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/","name":"Meta launches Muse to act across email, travel, shopping and the web","description":"Meta is rolling out Muse in the US on iOS, Android and the web as a personal agent that can browse, fill forms, send email, book travel and make purchases after required approvals. Meta says each user receives an isolated cloud computer, with a separate Sentinel agent reviewing outbound actions and an audit trail showing what Muse has done."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/navier-stokes-solution","name":"OpenAI publishes an AI-generated, Lean-checked answer to the Navier–Stokes problem","description":"OpenAI says an internal model and roughly 10,000 coordinating agents produced a proposed resolution of the Navier–Stokes existence and smoothness Millennium Prize problem, followed by a Lean formalization using GPT-6 Astra. The paper and proof code are public, but the extraordinary mathematical claim still requires independent expert scrutiny and formal recognition is not automatic."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/alphagenome-atlas-a-predictive-map-of-every-possible-dna-letter-change-in-the-human-genome/","name":"AlphaGenome Atlas maps predicted effects for nine billion possible DNA changes","description":"Google DeepMind has released a free academic portal and API containing AlphaGenome predictions for every possible single-letter change in the human genome. The one-petabyte resource also introduces a combined variant-impact score, and collaborators report using it to prioritize variants later checked in rare-disease experiments."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/introducing-chatgpt-images-2-5","name":"ChatGPT Images 2.5 adds faster generation, targeted edits and an in-app sketch tool","description":"OpenAI is rolling Images 2.5 out across ChatGPT, ChatGPT Work and Codex, claiming up to 50% lower generation latency plus better subject preservation and multi-turn editing. ChatGPT also gains drawing references, templates and image comments, while developers receive Flare and higher-precision Sunburst API models."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/1password","name":"1Password reports shorter pull-request cycles after embedding Codex across development","description":"An OpenAI customer study says 1Password measured a 20.9% productivity improvement among its core Codex cohort and a 10.9% reduction in median pull-request cycle time. Its workflow spans planning, implementation, review, tests and incident investigation, while secret references are resolved only when approved tools run so plaintext credentials do not enter model context."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/teen-development-research-grants","name":"OpenAI offers $5 million for independent research on AI and teen development","description":"OpenAI is accepting worldwide proposals on how generative AI affects people aged 13–17, with individual grants up to $1 million and applications due October 6. Eligible work includes well-being, relationships, patterns of use and safeguards, with ethics review, consent, privacy and safeguarding requirements for research involving minors."},{"@type":"ListItem","position":7,"url":"https://newsroom.accenture.com/news/2026/accenture-and-google-cloud-deepen-partnership-with-formation-of-new-accenture-gemini-enterprise-business-group","name":"Accenture and Google Cloud form a 1,000-engineer unit for Gemini deployments","description":"Accenture and Google Cloud are creating a dedicated Gemini Enterprise group and plan to establish a 1,000-person forward-deployed engineering workforce. The unit will build industry solutions and help customers move from small experiments into production; the companies cite a YouTube support deployment with 37% lower average handling time and 11% higher customer sentiment."},{"@type":"ListItem","position":8,"url":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","name":"Mistral raises €3 billion to expand open-weight models and sovereign AI infrastructure","description":"Mistral says Samsung-led investors have backed a €3 billion Series D at a post-money valuation above €21 billion. The French company plans to expand model research, compute, infrastructure and international sales around a stack that emphasizes open weights, private deployment and customer control over data and systems."},{"@type":"ListItem","position":9,"url":"https://jasondoyle.ie/whitepapers/the-ai-bill-of-materials-is-an-operational-record/","name":"An operational AI bill of materials tracks models, prompts, data, tools and permissions","description":"A detailed white paper argues that an ordinary software bill of materials misses AI components that can change behavior without a code release, including hosted models, prompts, retrieval indexes, datasets and agent authority. It proposes a versioned dependency graph that separates supplier declarations from verified facts, internal assessments and runtime observations."},{"@type":"ListItem","position":10,"url":"https://the-decoder.com/meta-drops-ai-usage-from-engineer-performance-reviews-after-tokenmaxxing-backfires/","name":"Meta reportedly drops raw AI usage from engineer performance reviews","description":"The Decoder, citing an internal memo reported by The Information, says Meta will stop using AI dashboards and token consumption in engineer performance reviews and instead judge the quality, speed and complexity of work. The earlier activity metric reportedly encouraged employees to consume tokens to improve their leaderboard position while internal AI costs rose."},{"@type":"ListItem","position":11,"url":"https://github.com/ayghri/i-have-adhd","name":"An ADHD-friendly skill makes coding agents lead with the next action","description":"The MIT-licensed i-have-adhd project packages ten communication rules for coding agents, including leading with the next action, numbering steps, suppressing tangents and making progress visible. It supports several coding-agent environments, has roughly 29,700 stars and led the day’s collected AI-related GitHub trend momentum."},{"@type":"ListItem","position":12,"url":"https://github.com/OpenBMB/MiniCPM","name":"MiniCPM trends with compact models designed for local and on-device use","description":"OpenBMB’s MiniCPM repository collects compact language-model releases, inference examples, fine-tuning and quantization tools, with recent work around the MiniCPM5 family and speculative decoding. The project has roughly 10,600 stars and ranked second in the day’s collected AI-related GitHub trend momentum."},{"@type":"ListItem","position":13,"url":"https://github.com/0x4m4/hexstrike-ai","name":"HexStrike connects AI agents to more than 150 security-testing tools","description":"HexStrike is an MIT-licensed MCP framework that exposes more than 150 penetration-testing and security-research tools to AI agents, with packaged agents for vulnerability analysis and related workflows. The roughly 11,700-star project ranked third in the day’s collected AI-related GitHub trend momentum."}]}}]}</script>
