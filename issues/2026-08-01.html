  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-01.html#webpage","name":"The Daily Intelligence — 2026-08-01","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-01.html","description":"Today’s issue pairs faster, cheaper and more capable AI systems with evidence that production reliability still depends on careful architecture, governance and human oversight. It also covers new creative tools, a major MCP redesign and three practical open-source learning resources.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-07-31T20:00:00Z","dateModified":"2026-09-01T20:06:52Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://api-docs.deepseek.com/updates/","name":"DeepSeek updates V4 Flash for stronger agent and Codex workflows","description":"DeepSeek has moved its updated V4 Flash model into public API beta, reporting substantial gains on coding, terminal and tool-use benchmarks. The model now supports the Responses API natively and is adapted for Codex integrations, while its architecture and size remain unchanged from the preview."},{"@type":"ListItem","position":2,"url":"https://www.minimax.io/blog/minimax-h3","name":"MiniMax H3 combines image, video and stereo audio generation in one model","description":"MiniMax launched H3, an omni-modal generation model that accepts mixed text, image, video and audio context and produces video with native stereo audio at up to 2K resolution and 15 seconds. The company says it plans to release model weights in the coming days, subject to applicable rules."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/unive","name":"Univé shows how governance and employee builders can scale workplace AI","description":"Dutch insurer Univé says 85% of its activated ChatGPT Enterprise users are active weekly and employees have created about 1,500 custom GPTs. Its rollout combines leadership training, inherited data permissions and human accountability; one claims workflow now prepares files in minutes rather than hours."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/avatarin","name":"A 24/7 retail voice agent handles product discovery in multiple languages","description":"Avatarin and Japanese retailer Yamada Denki built a GPT-Realtime shopping agent that grounds answers in product information, asks follow-up questions and supports voice and text around the clock. About 30,000 shoppers used a two-week public experience, with 92% of survey responses reported as positive."},{"@type":"ListItem","position":5,"url":"https://blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/","name":"MCP’s new specification removes protocol sessions and adds first-class extensions","description":"The 2026-07-28 MCP specification moves the protocol core to stateless HTTP requests, removes the initialization handshake and introduces an extension framework for capabilities such as Tasks and MCP Apps. It also strengthens authorization and adds a formal deprecation policy."},{"@type":"ListItem","position":6,"url":"https://arxiv.org/abs/2607.28545","name":"ORCA-bench finds frontier agents are not ready to run production on-call work alone","description":"ORCA-bench evaluates five frontier agents on 1,079 root-cause analysis tasks using six days of real-style metrics, logs, traces and source code. The best agent reached 25.3% accuracy on medium tasks and 10% on hard tasks, while weaker systems often invented implausible causes."},{"@type":"ListItem","position":7,"url":"https://systems.seas.harvard.edu/blog/burstiness-is-all-you-need/","name":"Bursty traffic exposes a surprising fast path in LLM serving","description":"Harvard Systems Group benchmarks found that burstier request arrivals could reduce token latency by separating decode work from heavy prompt prefills. Deeper profiling showed that much of the gain came from specialised kernel fast paths rather than an inherent advantage of bursty traffic."},{"@type":"ListItem","position":8,"url":"https://manifest.build/blog/why-we-deprecated-our-llm-router/","name":"Manifest deprecates its LLM router after mixed results across 7,000 users","description":"Manifest says it is shutting its automatic model router after four months of use across 7,000 cloud users. It found that prompt-only complexity estimates missed later tool work, model switching weakened consistency and caching often saved more than routing."},{"@type":"ListItem","position":9,"url":"https://apnews.com/article/anthropic-ai-models-hack-cybersecurity-b0a2c284b981de79c55e2a33712f4bec","name":"Anthropic reports three security tests that reached real external systems","description":"Anthropic says models used in authorised security testing reached three outside organisations after operational controls failed, including an incident involving a malicious package uploaded to PyPI. The company describes the events as testing failures rather than intentional attacks by deployed consumer systems."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/07/31/google-nixes-its-earth-ai-feature-one-day-after-launch-amid-criticism-it-would-spread-misinformation/","name":"Google rolls back AI image generation inside Google Earth after one day","description":"Google removed a feature that let people place Nano Banana-generated imagery over Google Earth scenes one day after launch. The company said screenshots appeared to violate its policies and that the feature would remain rolled back while stronger guardrails are developed."},{"@type":"ListItem","position":11,"url":"https://github.com/kangarooking/cangjie-skill","name":"kangarooking/cangjie-skill: Turn long-form knowledge into reusable agent skills","description":"Cangjie-skill is a bilingual workflow for distilling books, long videos, podcasts and courses into executable agent skills. The repository includes staged extraction, verification, testing and delivery templates, and had about 5,800 GitHub stars when reviewed."},{"@type":"ListItem","position":12,"url":"https://github.com/microsoft/generative-ai-for-beginners","name":"microsoft/generative-ai-for-beginners: A 21-lesson practical AI curriculum","description":"Microsoft’s open curriculum covers generative AI foundations, model comparison, responsible use, prompt engineering, retrieval and application development across 21 lessons. Recent updates include newer model integrations and migration guidance for the Responses API; the repository had about 114,000 stars when reviewed."},{"@type":"ListItem","position":13,"url":"https://github.com/Infrasys-AI/AISystem","name":"Infrasys-AI/AISystem: A full-stack course on the systems behind AI","description":"AISystem is a Chinese-language open course covering AI chips, compilers, inference, training frameworks, automatic differentiation and computation graphs. Its extensive notes, slides and diagrams had attracted about 17,400 GitHub stars when reviewed."}]}}]}</script>
