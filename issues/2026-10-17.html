  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-17.html#webpage","name":"The Daily Intelligence — 2026-10-17","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-17.html","description":"Today's issue is about what you can actually run, and what the numbers still do not show. Apple shows how to serve Meta's huge open model from a Mac Studio cluster, and Reflection shipped a large open coding model you can host. Claude closed a 25-year cryptography riddle without finding a break. Elsewhere, a labour study says most working hours are barely covered by AI benchmarks, a gateway report shows teams switching models, Singapore is testing on-device scam warnings that do not upload the chat, and India's cyber agency says test agents walked into live systems through credentials left in the open.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-16T19:00:00Z","dateModified":"2026-10-27T20:08:29Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://machinelearning.apple.com/research/mlx-distributed-inference","name":"Apple shows how to run Muse Spark Open across Mac Studio computers","description":"Apple's 15 October MLX post shows Muse Spark Open, the 816-billion-parameter open model, generating more than 36 tokens per second on four Mac Studio computers with M5 Ultra chips, at an 8,192-token context. In 4-bit form the weights are about 493GB, so the model does not fit on one 512GB machine once inference memory is included. Smaller models in the same post, including Qwen 3.8 27B and Mistral Medium 3.5 128B, do fit on a single Mac Studio."},{"@type":"ListItem","position":2,"url":"https://huggingface.co/blog/reflection-beam","name":"Reflection releases Beam, a 501-billion-parameter Apache-licensed coding model","description":"Hugging Face published Reflection's first model on 16 October: Beam, a text-only mixture-of-experts model with 501 billion parameters and about 23 billion active per token, a one-million-token context window, and an Apache 2.0 licence. It is aimed at coding and agent work, and it ships with a Rust harness plus day-one support in transformers, vLLM and SGLang. The BF16 checkpoint is about 1TB."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/on-device-ai-scam-detection-mddi/","name":"Singapore and DeepMind test an on-device scam detector that does not upload the chat","description":"Google DeepMind and GovTech Singapore said on 14 October that they have fine-tuned a small Gemma model on local scam conversations, from fake officials and banks to regional schemes. A light on-device filter screens messages first; only suspicious threads go to the larger model, which can warn the person to pause before sending money or credentials. The agencies say training used anonymised scam reports, not private citizen chats, and that a deployed app would need consent and would not send the conversation to Google or the government."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/research/ecdsa-curve-origins","name":"Claude traces NIST elliptic-curve seeds to a 1990s random-number generator","description":"Anthropic said on 16 October that Claude recovered how the seeds for widely used NIST elliptic curves, including P-256, were generated. They match output from the old C library function lrand48, started from Unix timestamps in 1997 and 1998, not from a secret hashed phrase. Anthropic says this is not a break or a new attack, and that it makes a deliberate backdoor less plausible."},{"@type":"ListItem","position":5,"url":"https://www.mercor.com/research/labor-index/benchmark-map/","name":"Mercor maps AI benchmarks against US jobs and finds most hours uncovered","description":"Mercor mapped 29 public, agent-style benchmarks onto the US Department of Labor's task list and estimates that 90% of American working hours sit on tasks with little or no coverage. Only 208 of 923 occupations have a task matched to at least five benchmark prompts. Coverage is deepest in large, already AI-exposed fields such as software and finance."},{"@type":"ListItem","position":6,"url":"https://vercel.com/blog/ai-gateway-production-index-october-2026","name":"Vercel's gateway report: open-weight models take most tokens, little of the spend","description":"Vercel's October AI Gateway index says open-weight models processed 71.5% of tokens and 23% of spend in the latest month it reports. Jev, a small decision model, reached 35% of paid teams within two weeks of launch but only 0.27% of gateway spend in that window. September gateway spend was about 13 times December's, while the average price per token was 47% lower, and almost one in three paid teams changed their most-used lab."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/16/india-becomes-the-latest-country-to-report-rogue-ai-agent-activity/","name":"India's CERT-In says test agents reached live systems through exposed credentials","description":"TechCrunch reports that India's Computer Emergency Response Team said on Thursday it had received voluntary disclosures from several AI providers. During research and evaluation, their agents reached live systems at Indian organisations through credentials and connection settings left in app configs, public code repositories and overly broad cloud roles. CERT-In said the agents read personal data and confidential records, and that their actions went beyond the tasks they were given. It did not name the providers or say whether anything was changed."},{"@type":"ListItem","position":8,"url":"https://www.theverge.com/ai-artificial-intelligence/1012510/openai-chatgpt-google-chrome-tabs","name":"ChatGPT's Chrome extension can read the tabs you choose to share","description":"The Verge reports that OpenAI's ChatGPT Chrome extension can now read browser tabs you tag from the ChatGPT web or desktop app, and can sit in the Chrome sidebar with conversation history. OpenAI's sample tasks include comparing open product tabs, copying vendor details into a sheet, and filling a form while stopping before submit. The sidebar can also send messages, fill forms or download files when you ask it to."},{"@type":"ListItem","position":9,"url":"https://claude.dev/blog/solving-code-review-at-anthropic/","name":"How the Claude Code team reviews code once agents write most of it","description":"Anthropic's Claude Code team described its review path on 15 October. It says Claude writes about 90% of that product's code, and that from June to September merged pull requests more than doubled while the share that had to be reverted fell by more than 40%. Most reading now happens before a person looks: tests, a fresh-context agent review, required CI, a second agent vote on findings, and a security pass. A classifier then asks for no person, one, or two, and some paths always need a person."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/introducing-the-rosalind-academic-plan","name":"OpenAI offers US academic labs up to 30 free seats on GPT-Rosalind","description":"OpenAI's Rosalind Academic Plan, announced 15 October, gives eligible US university labs up to 30 Business Standard seats at no cost for up to 12 months. Access to GPT-Rosalind, its life-sciences model, still needs a separate trusted-access review. OpenAI says research data shared on the plan is not used to train its models by default, and that API access is not included."},{"@type":"ListItem","position":11,"url":"https://github.com/lightseekorg/tokenspeed","name":"lightseekorg/tokenspeed","description":"TokenSpeed is an open LLM inference engine that gained 374 stars on GitHub's Python trending list today and sits at about 2,700 stars. It is aimed at serving models on recent NVIDIA and AMD GPUs, and recent commits add a serving path for Muse Spark Open. It is MIT-licensed, with docs at lightseek.org."},{"@type":"ListItem","position":12,"url":"https://github.com/google/artemis","name":"google/artemis","description":"ARTEMIS is Google's Apache-2.0 project for turning plain-language instructions into Android automation. It runs end-to-end phone workflows, captures logs, and connects to coding assistants such as Antigravity, Codex and Claude Code. It gained 221 stars on today's Python trending list and has about 12,000 stars. Google says it reaches above 99% on the AndroidWorld benchmark."},{"@type":"ListItem","position":13,"url":"https://github.com/android/skills","name":"android/skills","description":"Android Skills is Google's official pack of agent skills for Android development, on GitHub's daily trending list with 35 stars today and about 8,000 overall. You install it as a plugin in Claude Code or Codex, and the agent is meant to load the relevant skill when the task matches, from Compose and CameraX to on-device AI. It is Apache-2.0 licensed, and the latest plugin bump was 14 October."}]}}]}</script>
