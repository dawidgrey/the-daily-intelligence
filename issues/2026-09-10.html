istItem","position":2,"url":"https://openai.com/index/gpt-6-astra-next-generation-work","name":"GPT-6 Astra targets computer use and complex professional workflows","description":"OpenAI has made GPT-6 Astra available in ChatGPT Work, Codex and its API, emphasizing computer use, browsing, coding and document-heavy professional work. API pricing starts at $10 per million input tokens and $50 per million output tokens, while enterprise controls can restrict websites, desktop applications, uploads and downloads."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/codex-quantum-computing-experiments","name":"Codex runs routine quantum-chip measurements while researchers retain oversight","description":"An MIT Engineering Quantum Systems researcher connected GPT-5.6 Sol through Codex to laboratory software for calibrating a six-qubit chip. The agent could choose parameters, run and analyze routine measurements when signals were clear, but weak or noisy results still required experienced guidance."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/supporting-journalism-from-classrooms-to-newsrooms","name":"OpenAI expands AI training and tool access for journalism schools and newsrooms","description":"OpenAI is providing more than 400 ChatGPT Edu subscriptions to graduate students and faculty at CUNY’s Newmark J-School and Northwestern’s Medill School, alongside training and workflow development. It is also extending enterprise access, API credits and reusable playbooks through journalism partners including the American Journalism Project and WAN-IFRA."},{"@type":"ListItem","position":5,"url":"https://huggingface.co/blog/ibm-research/ibm-releases-sota-granite-time-series","name":"IBM releases an open 385M-parameter model for zero-shot time-series forecasting","description":"IBM has released Granite Time Series PatchTST-FM-r2, a roughly 385 million-parameter model for forecasting demand, prices, energy loads, traffic and other time series without task-specific training. The weights, architecture, inference pipeline and benchmark code are available under commercial-friendly Apache 2.0 or OpenMDW 1.0 licensing."},{"@type":"ListItem","position":6,"url":"https://sierra.ai/blog/hyper-t-bench-evaluating-agents-that-build-agents","name":"Hyper-tau-bench finds agents still struggle to build reliable agents alone","description":"Sierra has open-sourced hyper-tau-bench, an evaluation in which a developer agent must recover requirements from messy business records, build a customer-service agent and pass unseen production-style tests within a cost budget. Its best fully automated configuration passed 23.9% of held-out tasks, compared with 82.2% for an experienced engineer working with a frontier model."},{"@type":"ListItem","position":7,"url":"https://arxiv.org/abs/2609.09153","name":"Procedural Graphs let agents revise the order and conditions of their own workflows","description":"A new preprint proposes Procedural Graphs, which represent agent know-how as linked procedures describing what to do, in what order and under which conditions. A refiner compares successful and failed trajectories, edits the graph and retains changes only when they preserve or improve held-out validation performance."},{"@type":"ListItem","position":8,"url":"https://www.natomy.com/med-evals","name":"Medical benchmark shows strong model scores—and why they are not clinical proof","description":"Natomy tested leading models zero-shot on MedXpertQA, including 2,000 questions with clinical images and 2,450 text-only questions. Gemini 3.8 Flash led the reported single runs, but the authors flag duplicated answer choices, occasional contradictory questions, image problems, exact-match grading and small subgroup samples."},{"@type":"ListItem","position":9,"url":"https://knowablemagazine.org/content/article/mind/2026/how-ai-can-listen-for-signs-of-schizophrenia","name":"Researchers test whether speech patterns can support earlier schizophrenia assessment","description":"Researchers are studying whether machine learning can detect patterns in pauses, intonation, loudness and language that may help clinicians assess schizophrenia earlier and monitor changes over time. Small studies report promising classification results, but differences in language, recording conditions, medication and population make broad clinical use difficult."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/09/09/apple-has-a-new-way-prove-your-iphone-photos-arent-ai-slop/","name":"Apple’s Reference Image creates a signed comparison for edited iPhone photos","description":"Apple has introduced Reference Image for the iPhone 18 Pro, using signed sensor data and Private Cloud Compute to create an unalterable comparison image that can reveal later changes. The reference is initially viewable in Photos, with developer APIs planned, and Apple is also supporting SynthID for identifying AI-created or altered images."},{"@type":"ListItem","position":11,"url":"https://github.com/experientiallabs/experiential","name":"Experiential routes agent traffic across hosted, BYOK and local models","description":"Experiential is an Apache-2.0 open-source gateway that presents hosted, bring-your-own-key and local models through one OpenAI-compatible API. The roughly 3,700-star project adds user and agent access controls, spending limits, traffic-based routing and tools for optimizing a router or specialized model from production traces."},{"@type":"ListItem","position":12,"url":"https://github.com/Tencent/teamai-cli","name":"Tencent’s TeamAI CLI turns agent lessons into shared team context","description":"TeamAI CLI is an MIT-licensed toolkit for running multiple coding agents while maintaining shared skills, rules, role definitions and a codebase knowledge graph in version-controlled files. The roughly 2,900-star project supports several agent tools and can import repositories, save privacy-scrubbed session summaries and generate team usage digests."},{"@type":"ListItem","position":13,"url":"https://github.com/vastsa/PI-Desktop","name":"PI-Desktop packages a local-first coding agent with installable plugins","description":"PI-Desktop is a local-first desktop coding-agent application built with Electron and a Rust host core, with provider configuration, workspace tools, permissions and user-installable plugins. The approximately 1,600-star project is under active development and publishes packaged releases alongside its source."}]}}]}</script>
