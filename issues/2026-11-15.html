  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-15.html#webpage","name":"The Daily Intelligence — 2026-11-15","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-15.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Anthropic let a Claude Code project run parallel threads after you step away, and opened a private way to keep that control plane on your own network. A security firm found AI-built apps leaving personal records readable. The rest is what to check before you trust a safety score, a token bill, or an agent with a login.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-14T19:00:00Z","dateModified":"2026-11-14T20:10:50Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://claude.com/resources/articles/projects-redesigned","name":"Claude can run the threads. You still pick the goal.","description":"Anthropic is rolling out redesigned Claude Code projects in beta. You set a goal and the repositories. A coordinator splits the work into threads, and each thread is a cloud Claude Code session on its own branch. You can watch or steer from the project chat, including from a phone, and the work can continue after you leave the computer. Access starts with selected Pro and Max users who already use cloud sessions and do not have existing web or desktop projects."},{"@type":"ListItem","position":2,"url":"https://claude.com/resources/articles/self-hosted-claude-managed-agents","name":"The agent can stay on your network. The beta is private.","description":"On 12 November, Anthropic opened a private beta for self-hosted Claude Managed Agents. The harness, sandboxes, credentials, and session history can run in your own cloud or on your own machines. Model calls can go to Anthropic, Amazon Bedrock, Google's Agent Platform, Microsoft Foundry, or a gateway you run. Developers still use the same core APIs as the hosted service."},{"@type":"ListItem","position":3,"url":"https://www.crissyfield.de/research/lovable-en/","name":"The app was easy to build. The records were easy to read.","description":"Crissy Field examined 159,041 Lovable projects archived from December 2025 to September 2026. Of 24,664 sites that sent database records as soon as the page loaded, the firm found email-bearing records in 7,403 of them. The examples include a forum with more than 80,000 profiles and 200,000 chat messages, and one service with more than 1,000 identity-document records, including passport numbers. The firm says that 30 percent figure is not a confirmed leak rate, and it is not publishing how the records were retrieved."},{"@type":"ListItem","position":4,"url":"https://www.apra.gov.au/news-and-publications/apras-system-risk-outlook-november-2026","name":"The buffers held. The patch window is getting shorter.","description":"On 12 November, APRA published its System Risk Outlook. The regulator says Australia's banks, insurers, and super funds remain resilient, and that this cannot be assumed if financial and operational shocks arrive together. It says frontier models are getting better at finding software flaws and automating complex cyber tasks, which can leave less time to patch. Its 2027 system stress test will look at AI-driven economic disruption, including a sharp fall in AI-related asset values."},{"@type":"ListItem","position":5,"url":"https://www.langchain.com/blog/series-c","name":"LangChain raised $300 million to sell control of agents, not a model.","description":"On 13 November, LangChain said it raised $300 million at a $3 billion valuation, led by CapitalG. That is more than double the $1.25 billion valuation from about a year ago. The company says more than 7,000 organisations use LangSmith to run, test, and govern agents without locking the work to one model. It also says Workday cut the time to deploy a new agent from five months to under a day. Those customer figures are LangChain's."},{"@type":"ListItem","position":6,"url":"https://research.google/blog/advancing-science-engineering-with-antigravitys-teamwork-feature/","name":"The agents searched. People still checked the proof.","description":"On 13 November, Google Research reported results from Antigravity's /teamwork, a multi-agent setup built on Gemini 4 models. Partner teams used it on open problems in maths, chemistry, and systems work. One result is a Lean-checked proof of the 2013 Courtade–Kumar conjecture, produced with researchers from Google, CUHK, USC, and CMU. Google says the tools are available in Antigravity, with more features still rolling out to outside users."},{"@type":"ListItem","position":7,"url":"https://www.anthropic.com/research/building-strong-safety-evaluations","name":"A safer score can mean the test asked the wrong question.","description":"Anthropic published a guide for people who build or rely on AI safety tests. The warning is that a safety claim is only as sound as the test behind it. A model that refuses every sensitive prompt can score well and still fail a person who needed a careful answer. In a Claude Fable 5.1 check, Anthropic says a system-prompt change moved the appropriate-response rate from 60 percent on the API to 94 percent on claude.ai."},{"@type":"ListItem","position":8,"url":"https://news.umich.edu/generative-ai-uses-more-energy-on-non-english-text/","name":"The same question can cost more tokens in another language.","description":"A University of Michigan study, published on 5 November and presented at EMNLP, measured Qwen 3, Gemma 3, and Llama 3.1 on reading questions in 122 languages. English used the least energy. Hindi used about 7.9 times as much as English, and Bengali about 15.3 times. The researchers say the gap comes from more tokens, and that languages using more tokens also tended to get weaker answers. Western European languages were often at twice the English energy, or less."},{"@type":"ListItem","position":9,"url":"https://openai.com/business/customer-stories/shield","name":"The agent can click the old portal. A person still sets the limit.","description":"On 13 November, OpenAI published a customer story about Shield, an IT-services firm. Shield says GPT-6 Astra now handles supported browser tasks in older portals that have no API, inside its Forge platform. Technicians choose which actions the agent may take alone and which need a review. Shield says these browser workflows are live, with thousands of runs a month, and that the model was 35 to 40 percent faster than the computer-use models it used before. Phone calls, on-site work, and remote-desktop tasks still need a person."},{"@type":"ListItem","position":10,"url":"https://developer.nvidia.com/blog/when-one-gpu-isnt-enough-serving-glm-5-3-across-two-nvidia-dgx-stations-with-vllm/","name":"GLM-5.3 does not fit one GPU. Two stations can share it.","description":"On 13 November, NVIDIA published a tutorial for serving GLM-5.3 NVFP4 across two DGX Stations with vLLM. The quantized model has 753 billion parameters, with about 40 billion active per token, and the checkpoint is about 464 GB. That is more than the 252 GB on one GB300 GPU. The setup splits the weights across both machines and exposes one OpenAI-compatible endpoint. On NVIDIA's own coding benchmark, output peaked at 607.8 tokens per second with 16 requests at once."},{"@type":"ListItem","position":11,"url":"https://github.com/tradermonty/claude-trading-skills","name":"tradermonty/claude-trading-skills: a checklist before the trade, not a tip","description":"Claude Trading Skills is an open toolkit of Claude skills for individual investors who cannot watch the market all day. It covers market review, charts, calendars, screeners, risk checks, trade planning, and a journal. The author says the point is a better decision process, not handing buy and sell decisions to a model. It led today's Python list on GitHub Trending, with 556 stars in the day."},{"@type":"ListItem","position":12,"url":"https://github.com/JuliusBrussee/caveman","name":"JuliusBrussee/caveman: shorter agent talk, same code, author's own numbers","description":"Caveman is an open skill and proxy that tells a coding agent to say less and read less, while leaving the code unchanged. The repository now also promotes Caveman Code, a desktop app the author says runs on subscriptions and keys you already have. On the author's November runs, one test cut input tokens by 33.2 percent across 54 Claude Code sessions, with the answers still marked correct. GitHub Trending listed it with 227 stars today."},{"@type":"ListItem","position":13,"url":"https://github.com/NVIDIA/SkillEvaluator","name":"NVIDIA/SkillEvaluator: test the skill before you trust the agent","description":"SkillEvaluator is NVIDIA's framework for checking agent skills, the folders of instructions an agent loads before a task. It starts with quality checks, including overlap between skills, and can then compare live runs with the skill on and off. The first tier runs from the command line without an API key. It is Apache-2.0 licensed and gained 168 stars on GitHub Trending today."}]}}]}</script>
