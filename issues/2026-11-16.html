  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-16.html#webpage","name":"The Daily Intelligence — 2026-11-16","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-16.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today Google let a US Gemini app read Wallet spending, but not move the money. Meta's Muse can phone a US business if you pay, and the person who answers may hang up. Mozilla will delete about 54,000 Solo websites on 30 November. The rest is a nationwide flight adviser a person still has to accept, a coding pause that is going away, and two open voice models you can run yourself.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-15T19:00:00Z","dateModified":"2026-11-19T20:11:35Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blog.google/innovation-and-ai/products/gemini-app/google-wallet-gemini-app/","name":"Gemini can read the spending. It cannot move the money.","description":"On 13 November, Google started letting Gemini app users in the United States connect Google Wallet. You can ask it to chart last quarter's spending, list subscriptions and price rises, or draft a holiday budget from last year's gifts and travel. A deeper read needs a bank or card link through Plaid. The connection is off until you turn it on, on the web or in the Android and iOS apps, and you can turn it off again."},{"@type":"ListItem","position":2,"url":"https://blog.google/innovation-and-ai/products/gemini-app/gemini-on-apple-carplay/","name":"Gemini Live is on the CarPlay screen. The brief is not for everyone.","description":"On 11 November, Google began rolling Gemini Live out to Apple CarPlay for Gemini users on iOS, in every language Gemini Live already supports. Update the iPhone app, allow the microphone, use Live once on the phone, then tap the Gemini icon on the car display. It can walk through the calendar, summarize Gmail, or rehearse a meeting. The chat syncs back to the phone when you park."},{"@type":"ListItem","position":3,"url":"https://techcrunch.com/2026/11/12/muse-can-now-place-calls-to-u-s-businesses-if-you-pay/","name":"Muse will phone the business. The business may hang up.","description":"On 12 November, Meta opened Muse phone calls to paid subscribers in the United States. Alexandr Wang, Meta's chief AI officer, said it can take the calls people avoid, including cable, the DMV, or a restaurant with no online booking. Plans start at $20 a month for 500 million Muse tokens a week, or $100 a month for 3 billion. TechCrunch reports that many businesses hang up once they hear an agent."},{"@type":"ListItem","position":4,"url":"https://www.theregister.com/software/2026/11/13/mozilla-leaves-solo-website-owners-to-go-it-alone-as-hosting-shuts-down/5309632","name":"Solo closes on 30 November. The page does not move itself.","description":"Mozilla is shutting Solo, the builder that used a language model to make a page and then hosted it. The Register reports that about 54,000 people used it. The Soloist.ai homepage says operations stop on 30 November 2026. Mozilla told The Register it first wrote to customers on 1 October. A ZIP export includes the HTML, form and newsletter submissions, and a spreadsheet of image links. The images are a separate download. Domains bought through Solo have to move to Name.com."},{"@type":"ListItem","position":5,"url":"https://arstechnica.com/features/2026/11/faa-expands-ai-advice-to-manage-air-traffic-congestion-across-entire-us-airspace/","name":"The adviser covers all 22 centers. A person still accepts the route.","description":"On 10 November, the US Federal Aviation Administration said it will use SMART, its $875 million traffic adviser, in the airspace of all 22 centers. Since 21 September, in the Washington region, the agency says it rerouted 180 flights and saved about 10 minutes and almost 80 gallons of fuel per flight. Those figures are the FAA's, for that first region. A team in Washington checks a recommendation before it goes out. Local controllers can refuse it. The system is not allowed to fly the aircraft."},{"@type":"ListItem","position":6,"url":"https://github.com/openai/codex/issues/18490#issuecomment-6890525683","name":"Codex is dropping plan mode. No date yet.","description":"On 15 November, an OpenAI maintainer wrote on a Codex GitHub issue that plan mode will be deprecated soon, and that the team will not add new plan-mode features. The issue, a request to compact the context before implementing a plan, was closed as not planned. The comment does not give a date, or say what replaces the step."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/allenai/xybench","name":"The model answered the question. The question was the wrong one.","description":"On 13 November, the Allen Institute for AI released XYBench, 8,115 questions where the stated request is not the real problem. It won the Best Resource Paper award at EMNLP 2026. On the Stack Overflow items, five models included a fix for the stated request in 75 to 86 percent of answers, and a fix for the underlying goal in 59 to 71 percent. They focused on the underlying goal in only 35 to 41 percent of answers. Human reference answers steered people off the mistaken approach more often."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/salesforce-sovereign-intelligence/sov-transcribe-1","name":"An open speech model, meant to get the email address right.","description":"On 12 November, Salesforce released SOV-Transcribe-1 under the Apache 2.0 license. It has 4 billion active parameters, 26 billion in total, and it transcribes a finished recording rather than a live stream. Salesforce says that, as of 12 November, it had a 2.28 percent word error rate on Artificial Analysis, first among open-weight non-streaming models and seventh overall. On a private test of phone numbers, emails, and code symbols, it passed 76.3 percent of recordings and recovered 93.4 percent of the target terms."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/Zyphra/zonos3-mini","name":"A small voice model can run on the phone. It can also copy a voice.","description":"On 11 November, Zyphra released ZONOS3-Mini, with weights under Apache 2.0. It uses 100 million active parameters, 800 million in total, and it speaks 43 languages. Zyphra says time to the first audio was under 570 milliseconds in the browser on a Pixel 9, and under 150 milliseconds on an M3 MacBook Air. On Zyphra's own multilingual test, it ranked first among open-weight models."},{"@type":"ListItem","position":10,"url":"https://unemploymentlabs.com/checkpoint-forensics","name":"Six open models match a Blackwell start. That is not a map of the chips.","description":"On 12 November, Will DePue published a forensic read of public model weights. Six models from DeepSeek, Moonshot AI, MiniMax, and Ant Group match the starting pattern of NVIDIA Blackwell chips. DeepSeek-V4-Flash and MiniMax-M3 match a B200 or B300. DeepSeek-V4-Pro, Kimi K3, Kimi K3.1-Pro, and Ling-3.1-flash match a GB200 or GB300. Earlier models from the same labs match the older Hopper pattern. The newest readable models from Alibaba, Zhipu, Tencent, Xiaomi, and StepFun still read as Hopper."},{"@type":"ListItem","position":11,"url":"https://github.com/andrewyng/openworker","name":"andrewyng/openworker: a desktop coworker that still has to ask","description":"OpenWorker is Andrew Ng's open desktop app for research, writing, and code review, plus a harness SDK for building your own agent app. It runs on your machine. You bring a cloud key or a local model through Ollama. GitHub lists about 19,300 stars, and it gained 139 more on today's trending list. The latest release is v0.3.1, from 5 October. It is MIT licensed, and the desktop app is an open beta."},{"@type":"ListItem","position":12,"url":"https://github.com/ag-ui-protocol/ag-ui","name":"ag-ui-protocol/ag-ui: the agent sends events, your app draws the chat","description":"AG-UI is an open, event-based protocol for putting an agent inside an application. During a run, the backend emits one of about 16 event types. The app decides how that looks. It is MIT licensed. GitHub lists about 17,700 stars, and it gained 393 today. The current release is dated 13 November."},{"@type":"ListItem","position":13,"url":"https://github.com/kajisho5/ffmpeg-skill","name":"kajisho5/ffmpeg-skill: cut the video on this machine, with no upload","description":"ffmpeg-skill gives a coding agent 42 local FFmpeg tools, plus an MCP server, for cuts, captions, reframing, loudness, and exports sized for a platform. It needs no cloud account and no API key. GitHub lists about 5,900 stars, and it gained 285 today. Version 3.9.3 landed on 15 November. It is MIT licensed."}]}}]}</script>
