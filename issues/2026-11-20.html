  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-20.html#webpage","name":"The Daily Intelligence — 2026-11-20","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-20.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today, Anthropic's shares started trading on Nasdaq. Canva added a switch for generative AI. United says an outside agent still cannot book the flight.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-19T19:00:00Z","dateModified":"2026-11-19T20:11:34Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://techcrunch.com/2026/11/19/anthropic-hits-nasdaq-exchanges-at-110-27-above-ipo-price/","name":"Anthropic opened at $111.50. The price was still moving.","description":"TechCrunch reported that Anthropic shares began trading on Nasdaq on 19 November, and that in the early minutes they were at $111.50, 33 percent above the $83 IPO price set on Wednesday. That price was already above the $70 to $78 range the company had projected. TechCrunch says the offering will raise over $81 billion."},{"@type":"ListItem","position":2,"url":"https://techcrunch.com/2026/11/19/google-gives-gemini-the-ability-to-use-your-mac-for-you/","name":"Gemini can use a Mac. You still approve the action.","description":"TechCrunch reports that Google announced computer use in the Gemini desktop app for macOS on 19 November. The agent can work across Mac apps and websites in the background, while you watch a live preview and keep your own cursor. You can pause, stop, or approve an action before it happens."},{"@type":"ListItem","position":3,"url":"https://www.canva.com/newsroom/news/ai-controls-canva/","name":"Canva can hide generative AI. Background Remover stays.","description":"On 19 November, Canva said two AI controls are available on Free and Pro at no extra cost. One switch hides generative AI features. The other limits AI-generated items in the library. Canva says Background Remover and Magic Grab stay on, because they edit what is already there."},{"@type":"ListItem","position":4,"url":"https://www.united.com/en/us/fly/help-center/digital-trust-center/artificial-intelligence/third-party-ai-agents.html","name":"United will not let an outside agent book the flight.","description":"United's help page says it is restricting unauthorized third-party AI agents from its site and from travel agencies. That includes booking, changing, canceling, checking in, and opening a MileagePlus account, even if you gave the agent permission. Bookings an agent made before 11 November 2026 will not be canceled."},{"@type":"ListItem","position":5,"url":"https://www.theverge.com/ai-artificial-intelligence/1037151/school-districts-ditching-google","name":"Schools that turn off Gemini may lose Search.","description":"The Verge, citing The New York Times, reports that New York, Los Angeles, and Chicago schools are considering other search tools after Google said schools that opt out of AI features will lose Search. Chris Phillips, Google's vice president of education, told the Times that starting next year those schools will not have access to Search."},{"@type":"ListItem","position":6,"url":"https://help.openai.com/en/articles/6825453-chatgpt-release-notes","name":"ChatGPT Health is reaching Android, desktop, and sites.","description":"OpenAI's release notes for 19 November say Health is rolling out to the desktop app, dots, sites, and Android, including Health Connect. The notes say it can use connected sleep and activity data, and that a dot may suggest a schedule change or a preventive-care reminder from connected records."},{"@type":"ListItem","position":7,"url":"https://www.theverge.com/ai-artificial-intelligence/1037634/openai-chatgpt-live-dictation","name":"Dictation in ChatGPT writes the words as you speak.","description":"The Verge reports that Live Dictation is rolling out globally on every ChatGPT plan, on the web, the desktop app, and iOS and Android. Speech becomes text while you talk. Tap or click the waveform to show the transcript, then edit it in the prompt box."},{"@type":"ListItem","position":8,"url":"https://www.reuters.com/legal/transactional/arizona-says-it-is-investigating-openai-other-firms-over-possible-rogue-agents-2026-11-19/","name":"Arizona opened an inquiry into bank agents. That is not a charge.","description":"Reuters reports that Arizona Attorney General Kris Mayes said on 18 November that the state has opened a criminal investigation into OpenAI and other AI companies over what she called the apparent infiltration of banks by rogue agents. She did not name the other companies or the banks. A Reuters request to OpenAI got no immediate comment."},{"@type":"ListItem","position":9,"url":"https://www.anthropic.com/research/claude-black-hole-physics","name":"Anthropic says Claude finished two black-hole calculations.","description":"Anthropic says Claude Fable 5.2 solved two open problems in the theoretical physics of black holes, and posted the preprints. One result, Anthropic says, is that a sudden switch to a black hole still happens when spacetime has no definite shape. The other is an exact ceiling for the simplest version of a method used to rule out wrong theories of quantum gravity."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/how-openai-performance-factory-keeps-chatgpt-fast","name":"OpenAI's agents are chasing ChatGPT slowdowns.","description":"On 19 November, OpenAI described the Performance Factory, a set of Codex workflows that investigate performance alerts, propose a fix, and check whether speed recovered after deployment. OpenAI says the regression workflow tracked more than 1,700 investigations in a little over three months and found a cause in more than 600."},{"@type":"ListItem","position":11,"url":"https://github.com/mjmirza/app-store-compliance","name":"mjmirza/app-store-compliance: a store-rule check for the coding agent","description":"App Store Compliance gained 542 stars on GitHub's daily trending list. The repo has 1,725 stars. It is a playbook and pre-submission guard for App Store and Google Play rules, with a skill for coding agents. Version 2.4.0 was tagged on 15 November. The license is OpenRoots Agent License 2.3, not a standard open-source license."},{"@type":"ListItem","position":12,"url":"https://github.com/openvinotoolkit/openvino","name":"openvinotoolkit/openvino: run a model on the hardware you have","description":"OpenVINO gained 246 stars on GitHub's daily trending list. The repo has 11,525 stars, under Apache-2.0. It is Intel's open toolkit for optimizing and deploying AI inference. The latest tagged release, 2026.4.1, is from 1 October, so today's climb is not a new release."},{"@type":"ListItem","position":13,"url":"https://github.com/FlashML-org/FreeVideo","name":"FlashML-org/FreeVideo: local video, with a separate weight license","description":"FreeVideo gained 99 stars on GitHub's Python trending list. The repo has 3,409 stars. Version 0.6.4 was tagged on 19 November. The project says it runs MiniMax H3 video generation in as little as 8 GB of video memory and 16 GB of RAM. The code is Apache-2.0. The weights use the MiniMax H3 Community License, which has territorial and use limits."}]}}]}</script>
