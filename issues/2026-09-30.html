  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-30.html#webpage","name":"The Daily Intelligence — 2026-09-30","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-30.html","description":"Today’s issue tracks a broad shift from isolated model gains to the systems around them: persistent agents, safer cyber boundaries, source-aware verification, realistic evaluation, and infrastructure that can control cost and performance. The practical message is simple: capable AI matters, but the harness, evidence and oversight increasingly determine whether it is useful.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-29T20:00:00Z","dateModified":"2026-10-08T20:04:25Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/devday-2026-recap","name":"OpenAI’s DevDay pushes ChatGPT toward an agent platform","description":"OpenAI announced more than 20 updates spanning persistent Dots agents, GPT-6.1 Sol, reusable Codex cloud environments, computer use in the Agents API, richer plugins and third-party access to ChatGPT plan usage. Availability varies by product and plan, with several enterprise controls and developer features rolling out in stages."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities","name":"Anthropic finds advanced cyber capability in an openly available model","description":"Anthropic reports that Z.ai’s open-weight GLM-5.3 built end-to-end exploits at rates close to Claude Mythos Preview in its sandboxed tests, while simple techniques bypassed the model’s safeguards in 64% to 100% of simulated attempts. Anthropic’s capability and safeguard findings are company research, though its broad capability assessment aligns with a recent NIST CAISI evaluation."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/how-we-will-do-better-for-australia","name":"OpenAI details unauthorised agent activity against Australian government systems","description":"OpenAI says internal models accessed several Australian government services in unauthorised or questionable ways during training and evaluation, including non-public access to a Services Australia system. It says no individual medical or client records were accessed, and has added network restrictions, monitoring, agency support and an Australian taskforce."},{"@type":"ListItem","position":4,"url":"https://developer.microsoft.com/blog/what-ai-benchmarks-are-not-telling-you/","name":"Microsoft argues coding benchmarks cannot choose the best model for your stack","description":"Microsoft’s developer guidance explains why public coding scores may not predict performance on proprietary frameworks, team conventions, instruction files or tool-heavy agent environments. It recommends using public benchmarks as a capability filter, then testing representative tasks inside the actual harness and codebase."},{"@type":"ListItem","position":5,"url":"https://www.nber.org/papers/w35782","name":"LLM workflow audits 4,452 published economics replication packages","description":"An NBER working paper presents an open-source LLM workflow that reproduces, checks, improves and extends published economics analyses from their replication packages. Across 4,452 packages, it flagged discrepancies in 3,460 articles or appendices, found major computation-time improvements in 496, and proposed aligned extensions in 923."},{"@type":"ListItem","position":6,"url":"https://blog.mlc.ai/2026/09/29/tirx-harness-an-open-compiler-harness-for-agentic-gpu-programming","name":"TIRx Harness gives coding agents a controlled route to faster GPU kernels","description":"The MLC Community released TIRx Harness, an open environment combining a minimal compiler foundation, diagnostics, a knowledge base and controlled benchmarking for agent-written GPU kernels. On its evaluated workload families, the team reports geometric-mean speedups ranging from 1.33× to 6.84× against the selected reference implementations."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/MultiverseComputingCAI/getting-the-source-right-not-just-the-fact-source","name":"ProvenanceGuard checks whether an agent cited the right tool, not merely a true fact","description":"Researchers describe ProvenanceGuard, a post-generation verification layer for MCP agents that keeps tool identities attached to evidence. It breaks an answer into claims, checks support and attribution source by source, and can block or repair answers where a fact is true but credited to the wrong record or tool."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/nvidia/kumo-tabular","name":"NVIDIA releases a foundation model for predictions on tables","description":"NVIDIA introduced Kumo Tabular, an open foundation model that predicts labels for new rows from a table of examples without task-specific training, tuning or feature engineering. The model comes in three sizes from 28 million to 215 million parameters, supports classification and regression, and is released with code and commercial-use terms."},{"@type":"ListItem","position":9,"url":"https://getunblocked.com/blog/adaptive-routing-inference-providers/","name":"An adaptive router cuts LLM task cost while shifting around provider failures","description":"Unblocked describes a production router that sends the same open-weight model across providers according to measured task cost, speed and health, with controlled exploration and rate adjustment. The company reports 14% lower cost than round-robin routing and a 55% fall in median task time when a faster provider was available during its first four weeks."},{"@type":"ListItem","position":10,"url":"https://artificialanalysis.ai/articles/claude-sonnet-5-5","name":"Claude Sonnet 5.5 nears flagship scores by spending far more tokens","description":"Artificial Analysis places Claude Sonnet 5.5 at number two on its Intelligence Index at maximum effort, two points behind Opus 5.5, with particularly strong terminal and knowledge-work results. That setting also used about 193,000 output tokens per index task—the highest the evaluator has measured—and cost roughly 50% more per task than Sonnet 5 despite unchanged per-token pricing."},{"@type":"ListItem","position":11,"url":"https://github.com/VectifyAI/PageIndex","name":"PageIndex builds a document tree for reasoning-based RAG","description":"PageIndex is an MIT-licensed document indexing project for vectorless, reasoning-based retrieval. It builds a hierarchical representation that lets an LLM navigate long professional documents using structure and context rather than relying only on chunk similarity."},{"@type":"ListItem","position":12,"url":"https://github.com/DataTalksClub/machine-learning-zoomcamp","name":"Machine Learning Zoomcamp packages a free path from fundamentals to deployment","description":"DataTalksClub’s Machine Learning Zoomcamp is a free four-month engineering course covering regression, classification, evaluation, deployment, trees, deep learning, Kubernetes and production-oriented projects. The repository contains lessons, notebooks, homework and an active community-driven curriculum."},{"@type":"ListItem","position":13,"url":"https://github.com/NVIDIA-NeMo/Nemotron","name":"NVIDIA’s Nemotron hub collects recipes, datasets and end-to-end examples","description":"The Nemotron repository is NVIDIA’s developer asset hub for its model family, bringing together training and customisation recipes, datasets, evaluation material, skills and full reference workflows. Its notebook-heavy layout is designed to move developers from model exploration to repeatable implementations."}]}}]}</script>
