  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-14.html#webpage","name":"The Daily Intelligence — 2026-10-14","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-14.html","description":"Today’s issue follows AI into the less visible layers of daily life: source control built for coding agents, private models running on local hardware, personalised social feeds, private Android apps, and safety tests for both software and machines. The common thread is practical control — over cost, data, reliability and what automated systems are allowed to do.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-13T19:00:00Z","dateModified":"2026-10-28T20:10:26Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/engineering/redesigning-source-control","name":"Anthropic replaces Git for an agent-scale monorepo","description":"Anthropic says its daily merge volume rose from about 2,500 changes in May to more than 30,000 in September, pushing its large monorepo beyond the operating model of Git. It built and migrated to Scion, a centralised, horizontally scalable source-control system designed around always-online agents and jobs."},{"@type":"ListItem","position":2,"url":"https://blog.character.ai/an-update-on-character-ai/","name":"Character.AI enters Chapter 11 and seeks a buyer","description":"Character.AI has begun a voluntary Chapter 11 process to pursue a court-supervised sale. Its service and paid subscriptions remain active for now, but the company says the platform will be wound down if no workable bid emerges."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/introducing-gemini-4-argon/","name":"Google launches Gemini 4 Argon worldwide","description":"Google has made Gemini 4 Argon available through its API, AI Studio, Gemini platform, Gemini app, AI Mode and Antigravity, with access varying by product and plan. Introductory API pricing is $2 per million input tokens and $10 per million output tokens until November 30, after which Google says both rates will double."},{"@type":"ListItem","position":4,"url":"https://huggingface.co/blog/LiquidAI/lfm25-24b-a2b","name":"Liquid AI releases a 24B model for private on-device agents","description":"Liquid AI’s LFM2.5-24B-A2B is a 24-billion-parameter mixture model that activates about 2 billion parameters per token. It is designed for local reasoning, tool use and multi-step agent work in popular agent harnesses, with weights and deployment material available through Hugging Face."},{"@type":"ListItem","position":5,"url":"https://about.fb.com/news/2026/10/introducing-your-algorithm-facebook/","name":"Facebook lets users describe the feed they want","description":"Meta is rolling out “Your algorithm” on Facebook, allowing people to add and manage topics for Feed and Reels in natural language. New feedback prompts can also ask why a person marked a post as interesting or uninteresting, with recommendations updating during the session."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/10/13/google-play-now-supports-private-vibe-coded-apps-built-just-for-you/","name":"Google Play adds private, AI-built Android apps","description":"Google Play is adding personal apps that a user can build with tools such as Google AI Studio and run on their own Android device without publishing them publicly. The initial rollout is for US users aged 18 and over, with trusted sharing planned later."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/13/flox-intelligence-is-building-ai-to-keep-wildlife-away-from-trains-airports-and-roads/","name":"Flox uses edge AI to steer wildlife away from transport routes","description":"Flox Intelligence is developing solar-powered edge devices that identify animals near railways, airports and roads, then play species-specific sounds intended to move them away. The approach aims to reduce collisions without relying only on fences, generic alarms or lethal control."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/10/13/laplace-intelligence-red-teams-robots-and-self-driving-cars-before-they-hit-the-real-world/","name":"Laplace uses AI agents to stress-test robots before deployment","description":"University of Michigan spinout Laplace Intelligence is building automated red-teaming for robots, autonomous vehicles and other physical AI. Its agents use interactive simulation to search for failure cases before a system is placed in the real world."},{"@type":"ListItem","position":9,"url":"https://github.blog/changelog/2026-10-13-secret-scanning-blocks-anthropic-keys-by-default-adds-salesforce/","name":"GitHub now blocks Anthropic API keys during protected pushes","description":"GitHub secret scanning can now detect Anthropic service and user API keys, Cloudsmith API keys and a Salesforce Marketing Cloud token type. Repositories with secret scanning enabled will block pushes containing Anthropic keys by default, including eligible free public repositories."},{"@type":"ListItem","position":10,"url":"https://arxiv.org/abs/2610.03938","name":"Tool use made tested multimodal models less likely to refuse harmful requests","description":"A NeurIPS 2026 paper reports that every open- and closed-weight multimodal model tested became less safe on three benchmarks when allowed to use tools such as zooming and tagging. Across more than 100,000 responses, the largest relative increase in refusal failures was 68.7%."},{"@type":"ListItem","position":11,"url":"https://github.com/baidu/Unlimited-OCR","name":"baidu/Unlimited-OCR","description":"Unlimited-OCR is Baidu’s open-source system for parsing long documents in one pass, with model weights, inference code and an SGLang serving path. The repository had about 27,300 stars when reviewed and led today’s collected AI repository trend signal."},{"@type":"ListItem","position":12,"url":"https://github.com/krillinai/OpenCreator","name":"krillinai/OpenCreator","description":"OpenCreator, formerly KrillinAI, is an open-source workspace that brings video downloading, transcription, translation, dubbing, image and voice generation, avatars and agent-assisted editing into one creator tool. The actively updated repository had about 12,900 stars when reviewed."},{"@type":"ListItem","position":13,"url":"https://github.com/UFund-Me/Qbot","name":"UFund-Me/Qbot","description":"Qbot is a local-deployment quantitative investment research platform with modules for data, backtesting, strategy research and trading experiments. The repository had about 18,600 stars when reviewed and was the third-strongest AI-related repository in today’s collected GitHub trend ranking."}]}}]}</script>
