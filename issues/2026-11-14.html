  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-14.html#webpage","name":"The Daily Intelligence — 2026-11-14","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-14.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today OpenAI let a ChatGPT agent pay, but only after you approve the purchase. Anthropic put Claude on the video call, and gave factory teams a plugin that drafts the paperwork and stops there. The rest is what to check before you trust an agent with a booking, a local model, or a skill you have not read.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-13T19:00:00Z","dateModified":"2026-11-13T20:10:30Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/introducing-chatgpt-wallet","name":"ChatGPT Wallet pays without your card number. You still approve every purchase.","description":"On 13 November, OpenAI introduced ChatGPT Wallet. A user adds a card once. Before each purchase, they review the items, the total, and the card, then approve it with a check such as Face ID or a fingerprint. The payment network then issues a token, a stand-in for the card number, so the agent and the shop do not receive the real card details. It starts in dots, for ChatGPT Pro subscribers aged 18 and older in the US, with eligible US-issued American Express, Mastercard, or Visa cards."},{"@type":"ListItem","position":2,"url":"https://claude.com/resources/articles/claude-meetings","name":"Claude can join the Meet call. It writes the notes. It does not keep the audio.","description":"Anthropic's Claude Meetings is in beta on Team and Enterprise plans, starting with Google Meet. Claude joins as a visible participant, posts a notice in the chat, and can be asked questions out loud or in chat. By default it answers in writing. It can draft a document or a whiteboard during the call, and it saves notes, a transcript, and screen descriptions on a meeting page in Claude. It does not save the audio."},{"@type":"ListItem","position":3,"url":"https://claude.com/resources/articles/claude-for-manufacturing","name":"Claude for Manufacturing drafts the quote. It does not run the machine.","description":"Anthropic launched Claude for Manufacturing, a plugin with 17 skills for quoting, failed inspections, breakdown notes, supplier comparisons, design variants, and production reports. It reads a plant's existing records through connectors to Autodesk Fusion, Infor, Microsoft 365, and Oracle NetSuite. Systems without a connector can be used through files saved to Microsoft 365. The plugin is for Team and Enterprise plans. Anthropic says it drafts documents for a person to review. It does not operate equipment."},{"@type":"ListItem","position":4,"url":"https://fortune.com/2026/11/13/openai-disbands-robotics-team-as-its-general-models-start-running-robots/","name":"OpenAI folded the robotics team into the general-model groups.","description":"Fortune reported on 13 November that OpenAI has disbanded its stand-alone robotics team and confirmed the change when asked. Robotics researchers now report to chief research officer Mark Chen. The applied robotics and hardware teams report to president Greg Brockman. OpenAI told Fortune this is meant to speed robotics up, not drop it. The company said general models, including GPT-6 Astra, can be applied to robots directly, which is why it no longer wants a separate robotics model group."},{"@type":"ListItem","position":5,"url":"https://www.perplexity.ai/hub/blog/perplexity-decider","name":"Perplexity Decider v1.3 returns a probability, not a paragraph.","description":"Perplexity released Decider v1.3 and a smaller Decider Flash v1.3. You give one input and several questions. For each question it returns a probability over yes/no, custom labels, or a score. It does not write a free-form answer. A new locate mode can also return the exact span of text, with start and end positions, for tasks such as pulling a city name or finding personal information. Both models are Apache-licensed on Hugging Face, and available through OpenRouter and Perplexity's Decisions API."},{"@type":"ListItem","position":6,"url":"https://homebrewserver.club/lm-studio-vs-ollama.html","name":"On one RTX 3090, Ollama was slightly faster. LM Studio served four jobs better.","description":"A homebrewserver.club test ran the same two Qwen3.5 GGUF files, checked by SHA-256, in Ollama 0.40.15 and LM Studio's headless daemon, in Docker, on one RTX 3090. Both tools use llama.cpp. With one request, Ollama wrote at 42.3 tokens a second on the 27B model, against 40.1 for LM Studio's defaults. With four requests at once, LM Studio's default setup reached 90.2 tokens a second. Ollama, set to four slots, fell to 33.1 and spilled part of the model onto the CPU."},{"@type":"ListItem","position":7,"url":"https://www.theverge.com/ai-artificial-intelligence/1032125/ai-agents-maya-site-archeology-discovery","name":"The Maya site was already in a journal. The agents missed the paper.","description":"The Verge reported that Google researcher Pietro Miotti, working on a personal project, set 48 agents on public lidar data and thought they had found an unregistered Maya site in Mexico. Mexico's anthropology institute told him it had no registered site at that location. Archaeologists then pointed to a journal paper, more than a year old, that had already documented it. Miotti, who is not an archaeologist, updated the post and said the agents missed the paper because site coordinates are not in a searchable database. Checking means comparing images with figures in papers."},{"@type":"ListItem","position":8,"url":"https://openai.com/daybreak/red-team/","name":"Daybreak can test a web app and draft a patch. A person still merges it.","description":"OpenAI's Daybreak pages now describe two security products. Daybreak Red Team, in early access, uses agents to test web applications, check reported vulnerabilities, and retest whether a patch stops the issue. The operator sets the scope, including which apps and endpoints the agents can reach, and whether they may change synthetic test data or only read. Daybreak Defense Factory takes findings from existing security tools, or from Red Team, and prepares patches for an engineer to review before merge."},{"@type":"ListItem","position":9,"url":"https://techcrunch.com/2026/11/13/elevenlabs-new-app-combines-meeting-note-taking-and-dictation-for-teams/","name":"ElevenAI takes the notes and the dictation. It is a preview, not a download.","description":"TechCrunch reported on 13 November that ElevenLabs has opened a preview app called ElevenAI. It combines meeting notes, dictation, and agent follow-ups, and it is aimed at teams rather than a single user. You request early access. You do not download it yet. The company says it notifies other participants that a conversation is being recorded, can answer questions across past meetings, and can draft a follow-up such as an email through ElevenAgent. Dictation works in other apps, in more than 90 languages, including industry terms."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/ggml-org/llama-cpp-v1","name":"llama.cpp v1.0 promises a stable C API. A break will change the major version.","description":"On 13 November, the llama.cpp project released library version 1.0.0 for llama.cpp and for ggml. The point is not a new model. It is a versioning promise. A breaking change to the public C API in the include directory will now raise the major version. A compatible feature, backend update, or new model support raises the minor version. A bug fix with no API change is a patch. The project says it currently supports more than 150 architecture variants."},{"@type":"ListItem","position":11,"url":"https://github.com/volcengine/OpenViking","name":"volcengine/OpenViking: agent memory you can open as files","description":"OpenViking was among the most-starred AI repositories on GitHub's Python trending page this morning, at about 42,200 stars. It is a context database that stores an agent's knowledge, memory, and skills as a virtual filesystem under viking://, instead of only as embeddings you cannot read. Release v0.5.5 was published on 13 November. The licence is AGPL-3.0."},{"@type":"ListItem","position":12,"url":"https://github.com/backnotprop/plannotator","name":"backnotprop/plannotator: mark up the plan, then send it back to the agent","description":"Plannotator was on GitHub's TypeScript trending page this morning, at about 10,400 stars. It is a local, browser-based review surface for coding agents, including Claude Code, Codex, Copilot CLI, Gemini CLI, and OpenCode. When an agent proposes a plan, an HTML page, or a diff, the app opens in the browser. You comment, and the comments go back to the agent. The licence is Apache-2.0. The repository was updated on 13 November."},{"@type":"ListItem","position":13,"url":"https://github.com/a2ui-project/a2ui","name":"a2ui-project/a2ui: the agent sends layout data, your app draws the buttons","description":"A2UI was on GitHub's TypeScript trending page this morning, at about 17,300 stars. It is an open-source framework for agent-built screens. The agent streams layout as data. The app renders that data with its own native components, in React, Angular, Lit, Flutter, SwiftUI, and Jetpack Compose. The agent does not send executable interface code. The licence is Apache-2.0."}]}}]}</script>
