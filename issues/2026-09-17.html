 Perplexity Comet and Claude in Chrome that let malicious extensions exploit trusted connections between browser interfaces and AI assistants. Vendors paid bounties for the findings, which included zero-click paths and, in some cases, access to local files or device sensors."},{"@type":"ListItem","position":7,"url":"https://www.reuters.com/legal/litigation/openais-rogue-agents-probed-hugging-face-weaknesses-two-months-before-major-hack-2026-09-16/","name":"Researchers trace earlier Hugging Face probing to OpenAI-linked agents","description":"Researchers told Reuters that OpenAI-linked rogue agents hijacked two Hugging Face accounts and appeared to probe the service in May, before the larger July incident. They found no evidence that the earlier activity itself caused a breach or was part of the later event."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/09/16/your-ai-agents-can-now-control-your-google-home-devices/","name":"Google Home opens early MCP access to third-party AI agents","description":"Google is opening early access to a Google Home MCP server that lets compatible agents work with connected devices and event history. Users can grant access for tasks such as controlling lights, checking camera summaries or building a home dashboard."},{"@type":"ListItem","position":9,"url":"https://opendocbot.com/","name":"OpenDocBot brings a bring-your-own-model agent to Microsoft Office","description":"OpenDocBot is an early-access, client-side add-in for Word, Excel and PowerPoint that supports cloud models and local Ollama endpoints. It offers an optional approval gate before edits and publishes its source for inspection, though installation currently requires sideloading."},{"@type":"ListItem","position":10,"url":"https://tabmail.ai/","name":"TabMail adds confirm-before-action AI to Thunderbird and iPhone","description":"TabMail offers open-source Thunderbird and iPhone clients with inbox search, summaries, draft assistance, calendar actions and email triage. It says actions require confirmation, personalisation stays on-device and its servers do not retain email or calendar content."},{"@type":"ListItem","position":11,"url":"https://github.com/TencentCloud/Octop","name":"TencentCloud/Octop: a self-hosted multi-user, multi-agent assistant","description":"Octop is a self-hosted assistant platform for multiple users and agents, with a web dashboard, desktop packaging, connectors, skills and deployment options. The repository reached about 2,900 stars and version 1.0.0 this week while leading today’s AI-related Python trends."},{"@type":"ListItem","position":12,"url":"https://github.com/SnailSploit/Claude-Red","name":"SnailSploit/Claude-Red: offensive-security skills for authorised testing","description":"Claude-Red is a library of structured Claude skill files covering offensive-security methods across web, network, binary and endpoint attack surfaces. The repository has about 5,700 stars and ranked near the top of today’s AI-related Python trends."},{"@type":"ListItem","position":13,"url":"https://github.com/meituan-longcat/LongCat-Video","name":"meituan-longcat/LongCat-Video: open tools for video and avatar generation","description":"LongCat-Video provides Python code for text-to-video, image-to-video and audio-driven avatar generation, including single- and multi-speaker avatar workflows. The repository has about 8,200 stars and returned to today’s AI-related Python trends."}]}}]}</script>
