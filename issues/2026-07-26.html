E.html","name":"AMD opens Instella-MoE, a 16B model with 2.8B active parameters","description":"AMD released Instella-MoE-16B-A3B with weights, data mixtures, training configurations, intermediate checkpoints and inference code. Its sparse design activates 2.8 billion of 16 billion parameters per token, and AMD reports training and serving efficiency gains from new attention and communication techniques."},{"@type":"ListItem","position":3,"url":"https://www.debian.org/vote/2026/vote_002","name":"Debian opens a formal debate over LLM-assisted contributions","description":"Debian has entered a discussion period for a general resolution on LLM use in project contributions. One proposal would prohibit generative-AI assistance across Debian packages, documentation, translations and official communications, citing licensing, quality and community concerns; the resolution has not yet been decided."},{"@type":"ListItem","position":4,"url":"https://status.openai.com/incidents/01KYC921K145JTR1JK7DYKGWH1","name":"OpenAI recovers from elevated errors across ChatGPT, Codex and its API","description":"OpenAI reported elevated error rates affecting ChatGPT, Codex and the Responses API before marking all impacted services as fully recovered. The disruption briefly affected both consumer access and production workflows built on OpenAI services."},{"@type":"ListItem","position":5,"url":"https://tanishq.xyz/engineering/agent-personality-tax","name":"A context-cost audit argues persistent agents should cache information by change rate","description":"An engineering write-up separates an agent’s context into layers that change at different speeds, from stable identity and instructions to live task state. The author reports cutting input costs by roughly 85% by caching stable prefixes instead of repeatedly sending the agent’s full personality and background."},{"@type":"ListItem","position":6,"url":"https://pypi.org/project/pyshackle/","name":"SHACKLE adds a runtime circuit breaker for autonomous agent actions","description":"The new pyshackle package mediates agent calls with deterministic allow, deny or human-review decisions and can stop repeated calls, budget overruns and timeouts before the next action. Its SP/1.0 proposal includes public conformance fixtures and integrations for LiteLLM and AutoGen."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/07/25/one-fallen-power-line-exposed-a-growing-ai-data-center-problem-heres-how-to-fix-it/","name":"A clustered data-centre shutdown shows why AI loads need grid-aware failover","description":"After a power-line failure near Washington, roughly 3.1 gigawatts of data-centre load disconnected from the PJM grid within about 30 seconds, contributing to a voltage spike and an extended recovery. Engineers say staggered switching and campus-scale energy storage could make these large loads less disruptive."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/07/24/prentis-new-ai-lab-co-founded-by-reid-hoffman-mark-pincus-in-talks-to-raise-100m/","name":"Prentis targets routine office work with specialised computer-use models","description":"Prentis, a new lab focused on models that operate office software, is reportedly discussing a $100 million raise at a $1 billion valuation. It says its smaller Hive-32B model can automate document-heavy workflows at lower cost, but TechCrunch notes that its benchmark and revenue projections have not been independently verified."},{"@type":"ListItem","position":9,"url":"https://www.npr.org/2026/07/12/nx-s1-5867763/ai-artificial-intelligence-data-texts-bots-voters-campaigns","name":"Political campaigns are using AI to hold personalised text conversations at scale","description":"NPR reports that campaign platforms are training bots to answer voter questions in a candidate’s voice, continue text conversations and collect signals about individual concerns. Providers describe rapid adoption, while critics question whether the technology improves outreach or simply makes political messaging more persistent."},{"@type":"ListItem","position":10,"url":"https://rafihasan.com/blog/2026-07-24-the-curious-case-of-agent-memory","name":"A practical guide separates agent memory into compaction, retrieval and learned experience","description":"A detailed engineering guide explains that an agent does not remember between model calls; its surrounding system must rebuild the right context. It compares lossy conversation compaction, retrieval from external stores and converting successful work into reusable procedures, using customer support as a running example."},{"@type":"ListItem","position":11,"url":"https://github.com/OpenDCAI/DataFlow","name":"OpenDCAI/DataFlow turns noisy source material into AI-ready data pipelines","description":"DataFlow is an Apache-2.0 Python system for generating, refining, evaluating and filtering data for model training and RAG. It was among the day’s strongest AI-related GitHub Trending projects and had about 7,000 stars when checked."},{"@type":"ListItem","position":12,"url":"https://github.com/Anionex/banana-slides","name":"Anionex/banana-slides builds editable presentations from prompts and source material","description":"Banana Slides is an AGPL-3.0 TypeScript application for generating presentations from a sentence, outline or page description, with support for uploaded templates and source material. The fast-rising project had more than 15,000 stars when checked."},{"@type":"ListItem","position":13,"url":"https://github.com/mksglu/context-mode","name":"mksglu/context-mode reduces tool-output pressure in AI coding sessions","description":"Context Mode is a TypeScript MCP-and-hooks toolkit that sandboxes large tool outputs, persists session memory and routes agents toward context-efficient operations across multiple coding platforms. The repository had more than 19,000 stars when checked and claims reductions of up to 98% for sandboxed tool output."}]}}]}</script>
