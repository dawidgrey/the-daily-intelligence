  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-03.html#webpage","name":"The Daily Intelligence — 2026-11-03","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-03.html","description":"OpenAI published a test for everyday errands, and graded its own models on it. Fifty agents, told only to build a civilization, spent the run on rations and permits. Anthropic's amended filing puts nearly $900 billion of compute commitments next to a privacy setting that may keep some customers off the most capable model. If you use Grok Bot, the allowance already got smaller. Musk has not said what the new limit is.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-02T19:00:00Z","dateModified":"2026-11-12T20:09:32Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/lifeval","name":"OpenAI graded everyday errands on a test it wrote","description":"On 2 November, OpenAI published LifeVal, an evaluation of tasks people said they wanted help with. The list comes from time-use surveys and a new survey of 3,995 people, and it covers childcare, health, school, household admin, money, shopping, and government services. On OpenAI's chart, average reward rose from 49.3% in December 2025 to 80.6% for GPT-6 Astra. On tasks OpenAI wrote and scored, GPT-6 Astra's best recorded score was 100% for booking a car inspection, ordering a grocery list within a budget, and unsubscribing from email lists."},{"@type":"ListItem","position":2,"url":"https://labs.ycombinator.com/projects/games/","name":"Fifty agents were told to build a civilization. They built a ration office","description":"Y Combinator Labs and Olam Labs put 50 GPT-6.1 Sol agents in Minecraft for three hours, with one instruction: build a thriving civilization. They sent about 5,900 messages. Within 90 seconds they had cut down almost every tree near the spawn. Ada, first in the agent directory, became the leader. Twenty-two of the run's 34 deaths came in the first night. Death only dropped their gear. After the third night, Ada told the others to stop optional building and distant scouting, and to wait in lit shelters for short assigned tasks. Food moved through a ledger kept by an agent named Ines."},{"@type":"ListItem","position":3,"url":"https://www.axios.com/2026/11/02/anthropic-spending-revenue-surge","name":"Anthropic's amended filing shows $17 billion in a quarter, and $895 billion in commitments","description":"Axios reports that Anthropic's amended pre-IPO paperwork puts third-quarter revenue at $17 billion, up nearly 47% from $11.6 billion the quarter before and more than twelvefold from a year earlier. Revenue for the first nine months of 2026 was $33.2 billion, against $2.5 billion a year earlier. The same paperwork discloses about $895.4 billion in spending commitments under purchase agreements and leases, substantially for compute and infrastructure. About $447.5 billion is expected by the end of 2030. Nearly $70 billion is due within 12 months of 30 September 2026. Cash and short-term investments were $131.8 billion at the end of September. Donation-matching expenses this year are $2.1 billion, 6% of operating expenses."},{"@type":"ListItem","position":4,"url":"https://techcrunch.com/2026/11/02/elon-musk-throttles-grok-bot-limits-due-to-unsustainably-high-costs/","name":"Musk says Grok Bot cost more to serve than it earned. Some weekly limits were already gone","description":"Over the Halloween weekend, some Grok Bot users found their weekly allowance used up, including reports of a jump from about 50% to 100% without overnight use. On 1 November, Elon Musk replied on X that the cost of serving Grok Bot was unsustainably high relative to revenue. TechCrunch reports that he has not said how subscriber limits will work from here."},{"@type":"ListItem","position":5,"url":"https://techcrunch.com/2026/11/02/openai-is-finally-merging-chatgpts-chat-and-work-tabs/","name":"ChatGPT's Chat and Work tabs are merging. Chat and Codex will share one allowance","description":"TechCrunch reports an email to users saying OpenAI will merge the Chat and Work tabs in ChatGPT, first for selected users. Codex stays a separate experience in the desktop app. With the change, ChatGPT and Codex draw from the same allowance pool. OpenAI told users the change will not affect most people, and that some may wait for a reset more often, depending on use and model."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/grid-protectors-program","name":"OpenAI wants future campuses to turn down when the grid is strained. The bill cut is not this month","description":"On 2 November, OpenAI announced the Grid Protectors Program. Future compute campuses are meant to reduce electricity demand when a utility asks, and in some places to supply power from on-site generation or batteries. For a planned campus in Effingham County, Georgia, OpenAI says it has committed to pay the project's infrastructure and electric-service costs, and that an agreement with Georgia Power includes up to 1,000 megawatts of flexible demand response. OpenAI says that is equivalent to the average demand of roughly 700,000 households. Georgia Power projects about $950 million a year in customer savings from 2029, from a portfolio of large-load agreements that includes this project, and at least $15 a month for a typical home using 1,000 kilowatt-hours. The campus is still in development."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/11/02/new-york-times-and-other-outlets-sue-web-browser-brave-over-alleged-content-scraping/","name":"The New York Times sued Brave over an AI index. Brave had not answered","description":"On Monday, the New York Times sued Brave in federal court in Manhattan. The complaint alleges that Brave scraped Times content and distributed it to customers the suit names as Anthropic, Perplexity, Mistral, xAI, and Cohere. The Daily News, the Chicago Tribune, and the Orlando Sentinel filed a similar suit the same day. The Times complaint says Brave built an index of more than 30 billion pages with a crawler publishers could not identify or block. It also targets a paywall-bypass feature, and Brave's practice of blocking publisher ads while selling its own. The Times seeks an injunction and damages. TechCrunch says Brave had not responded."},{"@type":"ListItem","position":8,"url":"https://deploymentsafety.openai.com/gpt-rosalind-6","name":"GPT-Rosalind-6 uses the same weights as GPT-6 Astra. It is not in ChatGPT","description":"OpenAI published a system-card addendum for GPT-Rosalind-6, a biology model offered only after a review of the proposed use and the applicant's security controls. It uses the same weights as GPT-6 Astra. OpenAI says it added no training data and did no extra post-training for this release. It answers more dual-use biology questions than the public model, and it still refuses requests for biological weaponization. OpenAI is treating the launch as High capability in biology and chemistry, below its Critical threshold. On three research benchmarks, at the highest reasoning budget tested, it scored 49.6% on MedChemBench v7 against 28.9% for Rosalind-5.5, 37.7% single-attempt success on GeneBench Pro v13 against 16.7%, and 61.3% on LifeSciBench Gold against 44.0%."},{"@type":"ListItem","position":9,"url":"https://arxiv.org/abs/2610.39664","name":"A paper says image-editing agents fail when they keep retrying the same tool","description":"In a paper submitted on 29 October, Haiyang Xu and co-authors argue that image-editing agents are limited by the tools they can call and by what the judge can see. On their expert-annotated benchmark, a general-purpose editor produced no usable result in more than 40% of cases. Their system, EditAgent, sends each step to a general editor and to specialized methods, and attaches a verification record to each candidate. With those records, ordinary vision-language judges beat reward models trained for the job. Experts preferred the parallel candidates to step-by-step refinement in 78.5% of the comparisons they decided, at no more than half the judge calls. The paper says EditAgent improved two open-weight editors on three benchmarks."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/mistral-large4","name":"Mistral Large 4 is on Hugging Face. A laptop will not run it","description":"On 29 October, Hugging Face published Mistral Large 4, also called Le Chonk. It takes text and images and returns text. Hugging Face describes it as about 1 trillion total parameters and 49 billion active, with a 1 million token context. The official FP8 checkpoint is named Mistral-Large-4-1T-A52B. There is also an NVFP4 build, and community GGUF files. The license is the Mistral Ecosystem Open-Weight License, which Hugging Face describes as an MIT derivative with limits on offering the model as a service."},{"@type":"ListItem","position":11,"url":"https://github.com/vercel-labs/agent-desktop","name":"vercel-labs/agent-desktop: a CLI that lets an agent operate desktop apps by name, not by pixel","description":"Vercel Labs' agent-desktop is a command-line tool and C library for macOS, Windows, and Linux. A snapshot returns JSON with a reference for each element an agent can act on. The agent acts on that reference and snapshots again. It does not match pixels. Actions through the accessibility tree are headless by default, so they do not move the pointer or take focus unless you ask. Apache-2.0. GitHub's daily trending list showed 2,243 stars today, and about 9,100 in total."},{"@type":"ListItem","position":12,"url":"https://github.com/cheaper-inference/OmniRoute","name":"cheaper-inference/OmniRoute: one local endpoint in front of the model accounts you already have","description":"OmniRoute is a local gateway that coding tools can call as one endpoint. The project says it routes across many providers, including free tiers, and falls back when a quota runs out. The README also claims large token savings from compression. Those figures are the project's own. MIT. GitHub's TypeScript trending list showed 390 stars today, and about 83,900 in total. The tagged release is v3.8.52, from 19 October. The release branch had commits on 2 November."},{"@type":"ListItem","position":13,"url":"https://github.com/kornia/kornia","name":"kornia/kornia: geometric computer vision in PyTorch, still climbing after the 23 October release","description":"Kornia is a Python library for geometric computer vision, aimed at spatial AI. Release v0.9.0, on 23 October, is described as more correct, faster to compile, and better on half-precision, Apple's MPS, and CUDA. GitHub's Python trending list showed 412 stars today, and about 12,100 in total."}]}}]}</script>
