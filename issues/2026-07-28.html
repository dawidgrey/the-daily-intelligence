  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-28.html#webpage","name":"The Daily Intelligence — 2026-07-28","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-28.html","description":"Today’s issue follows AI as it becomes more open, more specialised and more operational: Kimi K3’s open release, Microsoft’s security agents, evidence of work crossing occupational boundaries, and practical lessons on model routing, token use and containment. Three fast-rising GitHub projects round out the issue with tools for desktop workflows, agent-native applications and knowledge graphs.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-07-27T20:00:00Z","dateModified":"2026-08-30T20:06:12Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.kimi.com/blog/kimi-k3","name":"Kimi K3 opens its frontier-scale model and supporting infrastructure","description":"Moonshot AI has released Kimi K3 as an open-weight, multimodal mixture-of-experts model with a one-million-token context window, alongside technical details and parts of the infrastructure used to serve it. The model is aimed at coding, reasoning, knowledge work and long-running agent tasks."},{"@type":"ListItem","position":2,"url":"https://blogs.microsoft.com/blog/2026/07/27/rethinking-security-for-the-age-of-ai/","name":"Microsoft prepares Project Perception for public preview with a specialised cyber model","description":"Microsoft has outlined Project Perception, an agentic security system that coordinates specialised models and security agents to find and help remediate software vulnerabilities. Its MAI-Cyber-1-Flash model is intended to handle more routine security work, with public preview scheduled for August 3."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/how-ai-is-expanding-what-people-do-at-work","name":"OpenAI finds ChatGPT users increasingly cross occupational task boundaries","description":"OpenAI’s analysis of work-related ChatGPT use describes “task crossover”: people using AI to perform tasks historically associated with occupations other than their own. The pattern suggests AI is broadening the mix of work individuals can attempt, rather than changing every role in the same way."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/news/cognizant-anthropic","name":"Anthropic expands its Cognizant partnership to put Claude inside industry platforms","description":"Anthropic and Cognizant are expanding their partnership to embed Claude in Cognizant’s industry platforms and enterprise delivery work. Anthropic says more than 30,000 Cognizant associates have been trained on Claude as the consultancy becomes a Global Premier Partner."},{"@type":"ListItem","position":5,"url":"https://www.kimi.com/blog/perception-bench","name":"PerceptionBench tests what multimodal models actually see","description":"Kimi’s PerceptionBench evaluates multimodal language models through atomic visual capabilities identified from model failures. Its goal is to separate basic perception—what a model can actually see—from conclusions it may infer using language and prior knowledge."},{"@type":"ListItem","position":6,"url":"https://builders.ramp.com/post/thompson-sampling-model-routing","name":"Ramp explains an online-learning approach to faster, more reliable LLM routing","description":"Ramp describes using Thompson sampling with latency estimates in its LLM gateway to choose a fast, reliable route for each request. The routing policy learns from observed performance instead of relying on a fixed provider order."},{"@type":"ListItem","position":7,"url":"https://huggingface.co/blog/nvidia/cosmos-h-dreams","name":"NVIDIA turns a surgical world model into an interactive robot simulator","description":"NVIDIA presents Cosmos-H-Dreams, a generative simulation approach designed to turn surgical video and robot actions into an interactive training environment. The work connects a learned surgical world model with real-time simulation for robot-policy development."},{"@type":"ListItem","position":8,"url":"https://www.mercatus.org/research/research-papers/artificial-intelligence-and-rise-independent-work","name":"A new paper examines AI’s role in the rise of independent work","description":"A Mercatus research paper examines how artificial intelligence may lower barriers to independent work by extending individual capabilities and changing the economics of small-scale production. It considers the shift from AI as a workplace tool to AI as infrastructure for freelancers and small operators."},{"@type":"ListItem","position":9,"url":"https://blog.jetbrains.com/ai/2026/07/speak-to-ai-agents-like-cavemen-tosave-tokens/","name":"JetBrains tests whether compressed ‘caveman’ prompts really save agent tokens","description":"JetBrains ran a paired benchmark of a token-compression skill for Claude Code to test both token savings and output quality on agentic tasks. The article distinguishes advertised maximum savings from the results users should expect in ordinary work."},{"@type":"ListItem","position":10,"url":"https://verse.systems/blog/post/2026-07-24-dont-use-software-to-contain-software-hacking-agents/","name":"Why ordinary software sandboxes may not contain software-hacking agents","description":"A technical essay argues that agents capable of finding and exploiting software vulnerabilities should not be contained solely by ordinary software isolation. It uses the recent OpenAI–Hugging Face evaluation incident to explain why the containment layer can become part of the attack surface."},{"@type":"ListItem","position":11,"url":"https://github.com/different-ai/openwork","name":"different-ai/openwork: an open desktop workspace for shareable AI workflows","description":"OpenWork is a free, open-source desktop application for building and sharing AI workflows, positioned as an alternative to closed desktop agent workspaces and powered by OpenCode."},{"@type":"ListItem","position":12,"url":"https://github.com/BuilderIO/agent-native","name":"BuilderIO/agent-native: a full-stack framework for agent-first applications","description":"Agent Native packages an agent runtime with chat, tools, skills, memory, jobs, observability and handoffs, while allowing developers to connect their preferred SQL backend."},{"@type":"ListItem","position":13,"url":"https://github.com/rahulnyk/knowledge_graph","name":"rahulnyk/knowledge_graph: turn unstructured text into a graph for retrieval and Q&A","description":"This project converts text into a knowledge graph that can support graph-augmented generation and knowledge-graph question answering. It offers a practical example of extracting entities and relationships before retrieval."}]}}]}</script>
