  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-31.html#webpage","name":"The Daily Intelligence — 2026-07-31","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-07-31.html","description":"Today’s issue follows AI from lower API bills into longer-running software agents, robot orchestration, music creation and browser security. The practical thread is implementation: preserving context, controlling actions, measuring security work and finding people who can turn capable models into reliable workflows.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-07-30T20:00:00Z","dateModified":"2026-08-08T20:05:30Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://deepmind.google/blog/gemini-robotics-er-2-powering-robotics-with-video-understanding-task-orchestration-and-multi-robot-collaboration/","name":"Gemini Robotics ER 2 gives robots a real-time planning and coordination layer","description":"Google launched Gemini Robotics ER 2, an embodied-reasoning model that watches continuous video, plans multi-step tasks, calls tools and coordinates multiple robots. Developers can access it through the Gemini API and Google AI Studio, with an enterprise private preview also available."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6","name":"OpenAI cuts GPT-5.6 Luna prices by 80% and Terra by 20%","description":"OpenAI reduced API prices for GPT-5.6 Luna to $0.20 per million input tokens and $1.20 per million output tokens, while Terra now costs $2 and $12 respectively. It also introduced an API Fast mode for Sol that offers up to 2.5 times the speed at twice the standard price."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/how-two-settings-tripled-our-arc-agi-3-scores","name":"Two context settings tripled GPT-5.6 Sol’s ARC-AGI-3 score","description":"OpenAI reports that retaining reasoning between actions and compacting long context raised GPT-5.6 Sol’s public ARC-AGI-3 score from 13.3% to 38.3% while using six times fewer output tokens. The experiment shows how strongly an agent’s harness can affect measured performance."},{"@type":"ListItem","position":4,"url":"https://deepmind.google/blog/were-launching-lyria-35-in-google-flow-music-with-advances-across-musicality-lyrics-vocals-and-creative-control/","name":"Lyria 3.5 brings more controllable AI music generation to Google Flow Music","description":"Google released Lyria 3.5 in Flow Music with improvements to melody, lyrics, vocal expression and pronunciation. New controls also let creators set tempo and duration more directly."},{"@type":"ListItem","position":5,"url":"https://near.ai/blog/introducing-ironclaw-1-0","name":"IronClaw 1.0 separates agent decisions from actions behind one safety checkpoint","description":"NEAR AI released IronClaw 1.0 across the command line, web, Slack and Telegram. Its architecture routes actions through a central guard, checkpoints state for resumption and shares memory and safety rules across channels; its benchmark claims use the same DeepSeek V4 Flash base model across compared harnesses."},{"@type":"ListItem","position":6,"url":"https://www.ctgt.ai/research/distillation-censorship-transfer","name":"A distillation study finds finance gains transferred without the teacher’s censorship pattern","description":"CTGT trained GPT-OSS models on financial-reasoning outputs from DeepSeek V4 Flash and reports that capability improved without a statistically significant transfer of the teacher’s political refusal pattern. The team released model weights, 304 evaluation prompts, scoring rubrics and analysis code for replication."},{"@type":"ListItem","position":7,"url":"https://www.isgroup.biz/en/cyber-security/llm-based-code-security-review-costs-findings-methodology.html","name":"An LLM-assisted audit found 41 security issues in a heavily reviewed codebase","description":"ISGroup spent about $3,140 in API calls reviewing GlobaLeaks, a codebase that had already received six professional audits. It reports 29 vulnerabilities, 12 denial-of-service issues and 42 hardening recommendations, averaging roughly $77 per confirmed finding before human validation."},{"@type":"ListItem","position":8,"url":"https://heyski.io/","name":"SKI adds a local two-way voice loop to popular coding agents","description":"SKI is a free Mac and Windows app that connects voice input and spoken replies to Claude Code, Codex, Cursor, Gemini CLI and other coding agents. Speech recognition and synthesis run on-device, with optional transcript review before instructions reach the agent."},{"@type":"ListItem","position":9,"url":"https://blog.google/security/chrome-stronger-with-every-update/","name":"Google says AI helped Chrome patch more than 1,000 security bugs in two releases","description":"Google says Chrome 149 and 150 fixed 1,072 security bugs, slightly more than the previous 23 releases combined. Its workflow uses AI for vulnerability discovery, duplicate detection, triage and patch assistance, including an agent that found a 13-year-old sandbox-escape bug."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/07/30/forward-deployed-engineers-are-the-ai-industrys-latest-talent-obsession/","name":"Forward-deployed engineers emerge as the scarce link between AI models and business results","description":"A study from executive search firm Christian & Timbers argues that demand is rising sharply for forward-deployed engineers who work inside customer organisations to implement AI. Its estimate of only 2,000 top-tier U.S. practitioners is directional rather than a labour-market census, but it reflects a shift from model access to deployment expertise."},{"@type":"ListItem","position":11,"url":"https://github.com/microsoft/TRELLIS.2","name":"microsoft/TRELLIS.2: Generate detailed 3D assets from images","description":"TRELLIS.2 is Microsoft’s open 3D-generation system for producing detailed assets from image inputs using compact structured latent representations. The repository includes inference and training code, data tooling and an MIT licence, and had about 9,600 GitHub stars when reviewed."},{"@type":"ListItem","position":12,"url":"https://github.com/chiphuyen/aie-book","name":"chiphuyen/aie-book: Practical resources for building AI applications","description":"This repository collects chapter summaries, case studies, references and supporting material for Chip Huyen’s AI Engineering book. It focuses on building applications with foundation models and had about 16,800 GitHub stars when reviewed."},{"@type":"ListItem","position":13,"url":"https://github.com/Infrasys-AI/AIInfra","name":"Infrasys-AI/AIInfra: A broad learning map for AI infrastructure","description":"AIInfra is a Chinese-language educational repository spanning AI clusters, storage, communication, training, inference, data and algorithms. Its notebooks and technical notes map the stack from hardware through large-model training and serving, and it had about 7,800 GitHub stars when reviewed."}]}}]}</script>
