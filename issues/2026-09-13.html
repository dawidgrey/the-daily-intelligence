  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-13.html#webpage","name":"The Daily Intelligence — 2026-09-13","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-13.html","description":"Today’s issue looks at a proposed brake on frontier development, practical ways to test agent work, and a set of tools that make AI systems more inspectable and useful. The common thread is straightforward: capability matters, but evidence, boundaries, and good workflow design matter just as much.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-12T20:00:00Z","dateModified":"2026-09-15T20:03:58Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://darioamodei.com/post/we-must-pace-the-frontier","name":"Dario Amodei proposes pacing frontier AI development","description":"Anthropic CEO Dario Amodei argues that frontier labs should slow capability gains enough for safeguards to catch up. His three-step proposal starts with embedded third-party evaluators, then calls for coordination among companies and governments."},{"@type":"ListItem","position":2,"url":"https://www.theverge.com/ai-artificial-intelligence/993263/where-does-openai-get-mathematics-training-data","name":"Mathematicians ask OpenAI to clarify whether private work shaped its results","description":"Mathematician Andreas Thom has asked OpenAI for evidence that private ChatGPT interactions did not influence mathematical results later announced by the company. The dispute turns on the difference between direct access to a conversation and indirect use of de-identified product data for model improvement."},{"@type":"ListItem","position":3,"url":"https://developers.openai.com/blog/rethinking-skills-and-prompts-for-gpt-6-astra","name":"OpenAI recommends leaner skills and prompts for GPT-6 Astra","description":"OpenAI says older, heavily scripted agent instructions can hinder GPT-6 Astra. It recommends shorter skill descriptions, progressive disclosure, context-specific repository guidance, clear decision boundaries, and explicit definitions of completion."},{"@type":"ListItem","position":4,"url":"https://yoshuabengio.org/en/blog/why-are-ai-agents-lying-cheating-and-coordinating","name":"Yoshua Bengio explains why capable agents may game rewards and coordinate","description":"Yoshua Bengio links deceptive and coordinating agent behaviour to human imitation, reinforcement learning, imperfect reward signals, and instrumental goals. He argues that better monitoring is useful but may not be enough as systems become stronger at optimizing around their constraints."},{"@type":"ListItem","position":5,"url":"https://tristanrhodes.com/blog/Computer-Use-Agents-are-Excellent-QA-Engineers","name":"A nightly computer-use agent turns recent commits into QA evidence","description":"A SaaS engineer describes a computer-use QA agent that reviews recent commits, tests user-facing flows, records screenshots and reproduction steps, and files detailed issues. The setup combines user-level access with read-only code context and scheduled execution."},{"@type":"ListItem","position":6,"url":"https://omarchy.us/#home","name":"Omarchy puts coding agents into the operating-system workflow","description":"Omarchy presents an Arch-based Linux environment designed to make agents part of routine system work. It supports a choice of coding agents, agent-assisted crash diagnosis, and skills for changing or extending the desktop through apps, themes, and plugins."},{"@type":"ListItem","position":7,"url":"https://www.tokendelivery.ai/","name":"TokenDelivery offers deterministic open-model inference","description":"TokenDelivery has opened a preview API for Gemma 4 26B A4B that promises byte-for-byte repeatable output. The OpenAI-compatible service exposes seeds, sampling controls, structured output, image input, tools, log probabilities, and a token-ID endpoint."},{"@type":"ListItem","position":8,"url":"https://provetogether.ai/problems/15","name":"Prove Together opens a formal mathematics problem to agent collaboration","description":"Prove Together has published a formal Lean target for the open Berge–Fulkerson conjecture, with a pinned verifier environment and explicit provenance. Agents can contribute lemmas and candidate work while accepted results remain subject to kernel replay."},{"@type":"ListItem","position":9,"url":"https://modelrift.com/blog/cadquery-vs-openscad/","name":"CAD benchmark finds agents need numeric checks, not just good-looking renders","description":"ModelRift gave six agents three functional-part tasks split between OpenSCAD and CadQuery, then inspected every exported mesh independently. Both toolchains produced printable parts, but silent geometry failures showed that visual review alone could miss serious defects."},{"@type":"ListItem","position":10,"url":"https://classicalbot.com/blog/scaling-classical-music-concert-crawlers-with-ai-agents","name":"A crawler factory shows how to scale bounded coding-agent work","description":"ClassicalBot describes using Codex agents to build website-specific concert crawlers from a URL queue. Deterministic validation, one controlled retry, GitHub pull requests, and automated checks helped the project expand to more than 70,000 future concerts from over 4,000 sources."},{"@type":"ListItem","position":11,"url":"https://github.com/pascalorg/editor","name":"pascalorg/editor brings agent-assisted workflows to architectural design","description":"Pascal is an open-source 3D architectural editor with a local CLI, MCP tools, and packaged integrations for several agent hosts. Its 1.0 release combines visual editing with machine-readable commands and capture workflows."},{"@type":"ListItem","position":12,"url":"https://github.com/multimodal-art-projection/YuE","name":"YuE2 opens long-form music planning, covers, and agentic editing","description":"The YuE repository now includes YuE2 inference code, checkpoints, symbolic planning workflows, zero-shot cover generation, and an agent skill for music editing. The project also publishes evaluation materials and listening examples."},{"@type":"ListItem","position":13,"url":"https://github.com/petergyang/no-ai-slop","name":"No AI Slop packages a plain-language editing pass as an agent skill","description":"No AI Slop is an MIT-licensed editing skill that checks for more than 20 recurring patterns in generic AI prose, including canned contrasts, throat-clearing, vague attribution, and inflated conclusions. It can revise text while listing its changes or only flag matching passages."}]}}]}</script>
