  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-16.html#webpage","name":"The Daily Intelligence — 2026-09-16","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-16.html","description":"Today’s issue follows a practical shift from chat toward systems that can speak, decide, verify and act inside ordinary workflows. New voice models and structured decision tools promise lower-friction automation, while fresh research warns that one successful agent run is not proof of reliability. The supporting tools are also maturing, from shared coding workstations and brand-aware APIs to open research and code-review projects.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-15T20:00:00Z","dateModified":"2026-09-22T20:06:21Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://deepmind.google/blog/introducing-gemini-3-8-live-and-3-8-live-extended-thinking/","name":"Gemini 3.8 Live adds simultaneous reasoning and background tool use to voice agents","description":"Google launched Gemini 3.8 Live and an Extended Thinking version for real-time voice conversations. The models can use visual context, switch among 97 languages, call tools in the background and, in the extended version, narrate progress while reasoning through multi-step work."},{"@type":"ListItem","position":2,"url":"https://typesafe.ai/blog/introducing-system-one-models-and-jev","name":"Jev trades free-form text for fast, typed decisions inside software","description":"TypeSafe AI opened early access to Jev, a model that returns predefined structured values and calibrated probabilities rather than generating prose token by token. The company positions it for classification, routing, extraction and other repeated decisions, and reports response times of roughly 70 to 500 milliseconds."},{"@type":"ListItem","position":3,"url":"https://huggingface.co/blog/ibm-research/altk-evolve-consistency","name":"IBM research exposes the consistency gap hidden by average agent scores","description":"IBM researchers report that a GPT-4.1 ReAct agent averaged 77.4% success across repeated AppWorld runs but completed every one of five attempts for only 53% of tasks. Their Consistency Analyzer identifies decisions likely to change between runs, while generated guidelines reduced the reported consistency gap from 24.4 to 12 percentage points."},{"@type":"ListItem","position":4,"url":"https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers","name":"OpenAI pauses new subscriptions to ChatGPT’s $200 Pro tier","description":"OpenAI says new sign-ups and upgrades to its $200-a-month Pro plan are temporarily paused. Existing $200 subscriptions continue, and the $100 Pro tier remains available with the same core features but lower usage allowances."},{"@type":"ListItem","position":5,"url":"https://openaifoundation.org/news/public-data-for-health","name":"OpenAI Foundation commits more than $125 million to public health datasets","description":"The OpenAI Foundation announced an initial group of grants worth more than $125 million to create and preserve broadly available life-science data. Projects include drug-absorption benchmarks, records from failed drug programs and multimodal data for personalised cancer-vaccine research."},{"@type":"ListItem","position":6,"url":"https://arxiv.org/abs/2608.21516","name":"Neuro-formal verification pairs coding agents with machine-checked proofs","description":"A revised preprint proposes having an AI agent translate programs in mainstream languages into proof obligations handled by established formal verifiers. On a balanced set of correct and buggy Python programs, the Dafny version resolved 57% of entries with 92% precision among its verdicts; a CBMC version found counterexamples for 63% of buggy programs at 90% precision."},{"@type":"ListItem","position":7,"url":"https://openart.ai/arena","name":"OpenArt launches an expert-led benchmark for creative AI models","description":"OpenArt published an Arena that ranks image and video models using evaluations organised around professional tasks including advertising, film, animation, graphic design, editing and lip-sync. Its first tables separate overall performance from use-case-specific rankings rather than naming one universal winner."},{"@type":"ListItem","position":8,"url":"https://www.amika.dev/","name":"Amika gives people and coding agents shared, reproducible cloud workstations","description":"Amika introduced shareable virtual workstations called Rigs that bundle repositories, services and coding agents in versioned environments. Teams can steer them through the web, CLI, SSH, Slack, Linear or GitHub, inspect live previews and take over an agent session."},{"@type":"ListItem","position":9,"url":"https://engine.tastelabs.com/","name":"Taste Engine turns a website’s brand system into structured agent context","description":"Taste Labs launched an API that extracts logos, colour palettes, fonts and brand metadata from a website into a structured design system. It also supports natural-language brand search and checks generated output against the captured brand context."},{"@type":"ListItem","position":10,"url":"https://uplink.spot/","name":"Uplink lets coding agents publish and connect web apps from the shell","description":"Uplink is an npm package for agent-driven web management. Its command-line workflow lets an agent share a local service, deploy an application and attach a domain without handing the task to a separate browser dashboard."},{"@type":"ListItem","position":11,"url":"https://github.com/alibaba/open-code-review","name":"alibaba/open-code-review combines fixed checks with an LLM review agent","description":"Open Code Review is an Apache-2.0 tool that combines deterministic analysis pipelines, built-in security and correctness rules, and an LLM agent that can use OpenAI- or Anthropic-compatible models. It led today’s eligible AI repositories on GitHub Trending with 2,751 stars added today."},{"@type":"ListItem","position":12,"url":"https://github.com/alphaXiv/OpenResearch","name":"alphaXiv/OpenResearch turns coding agents into local-first research workers","description":"OpenResearch provides a local-first workspace where coding agents can review literature, propose hypotheses, run experiments and preserve the lineage of parallel attempts. It added 593 stars today, the second-highest count among eligible, previously unpublished AI repositories found on GitHub Trending."},{"@type":"ListItem","position":13,"url":"https://github.com/addyosmani/agent-skills","name":"addyosmani/agent-skills packages tested engineering workflows for coding agents","description":"Agent Skills is an MIT-licensed collection of engineering workflows for assistants including Claude Code, Codex, Cursor and Gemini. It added 386 stars today, ranking third among eligible, previously unpublished AI repositories in the refreshed GitHub Trending results."}]}}]}</script>
