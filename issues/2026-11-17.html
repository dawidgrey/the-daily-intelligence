  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-17.html#webpage","name":"The Daily Intelligence — 2026-11-17","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-11-17.html","description":"The Daily Intelligence is a short daily brief on AI that changes work, tools, and ordinary decisions. Today a Hugging Face token routes open models through OpenRouter, and the code stays put. A healthcare agent can draft the MRI paperwork, but a person still sends it. Audible will speak a reason to try the next book. A US chip-rule text would cover remote compute, and the public copy still has blank dates.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-11-16T19:00:00Z","dateModified":"2026-11-17T20:10:00Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://huggingface.co/blog/openrouter","name":"The Hugging Face token now routes through OpenRouter.","description":"On 16 November, Hugging Face switched language-model calls on Inference Providers from its own router to OpenRouter. The same token still works, through OpenAI-style or Anthropic-style APIs, and OpenRouter picks a provider by live price, speed, and reliability, then retries another if the first fails."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/advancing-computer-use-for-healthcare-teams","name":"The agent can draft the MRI request. A person still sends it.","description":"On 16 November, OpenAI said computer-use agents for healthcare are available in ChatGPT for Healthcare, ChatGPT for Clinicians, and the API. They can move through existing software to draft orders, notes, and authorization requests. OpenAI says physicians rated 99% of 325 reviewed inbox tasks clinically safe, and 93% of 646 ratings very or extremely helpful."},{"@type":"ListItem","position":3,"url":"https://www.audible.com/about/newsroom/audible-personalizes-how-listeners-find-explore-and-return-to-stories","name":"Audible will speak a reason to try the next book.","description":"Audible has launched audio discovery for select English-language titles in the United States. A short clip plays a narrated sample, an AI-generated overview of the themes and what listeners liked, and editor or author commentary taken from older Audible interviews. Ask a Question and spoiler-free Recaps are expanding to more US titles, with a broader rollout due in December, only for books you already have."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/expanding-chatgpt-for-academic-researchers","name":"The next research grants are Plus, not Pro, and first come.","description":"On 16 November, OpenAI said the next round of ChatGPT for Academic Researchers opens on 23 November and will award 50,000 grants, first come, first served. Each grant covers the recipient and up to two collaborators on ChatGPT Plus, not Pro. The program's stated goal is 200,000 researchers, after a summer pilot that reached 20,000 people in 33 countries."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/the-kings-trust-and-openai","name":"A £1 million grant for young people learning AI skills.","description":"On 16 November, the King's Trust and OpenAI announced a £1 million partnership to help up to 25,000 young people in the UK build AI skills for work over 18 months, with priority for those not in education, employment, or training. The Trust plans nationally recognized AI qualifications. The money is a donation to the charity, not a job offer."},{"@type":"ListItem","position":6,"url":"https://the-decoder.com/alibabas-qwen4-max-takes-on-opus-5-5-gpt-6-and-kimi-k3-1-pro-at-much-lower-prices/","name":"Qwen4-Max uses fewer tokens on Alibaba's own work test.","description":"On 15 November, Alibaba introduced Qwen4-Max, a 2.4-trillion-parameter model that activates 71 billion per token, reads images, and takes a one-million-token window. On Alibaba's Work360 test, average cost per task fell from $4.43 to $1.67, and token use fell by about a quarter to a third versus Qwen3.8-Max. Those figures are Alibaba's."},{"@type":"ListItem","position":7,"url":"https://www.bis.gov/media/documents/rin-0694-ak50.pdf","name":"The chip-rule text is public. The start date is still blank.","description":"A Commerce Department interim-rule text, reported by TechCrunch on 16 November, would require licenses to send advanced AI chips and servers to overseas data centers that remotely supply significant compute to companies based in Country Group D:5 or Macau. It would also require a license for advanced chips going to Indonesia, Malaysia, Singapore, Thailand, or Brazil, with an exception for US-headquartered companies if reporting conditions are met. The public PDF still has blank Federal Register dates."},{"@type":"ListItem","position":8,"url":"https://photonhealth.com/integrations/openai","name":"A clinician can draft the prescription in chat. The patient picks the pharmacy.","description":"Photon lets eligible US clinicians draft, review, and send a prescription from ChatGPT for Clinicians or ChatGPT for Healthcare. After the clinician sends it, the patient gets a text, outside ChatGPT, to compare pharmacies by price and location. Controlled substances are not supported, verification is required before the first send, and Photon says the integration is free through 31 December 2026."},{"@type":"ListItem","position":9,"url":"https://sierra.ai/blog/releasing-poppy","name":"Muse will look for Poppy first. You still set the permissions.","description":"Sierra has released version 1.0 of the Personal Agent Protocol, or Poppy, so a personal agent can connect to a company's agent, website, or API. Sierra says every Shopify store now publishes a Poppy file automatically, and Meta's Muse looks for Poppy first on every site it visits. Access uses OAuth, and the customer can change what the agent is allowed to do."},{"@type":"ListItem","position":10,"url":"https://www.perplexity.ai/hub/blog/introducing-perplexitys-monitor-api","name":"Perplexity will watch the page, then ping the agent.","description":"Perplexity has launched a Monitor API that checks a topic across the web, or up to 10 specific pages, on a schedule and sends a webhook when an update passes its goal checks. Web monitors cost $1 per 1,000 successful runs. Page monitors cost $1 per 1,000 URLs fetched. It uses the same API key as Perplexity Search."},{"@type":"ListItem","position":11,"url":"https://github.com/google-research/paper-orchestra","name":"google-research/paper-orchestra: agents that turn notes into LaTeX","description":"PaperOrchestra, from Google Cloud AI Research, is a multi-agent pipeline that turns ideas and experiment logs into a LaTeX manuscript, including a literature pass, section drafts, revision, and plots. It was among the most starred Python repositories on GitHub's daily trending list, with 306 stars today. The authors say it is not an officially supported Google product, and the paper dataset is not in the repo."},{"@type":"ListItem","position":12,"url":"https://github.com/openai/whisper","name":"openai/whisper: speech to text on your own machine","description":"OpenAI's Whisper is a speech-recognition model that can transcribe speech, translate it, and identify the language. The repository picked up 123 stars on GitHub's daily Python trending list and has about 112,800 stars overall. It is released under the MIT license."},{"@type":"ListItem","position":13,"url":"https://github.com/FujiwaraChoki/supoclip","name":"FujiwaraChoki/supoclip: an open clip cutter that calls a model","description":"Supoclip, an open-source alternative to OpusClip, gained 103 stars on GitHub's daily Python trending list and has about 3,300 stars overall. It turns longer video into short clips and expects an AI provider key, including OpenRouter. The license is AGPL-3.0."}]}}]}</script>
