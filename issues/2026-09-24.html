  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-24.html#webpage","name":"The Daily Intelligence — 2026-09-24","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-24.html","description":"Today’s issue tracks a practical shift: AI systems are gaining memory, local execution, repeatable workflows and access to real business tools. The useful question is no longer only what a model can say, but what it can do reliably, privately and under human oversight.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-23T20:00:00Z","dateModified":"2026-09-23T20:06:15Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","name":"Claude helps identify a previously uncharacterized enzyme system","description":"Anthropic says a group of roughly 950 Claude agents searched genomic data and identified an enzyme system associated with CRISPR-like DNA repeats. Human scientists reviewed the result and tested it in the lab, while its biological function remains under investigation."},{"@type":"ListItem","position":2,"url":"https://deepmind.google/blog/advancing-private-ai-compute-with-secure-server-side-memory/","name":"Google designs private cloud memory for personal AI","description":"Google has detailed a Private AI Compute architecture for persistent, cross-device assistant memory. It combines encrypted per-user storage, device-held keys and secure cloud enclaves, with software verification and an independent security audit."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/say-hello-to-gemini-38-text-to-speech/","name":"Gemini 3.8 brings prompt-designed voices to text-to-speech","description":"Google introduced Gemini 3.8 Flash TTS and Flash-Lite TTS for custom voice design, line-by-line performance direction and high-volume generation across more than 100 languages and dialects. The release includes consent checks for voice replication, SynthID watermarking and C2PA credentials."},{"@type":"ListItem","position":4,"url":"https://openai.com/index/introducing-mentalhealthbench","name":"MentalHealthBench tests AI across realistic support conversations","description":"OpenAI released an open benchmark built with more than 80 licensed mental-health experts across 22 countries. It evaluates responses across everyday stress, higher-acuity situations and emergencies, including whether models seek context, preserve agency and offer appropriate guidance."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/grab-openai-ai-skills-southeast-asia","name":"Grab and OpenAI plan practical AI training for 30,000 partners","description":"Grab and OpenAI launched a two-year program to teach 30,000 drivers, delivery workers and merchants across Southeast Asia practical AI skills. Workshops will cover tasks such as analysing sales, planning promotions, testing business ideas and building simple dashboards or websites."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/ringg","name":"Ringg reports lower costs from routing customer-service work across models","description":"In an OpenAI customer case study, Ringg says its multilingual voice and chat agents handle more than seven million connected calls a month and resolve up to 65% of routine requests. The platform routes different tasks to different models, evaluates changes offline and escalates cases to people with context."},{"@type":"ListItem","position":7,"url":"https://developers.googleblog.com/introducing-support-for-local-ai-models-in-the-antigravity-sdk/","name":"Google’s Antigravity SDK adds offline local-agent workflows","description":"Google’s Antigravity SDK now supports local agent workflows, initially optimized for Gemma 4 26B A4B with LiteRT. It can also connect to OpenAI-compatible local servers such as Ollama, LM Studio and vLLM, while allowing hybrid cloud-and-device orchestration."},{"@type":"ListItem","position":8,"url":"https://modal.com/blog/trillion-tokens-trillion-parameters","name":"Modal explains the systems work behind coding-agent inference at scale","description":"Modal published a detailed engineering account of serving coding-agent workloads at trillions of tokens, covering prefill, decode, batching, caching and deployment. It reports 2.8-times better per-user performance and 5.6-times higher aggregate replica performance after optimization."},{"@type":"ListItem","position":9,"url":"https://bearing-linter.com/","name":"Bearing turns written coding rules into checks after each agent turn","description":"Bearing is a new linter that evaluates code diffs against natural-language conventions from files such as AGENTS.md and skills. It uses the Jev decision model to return structured judgments and probabilities after an agent completes a turn."},{"@type":"ListItem","position":10,"url":"https://www.aboutamazon.com/news/innovation-at-amazon/seller-assistant-plugin-amazon-quick-claude","name":"Amazon opens seller operations to Claude and its own AI assistant","description":"Amazon announced a selling-partner plugin for Amazon Quick and, in beta, Anthropic’s Claude. Sellers can bring listings, inventory and performance data into those assistants, while new Seller Assistant workflows can monitor conditions and prepare or take approved actions with audit trails and seller-set guardrails."},{"@type":"ListItem","position":11,"url":"https://github.com/browserbase/stagehand","name":"Stagehand offers a browser automation SDK built for AI agents","description":"Stagehand is a TypeScript-led SDK for extracting information from websites and letting AI agents interact with browser pages. The repository has about 25,000 stars and remained active this week with updates to its browser CLI."},{"@type":"ListItem","position":12,"url":"https://github.com/TNT-Likely/PanWatch","name":"PanWatch packages market monitoring into a self-hosted AI assistant","description":"PanWatch is a self-hosted market-monitoring project for Chinese, Hong Kong and US equities, combining portfolio tracking, alerts and multi-agent analysis. The MIT-licensed repository has about 1,500 stars and recent development activity."},{"@type":"ListItem","position":13,"url":"https://github.com/strands-agents/harness-sdk","name":"Strands Harness SDK targets production control for AI agents","description":"Strands Harness SDK is an open-source Python and TypeScript toolkit for building and controlling production AI agents across models and clouds. The repository has about 7,700 stars and was receiving active fixes and documentation updates during this issue’s collection window."}]}}]}</script>
