  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-09.html#webpage","name":"The Daily Intelligence — 2026-10-09","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-09.html","description":"Today’s issue follows AI into everyday work: a universal workplace agent, creative software control, local multimodal search, automated security review and specialist reasoning. The common thread is practical execution, along with the policies, monitoring and human checks needed when models can act rather than merely answer.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-08T19:00:00Z","dateModified":"2026-10-10T20:05:49Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026","name":"Google introduces a universal Gemini agent for work","description":"Google has announced a single Gemini agent that can answer questions, create content, run code and complete longer tasks across workplace systems. It can create subagents, keep working in the cloud, use Gemini or Claude models, and operate through services including Workspace, Microsoft 365 and Slack."},{"@type":"ListItem","position":2,"url":"https://voyager.so","name":"Voyager brings AI agents into professional creative software","description":"Voyager has launched an open creative-work harness that lets frontier and open models work with applications such as Blender, DaVinci Resolve, After Effects, Ableton and Unity. It supports reusable skills and memory intended to help agents learn a creator’s working style."},{"@type":"ListItem","position":3,"url":"https://deepmind.google/blog/embeddinggemma-2-an-open-lightweight-multimodal-embedding-model/","name":"EmbeddingGemma 2 brings multimodal search to local devices","description":"Google has released EmbeddingGemma 2, a 740-million-parameter open model that maps text, code, images, audio and video into a shared embedding space. Google says quantized versions can run on consumer devices with under 600MB of active memory for the full multimodal model."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/news/2026-usage-policy-update","name":"Anthropic rewrites Claude’s rules for agents and high-risk work","description":"Anthropic’s updated Usage Policy, effective November 12, clarifies restrictions on deceptive campaigns, surveillance, weapons software and autonomous physical actions. It also restates human-review and disclosure requirements for high-risk decisions in areas such as health and finance, and adds a narrow rule against sustained, purposeless abuse of Claude."},{"@type":"ListItem","position":5,"url":"https://www.anthropic.com/research/launching-opt-in-vuln-finding-service-for-open-source","name":"Anthropic opens a free AI vulnerability scanner to eligible projects","description":"Anthropic has launched OSS Scanner, an opt-in service that periodically scans eligible open-source projects with its strongest models at no cost. Reports include reproducible examples, explanations and proposed patches, but are delivered without human review and may contain mistakes."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/nvidia/nemotron-ioi-and-imo-2026","name":"NVIDIA adapts one Nemotron family to gold-level maths and coding","description":"NVIDIA reports that specialist systems built from Nemotron 3 exceeded gold-medal thresholds on the 2026 International Olympiad in Informatics and International Mathematical Olympiad. The teams combined supervised fine-tuning, reinforcement learning and generate-check-revise inference loops rather than training separate foundation models from scratch."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/08/goodfire-says-its-new-inside-out-monitors-catch-rogue-ai-agents-at-a-fraction-of-the-cost/","name":"Goodfire monitors AI agents by reading signals inside the model","description":"Goodfire has launched internal-activation monitors for Kimi K3 deployments hosted by Baseten. Small probes watch model signals for risks such as offensive hacking or reward manipulation, then call a separate reviewer model only when something appears suspicious; company tests reported lower monitoring costs and modest latency overhead."},{"@type":"ListItem","position":8,"url":"https://www.channelnewsasia.com/business/anthropic-launches-dashboard-animation-tools-claude-6444391","name":"Claude adds live dashboards and editable animations","description":"Anthropic has introduced beta tools that build live data dashboards from connected business systems and create editable animations from prompts. Dashboards is available on paid plans, while Motion is initially limited to Team and Enterprise customers; Docs, Slides and Design are now broadly available."},{"@type":"ListItem","position":9,"url":"https://openai.com/index/oracle","name":"Oracle shows how structured context turns AI into repeatable work","description":"Oracle says more than 130,000 employees actively use ChatGPT and over 95,000 use Codex across recruiting, analytics and engineering. Its examples include a recruiting-research workflow, a business ontology that grounds generated SQL and incident tools that retrieve the right operational playbook."},{"@type":"ListItem","position":10,"url":"https://openai.com/index/disrupting-ai-enabled-false-front-operations","name":"OpenAI details influence operations built behind convincing false fronts","description":"OpenAI says it banned Russian- and Iranian-linked influence operations that used its models alongside older tactics to run a purported think tank and fake journalist personas. Unlike many low-reach social campaigns, parts of these operations placed material in established external publications."},{"@type":"ListItem","position":11,"url":"https://github.com/Tracer-Cloud/opensre","name":"Tracer-Cloud/opensre: build agents for production reliability work","description":"OpenSRE is an actively developed Python toolkit for building AI agents that investigate incidents and support site-reliability work. The project has about 11,600 GitHub stars, frequent releases and integrations intended for operational tools and evidence gathering."},{"@type":"ListItem","position":12,"url":"https://github.com/Vincentwei1021/video-shotcraft","name":"Vincentwei1021/video-shotcraft: a recipe library for agent-made product videos","description":"Video Shotcraft packages 152 shot recipes, 209 motion previews and a production-ready Remotion template as a skill for Claude Code and Codex. The Apache-2.0 project has about 10,900 stars and includes smoke tests for runnable demos."},{"@type":"ListItem","position":13,"url":"https://github.com/bmad-code-org/BMAD-METHOD","name":"bmad-code-org/BMAD-METHOD: structured workflows for AI-driven development","description":"BMAD Method is a large, active collection of agents, skills and process guidance for planning and delivering software with AI coding tools. Its recent work includes tooling to build and evaluate reusable skills as well as structured project and agent workflows."}]}}]}</script>
