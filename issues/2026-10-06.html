  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-06.html#webpage","name":"The Daily Intelligence — 2026-10-06","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-06.html","description":"Today’s issue is about the decisions hidden inside practical AI: where agents run, what they are allowed to touch, how their output is marked, and which abstractions make them dependable. There is also a striking—but still unverified in the lab—example of agents helping identify candidate materials for future computer memory.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-05T19:00:00Z","dateModified":"2026-10-07T20:03:49Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.vals.ai/blogs/room-temperature-magnetic-semiconductors","name":"AI agents identify two candidate materials for spin-based memory","description":"Vals AI reports that a team of Claude Opus 5.5 agents designed one candidate magnetic semiconductor and identified a second, first made in 1999, that calculations suggest could retain useful spin properties above room temperature. The team published calculations, code, independent reruns and known caveats; neither candidate’s key predicted properties have yet been confirmed experimentally."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/new-chatgpt-ads-format-and-measurement","name":"ChatGPT will test visual ads during image generation","description":"OpenAI will begin testing clearly labelled visual ads while ChatGPT generates images, starting later this month with a group of US advertisers. It is also adding conversion-data integrations, attribution partners and brand-suitability pilots, while saying ads will remain separate from generated images and will not influence answers."},{"@type":"ListItem","position":3,"url":"https://openai.com/index/eu-text-provenance","name":"OpenAI prepares invisible text watermarks for ChatGPT and Codex in the EU","description":"OpenAI says eligible ChatGPT and Codex text in the EU will receive an invisible statistical watermark over the coming weeks, while API customers worldwide can opt in for selected models. Detector access starts with approved researchers, and OpenAI’s own tests show that short, constrained or edited text can be difficult to identify reliably."},{"@type":"ListItem","position":4,"url":"https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile","name":"Claude moves new Pro and Max Cowork tasks to the cloud","description":"From October 6, new Claude Cowork tasks on Pro and Max plans run on Anthropic’s servers, and the “Only on your computer” option is being removed. Existing local tasks remain local; connected desktop folders can still be reached only while the app is open, with individual files copied to the cloud when a task needs them."},{"@type":"ListItem","position":5,"url":"https://capgym.github.io/","name":"CaP-X gives coding agents a physical exam in robot control","description":"CaP-X is an open framework for testing language-model agents that write executable robot-control code across more than 100 manipulation tasks. Its published results put the strongest tested frontier model at 32.3% average success against an 88.5% human baseline, while post-training a 7B coding model substantially improved selected simulation and real-robot tasks."},{"@type":"ListItem","position":6,"url":"https://openclaw.ai/blog/openclaw-trail-of-bits-engagement-recap","name":"OpenClaw publishes lessons from a 24-vulnerability security review","description":"OpenClaw says a Trail of Bits review found 24 severity-rated reports: two high, 16 medium and six low, with no critical findings. The project reports that every actionable issue was fixed in stable releases, and highlights recurring problems around permission propagation, identity aliases, changed resources and permissions that were checked too early."},{"@type":"ListItem","position":7,"url":"https://www.modeloptic.com/blog/give-your-ai-agent-a-dsl","name":"A domain-specific language can give agents less room to fail","description":"Modeloptic argues that complex agents become more dependable when they operate through a small domain-specific language rather than manipulating low-level systems directly. Its financial-modeling example replaces a long sequence of spreadsheet decisions with one structured operation, leaving deterministic formatting and formula work to conventional code."},{"@type":"ListItem","position":8,"url":"https://cognition.com/agent-memory-repo","name":"Cognition proposes Git repositories as portable agent memory","description":"Cognition released Agent Memory Repo as an open standard for storing agent memory in versioned folders containing Markdown, queries, scripts and source links. Sessions clone, search, update and push the repository, while a separate periodic agent can merge duplicates, remove stale entries and resolve contradictions."},{"@type":"ListItem","position":9,"url":"https://www.harborframework.com/","name":"Harbor packages agent evaluations into repeatable sandboxes","description":"Harbor is a framework from the makers of Terminal-Bench for defining agent tasks inside sandboxed environments and using them for evaluation and optimization. It can be installed as a Python command-line tool, giving teams a common way to package tasks rather than passing around ad hoc test setups and result archives."},{"@type":"ListItem","position":10,"url":"https://ototo.dev/","name":"Otōto sends code exploration to a smaller model","description":"Otōto is an open-source MCP server that lets Claude Code or OpenCode delegate repository exploration to a smaller model on a user-selected server. It returns concise answers with checked file-and-line citations, while discarding the exploratory context after each call; the project reports lower model spending in its own small benchmarks."},{"@type":"ListItem","position":11,"url":"https://github.com/VictorTaelin/OptMem","name":"VictorTaelin/OptMem keeps agent memory in an append-only local log","description":"OptMem is a dependency-free Python tool for persistent agent memory, with about 1,900 GitHub stars at publication. It stores short records in an append-only log, builds a rebuildable tree of summaries and exposes commands to wake, record, search and inspect memory without a background service."},{"@type":"ListItem","position":12,"url":"https://github.com/harshuljain13/llm-inference-at-scale","name":"harshuljain13/llm-inference-at-scale maps the production serving stack","description":"llm-inference-at-scale is a practitioner-oriented handbook for serving language models in production, with about 240 GitHub stars at publication. The repository organizes explanatory notebooks and guidance around the systems decisions involved in moving from a model to a scalable inference service."},{"@type":"ListItem","position":13,"url":"https://github.com/AI4Finance-Foundation/FinGPT","name":"AI4Finance-Foundation/FinGPT provides open financial-model building blocks","description":"FinGPT is an MIT-licensed open-source project for financial language models, with more than 21,000 GitHub stars at publication. It includes data pipelines, sentiment models, benchmarks and a forecaster workflow, with models and datasets also available through Hugging Face."}]}}]}</script>
