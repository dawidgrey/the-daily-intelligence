  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-14.html#webpage","name":"The Daily Intelligence — 2026-09-14","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-14.html","description":"Today’s issue tracks a practical shift: models are being trusted with longer workflows, while teams add stronger context, verification and evidence around their work. There are also useful releases for music, web performance and specialist recruiting, plus three fast-rising open-source projects.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-13T20:00:00Z","dateModified":"2026-09-23T20:06:15Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://openai.com/index/perplexity-improving-accuracy-with-astra","name":"Perplexity says GPT-6 Astra can handle end-to-end systems with less supervision","description":"Perplexity says it is using GPT-6 Astra to write communications, change software, monitor production systems and build realistic end-to-end tests. The account is an OpenAI customer case study, so its performance claims should be read as company-reported rather than independent evaluation."},{"@type":"ListItem","position":2,"url":"https://elevenlabs.io/blog/music-v2-5-model","name":"ElevenLabs releases Music v2.5 with lossless downloads on every plan","description":"Music v2.5 is now ElevenMusic’s default model for prompted and reference-based generation, with the company reporting fuller arrangements and more natural instruments. Free accounts receive five lossless downloads per day, while commercial-use conditions vary by plan and attribution requirements."},{"@type":"ListItem","position":3,"url":"https://flare.henryrobbins.com/","name":"FLARE pairs LLM agents with Lean proofs to verify optimisation models","description":"FLARE uses an LLM-based agent and the Lean proof assistant to determine whether one mixed-integer linear programming formulation correctly reformulates another. On the paper’s 54-pair NP-hard evaluation subset, FLARE reported 100% accuracy and produced machine-checkable certificates for accepted reformulations."},{"@type":"ListItem","position":4,"url":"https://huggingface.co/collections/AllSpark-Research/iris","name":"Iris releases open-weight search agents and a reusable evaluation harness","description":"AllSpark Research has published the 36-billion-parameter Iris-mini and 403-billion-parameter Iris-pro search agents as open weights. The accompanying release includes an agent harness, tool and context-management support, plus evaluations for four search and reasoning benchmarks; the team’s broader training pipeline is promised but not yet released."},{"@type":"ListItem","position":5,"url":"https://aeroscissorz.github.io/aeroscissorz/posts/knowledge-catalog/","name":"Why data agents need business definitions, not just database access","description":"A practical implementation note argues that schemas alone cannot tell an agent what terms such as revenue or new customer mean inside a particular business. It proposes a governed catalogue containing ownership, freshness, business definitions, verified queries and access controls."},{"@type":"ListItem","position":6,"url":"https://www.getdesign.app","name":"getdesign turns a live website into design context for coding agents","description":"The beta product opens a public site in a browser, reads its rendered CSS and produces a design.md covering colours, typography, spacing and components. It is available through a web dashboard, API, Bun CLI, SDK and a portable agent skill, with hosted runs using the customer’s Daytona and OpenAI keys."},{"@type":"ListItem","position":7,"url":"https://makefaster.dev","name":"Makefaster packages website performance work as a repeating AI loop","description":"Makefaster is an AI skill that researches a site’s performance, proposes changes, tests them in isolation and applies successful improvements before repeating the cycle. Its public leaderboard reports large average improvements, but those figures are first-party and results will vary by site."},{"@type":"ListItem","position":8,"url":"https://sengi.ai/","name":"Sengi brings evidence-checked candidate sourcing into Claude and ChatGPT","description":"Sengi connects to AI assistants through MCP and searches public sources for candidates who match detailed role requirements. It presents evidence for each must-have and separates clear matches from uncertain ones instead of returning an unqualified list of names."},{"@type":"ListItem","position":9,"url":"https://www.reuters.com/business/anthropic-selects-nasdaq-ipo-business-insider-reports-2026-09-13/","name":"Anthropic reportedly chooses Nasdaq for a potential IPO","description":"Reuters reports, citing a Business Insider account based on a person familiar with the plans, that Anthropic has selected Nasdaq for a potential initial public offering. The report describes a preparatory decision, not a confirmed listing date or completed offering."},{"@type":"ListItem","position":10,"url":"https://www.justice.gov/usao-sdny/pr/founder-and-former-ceo-artificial-intelligence-company-pleads-guilty-securities-fraud","name":"Joonko founder pleads guilty over false customer and revenue claims","description":"Joonko founder and former CEO Ilit Raz pleaded guilty to securities fraud after admitting to misleading investors about customers and revenue at the AI recruiting company. Prosecutors say fabricated documents supported claims used to raise approximately $27 million in 2021 and 2022."},{"@type":"ListItem","position":11,"url":"https://github.com/JustVugg/colibri","name":"JustVugg/colibri runs large mixture-of-experts models from local storage","description":"Colibri is a dependency-light C inference engine that streams mixture-of-experts model weights from disk so large open models can run on existing hardware. It led today’s eligible, previously unpublished AI repositories found on GitHub Trending, with 960 stars added on the captured daily page."},{"@type":"ListItem","position":12,"url":"https://github.com/asgeirtj/system_prompts_leaks","name":"asgeirtj/system_prompts_leaks archives prompts from major AI products","description":"This community archive collects claimed or extracted system prompts and related configuration from products by Anthropic, OpenAI, Google, xAI and others. It was the next eligible unpublished AI repository by daily GitHub Trending momentum, adding 727 stars on the captured page."},{"@type":"ListItem","position":13,"url":"https://github.com/vxcontrol/pentagi","name":"vxcontrol/pentagi coordinates AI agents for authorised penetration testing","description":"Pentagi is an open-source system that orchestrates AI agents and security tools for complex penetration-testing workflows. It ranked third among eligible unpublished AI repositories in today’s captured GitHub Trending results, with 613 stars added."}]}}]}</script>
