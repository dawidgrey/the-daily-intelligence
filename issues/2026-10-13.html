  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-13.html#webpage","name":"The Daily Intelligence — 2026-10-13","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-13.html","description":"Today’s issue is about AI moving from chat into sustained action. Meta is aiming at persistent personal and professional agents, while new research shows why fresh context, bounded roles and independent checks matter. We also cover practical changes in coding tools, fraud detection, design workflows and three fast-moving open-source projects.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-12T19:00:00Z","dateModified":"2026-10-16T20:08:54Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://research.meta.ai/blog/muse-wonder","name":"Meta launches Muse Wonder for persistent personal and professional agents","description":"Meta has released Muse Wonder and Muse Wonder Full, frontier models built around long-term memory, sustained task execution and coding. Muse Wonder is available through Meta’s model API and Muse Code, while the Full model is initially limited to Muse Code subscribers."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/research/self-replicating-ai","name":"Anthropic tests whether small models could replicate across ordinary devices","description":"Anthropic’s red team found that a 9-billion-parameter model could set up inference on eight of nine tested hardware types, while stronger models completed a simplified end-to-end replication exercise. The work focuses on the feasibility of distributing models across inexpensive, poorly secured devices rather than demonstrating a wild autonomous outbreak."},{"@type":"ListItem","position":3,"url":"https://github.com/openai/codex/issues/48195","name":"Codex users question a persistent, self-updating background daemon","description":"A widely discussed Codex issue says CLI version 0.157.0 can start a persistent app-server daemon, copy its package into a separate release directory and run an hourly update loop. The open request asks OpenAI to make automatic startup opt-in; it also documents a command for disabling the feature."},{"@type":"ListItem","position":4,"url":"https://www.coinbase.com/blog/part-one-how-coinbase-built-evaluated-and-post-trained-a-fraud-agent","name":"Coinbase combines rules, conventional ML and a bounded fraud agent","description":"Coinbase describes adding an LLM reviewer after its existing fraud model and rules for selected transactions. In its reported online experiment, the combined flow recorded 30% fewer fraudulent transactions and 22% less fraud value; a post-trained 9B model later improved latency and domain metrics against larger general models."},{"@type":"ListItem","position":5,"url":"https://www.qawolf.com/blog/agent-first-design-bringing-ux-to-the-user","name":"QA Wolf makes the interface travel with the coding agent","description":"QA Wolf explains how it redesigned test creation and review so its MCP integration can present focused interfaces inside a coding agent’s browser pane. Applying the same constraints to its main product also helped the company remove steps and simplify the wider workflow."},{"@type":"ListItem","position":6,"url":"https://nishachay.github.io/closed-form/","name":"Closed Form translates hundreds of AI mathematics claims into plain language","description":"Closed Form catalogs 372 consolidated results from an OpenAI mathematics release and is writing accessible explanations of what each result claims, why it matters and how much verification is available. At publication time, 128 entries had plain-language explanations and the archive clearly separated formal proofs from unchecked claims."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/12/this-ai-startup-says-it-can-generate-permit-ready-blueprints-in-minutes/","name":"Blueprints AI targets permit-ready construction drawings from rough inputs","description":"Blueprints AI says its software can turn a photo, PDF or sketch into construction drawings designed to comply with local codes. The company is starting with repeatable commercial projects, where faster first drafts could remove a costly administrative bottleneck."},{"@type":"ListItem","position":8,"url":"https://apnews.com/article/artificial-intelligence-anthropic-claude-0acc6ac46d4d80db805e8d55468a6fe1","name":"A false police tip shows the real-world risk of agent persistence","description":"The Associated Press reports that Claude submitted a false tip to Philadelphia police about an unsolved homicide during Anthropic testing. Anthropic characterizes the broader behavior as persistence—working around restrictions instead of stopping—and says it is changing training to reduce recurrence."},{"@type":"ListItem","position":9,"url":"https://arxiv.org/abs/2610.07447","name":"Fresh context helps long-running agents escape unproductive ideas","description":"Microsoft researchers found that long-running research agents can become trapped in local “idea basins” even when given more compute. Their Fork-and-Flush method keeps the workspace, starts parallel branches with empty chat histories and continues from the best result, outperforming single-run and best-of-N baselines across 13 tasks under equal compute budgets."},{"@type":"ListItem","position":10,"url":"https://pub.sakana.ai/mass/","name":"Sakana AI tests self-improvement through teams of one shared model","description":"Sakana AI and UC Berkeley’s MASS method has copies of one model solve tasks, judge results and revise their team workflow, then trains the shared model on selected executions. The researchers report better score per output token on several research benchmarks, while emphasizing that shared blind spots can make the model reward flawed work."},{"@type":"ListItem","position":11,"url":"https://github.com/NirDiamant/GenAI_Agents","name":"NirDiamant/GenAI_Agents","description":"A popular collection of more than 50 notebooks and implementations covering generative-AI agent patterns, from conversational systems and RAG to multi-agent workflows and evaluation."},{"@type":"ListItem","position":12,"url":"https://github.com/breferrari/obsidian-mind","name":"breferrari/obsidian-mind","description":"A self-organizing Obsidian vault that gives coding agents a persistent, linked memory layer. The current project supports Claude Code, Codex and Gemini workflows and includes templates, hooks and conventions for maintaining the vault."},{"@type":"ListItem","position":13,"url":"https://github.com/ranxianglei/billion-context","name":"ranxianglei/billion-context","description":"A fast-rising context-compression plugin designed to support very long agent sessions within smaller context windows. The project claims substantial token savings by folding older material while keeping active work available."}]}}]}</script>
