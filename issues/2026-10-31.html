  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-31.html#webpage","name":"The Daily Intelligence — 2026-10-31","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-31.html","description":"On 30 October, OpenAI and Google said they will honor one robots.txt signal for AI training, so a site does not have to write a separate rule for every crawler. Neither company has switched it on. The rest of today's issue is about the limits that already apply: a cyber-access session that can still be used for training, a renamed Claude plan, and a delivery company that has counted only a few hundred orders from outside agents.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-30T19:00:00Z","dateModified":"2026-10-30T20:09:14Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://developers.google.com/search/blog/2026/10/ai-training-control","name":"Google and OpenAI will honor one robots.txt line for AI training","description":"On 30 October Google said it plans to treat a shared robots.txt token, __usage_ai-training, as a training preference across participating AI providers. If a site disallows that token and does not set a separate rule for Google-Extended, Google plans to read the disallow as a block on Google-Extended, the training control it has offered since 2023. OpenAI said the same day that it will honor the signal. The draft, posted to the IETF on 30 October, is not yet a standard."},{"@type":"ListItem","position":2,"url":"https://help.openai.com/en/articles/7730893-data-controls-in-chatgpt","name":"A Daybreak session can still be used for training after you opt out","description":"OpenAI's data-controls page, updated on 31 October, says that during Daybreak sessions on a personal ChatGPT account, content from those interactions may be used to improve models even when \"Improve the model for everyone\" is off. OpenAI says the exception is to strengthen safeguards against cyber misuse. The same toggle still applies to other activity outside a Daybreak session."},{"@type":"ListItem","position":3,"url":"https://support.claude.com/en/articles/17728952-what-is-the-ultra-plan","name":"Claude's Max 20x plan is now Ultra, at the same $200 price","description":"Anthropic has renamed the Max 20x plan to Ultra. Existing subscribers move over automatically, and the price stays $200 a month. Ultra includes 10 times the Pro plan's usage each week. Verified accounts have no five-hour limit. Accounts that are not yet verified still have a temporary session limit until Anthropic verifies them from account and payment history."},{"@type":"ListItem","position":4,"url":"https://the-decoder.com/openai-doubles-usage-limits-on-pro-plans-as-competition-with-anthropic-heats-up/","name":"OpenAI doubles Work and Codex allowances on Pro, and cancels a planned cut","description":"OpenAI's help page for ChatGPT Pro, updated on 30 October, says Pro 100 and Pro 500 now include twice their previous Work and Codex allowance. On Pro 200, a reduction announced in a 29 September email is canceled. Subscribers who already had the higher allowance keep it. Those on the lower allowance have had it doubled to match, and the price stays $200 a month. Plus is unchanged."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/community-safety-report-and-new-protections-for-teens","name":"ChatGPT will say less about past mass attacks, including to adults","description":"On 30 October OpenAI said ChatGPT will give less detailed answers about past mass attacks, for every user, including less reconstruction of how an attack was carried out. It is also adding further limits for accounts it predicts are under 18, even when a question looks harmless and shows no violent intent. A first Community Safety Report is promised for early 2027, covering the second half of 2026, then every six months."},{"@type":"ListItem","position":6,"url":"https://techcrunch.com/2026/10/30/doordash-said-its-only-received-several-hundred-orders-from-ai-agents/","name":"DoorDash has counted several hundred orders from outside AI agents","description":"On DoorDash's third-quarter earnings call, CEO Tony Xu said the company is seeing maybe several hundred orders in total from third-party agents such as Muse, Instinct, and Fo. TechCrunch notes that DoorDash's 2025 report put average daily deliveries at 3 million. Xu said most people still order in the DoorDash app, and that the company wants a working relationship with agent makers rather than a fight."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/29/as-search-traffic-dries-up-reddit-announces-its-shifting-to-a-logged-in-experience/","name":"Reddit will test a logged-in site as Google referrals fall by a million a week","description":"On its 29 October earnings call, Reddit said Google search referrals fell by more than 1 million a week on average in October, and that daily active users could fall by a low-double-digit percentage next quarter if that continues. Global daily actives were flat at 130.3 million. U.S. daily actives fell to 50.7 million, from 53.2 million the quarter before. Revenue rose 53% year over year to $895 million."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/10/30/googles-first-data-center-satellite-is-online-and-writing-poetry/","name":"Google's first orbital TPU is online, and it can run for about 20 minutes","description":"TechCrunch reports that Google's Suncatcher prototype, launched earlier this month on a Falcon 9, answered its first prompt this week. The satellite carries four Tensor Processing Units and generates up to 1 kilowatt. Power limits mean it can run only one of those chips, for about 20 minutes at a time. The model on board is DeepMind's Gemma 4. A Google spokesperson told TechCrunch the satellite was operating as expected."},{"@type":"ListItem","position":9,"url":"https://axiommath.ai/research/the-enormous-theorem-formalized/","name":"Axiom says agents produced a computer-checked proof of the enormous theorem","description":"Axiom Math says it has released the first complete computer-checked proof of the classification of finite simple groups, a result whose human write-up runs to about 15,000 pages. Over 24 days, the company says, engineers and mathematicians directed swarms of agents that produced about 43.1 million lines of Lean. The translation found 34 noteworthy gaps in the published arguments, including a substantial repair to the Unbalanced Group Theorem, and one new group-theory result."},{"@type":"ListItem","position":10,"url":"https://smeltagent.dev","name":"Smelt is a terminal coding agent that reports a fifth of the memory","description":"Smelt is an open-source coding agent for the terminal, written to be scripted in Lua and licensed under MIT. It is marked beta until version 1.0, with builds for Linux, macOS, and Windows. Sign-in is through a ChatGPT, GitHub Copilot, or Kimi Code account. Plugins are Lua files dropped into a config folder, and the project says they load without a restart."},{"@type":"ListItem","position":11,"url":"https://github.com/CopilotKit/OpenBot","name":"CopilotKit/OpenBot: a self-hosted desk where each agent gets a computer","description":"OpenBot is an MIT-licensed template for running AI coworkers on your own infrastructure. Each coworker gets a browser, files, and only the tools you grant. Tool calls go through a gateway that decides the action before it runs and records it after. Agents speak AG-UI, so a LangGraph, Mastra, CrewAI, Pydantic AI, or Google ADK agent can be attached without rewriting the desk. It is trending on GitHub and is marked beta."},{"@type":"ListItem","position":12,"url":"https://github.com/MemPalace/mempalace","name":"MemPalace/mempalace: local memory for coding agents, with no API key required","description":"MemPalace is a local-first memory store for AI agents, MIT-licensed, at version 3.12.0. It keeps session text verbatim, searches it, and ships an MCP server plus plugins for Claude Code, Codex, and Cursor. The project says the core benchmark path needs no API key. It reports 96.6% Recall@5 on LongMemEval with zero API calls. Python 3.10 or newer is required. It is among the most-starred AI repositories trending today."},{"@type":"ListItem","position":13,"url":"https://github.com/datawhalechina/diy-llm","name":"datawhalechina/diy-llm: a Chinese CS336, with six code assignments","description":"Diy-LLM is Datawhale's Chinese adaptation of Stanford's CS336, a course on building a language model rather than calling one. The chapters run from tokenizers and Transformer details through mixture-of-experts, GPU kernels, distributed training, inference, and alignment. Six code assignments are the spine. An English readme is in the repository, and the online reader is at datawhalechina.github.io/diy-llm. It is trending on GitHub."}]}}]}</script>
