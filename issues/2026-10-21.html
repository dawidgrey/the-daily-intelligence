  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-21.html#webpage","name":"The Daily Intelligence — 2026-10-21","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-21.html","description":"Today's issue is about where a model is allowed to run. DeepSeek has published the inference framework behind its production service, on the same day the US Department of Homeland Security ordered civilian agencies to remove DeepSeek products from their systems. Mistral has shipped a voice-agent stack that can take a call in more than 50 languages. Perplexity Computer can now plan and finish a task on a Mac without sending the work to the cloud. ChatGPT can hide a saved chat behind a PIN, which is not the same as encrypting it.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-20T19:00:00Z","dateModified":"2026-10-25T20:08:30Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://github.com/deepseek-ai/DeepInfer","name":"DeepSeek open-sources DeepInfer, the framework behind its production service","description":"DeepSeek has published DeepInfer, the inference framework it says powers its large-scale production services. The Apache-2.0 release supports offline inference for DeepSeek-V4.1-Flash, including the 17 October checkpoint, with optimized kernels, expert parallelism, and structured outputs. DeepSeek says the project was originally built primarily on vLLM. The repository reached about 11,300 stars within a day of the first commit, and the Hacker News thread passed 1,900 points."},{"@type":"ListItem","position":2,"url":"https://www.federalregister.gov/documents/2026/10/20/2026-21447/notice-of-order-regarding-exclusion-and-removal-of-deepseek-products-from-federal-civilian-executive","name":"Homeland Security orders civilian agencies to remove DeepSeek products","description":"The Department of Homeland Security has published an order excluding information-technology products and services developed by Hangzhou DeepSeek Artificial Intelligence Co., Ltd., and affiliated entities, from federal civilian agency procurements. It also orders removal of DeepSeek and DeepSeek-affiliate products, and third-party products and services developed using DeepSeek implementations, from civilian agency information technology. The notice is Docket No. DHS-2026-0628, published 20 October 2026. It applies to federal civilian executive-branch systems, not to a personal account."},{"@type":"ListItem","position":3,"url":"https://mistral.ai/news/voxtral-3","name":"Mistral ships Voxtral 3, a voice-agent stack for calls in 50-plus languages","description":"Mistral has released Voxtral 3: speech-to-text and text-to-speech models, plus a voice-agent SDK that listens, calls tools, and speaks in one streaming pipeline. The company says Voxtral Small Transcribe 3 covers more than 50 languages, including who-spoke-when and keyphrase biasing, and that the Mini batch model is priced at $0.0035 a minute. Speech synthesis is priced at $13 per million characters, across more than 35 languages and 50 dialects. The stack is available on Mistral's API, including a European endpoint, or for self-deployment."},{"@type":"ListItem","position":4,"url":"https://www.perplexity.ai/hub/blog/perplexity-computer-now-runs-fully-local-on-mac","name":"Perplexity Computer can now finish a task entirely on a Mac","description":"Perplexity says Computer can now run the model, the harness, and the task on an Apple silicon Mac, without sending the work to the cloud. It uses Qwen 3.6 or PPLX Pro, a post-trained version of Qwen, and recommends 36GB of memory or more. With permission, it can work across local files and apps including Notes, Messages, Mail, and Numbers. Users can still send a step to the cloud for current information, a browser, or a connected app. It is available to Pro, Max, and Enterprise subscribers in the Mac app."},{"@type":"ListItem","position":5,"url":"https://help.openai.com/en/articles/20001411-using-locked-chats-in-chatgpt","name":"ChatGPT can hide a saved chat behind a PIN","description":"OpenAI is rolling out locked chats in ChatGPT. A locked conversation leaves regular history, pinned chats, and regular search, and opening it requires a four-digit account PIN, or Face ID, Touch ID, or device unlock on supported phones. OpenAI says locking does not create end-to-end encryption, does not change how long the chat is retained, and does not change the setting that allows chats to improve the model. Memories created after a chat is locked stay inside locked chats. Resetting a forgotten PIN permanently deletes every locked chat and the files protected only by that PIN. The feature is not available on ChatGPT for Healthcare, and it is still rolling out."},{"@type":"ListItem","position":6,"url":"https://blog.yelp.com/news/fall-product-release-2026","name":"Yelp's new agent will call a restaurant and text you the wait","description":"Yelp's fall release adds Check for Me, an AI phone agent that calls an eligible restaurant, asks the wait for your party size, and texts you the answer. Yelp says it is rolling out over the coming months on iOS in the US, on restaurant pages where walk-ins are possible, and inside Yelp Assistant. The same release lets Yelp Assistant book OpenTable reservations in the chat, and adds Smart Lead Reply, which drafts and qualifies replies to incoming business leads."},{"@type":"ListItem","position":7,"url":"https://newsroom.spotify.com/2026-10-20/prioritizing-human-artistry/","name":"Spotify says it pulled 50 million AI slop tracks out of recommendations","description":"Spotify says that this year it has taken more than 50 million tracks it classifies as AI-generated slop or spam out of recommendations, on top of more than 75 million spam tracks removed from the service for rule violations. It says recommendation and editorial programming now favour music it identifies as made by human artists, and that listener complaints about this content have fallen since the change. AI Persona profiles, where the artist identity itself is generated, are labeled and kept out of recommendations unless a listener follows them. Spotify says no single detector is enough, and that detection will get harder as the generators improve."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/hf-torchtpu","name":"Hugging Face models can now load on a TPU with one device setting","description":"Google has open-sourced TorchTPU, a native PyTorch backend for its Tensor Processing Units, and Hugging Face says Transformers, Diffusers, and its Kernels library now run on it without a port to JAX or the older torch_xla path. Loading a language model is a device setting of tpu. An image pipeline is a move onto the same device. Hugging Face says its older Optimum TPU package is no longer required for those libraries, and that 96.5% of the Transformers tests that run on TPU currently pass."},{"@type":"ListItem","position":9,"url":"https://peec.ai/blog/publish-stats-get-cited-the-tactic-that-put-my-data-all-over-the-web","name":"A site of invented statistics is still being retrieved by ChatGPT","description":"Peec AI researcher Metehan Yesilyurt says he published about 50,000 invented statistics in March 2026, at a cost of about $50. He says Google largely dropped the site, while ChatGPT's page-opening bot kept fetching the pages months later, including more than 70,000 fetches in a recent 30-day window. He reports more than 10,000 sessions from ChatGPT and links from more than 330 domains, and says made-up figures later appeared in an academic paper and in a bank's investment research. He presents the work as a warning about citations, not as a method to copy."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/blog/ibm-research/altk-evolve-bc","name":"IBM's learned playbook lifts an older model on a customer-service test","description":"IBM Research says ALTK-Evolve, using GPT-4.1, distilled an agent's own successes and failures into short rules and appended them to the prompt. On the retail half of τ²-bench, a stock customer-service agent with those rules scored 67.5% Pass^4, which IBM says beat every retail entry in its 12 October leaderboard snapshot. No weights were updated. The same model wrote the rules and ran the agent. The score is on one customer-service benchmark, with a simulated customer."},{"@type":"ListItem","position":11,"url":"https://github.com/vllm-project/vllm","name":"vllm-project/vllm: serve an open model behind an API you run","description":"vLLM is the widely used open-source engine for serving language models, with about 94,400 stars and another 98 today on GitHub's Python trending list. It offers an OpenAI-compatible API, continuous batching, quantization, and tool calling, and it runs on Nvidia, AMD, and a long list of other accelerators, including TPUs. DeepSeek says its new DeepInfer framework was originally built primarily on vLLM."},{"@type":"ListItem","position":12,"url":"https://github.com/croffasia/itsaplan","name":"croffasia/itsaplan: a self-hosted board where agents take tickets","description":"It's a Plan is a self-hosted issue tracker on today's TypeScript trending list, with about 1,600 stars. It has projects, boards, cycles, and an API. The difference it advertises is that an agent can have a role, permissions, and an assignee slot on the same board as people, and can be reached over REST, webhooks, and MCP. The main licence is AGPL-3.0."},{"@type":"ListItem","position":13,"url":"https://github.com/NVlabs/ASPIRE","name":"NVlabs/ASPIRE: a library of robot skills an agent keeps refining","description":"NVIDIA and university collaborators have released ASPIRE v1.0, a robotics project that treats learning as a growing library of skills rather than a weight update. It is on today's Python trending list, with about 750 stars and 65 today. The October note says it can solve a Rubik's Cube and reports 99% success on 80 selected simulation tasks. The authors say generated code runs with full import access and is not a security sandbox."}]}}]}</script>
