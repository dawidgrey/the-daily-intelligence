  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-16.html#webpage","name":"The Daily Intelligence — 2026-10-16","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-16.html","description":"Today's issue is about tools you can use, and about checking the stories around them. Meta has published a very large open-weight model for coding agents. Amazon, Google, Bluesky and Brave are shipping products for notes, shopping, small social projects and encrypted browser chats. Anthropic is embedding outside evaluators, a US regulator has asked two labs for incident files, and a former Meta engineer says one of Anthropic's new systems should have credited an older design.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-15T19:00:00Z","dateModified":"2026-10-17T20:10:28Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://huggingface.co/blog/meta-muse-spark-open","name":"Meta releases Muse Spark Open, an 816-billion-parameter open-weight model","description":"Hugging Face published Meta's Muse Spark Open on 15 October: an open-weight mixture-of-experts model with about 816 billion parameters, about 42 billion active per token, and a context window of up to one million tokens. It takes text, images, audio and video as input, generates text, and is aimed at long coding and agent tasks."},{"@type":"ListItem","position":2,"url":"https://www.anthropic.com/news/an-update-on-independent-evaluators","name":"Anthropic gives METR employee-like access to review its risks","description":"Anthropic said on 15 October that it has onboarded six staff from the nonprofit METR with company hardware, office space and access roughly matching its own risk teams. METR can publish its findings; Anthropic cannot veto publication, but it can require redaction of narrow categories such as customer data, privileged legal material and model architectures."},{"@type":"ListItem","position":3,"url":"https://www.axios.com/2026/10/15/ftc-openai-anthropic-ai-safety-investigation","name":"Axios reports the FTC sent investigative demands to OpenAI and Anthropic","description":"Axios reported that the US Federal Trade Commission on Wednesday sent civil investigative demands to OpenAI and Anthropic, citing a person familiar with the probe. The demands are said to run more than 50 pages and to seek documents on safety incidents, safeguards, marketing and privacy policies. OpenAI said safety remains a priority and that it will engage constructively."},{"@type":"ListItem","position":4,"url":"https://techcrunch.com/2026/10/15/amazons-bee-launches-two-new-personal-ai-devices-starting-at-75/","name":"Amazon's Bee launches a $75 wearable and a phone-mounted recorder","description":"Amazon's Bee introduced the Bee Frontier, a $74.99 wrist or clip-on recorder available now, and the Bee Eclipse, a $99.99 card-sized device that attaches to a phone and is due soon. Free use includes conversation summaries and 14 days of memory; a $11.99 monthly plan adds unlimited summaries, to-dos and links to Alexa and Amazon shopping. Amazon says raw audio is processed and deleted, and that transcripts are encrypted with keys the device controls."},{"@type":"ListItem","position":5,"url":"https://blog.google/products-and-platforms/products/shopping/universal-cart-launch/","name":"Google's Universal Cart launches in US Search and the Gemini app","description":"Google said Universal Cart is now available in the United States in Search and the Gemini app. It saves products from more than one retailer in one list, can notify you of price drops or restocks, and can surface card perks and promo codes. Checkout can use Google Pay with participating stores, or move the items to the merchant's own cart; the merchant stays the seller."},{"@type":"ListItem","position":6,"url":"https://brave.com/blog/browser-ai-e2ee/","name":"Brave Leo adds end-to-end encryption for one open-weight chat model","description":"Brave said its Leo assistant can now encrypt prompts on the device before they leave, for chats that use the open-weight GLM 5.3 Flash model. Only an attested hardware enclave, operated by NEAR AI, is meant to decrypt them. The mode is available in Brave Release, Beta and Nightly, and builds on the confidential-computing option Brave announced in November 2025."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/10/15/bluesky-expands-its-ai-powered-attie-app-to-let-anyone-build-websites-games-and-more/","name":"Bluesky's Attie can now build small sites, games and quizzes","description":"At TechCrunch Disrupt, Bluesky CEO Toni Schneider said Attie, previously a tool for custom feeds, can now create websites, games, polls and quizzes on the same AT Protocol as Bluesky. Creators can bring their own model or use open-weight options, and the results can be shared to Bluesky's audience."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/flux-3","name":"FLUX.3 Image Klein checkpoints are now available in Diffusers","description":"Hugging Face said Black Forest Labs' open FLUX.3 Image Klein models are in Diffusers, covering text-to-image, edits from reference images, and layout control with bounding boxes. A distilled checkpoint is set up for faster inference, and NVFP4 and FP8 weights are offered for smaller GPUs. The two-second example Hugging Face cites is for a 1024-pixel image on an H100, not a laptop."},{"@type":"ListItem","position":9,"url":"https://www.perplexity.ai/hub/blog/open-sourcing-space","name":"Perplexity open-sources SPACE, the sandbox behind its Computer agent","description":"Perplexity open-sourced SPACE, the virtual-machine sandbox it has used for its Computer agent since July. Each sandbox has its own operating system; network access and credentials are managed outside it, and sessions can be paused, snapshotted and branched. Perplexity says a published test found no escape from the virtual machine to the host in 108 attempts, after it fixed earlier ways around network limits."},{"@type":"ListItem","position":10,"url":"https://sunshowers.io/posts/anthropic-mononoke-2/","name":"A former Meta engineer says Anthropic's Scion should credit Mononoke","description":"In a follow-up that led Hacker News, a former Meta source-control engineer compared Anthropic's public description of Scion changesets with his 2022 description of Mononoke's Bonsai changesets and said the data models match. He argues that crediting Sapling is not the same as crediting Mononoke. He also says he later received private confirmation of intentional copying and staff overlap; that confirmation is not public, and he said Anthropic had not updated its post."},{"@type":"ListItem","position":11,"url":"https://github.com/affaan-m/ECC","name":"affaan-m/ECC: a shared harness for coding agents","description":"ECC is an agent harness that packages skills, memory, security checks and a research-first workflow for Claude Code, Codex, OpenCode, Cursor and similar tools. It was the highest new AI-related repository on today's GitHub trending list that this publication has not already covered, with about 1,015 stars today and about 280,200 overall."},{"@type":"ListItem","position":12,"url":"https://github.com/xerj-org/xerj","name":"xerj-org/xerj: an index so agents search files with fewer tokens","description":"Xerj indexes code, documents, logs and PDFs so agents can search them, including for retrieval and agent memory, through an Elasticsearch-compatible interface. It was the second-highest new AI-related repository on today's trending list, with about 725 stars today and about 5,500 overall. The project says this uses about 40 times fewer tokens than grep."},{"@type":"ListItem","position":13,"url":"https://github.com/obra/superpowers","name":"obra/superpowers: a skills workflow that makes coding agents plan first","description":"Superpowers is a skills framework that tells a coding agent to agree a design, write a plan, and then work through tasks with review, including test-first development. It supports Claude Code, Codex, Cursor, Gemini, Hermes and other agents. It was the third-highest new AI-related repository on today's trending list, with about 688 stars today and about 299,700 overall."}]}}]}</script>
