  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-08.html#webpage","name":"The Daily Intelligence — 2026-09-08","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-08.html","description":"Today’s issue looks past model-launch noise to evidence you can use: a computer-checked mathematical proof, harder business benchmarks, a real agent purchase and production-scale coding-agent data. The common lesson is that useful AI needs verifiable outcomes—and honest accounting for the human work around it.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-07T20:00:00Z","dateModified":"2026-09-14T20:04:15Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://www.anthropic.com/news/formalizing-fermats-last-theorem","name":"Claude produces the first complete computer-checked proof of Fermat’s Last Theorem","description":"Anthropic says dozens of Claude agents spent 11 days producing an end-to-end Lean formalization of Fermat’s Last Theorem, comprising about 13 million lines and 30,300 proved theorems. The work formalizes an existing proof rather than discovering new mathematics, and Anthropic has published the resulting proof repository for inspection."},{"@type":"ListItem","position":2,"url":"https://artificialanalysis.ai/articles/artificial-analysis-intelligence-index-v4-3","name":"A harder AI index tests agents on 657 guarded business workflows","description":"Artificial Analysis updated its Intelligence Index with Terminal-Bench v4 and AutomationBench-AA, a held-out set of 657 finance, HR, marketing, operations, sales and support tasks. Leading models complete many objectives, but the best reported full-workflow completion rate without a guardrail violation is only 41.6%."},{"@type":"ListItem","position":3,"url":"https://forgemesh.io/blog/first-x402-physical-order-bought-with-curl","name":"An AI agent buys a physical shirt through an HTTP payment flow","description":"ForgeMesh documents an AI agent ordering a $29.94 shirt in six HTTP calls, paying in USDC through the x402 protocol and triggering Printify production without a person intervening after the initial instruction. The merchant and buyer published an on-chain receipt and audit trail, although the claim that this is the first such physical purchase is not independently established."},{"@type":"ListItem","position":4,"url":"https://insilico.com/news/rnt0709261-rentosertib-proteomic-aging-clocks","name":"AI-designed lung drug shifts six biological-age markers in a small trial","description":"Insilico Medicine reports that six independently developed protein-based aging clocks read blood samples from rentosertib-treated patients as younger than placebo samples. The analysis comes from 42 people in an earlier lung-disease trial; it measures biomarker changes, not demonstrated rejuvenation or longer life, and the company developing the drug is the primary source."},{"@type":"ListItem","position":5,"url":"https://www.law.berkeley.edu/wp-content/uploads/2026/05/AI-Final-Policy-26.pdf","name":"Berkeley Law bans most AI assistance in assessed work by default","description":"UC Berkeley School of Law’s Summer 2026 policy prohibits AI for conceptualizing, outlining, drafting, revising, translating or editing assessed work, and for any use in exams. Students may use it only to identify research sources unless an instructor provides a different written rule and requires disclosure."},{"@type":"ListItem","position":6,"url":"https://www.bleepingcomputer.com/news/artificial-intelligence/chatgpt-can-now-connect-to-your-personal-apps-to-mimic-writing-style/","name":"ChatGPT tests learning a user’s writing style from connected apps","description":"OpenAI confirmed it is testing a Writing Style feature with a small group of users. The experiment can reference examples from connected Slack, Google Drive, Notion and Gmail accounts to draft in a user’s voice, rather than requiring writing samples to be pasted into each chat."},{"@type":"ListItem","position":7,"url":"https://www.cnbc.com/2026/09/06/meta-google-openai-anthropic-ai-model-fatigue.html","name":"Rapid model releases create ‘model fatigue’ for AI buyers","description":"CNBC examines a week of closely spaced model releases from Anthropic, Meta, Google and OpenAI, alongside another major open-model launch. Developers and executives describe growing effort spent comparing capabilities, prices and risks as vendors shorten release cycles."},{"@type":"ListItem","position":8,"url":"https://kstark007.github.io/blog/agentic-coding-in-the-wild/","name":"Production data shows coding agents create long, mostly serial workloads","description":"A detailed reading of Microsoft Azure Research and UIUC telemetry describes 48.8 million sampled GitHub Copilot sessions, with model calls and tool calls tightly coupled and 87% of model calls initiated by the agent. Median sessions lasted 4.2 minutes, while the 62.6-minute mean exposed a small but expensive tail of long-running work."},{"@type":"ListItem","position":9,"url":"https://smarterarticles.co.uk/botsitting-the-unpaid-labour-behind-every-ai-productivity-claim","name":"‘Botsitting’ puts the hidden labour of checking AI on the balance sheet","description":"An evidence-rich essay argues that AI productivity claims often omit the time workers spend supplying context, correcting mistakes and verifying outputs. It connects a 6,000-worker survey with human-factors research and a controlled developer study, while making a broader interpretation rather than presenting new primary research."},{"@type":"ListItem","position":10,"url":"https://www.revise.net","name":"Revise makes every AI writing edit visible and optional","description":"Revise is an AI editor for long-form writing that presents suggestions as tracked changes, supports custom style rules and voice profiles, and lets users choose editing intensity. It also offers in-document chat, speech-to-text and a browser extension; its performance and privacy claims are vendor-reported."},{"@type":"ListItem","position":11,"url":"https://github.com/openai/skills","name":"OpenAI’s skills catalog trends again despite its move to plugins","description":"OpenAI’s roughly 26,000-star repository packages reusable instructions, scripts and resources for Codex, and appeared among the day’s fastest-rising AI-related repositories. The repository is now explicitly deprecated in favour of OpenAI’s Plugins repository, so it is better treated as a reference than a current distribution channel."},{"@type":"ListItem","position":12,"url":"https://github.com/patchy631/ai-engineering-hub","name":"AI Engineering Hub collects working examples for agents, RAG and model workflows","description":"AI Engineering Hub is an MIT-licensed collection of notebooks and example projects covering LLM applications, retrieval-augmented generation, agents, fine-tuning and related production patterns. The repository has about 37,400 stars and was one of the strongest-rising AI repositories in the day’s collected trending data."},{"@type":"ListItem","position":13,"url":"https://github.com/pytorch/pytorch","name":"PyTorch remains the most popular AI framework in today’s trending set","description":"PyTorch is the widely used tensor and neural-network framework with GPU acceleration, an extensive ecosystem and more than 102,000 GitHub stars. It was the largest established AI repository among the projects appearing in the day’s collected GitHub trending results."}]}}]}</script>
