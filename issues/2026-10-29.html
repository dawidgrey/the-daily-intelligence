  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-29.html#webpage","name":"The Daily Intelligence — 2026-10-29","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-29.html","description":"Gemini 4 Carbon leads a rebuilt intelligence index, and Google is not opening it to the public yet. The rest of today's issue is about work you can already do: see what a team spent, check a legal citation, transcribe a recording, fill a form from Gmail, or let a router pick a cheaper model for the easy steps.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-28T19:00:00Z","dateModified":"2026-10-29T20:08:45Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/","name":"Gemini 4 Carbon leads a new index, and most people cannot use it yet","description":"Google announced Gemini 4 Carbon on 28 October, two weeks after Gemini 4 Argon. Google says Carbon scores 59 and ranks first on Artificial Analysis Intelligence Index v5. The same-day note on Artificial Analysis agrees it is the new number one. Carbon is not in the Gemini app or the public API. Starting this week it goes to a subset of cyber defenders, then to more trusted partners through DeepMind's Fairwind program, while Google takes part in the U.S. government's voluntary pre-release testing."},{"@type":"ListItem","position":2,"url":"https://artificialanalysis.ai/articles/artificial-analysis-intelligence-index-v5","name":"Artificial Analysis rebuilt its index so most of the tests are private","description":"On 27 October, Artificial Analysis published Intelligence Index v5. Two benchmarks are new, three are revised, and 60 percent of the index now uses private test sets or held-out answers. In that snapshot, before Carbon was in the table, Claude Opus 5.5 (max) led at 58, ahead of GPT-6 Astra (max) at 57. The best open-weights model with released weights, DeepSeek V4.1 Flash 1017 (max), scored 32, tied with GLM-5.3 (max). That is 26 points behind the leader, and below Claude Haiku 5.5 (max) at 36."},{"@type":"ListItem","position":3,"url":"https://artificialanalysis.ai/articles/github-copilot-fusion-orchestrates-anthropic-and-openai-models-to-balance-performance-and-cost","name":"GitHub Copilot Fusion routes work across Anthropic and OpenAI models","description":"Artificial Analysis benchmarked GitHub Copilot Fusion, which GitHub describes as a router that picks models and a work pattern for each task. In the Coding Agent Index, Fusion's max setting in GitHub Copilot cost $5.59 per task, against $11.42 for Claude Code with Opus 5.5 (max). It led Terminal-Bench 4.0 at 71, ranked third on FrontierCode at 51, and used 7.2 million tokens per task, about half the tokens of Opus 5.5 in Claude Code. The headline gap is two points below that Opus run, at about half the cost."},{"@type":"ListItem","position":4,"url":"https://claude.com/resources/articles/smart-reports-surveys-pooled-budgets","name":"Claude Enterprise can now show a team what its token spend produced","description":"Anthropic made three Claude Enterprise tools generally available on 28 October: smart reports, in-app surveys, and pooled group budgets. A report takes a team, a date range, and the products to include, then samples transcripts and groups the work into workstreams. It shows spend, deliverables, and common friction, such as a missing connector or a failed tool call. Surveys ask what would break if Claude disappeared. A pooled budget is one monthly pot for a group, with a member limit still acting as a guardrail."},{"@type":"ListItem","position":5,"url":"https://claude.com/resources/articles/introducing-artifacts-for-legal-work","name":"Claude for Legal adds checklists that link every line to a source","description":"Anthropic added a gallery of ready-made artifacts for Claude for Legal. The six it highlights are a cite check, a jurisdiction survey, a matter board, a playbook deviation board, a regulatory timeline, and a table pulled from a stack of contracts. Each one opens with an example. A lawyer adds documents or connectors, Claude does a first pass, and every answer links back to the source language. Anthropic says it has added more than 60 legal connectors since the May launch, including Bloomberg Law."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/nvidia/nemotron-transcribe-granary","name":"Nvidia releases an open transcription model for recordings, not live calls","description":"Nvidia published Nemotron 3.5 Transcribe on 28 October, an open-weight model of about 30 billion parameters. One checkpoint transcribes 40 languages, translates 31 of them to or from English, and labels speakers in 13. It takes recordings up to an hour and up to eight speakers. Nvidia says it is first among open-weight models on the Hugging Face Open ASR English leaderboard, at 5.33 percent average word error rate, with API models left out of that comparison. Quantized builds for local machines are still listed as coming soon."},{"@type":"ListItem","position":7,"url":"https://blog.google/innovation-and-ai/technology/developers-tools/connected-apps-one-place/","name":"Google opens a console for apps inside Search and Gemini","description":"Google opened a preview of the Connected Apps Platform on 28 October. A developer connects a cloud MCP server, or Android MCP through AppFunctions, then registers the app in the Google Connected Console. Before review, they choose Search, the Gemini app, or both. After it is live, the console shows traffic, latency, and errors, and the developer keeps the verified logo and the signed-in account. Google says access will be added in phases, with a signup at developers.google.com/connected-apps."},{"@type":"ListItem","position":8,"url":"https://blog.google/products-and-platforms/products/chrome/enhanced-autofill-gmail/","name":"Chrome can fill a form from Gmail, if you turn it on","description":"Chrome's enhanced autofill can now suggest details pulled from Gmail while you fill a form. Google says Gemini with Personal Intelligence can surface order numbers, tracking information, and flight bookings. The rollout started on 28 October for Gemini in Chrome users in the United States who already have Personal Intelligence on, on desktop, Android, and iOS. Google says sensitive data is encrypted, and that you turn the feature on and choose what it can access in Chrome settings. A later step, not this one, would read images in Google Photos."},{"@type":"ListItem","position":9,"url":"https://www.bellingcat.com/resources/2026/10/22/can-llms-supercharge-geolocations-our-tests-show-big-improvements-but-humans-remain-key/","name":"Bellingcat's photo test: models narrow the map, and still miss the spot","description":"Bellingcat gave current models 52 photos that had not been published online, with metadata removed and no landmarks, and asked for one set of coordinates. Gemini 4 Argon had the best median error in the published table, 1.7 kilometres, and the highest Mean Log Score, 71.3. Claude Opus 5.5 had the highest GeoGuessr-style score, 4,734, with a median error of 4.4 kilometres. Several models placed at least 10 of the 52 photos within one kilometre. Some models refused or timed out on a photo."},{"@type":"ListItem","position":10,"url":"https://www.omnara.com/blog/agent-memory-is-in-the-wrong-place","name":"Omnara puts agent memory in a shared file store, not on the sandbox","description":"Omnara argues that agent memory should not live on a laptop or a sandbox the agent might lose. In its system, memory is a set of folders in the control plane, mounted by whichever worker takes the next turn. Agents list, read, search, and edit those files through four tools. A write names the version the agent last saw. If another agent changed the file, the write fails and the agent has to read it again, unless it passes force. Omnara says a crashed sandbox cannot hold a lock on that memory, because the lock sits in the control plane."},{"@type":"ListItem","position":11,"url":"https://github.com/elayadesign/ai-design-skills","name":"elayadesign/ai-design-skills: a landing-page skill for coding agents","description":"On today's GitHub Trending list, elayadesign/ai-design-skills picked up about 1,395 stars. The repository has about 10,800 stars and an MIT license. It is a collection of markdown skills for Claude Code, Cursor, Codex, Windsurf, and other tools that read a rules file. The collection currently ships one skill, landing-page-design."},{"@type":"ListItem","position":12,"url":"https://github.com/expo/skills","name":"expo/skills: agent skills for Expo apps, including the paid EAS ones","description":"expo/skills is on today's GitHub Trending list, with about 212 stars in the day and about 3,500 overall. It is an MIT-licensed pack of skills that teach a coding agent how Expo work is done. The names split the free framework skills (expo-) from the paid Expo Application Services skills (eas-). A separate experiments plugin holds APIs that are not final."},{"@type":"ListItem","position":13,"url":"https://github.com/beenuar/AiSOC","name":"beenuar/AiSOC: a self-hosted desk for sorting security alerts","description":"beenuar/AiSOC is on today's Python trending list, with about 453 stars in the day and about 4,800 overall. It is an MIT-licensed security operations project: alert fusion, an agent that triages alerts, and a ledger of each agent step that can be replayed. The project says it can run with no API key, and that it ships an MCP server for Claude, Cursor, and Continue."}]}}]}</script>
