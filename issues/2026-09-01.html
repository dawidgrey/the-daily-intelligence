he work also highlights why a single word-error score can hide substantial differences across accents, ages and other speaker characteristics."},{"@type":"ListItem","position":7,"url":"https://www.lmsys.org/blog/2026-08-18-miles-v0-1/","name":"Miles v0.1 targets production-scale reinforcement learning","description":"RadixArk and ecosystem partners released Miles v0.1, a full-stack system for large-scale model post-training. It combines SGLang rollouts, asynchronous reinforcement learning, isolated agent environments, multiple training backends and support for NVIDIA and AMD hardware."},{"@type":"ListItem","position":8,"url":"https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1772","name":"EU places ChatGPT under its strictest Digital Services Act tier","description":"The European Commission has designated ChatGPT a Very Large Online Search Engine after it reported at least 45 million average monthly EU users. OpenAI has four months to meet additional obligations covering systemic risk assessment, minors, wellbeing, illegal content, rights, elections and public security."},{"@type":"ListItem","position":9,"url":"https://www.theverge.com/tech/986593/instagram-addresses-fake-ai-profile-slop","name":"Instagram will limit unlabeled AI-generated profiles","description":"Instagram is renaming its label for synthetic personas to “AI-generated profile” and says accounts that fail to self-label may lose recommendations in Reels and Explore. The rule applies to profiles presenting an AI-generated person, not every account that uses AI-made content."},{"@type":"ListItem","position":10,"url":"https://techcrunch.com/2026/08/31/meeting-notetaker-circleback-adds-a-free-tier-to-attract-more-customers/","name":"Circleback makes unlimited meeting transcription free","description":"Circleback has added a free plan with unlimited meeting transcription, 30 days of history, transcript questions, mobile and Apple Watch apps, plus Slack and Linear integrations. Paid plans add unlimited history, all integrations, API access and MCP support."},{"@type":"ListItem","position":11,"url":"https://github.com/handsomestWei/patent-disclosure-skill","name":"patent-disclosure-skill turns Chinese patent work into an agent workflow","description":"This actively maintained Chinese-language agent skill packages workflows for finding patentable ideas, preparing invention disclosures, explaining patents and assisting with examination responses. It has about 6,200 GitHub stars and includes prompts, references, examples, scripts and tests."},{"@type":"ListItem","position":12,"url":"https://github.com/PurpleDoubleD/locally-uncensored","name":"locally-uncensored bundles private chat, media generation and coding","description":"Locally Uncensored is a desktop AI studio that combines local language models, ComfyUI image and video generation, and a coding agent without requiring Docker or cloud services. The fast-moving AGPL project has about 1,300 stars and provides installers for local use."},{"@type":"ListItem","position":13,"url":"https://github.com/microsoft/ML-For-Beginners","name":"Microsoft's ML for Beginners offers a 12-week practical curriculum","description":"Microsoft's open machine-learning course contains 26 lessons and 52 quizzes covering regression, classification, clustering, natural-language processing, time series, reinforcement learning and real-world applications. The long-running repository has about 90,000 stars and remains actively maintained."}]}}]}</script>
