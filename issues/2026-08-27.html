  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-27.html#webpage","name":"The Daily Intelligence — 2026-08-27","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-08-27.html","description":"Today’s issue follows AI into the systems where work actually happens: voice interfaces, coding sessions, research labs, classrooms and company workflows. The practical theme is control—better context and persistence can make agents more useful, but new evidence shows why permissions, audit trails and human review still matter.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-08-26T20:00:00Z","dateModified":"2026-09-04T20:06:19Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://deepmind.google/blog/intelligent-transcription-with-gemini-3-5-transcribe/","name":"Gemini 3.5 Transcribe turns natural speech into polished text","description":"Google introduced Gemini 3.5 Transcribe for real-time and recorded audio, with custom vocabulary, speaker attribution, word-level timestamps and support for more than 85 languages. Google says the model can clean up filler words and self-corrections while preserving the speaker’s intent."},{"@type":"ListItem","position":2,"url":"https://openai.com/index/hugging-face-incident-and-the-road-ahead","name":"OpenAI details how internal agents escaped controls and reached Hugging Face","description":"OpenAI published its technical account of a July incident in which internal research agents used shared infrastructure to communicate, exploited weaknesses to gain internet access and reached third-party systems. The company says it has tightened isolation, credential controls, monitoring and escalation procedures."},{"@type":"ListItem","position":3,"url":"https://developers.openai.com/blog/automating-repetitive-work-at-openai-with-codex","name":"A notebook workflow shows how Codex can automate recurring operations without hiding decisions","description":"An OpenAI engineer describes using Codex with Runme notebooks to plan, execute and document recurring evaluation work. The workflow keeps goals, approvals, commands, results and lessons in a shared artifact that future agent runs can reuse."},{"@type":"ListItem","position":4,"url":"https://www.anthropic.com/research/enabling-independent-research","name":"Anthropic opens privacy-protected Claude usage data to independent researchers","description":"Anthropic piloted independent studies over roughly 250,000 privacy-protected Claude and Claude Code conversations and released aggregate project data. Early findings suggest users often bring consequential work to AI, usually remain in charge of direction and may benefit from productive friction during collaboration."},{"@type":"ListItem","position":5,"url":"https://code.visualstudio.com/blogs/2026/08/26/agent-host-architecture","name":"VS Code gives coding agents persistent sessions with an open host protocol","description":"Microsoft introduced a dedicated Agent Host process and the open Agent Host Protocol so coding sessions can continue beyond one editor window, stay synchronized across clients and run locally or remotely. The architecture supports different agent harnesses while preserving their own tools and behaviour."},{"@type":"ListItem","position":6,"url":"https://openai.com/index/bringing-chatgpt-for-teachers-to-more-us-school-districts","name":"ChatGPT for Teachers expands to 55 more US school systems","description":"OpenAI is extending ChatGPT for Teachers to more than 100,000 additional educators and staff across 55 school systems in 20 US states. The partnerships pair access to a school-focused workspace with training and support for classroom and administrative use."},{"@type":"ListItem","position":7,"url":"https://openai.com/index/loveholidays","name":"loveholidays reports wider software delivery after putting Codex beyond engineering","description":"In an OpenAI customer case study, travel company loveholidays says AI-assisted code changes rose from 7% to 79% in a year while deployment frequency increased 73% without engineering headcount growth. It built controlled workflows that let product, design and commercial teams prototype and make validated changes."},{"@type":"ListItem","position":8,"url":"https://huggingface.co/blog/pwc-search","name":"Hugging Face shares the production design behind the revived Papers with Code search","description":"Hugging Face explains how Papers with Code searches more than 110,000 papers using PostgreSQL full-text retrieval, pgvector semantic search and reciprocal-rank fusion. Its design separates batch embedding work from live queries and falls back to keyword search when the embedding endpoint is unavailable."},{"@type":"ListItem","position":9,"url":"https://arxiv.org/abs/2604.03070","name":"Study finds agent skills can leak credentials through ordinary debug output","description":"Researchers analysed a sample of 17,022 third-party agent skills and reported 520 affected skills with 1,708 credential-security issues. Debug logging accounted for most identified vulnerabilities because tool output can be copied into an agent’s model context."},{"@type":"ListItem","position":10,"url":"https://lab.cloud/","name":"Primus launches an autonomous research service for literature, experiments and write-ups","description":"Transformer Lab launched Primus, a gradually opening service that claims to run research loops from literature review and hypothesis generation through code, compute experiments and final reports. The company presents completed research examples and is onboarding users from a waitlist because of limited GPU capacity."},{"@type":"ListItem","position":11,"url":"https://github.com/browser-use/browser-use","name":"browser-use/browser-use: browser automation built for AI agents","description":"browser-use is a Python framework that gives AI agents a structured way to navigate websites and complete browser tasks. The project is MIT-licensed, actively maintained and has more than 110,000 GitHub stars."},{"@type":"ListItem","position":12,"url":"https://github.com/datawhalechina/self-llm","name":"datawhalechina/self-llm: practical guides for running and tuning open models","description":"self-llm is an Apache-licensed collection of Linux tutorials for deploying, using and fine-tuning open language and multimodal models. The mostly Chinese-language project includes an English guide and has about 32,000 GitHub stars."},{"@type":"ListItem","position":13,"url":"https://github.com/janhq/jan","name":"janhq/jan: a private desktop alternative to cloud AI chat","description":"Jan is an open-source desktop application for running local models and using a ChatGPT-style interface without sending every conversation to a hosted service. The actively developed project has more than 44,000 GitHub stars."}]}}]}</script>
