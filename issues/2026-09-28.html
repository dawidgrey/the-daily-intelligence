vestigating suspicious activity and testing fixes for civilian infrastructure. The company says similar access has helped European agencies identify and remediate vulnerabilities."},{"@type":"ListItem","position":7,"url":"https://techcrunch.com/2026/09/26/google-tests-buying-from-walmart-owned-flipkart-through-gemini-and-ai-mode-in-india/","name":"Google tests buying from Flipkart inside Gemini and AI Mode","description":"Google is testing a Buy button for selected Flipkart products inside Gemini and AI Mode with a limited group of users in India. The flow moves shoppers from AI-assisted discovery into Flipkart checkout without leaving the AI interface."},{"@type":"ListItem","position":8,"url":"https://www.bcbs.com/about-us/association-news/bcbsa-analysis-ai-coding-tools-affects-healthcare-costs","name":"Blue Cross analysis links AI-assisted coding to $942 million in added claims costs","description":"A Blue Cross Blue Shield Association analysis says increased coding of medically complex conditions added an estimated $942 million to claims spending from 2023 to 2025, without evidence of a matching change in care delivered. The insurer group argues that AI coding tools may be identifying more billable secondary diagnoses."},{"@type":"ListItem","position":9,"url":"https://huggingface.co/blog/nvidia/nemotron-diarization","name":"NVIDIA opens a 100M-parameter model for real-time speaker tracking","description":"NVIDIA’s open-weight Nemotron 3 Diarization model identifies who spoke when across live or recorded conversations, including overlapping speech and up to eight speakers. NVIDIA reports a 14.72% diarization error rate on VoiceArena’s benchmark and provides configurable latency for streaming use."},{"@type":"ListItem","position":10,"url":"https://huggingface.co/internlm/Atria-Dawn-Preview","name":"Atria Dawn targets verifiable research and engineering work","description":"Shanghai AI Laboratory has released Atria Dawn Preview, a 744B-parameter mixture-of-experts agentic model with a 256K context window. It is designed to move from research questions to executable, reproducible results across discovery, software creation, document delivery and authorised cybersecurity tasks."},{"@type":"ListItem","position":11,"url":"https://github.com/yetone/magpie","name":"yetone/magpie: switch models across coding agents from one place","description":"Magpie is an actively developed menu-bar and command-line tool for routing coding agents such as Codex, Claude Code and Gemini CLI through different model providers. The repository reached about 1,200 stars while shipping frequent updates."},{"@type":"ListItem","position":12,"url":"https://github.com/microsoft/data-formulator","name":"microsoft/data-formulator: AI-assisted data exploration and visualisation","description":"Microsoft’s Data Formulator is an interactive system for connecting, transforming, exploring and visualising data with AI assistance. The MIT-licensed project has roughly 17,400 stars and was among the day’s strongest AI-related GitHub Trending entries."},{"@type":"ListItem","position":13,"url":"https://github.com/GokuMohandas/Made-With-ML","name":"GokuMohandas/Made-With-ML: a production ML learning path","description":"Made-With-ML is a practical, open repository covering how to develop, deploy, test and iterate on production-grade machine-learning applications. It has about 49,600 stars and includes notebooks, datasets, deployment examples and tests."}]}}]}</script>
