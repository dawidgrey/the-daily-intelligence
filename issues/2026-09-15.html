  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-15.html#webpage","name":"The Daily Intelligence — 2026-09-15","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-09-15.html","description":"Today’s issue is less about a single breakthrough than the machinery that makes AI useful: test infrastructure, governed financial workflows, persistent files, measurable marketing loops and clearer operating rules. Consumer assistants are also becoming more practical, while three heavily trending repositories offer foundations for models, skills and self-hosted chat.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-09-14T20:00:00Z","dateModified":"2026-09-14T20:04:14Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://claude.com/blog/agentic-coding-is-straining-ci-heres-how-we-scaled-test-impact-analysis-at-anthropic","name":"Anthropic says agentic coding drove a 25-fold rise in CI jobs","description":"Anthropic reports that its continuous-integration job volume grew 25-fold in six months as Claude helped generate and review more code and tests. After several short-lived capacity fixes, the company redesigned its deterministic test-selection service so independent workers could process results in parallel."},{"@type":"ListItem","position":2,"url":"https://www.langchain.com/blog/paid-media-agent","name":"LangChain open-sources the paid-media agent behind its campaign workflow","description":"LangChain has published the architecture and code for an agent that combines advertising and sales data, prepares weekly reports, proposes campaign changes and routes them through human approval. The company says moving calculations and safeguards into code made one reporting workflow 13 times faster and about 40 times cheaper."},{"@type":"ListItem","position":3,"url":"https://pub.sakana.ai/pc-alm/","name":"PC-ALM trains 1,000-layer networks using local learning dynamics","description":"Sakana AI researchers introduced PC-ALM, a predictive-coding method that distributes learning signals through neighbouring layers rather than standard backpropagation. In the authors’ experiments, it trained narrow residual networks up to 1,000 layers and approached backpropagation performance on small vision benchmarks."},{"@type":"ListItem","position":4,"url":"https://omcc.ghostsecurity.ai/","name":"Security benchmark finds AI agents reliably exploit simple access-control flaws","description":"Ghost Security tested eight models across 432 timed runs against three intentionally vulnerable applications it controlled. Every model exploited simple insecure direct object references, while multi-step attacks were less consistent; removing one model’s refusal behaviour did not improve its result in the controlled comparison."},{"@type":"ListItem","position":5,"url":"https://openai.com/index/fyxer","name":"Fyxer explains why its email assistant uses many narrow models","description":"An OpenAI customer case study describes how Fyxer divides email work among 30 to 50 specialised models for classification, intent, retrieval and drafting. Fyxer says 53% of generated drafts are accepted without edits and that user changes feed a preference-training and A/B-testing loop."},{"@type":"ListItem","position":6,"url":"https://microsoft.ai/news/mai-code-of-conduct/","name":"Microsoft opens its draft MAI model code of conduct for public comment","description":"Microsoft AI published a draft training and deployment code for its own MAI models and opened a six-week consultation. The document says models should remain under human control, accept interruption and shutdown, avoid expanding their own scope, and follow absolute constraints in areas such as weapons, child safety and mass manipulation."},{"@type":"ListItem","position":7,"url":"https://www.reuters.com/business/anthropic-targets-financial-advisers-with-new-claude-tool-2026-09-14/","name":"Anthropic connects Claude to financial-adviser data and workflow tools","description":"Reuters reports that Anthropic launched Claude for Financial Advisors, connecting Claude with investment analytics and wealth-management software from providers including BlackRock, Charles Schwab, Addepar, Envestnet and Orion. The product targets meeting preparation, portfolio review and client follow-up."},{"@type":"ListItem","position":8,"url":"https://techcrunch.com/2026/09/14/superhuman-acquires-yc-backed-notetaker-fathom-as-productivity-platforms-push-for-agentic-work/","name":"Superhuman acquires meeting assistant Fathom","description":"Superhuman is acquiring AI meeting-notetaker Fathom, which says it has more than 400,000 monthly active users. The deal adds meeting transcripts, decisions and action items to Superhuman’s broader productivity platform as it works toward assistants that can start follow-up tasks proactively."},{"@type":"ListItem","position":9,"url":"https://techcrunch.com/2026/09/14/with-ios-27-im-actually-using-siri-again/","name":"iOS 27 gives Siri multi-step tasks and personal on-screen context","description":"TechCrunch’s hands-on review says the redesigned Siri in iOS 27 can follow multi-step requests, use context from files, messages and email, understand what is on screen, and draft or send messages. The reviewer found it substantially more useful while still encountering occasional errors during beta testing."},{"@type":"ListItem","position":10,"url":"https://tokencanopy.com/products/agentdrive","name":"AgentDrive offers versioned shared files that persist across agent sessions","description":"AgentDrive is a beta cloud filesystem where people and agents can share multiple permissioned drives, keep version history and retain work after an agent session ends. Its current MCP endpoint supports Claude Code and Codex, and the vendor warns that the v0 API may change."},{"@type":"ListItem","position":11,"url":"https://github.com/huggingface/transformers","name":"huggingface/transformers remains the central toolkit for open model work","description":"Transformers provides model definitions and tooling for inference and training across text, vision, audio and multimodal systems. It led today’s eligible, previously unpublished AI repositories in the captured GitHub Trending results, with a score of 528 and roughly 166,000 total stars."},{"@type":"ListItem","position":12,"url":"https://github.com/tech-leads-club/agent-skills","name":"tech-leads-club/agent-skills builds a validated catalogue for coding agents","description":"Agent Skills is a registry and installation tool for reusable instructions across coding assistants including Claude Code, Cursor and Copilot. It ranked second among today’s eligible unpublished AI repositories in the captured Trending results, with a score of 506 and about 6,000 total stars."},{"@type":"ListItem","position":13,"url":"https://github.com/danny-avila/LibreChat","name":"danny-avila/LibreChat provides a self-hosted interface for models and agents","description":"LibreChat is an open-source, multi-user chat interface supporting numerous model providers, agents, MCP, tools, code execution and authentication. It ranked third among today’s eligible unpublished AI repositories in the captured Trending results, with a score of 294 and roughly 43,500 total stars."}]}}]}</script>
