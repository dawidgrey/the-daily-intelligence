  <script defer data-domain="dailyintelligence.lacbgrey.com.au" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://lacbgrey.com.au/#organization","name":"LACB Grey","url":"https://lacbgrey.com.au/"},{"@type":"WebSite","@id":"https://dailyintelligence.lacbgrey.com.au/#website","name":"The Daily Intelligence","url":"https://dailyintelligence.lacbgrey.com.au/","publisher":{"@id":"https://lacbgrey.com.au/#organization"},"inLanguage":"en-AU"},{"@type":"CollectionPage","@id":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-25.html#webpage","name":"The Daily Intelligence — 2026-10-25","url":"https://dailyintelligence.lacbgrey.com.au/issues/2026-10-25.html","description":"Today's issue is about what you can actually use, and what the claim leaves out. Block has shown Dessa, a speech-only conversation model that runs on a high-end laptop, and is not offering it to the public yet. A study finds that swapping coding-agent harnesses moves scores about as much as running the same setup twice, while the bill can triple. The Verge reports that a widely shared drug-design experiment produced binders, not a scorpion antivenom. A patent-lawyer trial, a market chart, and a database check all point the same way: the useful question is what is still true after the model says it is done.","isPartOf":{"@id":"https://dailyintelligence.lacbgrey.com.au/#website"},"publisher":{"@id":"https://lacbgrey.com.au/#organization"},"datePublished":"2026-10-24T19:00:00Z","dateModified":"2026-10-26T20:07:51Z","inLanguage":"en-AU","image":"https://dailyintelligence.lacbgrey.com.au/og-image.png","mainEntity":{"@type":"ItemList","numberOfItems":13,"itemListElement":[{"@type":"ListItem","position":1,"url":"https://block.xyz/dessa","name":"Block shows Dessa, a speech-only model it is not releasing yet","description":"Block, the company behind Square and Cash App, has published Dessa, a full-duplex speech-to-speech model it says was trained from scratch on human conversation only, with no text and no pretrained model. Block says it runs locally on a MacBook Pro M4 Max or better, and that training used one NVIDIA GB200 NVL72. The public page is a set of recorded conversations and a call for a small group of AI safety researchers to get early access. It is not a download."},{"@type":"ListItem","position":2,"url":"https://arxiv.org/abs/2610.04433","name":"Swapping a coding-agent harness mostly changes the bill","description":"Yangze Liu and Zhongyi Han, at Shandong University, ran five models through Claude Code, mini-SWE-agent, and OpenCode on SWE-bench Verified, then reran the same setups to see how much a score moves when nothing else changes. On 447 tasks, Claude Code and mini-SWE-agent, the heaviest and lightest harnesses, sat within five points. Swapping harnesses flipped the result on 13 percent of tasks, the same rate as a plain rerun. OpenCode trailed by up to nine points. With the same model and the same price list, cost per task differed by up to three times, mostly because of the system prompt and tool descriptions sent on every step."},{"@type":"ListItem","position":3,"url":"https://www.theverge.com/ai-artificial-intelligence/1016443/anthropic-claude-citrini-vibecoding-scorpion-antivenom","name":"Claude did not invent a scorpion antivenom","description":"The Verge reports that Citrini Research, working with Anthropic, asked an unreleased Claude model to design proteins that might bind scorpion toxins. Anthropic's own account says 17 of 211 lab-tested designs bound to one of four toxins, and that none bound more than one. Anthropic says it has not tested whether those binders stop the toxin in cells or in animals, and does not claim an antivenom. Experts told The Verge that finding a binder is the easier step. Turning it into a safe medicine is the part this experiment did not do."},{"@type":"ListItem","position":4,"url":"https://www.nber.org/papers/w35720","name":"Junior patent lawyers get better drafts with AI, then lose the gain when it is taken away","description":"A pre-registered three-month trial gave 133 patent lawyers at eleven U.S. firms access to an unreleased Google Labs drafting assistant. Blinded attorneys scored the work. AI access raised draft quality by 0.34 standard deviations at 10 days and 0.38 at 90 days, with larger gains for juniors. When everyone then redlined a draft with no AI, treated lawyers beat controls by 0.32 standard deviations, but that advantage sat entirely with seniors, at 0.45. Juniors showed no average gain. Google paid the direct costs, and several authors are Google employees."},{"@type":"ListItem","position":5,"url":"https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector","name":"Apollo's charts still show no AI payoff outside the tech giants","description":"Torsten Slok, Apollo's chief economist, published a 24 October note arguing that AI spending has not yet shown up in the rest of corporate America. In the charts he posts, revenue per worker and profit margins are rising for the Magnificent Seven and flat for the other 493 companies in the S&P 500. He also shows a productivity series with no visible AI bump. His reading is that mainstream firms are starting to treat token spend as a cost, not a growth engine, and that the AI story will be decided outside the tech sector."},{"@type":"ListItem","position":6,"url":"https://huggingface.co/blog/microsoft/thinkingbox-training","name":"Microsoft trains an agent on the database, not on the claim that it is done","description":"Microsoft and Hugging Face report a follow-up to ThinkingBox, which grades an agent by the database it leaves behind rather than by the message that says the task is finished. They used those checks as rewards and fine-tuned Qwen3.8-27B for 50 steps on tasks outside the 507-task benchmark. Tasks completed correctly on all 20 attempts rose from 38 to 107. Average success rose from 51.70 percent to 60.78 percent. Tasks solved at least once fell from 453 to 446."},{"@type":"ListItem","position":7,"url":"https://www.theverge.com/tech/1017450/meta-business-terms-delayed-ai-scraping","name":"Meta delays new business terms to 20 November after publisher pushback","description":"Meta is delaying enforcement of new business terms from 30 October to 20 November, spokesperson Daniel Roberts told The Verge. Publishers had warned that the terms could let Meta scrape news sites that use its tools, including for AI training. Meta had already removed the word 'training' from the terms. Legal experts told The Verge that edit was not enough to rule training out. Roberts said the delay is time to explain how Meta's crawlers work, and that content owners can still use robots.txt to signal what they do not want crawled."},{"@type":"ListItem","position":8,"url":"https://www.theguardian.com/technology/2026/oct/23/anthropic-report-ai-workplace-shifts","name":"Outside researchers question Anthropic's picture of the AI workplace","description":"The Guardian reports that researchers are skeptical of Anthropic's employment study, which said junior technical hiring at the company fell as agent hours passed staff hours. Morgan Frank, at Case Western Reserve, points to work showing exposed job markets weakened before ChatGPT launched, so the timing does not line up with a simple AI story. Julián Posada, at Yale, says the report has no outside audit and reads like a document from a company preparing to sell shares. Anthropic did not respond to the Guardian. The paper also notes reporting that a draft filing showed a net loss above $80 billion in the first half of this year."},{"@type":"ListItem","position":9,"url":"https://www.technologyreview.com/2026/10/19/1147186/making-the-internet-better-for-ai-agents-might-make-it-worse-for-everyone-else/","name":"A web rebuilt for agents can get worse for the person still browsing","description":"MIT Technology Review argues that personal agents, including OpenAI's Dots and Meta's Muse, are a third kind of web visitor: not a person, and not an ordinary bot. Muse was downloaded 5 million times in its first month, and one security firm says agent traffic tripled from August to September. Sites from Pizza Hut to Yelp have blocked agents. Amazon has blocked Muse and is still fighting Perplexity in court. Shopify has opened a checkout lane for browser agents. The piece asks what is left for a person who wants to compare prices themselves."},{"@type":"ListItem","position":10,"url":"https://terrytao.wordpress.com/2026/10/24/oai-math-revised-a-community-hub-for-revising-openais-math-write-ups/","name":"Mathematicians open a public edit of OpenAI's math write-ups","description":"Terence Tao has posted a guest note from Abhinav Nellore, Johannes Schmitt, Soledad Villar, and Rachel Ward. They say OpenAI's math write-ups, published at github.com/openai/math, can be hard to follow and can cite incompletely. They have opened github.com/mathcommunity/oai-math-revised as a place for students, postdocs, professors, and other readers to revise those notes. A browsable copy is at mathcommunity.github.io/oai-math-revised. They are also asking for volunteer reviewers by topic."},{"@type":"ListItem","position":11,"url":"https://github.com/anthropics/sandbox-runtime","name":"anthropics/sandbox-runtime: a file and network fence without a container","description":"sandbox-runtime is an Apache-2.0 tool that enforces filesystem and network limits on a process at the operating-system level, without requiring a container. Anthropic uses this class of fence around coding-agent commands. The repository was updated on 24 October. GitHub's daily TypeScript trending list had it at 592 stars today. The repository has 6,435 stars."},{"@type":"ListItem","position":12,"url":"https://github.com/makecindy/cindy","name":"makecindy/cindy: a local client that keeps the harness while the model changes","description":"Cindy is an Apache-2.0 desktop and mobile client for an AI agent that runs on your machine. The first harnesses it supports are Claude Code and Codex. You can sign in to Cindy's hosted service, reuse a coding plan you already pay for, bring your own API keys, or use local models. Skipping sign-in runs local agents and turns off server-backed features. The cloud backend is not in this repository. Version 0.1.115 shipped on 23 October. GitHub's daily TypeScript trending list had it at 471 stars today. The repository has 4,005 stars."},{"@type":"ListItem","position":13,"url":"https://github.com/bendlang/bend","name":"bendlang/bend: a language that tries to reject an agent's unproven code","description":"Bend 2 is an Apache-2.0 language whose pitch is that a proof check blocks code, including code an agent writes, when it does not meet the stated laws. Version 2.0.39 landed on 23 October. The project says the compiler is mostly AI-written and not fully audited, and that the checker itself is not proven. A separate `--verdict` path uses a proven kernel on the translated terms. GitHub's daily TypeScript trending list had it at 113 stars today. The repository has 24,109 stars."}]}}]}</script>
